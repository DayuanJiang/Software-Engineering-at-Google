<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch04-story" data-layout="desktop" role="img" aria-labelledby="ch04-story-title ch04-story-desc">
  <title id="ch04-story-title">从一次照片误分类，到把公平当作工程目标</title>
  <desc id="ch04-story-desc">本章回顾。从一次照片误分类，到把公平当作工程目标。起点：图像识别把黑人用户标成了动物。没有人故意写下这样的代码。训练数据、测试用户和团队本身，都没有覆盖到这些用户。；根源：偏见是默认状态。工程师按自己的经验做假设，团队越单一，盲点越大。产品的伤害还会反过来伤害招聘：求职者不再相信这家公司包容。；转折：多样性是产品质量问题。多元团队更容易预见不同用户的处境。谷歌的方法是培养多元文化能力，把“这对谁不适用”变成每个环节的问题。；做法：拒绝单一方案，用结果检验价值观。挑战既定流程，从设计到测试都纳入更多视角；评估速度时，把“是否真的帮到所有用户”放进权衡。。这一章最想强调的：为所有人做工程，从承认自己的盲点开始。 宁可放慢，也别发布会伤害部分用户的产品；这项工作没有做完的时候。</desc>
