  <text x="777.2" y="248.0" class="h18" text-anchor="start">DAMP 优于 DRY</text>
  <text x="777.2" y="282.0" class="c14" text-anchor="start">测试代码宁可重复也</text>
  <text x="777.2" y="303.0" class="c14" text-anchor="start">要直白；别把逻辑和</text>
  <text x="777.2" y="324.0" class="c14" text-anchor="start">条件放进测试里</text>
  <rect x="32.0" y="396.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
