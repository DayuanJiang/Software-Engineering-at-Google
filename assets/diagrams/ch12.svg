  <text x="46.0" y="248.0" class="h18" text-anchor="start">不轻易坏</text>
  <text x="46.0" y="282.0" class="c14" text-anchor="start">对着公开接口测行为；</text>
  <text x="46.0" y="303.0" class="c14" text-anchor="start">重构、加功能、修</text>
  <text x="46.0" y="324.0" class="c14" text-anchor="start">bug 都不该逼你改测</text>
  <text x="46.0" y="345.0" class="c14" text-anchor="start">试</text>
  <rect x="214.8" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <rect x="228.8" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)"/>
  <g transform="translate(228.8,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></g>
  <text x="228.8" y="248.0" class="h18" text-anchor="start">一个行为</text>
  <text x="228.8" y="282.0" class="c14" text-anchor="start">一个测试只验证一个</text>
  <text x="228.8" y="303.0" class="c14" text-anchor="start">行为，按 given、</text>
  <text x="228.8" y="324.0" class="c14" text-anchor="start">when、then 组织，用</text>
  <text x="228.8" y="345.0" class="c14" text-anchor="start">被测行为命名</text>
