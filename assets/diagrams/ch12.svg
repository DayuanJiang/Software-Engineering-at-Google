  <g transform="translate(411.6,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g>
  <text x="411.6" y="248.0" class="h18" text-anchor="start">完整简洁</text>
  <text x="411.6" y="282.0" class="c14" text-anchor="start">读者在测试里就能看</text>
  <text x="411.6" y="303.0" class="c14" text-anchor="start">到全部关键输入和预</text>
  <text x="411.6" y="324.0" class="c14" text-anchor="start">期，无关细节用辅助</text>
  <text x="411.6" y="345.0" class="c14" text-anchor="start">方法藏起来</text>
