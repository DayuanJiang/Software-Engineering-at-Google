  <text x="594.4" y="248.0" class="h18" text-anchor="start">失败可读</text>
  <text x="594.4" y="282.0" class="c14" text-anchor="start">失败信息要说清预期、</text>
  <text x="594.4" y="303.0" class="c14" text-anchor="start">实际和差别，让人不</text>
  <text x="594.4" y="324.0" class="c14" text-anchor="start">用调试就知道错在哪</text>
