<svg xmlns="http://www.w3.org/2000/svg" width="420" height="832" viewBox="0 0 420 832" class="chapter-svg cg-ch05-story" data-layout="mobile" role="img" aria-labelledby="ch05-storym-title ch05-storym-desc">
  <title id="ch05-storym-title">从最会写代码的人，到让团队写出好代码的人</title>
  <desc id="ch05-storym-desc">本章回顾。从最会写代码的人，到让团队写出好代码的人。起点：你写得最好，所以被叫去当负责人。第一反应通常是继续自己动手：最难的活自己干，别人的代码自己改。结果是你成了瓶颈。；冲突：老式“管理”在工程团队行不通。把人当资源、盯着产出、当所有人的朋友、忽视低绩效者，这些反模式每一个都会拖垮团队。；转折：领导是服务：放下自我，做催化剂。你的工作变成让别人做得更好：清障、提问、设目标、护住团队。成员有时慢一点，也是团队在成长。；做法：像照料植物一样对待每个人。有人需要更多光照，有人需要更少打扰。经理负责人和方向，技术负责人负责技术；兼任两职时更要学会委派。。这一章最想强调的：领导者的成绩单是团队的产出，与自己写了多少代码无关。 尽量委派，别事事自己干；特别关注团队的专注点、方向和推进速度。</desc>
