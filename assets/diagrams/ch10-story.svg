<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch10-story" data-layout="desktop" role="img" aria-labelledby="ch10-story-title ch10-story-desc">
  <title id="ch10-story-title">从人人抱怨却没人写的文档，到和代码一起维护的文档</title>
  <desc id="ch10-story-desc">本章回顾。从人人抱怨却没人写的文档，到和代码一起维护的文档。起点：每个工程师都抱怨文档差，却很少有人写。写文档的收益落在未来的读者身上；工程师又常常高估自己的写作能力。；转折：文档和代码一样，是随时间推移的产物。写一次、读很多次，受益最多的往往是几个月后忘了细节的自己。这个视角一变，写文档就值得投入。；做法：把文档放进代码的工作流。放在代码库里，有负责人、有评审、有变更记录；先想清读者是谁，一份文档只服务一个目的。；落点：文档的生命周期：写、审、改、删。参考文档、设计文档、教程、概念文档各有读者；过时的文档比没有更糟，该删就删。。这一章最想强调的：为读者写作；把文档当作代码来写、评审和维护。 每份文档只服务一个目的，文档变更沿用现有的开发者工作流。</desc>
