  <text x="364.8" y="210.0" class="h18" text-anchor="middle">准备测试数据</text>
  <text x="364.8" y="236.0" class="c15" text-anchor="middle">种子数据、录制的真实流量</text>
  <text x="364.8" y="258.0" class="c15" text-anchor="middle">或人工构造；数据越真实越</text>
  <text x="364.8" y="280.0" class="c15" text-anchor="middle">可信，也越难维护</text>
  <path d="M471.0 150.0 L489.0 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch14-arrow)"/>
  <circle cx="595.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(580.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></g>
  <text x="595.2" y="210.0" class="h18" text-anchor="middle">执行操作</text>
  <text x="595.2" y="236.0" class="c15" text-anchor="middle">用公开 API 驱动，别贴着界</text>
  <text x="595.2" y="258.0" class="c15" text-anchor="middle">面写：界面一改样式，测试</text>
  <text x="595.2" y="280.0" class="c15" text-anchor="middle">就断</text>
  <path d="M701.5 150.0 L719.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch14-arrow)"/>
  <circle cx="825.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(810.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
  <text x="825.8" y="210.0" class="h18" text-anchor="middle">验证结果</text>
  <text x="825.8" y="236.0" class="c15" text-anchor="middle">人工检查、断言、A/B 差异</text>
  <text x="825.8" y="258.0" class="c15" text-anchor="middle">比较；明确这轮测试要回答</text>
  <text x="825.8" y="280.0" class="c15" text-anchor="middle">什么风险</text>
  <text x="32.0" y="316.0" class="c14" text-anchor="start">类型：功能、浏览器与设备、性能与负载、部署配置、探索性、A/B 差异、用户验收、探针与金丝雀、灾难恢复</text>
  <rect x="32.0" y="348.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="369.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="399.0" class="answer" text-anchor="start">单元测试看不到组件之间的配合，需要少量有目标的大型测试补上</text>
