  <text x="32.0" y="52.0" class="headline" text-anchor="start">单元测试都过了，系统为什么还会坏？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">大型测试跨多个单元、更慢也更真实；它的结构可以拆成四步</text>
  <circle cx="134.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(119.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
  <text x="134.2" y="210.0" class="h18" text-anchor="middle">搭起被测系统</text>
  <text x="134.2" y="236.0" class="c15" text-anchor="middle">决定 SUT 的范围：封闭的单</text>
  <text x="134.2" y="258.0" class="c15" text-anchor="middle">机环境、多机部署，还是接</text>
  <text x="134.2" y="280.0" class="c15" text-anchor="middle">近生产的环境</text>
  <path d="M240.5 150.0 L258.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch14-arrow)"/>
