<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch14" data-layout="desktop" role="img" aria-labelledby="ch14-title ch14-desc" viewBox="0 0 960 560" width="960" height="560">
<title id="ch14-title">界面变了，后端测试也要失败吗？</title>
<desc id="ch14-desc">本章 UI/API 边界案例与图14-6缩减方案的教学组合，不是实际产品拓扑。原先从界面驱动的测试可能因外观变化而在执行后端前失败；拆开后 UI 单独测试，公共 API 独立驱动后端。虚线是后端 SUT 的关注范围而非机器边界；内存数据库和第三方替身不验证真实存储和依赖的新行为，也不替代整条界面联动覆盖。</desc>
<style>
.cg-ch14[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch14[data-layout="desktop"] .strong {font-weight:600}
.cg-ch14[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch14[data-layout="desktop"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch14[data-layout="desktop"] .boundary {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;stroke-dasharray:7 5}
.cg-ch14[data-layout="desktop"] .primary {fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch14[data-layout="desktop"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch14[data-layout="desktop"] .primary-path {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch14-primary-arrow)}
.cg-ch14[data-layout="desktop"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch14[data-layout="desktop"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch14[data-layout="desktop"] .secondary-path {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;marker-end:url(#ch14-secondary-arrow)}
.cg-ch14[data-layout="desktop"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch14[data-layout="desktop"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch14[data-layout="desktop"] .warm-path {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2;marker-end:url(#ch14-warm-arrow)}
.cg-ch14[data-layout="desktop"] .danger {fill:var(--diagram-danger-soft,#faecee);stroke:var(--diagram-danger,#b54750);stroke-width:1.5}
.cg-ch14[data-layout="desktop"] .danger-ink {fill:var(--diagram-danger,#b54750)}
.cg-ch14[data-layout="desktop"] .danger-path {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2;marker-end:url(#ch14-danger-arrow)}
</style><defs>
<marker id="ch14-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch14-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch14-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch14-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="960" height="560" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">界面变了，后端测试也要失败吗？</text>
<text x="32" y="78" class="small" text-anchor="start">本章边界案例：外观变化可能使 UI 测试变脆弱，底层行为却未改变</text>
<text x="32" y="119" class="strong" text-anchor="start">原来：后端场景也从 UI 操作开始</text>
<rect x="218" y="133" width="710" height="94" rx="6" class="boundary"/>
<g data-box="32,146,150,68"><rect x="32" y="146" width="150" height="68" rx="6" class="secondary"/>
<text x="107.0" y="188" class="" text-anchor="middle">测试驱动</text>
</g>
<g data-box="234,146,150,68"><rect x="234" y="146" width="150" height="68" rx="6" class="danger"/>
<text x="309.0" y="175" class="strong" text-anchor="middle">界面 UI</text>
<text x="309.0" y="201" class="small" text-anchor="middle">外观改了</text>
</g>
<g data-box="442,146,214,68"><rect x="442" y="146" width="214" height="68" rx="6" class="primary"/>
<text x="549.0" y="188" class="" text-anchor="middle">API + 真实后端</text>
</g>
<g data-box="708,146,202,68"><rect x="708" y="146" width="202" height="68" rx="6" class="primary"/>
<text x="809.0" y="188" class="" text-anchor="middle">数据库</text>
</g>
<path d="M182 180H232" class="danger-path" data-connector="true"/>
<path d="M384 180H440" class="secondary-path" data-connector="true"/>
<path d="M656 180H706" class="primary-path" data-connector="true"/>
<text x="32" y="257" class="small" text-anchor="start">界面定位失效时，测试尚未走到后端，不能据此说后端出错。</text>
<path d="M32 278H928" class="guide"/>
<text x="32" y="309" class="strong" text-anchor="start">拆开入口：UI 单独测，后端由公共 API 驱动</text>
<g data-box="32,345,170,96"><rect x="32" y="345" width="170" height="96" rx="6" class="secondary"/>
<text x="117.0" y="383" class="strong" text-anchor="middle">UI 测试</text>
<text x="117.0" y="415" class="small" text-anchor="middle">验证界面</text>
</g>
<g data-box="234,365,158,74"><rect x="234" y="365" width="158" height="74" rx="6" class="secondary"/>
<text x="313.0" y="410" class="" text-anchor="middle">API 驱动</text>
</g>
<rect x="422" y="324" width="506" height="135" rx="6" class="boundary"/>
<text x="442" y="353" class="small" text-anchor="start">后端 SUT（范围）</text>
<g data-box="442,365,202,74"><rect x="442" y="365" width="202" height="74" rx="6" class="primary"/>
<text x="543.0" y="395" class="strong" text-anchor="middle">真实后端</text>
<text x="543.0" y="424" class="small" text-anchor="middle">程序间交互</text>
</g>
<g data-box="704,365,198,74"><rect x="704" y="365" width="198" height="74" rx="6" class="warm"/>
<text x="803.0" y="410" class="" text-anchor="middle">内存数据库</text>
</g>
<path d="M392 402H440" class="primary-path" data-connector="true"/>
<path d="M644 402H702" class="primary-path" data-connector="true"/>
<g data-box="442,491,202,52"><rect x="442" y="491" width="202" height="52" rx="6" class="warm"/>
<text x="543.0" y="524" class="" text-anchor="middle">第三方替身</text>
</g>
<path d="M543 439V489" class="warm-path" data-connector="true"/>
<text x="32" y="488" class="small" text-anchor="start">范围不等于资源规模</text>
<text x="32" y="520" class="small" text-anchor="start">虚线不是机器边界</text>
<text x="674" y="487" class="small" text-anchor="start">仍需按风险覆盖：</text>
<text x="674" y="516" class="small" text-anchor="start">界面联动 / 真实存储</text>
<text x="674" y="545" class="small" text-anchor="start">真实第三方的新行为</text>
</svg>
