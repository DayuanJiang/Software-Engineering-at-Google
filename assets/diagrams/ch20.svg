  <text x="32.0" y="52.0" class="headline" text-anchor="start">编译能过，代码就没问题了吗？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">三层把关，越往上越依赖人的判断</text>
  <rect x="32.0" y="114.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <g transform="translate(50.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
  <text x="92.0" y="142.0" class="h18" text-anchor="start">人工审查</text>
  <text x="92.0" y="164.0" class="c15" text-anchor="start">只处理需要判断和取舍的部分；机器能抓的问题不该耗审查者的时间</text>
  <rect x="32.0" y="186.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <g transform="translate(50.0,204.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></g>
  <text x="92.0" y="214.0" class="h18" text-anchor="start">静态分析（Tricorder）</text>
  <text x="92.0" y="236.0" class="c15" text-anchor="start">跑得快、误报少、结果让工程师愿意看；在代码审查时给出意见，附带修复建议</text>
  <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
