  <text x="92.0" y="286.0" class="h18" text-anchor="start">编译器</text>
  <text x="92.0" y="308.0" class="c15" text-anchor="start">只查语法和类型；long 换成 int 之后右移成了空操作，它照样通过</text>
  <text x="32.0" y="348.0" class="c14" text-anchor="start">关键经验：关注开发者的感受；把分析融入核心工作流；让领域专家贡献自己的检查</text>
  <rect x="32.0" y="376.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="397.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="427.0" class="answer" text-anchor="start">编译只查语法和类型；静态分析在审查时自动抓出更多问题</text>
