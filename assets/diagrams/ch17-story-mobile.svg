<svg xmlns="http://www.w3.org/2000/svg" width="420" height="927" viewBox="0 0 420 927" class="chapter-svg cg-ch17-story" data-layout="mobile" role="img" aria-labelledby="ch17-storym-title ch17-storym-desc">
  <title id="ch17-storym-title">从 grep 一行行翻代码，到全公司代码秒级可查</title>
  <desc id="ch17-storym-desc">本章回顾。从 grep 一行行翻代码，到全公司代码秒级可查。起点：想知道一个函数被谁调用，先 grep 半天。编辑器只看得到本地检出的代码；几十亿行的代码库，本地根本放不下，更别说建索引。；发现：读代码的时间远多于写代码。理解代码是工程师最常做的事：找定义、看示例、查影响、读历史。把这件事做快，全公司的生产力都会涨。；设计：专门的网页工具：全量索引、交叉引用、统一地址。Kythe 用构建信息区分同名符号；搜索、浏览、索引每个环节都保持低延迟；每段代码有唯一链接，文档和工具都指向它。；取舍：信任来自完整：索引全部代码，返回全部结果。早期功能弱的版本也有人用，但只有结果完整、排序合理，工具才会被广泛依赖。规模迫使谷歌自研，IDE 索引和 grep 都不够用。。这一章最想强调的：帮助开发者理解代码，能显著提高工程生产力；代码搜索是这件事的关键工具。 作为交互式工具，它必须快到支持“一问一答”的工作流，并且完整到让人信任。</desc>
