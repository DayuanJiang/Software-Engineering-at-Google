  <rect x="0" y="0" width="420" height="530" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch10m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">工程师为什么不爱写文档，怎么改？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">文档写一次、被读很多次；受益最多的常常是几个月后的自己</text>
  <rect x="22.0" y="98.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <circle cx="50.0" cy="124.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,116.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
  <text x="74.0" y="129.0" class="h18" text-anchor="start">常见状况</text>
  <text x="74.0" y="154.0" class="c15" text-anchor="start">没人觉得写文档是自己的活；写了没人看，也</text>
  <text x="74.0" y="176.0" class="c15" text-anchor="start">没人知道在哪；一份文档想服务所有人；过时</text>
  <text x="74.0" y="198.0" class="c15" text-anchor="start">了还挂着，误导读者</text>
  <rect x="22.0" y="218.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="244.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
  <text x="74.0" y="249.0" class="h18" text-anchor="start">把文档当作代码</text>
  <text x="74.0" y="274.0" class="c15" text-anchor="start">放进代码库，有负责人、有评审；先想清读者</text>
  <text x="74.0" y="296.0" class="c15" text-anchor="start">是谁，再决定写什么；一份文档只做一件事：</text>
  <text x="74.0" y="318.0" class="c15" text-anchor="start">参考、设计、教程或概念；跟着代码一起改，</text>
  <text x="74.0" y="340.0" class="c15" text-anchor="start">过时就删</text>
  <text x="22.0" y="372.0" class="c13" text-anchor="start">文档类型：参考文档、设计文档、教程、概念文档、着陆页；复</text>
  <text x="22.0" y="392.0" class="c13" text-anchor="start">杂或面向用户的场合，才需要技术撰稿人</text>
  <rect x="22.0" y="418.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="439.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="465.0" class="answer-m" text-anchor="start">把文档当作代码来写、评审和维护，动笔前先</text>
  <text x="36.0" y="491.0" class="answer-m" text-anchor="start">想清读者是谁</text>
</svg>
