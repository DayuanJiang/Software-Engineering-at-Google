<svg xmlns="http://www.w3.org/2000/svg" id="ch10m-diagram" class="chapter-svg cg-ch10" role="img" aria-labelledby="ch10m-title ch10m-desc" viewBox="0 0 420 680" width="420" height="680">
<title id="ch10m-title">读者能做出下一步判断吗？</title>
<desc id="ch10m-desc">三个据本章改绘的阅读卡点。按 StrCat 原注释推演，输入字符串 a 和 b 不插入分隔符，所以得到 ab，而不是 a 空格 b。原文的教程失败示例漏写了用户名授权前提，读者需要先确认权限。对失效教程，应标明过时，并在有替代来源时指向它。使用中的问题通过反馈接回负责人和变更评审。这些例子是不同的判断条件，不是一个必须依次完成的流程；示例代码未执行。</desc>
<style>
.cg-ch10#ch10m-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch10#ch10m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch10#ch10m-diagram .heading{font-size:24px;font-weight:600}
.cg-ch10#ch10m-diagram .strong{font-weight:600}
.cg-ch10#ch10m-diagram .code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.cg-ch10#ch10m-diagram .good{fill:var(--diagram-primary,#087f6d)}
.cg-ch10#ch10m-diagram .bad{fill:var(--diagram-danger,#b54750)}
.cg-ch10#ch10m-diagram .system{fill:var(--diagram-secondary,#2f6eac)}
</style>
<defs><marker id="ch10m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.6"/></marker></defs>
<rect width="420" height="680" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="heading" text-anchor="start">读者能做出下一步判断吗？</text>
<text x="24" y="69" class="small" text-anchor="start">三个阅读卡点，据本章例子改绘</text>
<rect x="24" y="92" width="372" height="162" rx="6" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="36" y="125" class="strong" text-anchor="start" data-bounds="36 102 348 142">拼接后，会自动加空格吗？</text>
<text x="36" y="163" class="small code" text-anchor="start" data-bounds="36 102 348 142">StrCat(&quot;a&quot;, &quot;b&quot;)</text>
<path d="M231 157H278" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10m-arrow)" data-connector="true"/>
<text x="294" y="163" class="code good" text-anchor="start" data-bounds="36 102 348 142">&quot;ab&quot;</text>
<text x="36" y="201" class="small" text-anchor="start" data-bounds="36 102 348 142">补明“无分隔符”，才能预测输出。</text>
<text x="36" y="232" class="small" text-anchor="start" data-bounds="36 102 348 142">调用与输出为按原注释推演的示例</text>
<rect x="24" y="272" width="372" height="136" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="36" y="305" class="strong" text-anchor="start" data-bounds="36 282 348 116">教程第4步报错，漏了什么？</text>
<text x="36" y="341" class="small" text-anchor="start" data-bounds="36 282 348 116">示例：漏写用户名的授权要求</text>
<path d="M40 353V380H57" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10m-arrow)" data-connector="true"/>
<text x="70" y="384" class="" text-anchor="start" data-bounds="36 282 348 116">未授权？先处理权限前提。</text>
<rect x="24" y="426" width="372" height="139" rx="6" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="36" y="460" class="strong" text-anchor="start" data-bounds="36 436 348 119">旧教程失效，还能继续照做吗？</text>
<text x="36" y="496" class="small" text-anchor="start" data-bounds="36 436 348 119">无标记：读者可能仍当作权威</text>
<path d="M40 507V537H57" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10m-arrow)" data-connector="true"/>
<text x="70" y="539" class="" text-anchor="start" data-bounds="36 436 348 119">标过时；有新来源则指向它</text>
<path d="M24 590H396" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<text x="24" y="621" class="strong" text-anchor="start">让发现的问题进入维护流程</text>
<text x="24" y="653" class="small" text-anchor="start">反馈给负责人，沿用变更评审</text>
</svg>
