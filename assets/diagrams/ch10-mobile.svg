    .cg-ch10[data-layout="mobile"] .c13 {font-size:13px;fill:var(--diagram-muted,#686868)}
    .cg-ch10[data-layout="mobile"] .tag {font-size:13px;font-weight:600;fill:var(--diagram-primary,#0b6f5d)}
