  <text x="480.0" y="184.0" class="h18" text-anchor="middle">写代码</text>
  <text x="480.0" y="206.0" class="c14" text-anchor="middle">小步改动，随时准备集成</text>
  <circle cx="774.8" cy="315.1" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(760.8,301.1) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
  <text x="774.8" y="233.1" class="h18" text-anchor="middle">提交前</text>
  <text x="774.8" y="255.1" class="c14" text-anchor="middle">跑快而可靠的测试：单元测试、静态</text>
  <text x="774.8" y="275.1" class="c14" text-anchor="middle">分析，几分钟出结果</text>
  <circle cx="662.2" cy="426.9" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(648.2,412.9) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="662.2" y="480.9" class="h18" text-anchor="middle">提交</text>
  <text x="662.2" y="502.9" class="c14" text-anchor="middle">进入主干，TAP 全球持续构建开始跑</text>
  <text x="662.2" y="522.9" class="c14" text-anchor="middle">更慢、覆盖更广的测试</text>
  <circle cx="297.8" cy="426.9" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(283.8,412.9) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></g>
  <text x="297.8" y="480.9" class="h18" text-anchor="middle">提交后</text>
  <text x="297.8" y="502.9" class="c14" text-anchor="middle">慢而不太确定的测试放这里；坏了要</text>
  <text x="297.8" y="522.9" class="c14" text-anchor="middle">能快速定位到某次提交</text>
  <circle cx="185.2" cy="315.1" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(171.2,301.1) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
  <text x="185.2" y="233.1" class="h18" text-anchor="middle">修复或回滚</text>
  <text x="185.2" y="255.1" class="c14" text-anchor="middle">反馈易得、能立刻行动；封闭测试让</text>
  <text x="185.2" y="275.1" class="c14" text-anchor="middle">结果可重复</text>
  <text x="32.0" y="590.0" class="c14" text-anchor="start">Takeout 团队的四个场景说明：随着规模变大，CI 越来越不可或缺；负担不起完整 CI 时也能从小做起</text>
