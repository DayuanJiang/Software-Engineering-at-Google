  <text x="32.0" y="52.0" class="headline" text-anchor="start">集成问题为什么越早发现越便宜？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">CI 是一个反馈回路：决定运行哪些测试、什么时候运行</text>
