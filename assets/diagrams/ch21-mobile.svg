<marker id="ch21m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch21m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect id="ch21m-shape-1" x="0" y="0" width="420" height="680" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="20" y="34" class="strong" text-anchor="start">依赖更新：</text>
<text x="20" y="63" class="strong" text-anchor="start">谁能验证受影响的用法？</text>
<text x="20" y="92" class="small" text-anchor="start">实线依赖；虚线回查受影响测试</text>
<rect id="ch21m-shape-2" x="20" y="111" width="380" height="139" rx="0" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="34" y="140" class="small" text-anchor="start">使用方组织（私有）</text>
<rect id="ch21m-shape-3" x="66" y="158" width="278" height="70" rx="4" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="205.0" y="186.5" class="strong" text-anchor="middle" data-owner="ch21m-shape-3">libuser</text>
<text x="205.0" y="215.5" class="small" text-anchor="middle" data-owner="ch21m-shape-3">经 liba 使用结果</text>
<rect id="ch21m-shape-4" x="20" y="270" width="380" height="248" rx="0" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="34" y="297" class="small" text-anchor="start">上游可见项目（示意）</text>
<rect id="ch21m-shape-5" x="66" y="312" width="278" height="74" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="1.5"/>
<text x="205.0" y="342.5" class="strong" text-anchor="middle" data-owner="ch21m-shape-5">liba</text>
<text x="205.0" y="371.5" class="small" text-anchor="middle" data-owner="ch21m-shape-5">调用 Foo()</text>
<rect id="ch21m-shape-6" x="66" y="432" width="278" height="74" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
