<svg xmlns="http://www.w3.org/2000/svg" width="420" height="670" viewBox="0 0 420 670" class="chapter-svg cg-ch21" data-layout="mobile" role="img" aria-labelledby="ch21m-title ch21m-desc">
  <title id="ch21m-title">用别人的代码，版本该怎么跟？</title>
  <desc id="ch21m-desc">本章概览。用别人的代码，版本该怎么跟？ 本章的主要部分：全部不动：永远用同一个版本，直到不得不换；语义化版本：看版本号猜兼容，靠得住吗？；打包发行版：跟着一个经过整体测试的集合走；跟随最新：Live at Head：一起改、一起测。一句话：依赖问题的根源是时间和信任，版本号替代不了实际测试</desc>
