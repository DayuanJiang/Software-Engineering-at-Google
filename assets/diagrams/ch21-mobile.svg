<path data-connector="true" d="M172 388V429" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch21m-secondary-arrow)"/>
<path data-connector="true" d="M346 469H366V349H346" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch21m-warm-arrow)" stroke-dasharray="6 5"/>
<path data-connector="true" d="M346 341H384V193H346" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch21m-warm-arrow)" stroke-dasharray="6 5"/>
<text x="20" y="550" class="strong" text-anchor="start">本地通过 ≠ 下游用法都通过</text>
<text x="20" y="580" class="small" text-anchor="start">私有用法：使用方补测试。</text>
<text x="20" y="608" class="small" text-anchor="start">必要变更：先协调迁移或提供工具。</text>
<text x="20" y="640" class="small" text-anchor="start">Live at Head 依赖这些前提，</text>
<text x="20" y="666" class="small" text-anchor="start">不是无条件选最新版本。</text>
</svg>
