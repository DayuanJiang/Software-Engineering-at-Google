  <text x="74.0" y="99.0" class="h18" text-anchor="start">你的项目</text>
  <text x="74.0" y="124.0" class="c15" text-anchor="start">它用了别人维护、随时在变的代码；依赖：版</text>
  <text x="74.0" y="146.0" class="c15" text-anchor="start">本策略从这里定</text>
  <text x="22.0" y="180.0" class="h16" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">四种跟版本的策略，各有代价</text>
