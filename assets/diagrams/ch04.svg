  <text x="32.0" y="52.0" class="headline" text-anchor="start">软件会不会伤害它没想到的用户？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">从照片被错误分类的伤害出发，这一章讲工程团队为什么会有盲点，以及怎么补</text>
  <circle cx="134.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(119.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
  <text x="134.2" y="210.0" class="h18" text-anchor="middle">承认偏见是默认</text>
  <text x="134.2" y="236.0" class="c15" text-anchor="middle">团队和数据都带着自己的经</text>
  <text x="134.2" y="258.0" class="c15" text-anchor="middle">验，没有刻意纠正，产品就</text>
  <text x="134.2" y="280.0" class="c15" text-anchor="middle">会自动带上盲点</text>
  <path d="M240.5 150.0 L258.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04-arrow)"/>
  <circle cx="364.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(349.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
  <text x="364.8" y="210.0" class="h18" text-anchor="middle">建立多元团队</text>
  <text x="364.8" y="236.0" class="c15" text-anchor="middle">不同背景的人更容易预见不</text>
  <text x="364.8" y="258.0" class="c15" text-anchor="middle">同用户的处境，这直接决定</text>
  <text x="364.8" y="280.0" class="c15" text-anchor="middle">产品质量</text>
  <path d="M471.0 150.0 L489.0 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04-arrow)"/>
  <circle cx="595.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(580.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
  <text x="595.2" y="210.0" class="h18" text-anchor="middle">挑战既定流程</text>
  <text x="595.2" y="236.0" class="c15" text-anchor="middle">拒绝单一方案；从需求、设</text>
  <text x="595.2" y="258.0" class="c15" text-anchor="middle">计到测试，每一步都问：这</text>
  <text x="595.2" y="280.0" class="c15" text-anchor="middle">对谁不适用？</text>
  <path d="M701.5 150.0 L719.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04-arrow)"/>
  <circle cx="825.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(810.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
  <text x="825.8" y="210.0" class="h18" text-anchor="middle">用结果检验价值</text>
  <text x="825.8" y="236.0" class="c15" text-anchor="middle">价值观要落到结果上：宁可</text>
  <text x="825.8" y="258.0" class="c15" text-anchor="middle">放慢，也别发布会伤害部分</text>
  <text x="825.8" y="280.0" class="c15" text-anchor="middle">用户的产品</text>
  <text x="32.0" y="316.0" class="c14" text-anchor="start">保持好奇，继续前行：公平是一直要做的工程工作，没有一次做完的时候</text>
  <rect x="32.0" y="348.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="369.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="399.0" class="answer" text-anchor="start">为所有人做工程，先承认自己有盲点，再把公平当作工程目标去验证</text>
