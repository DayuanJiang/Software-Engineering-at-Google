<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" class="chapter-svg cg-ch04" data-layout="desktop" role="img" aria-labelledby="ch04-title ch04-desc">
<title id="ch04-title">产品伤害为何也会影响团队建设？</title>
<desc id="ch04-desc">本章的风险联系：Google Photos 的误分类伤害黑人用户；求职者也可能失去对组织包容性的信任，从而妨碍代表性招聘目标。虚线表示可能影响，不是测量出的效应。产品侧需与用户共建并衡量结果，组织侧需同时审视招聘、留任与成长；人员代表性不保证公平。</desc>
<style>
.cg-ch04[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch04[data-layout="desktop"] .strong {font-weight:600}
</style>
<defs>
<marker id="ch04-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch04-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch04-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch04-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="43" text-anchor="start" class="strong">产品伤害为何也会影响团队建设？</text>
<text x="32" y="81" text-anchor="start" class="small">书中风险联系：产品的用户，也可能是组织的求职者。</text>
<g id="ch04-product" data-box="32,129,264,148">
<rect x="32" y="129" width="264" height="148" rx="6" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="164" y="166" text-anchor="middle" class="strong">产品失误</text>
<text x="164" y="207" text-anchor="middle" class="">例：照片识别误分类</text>
<text x="164" y="244" text-anchor="middle" class="">伤害黑人用户</text>
</g>
<g id="ch04-trust" data-box="348,129,264,148">
<rect x="348" y="129" width="264" height="148" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="480" y="166" text-anchor="middle" class="strong">信任受损</text>
<text x="480" y="207" text-anchor="middle" class="">求职者也可能怀疑</text>
<text x="480" y="244" text-anchor="middle" class="">组织是否包容</text>
</g>
<g id="ch04-hiring" data-box="664,129,264,148">
<rect x="664" y="129" width="264" height="148" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="796" y="166" text-anchor="middle" class="strong">组织后果</text>
<text x="796" y="207" text-anchor="middle" class="">代表性招聘目标</text>
<text x="796" y="244" text-anchor="middle" class="">可能更难实现</text>
</g>
<text x="322" y="184" text-anchor="middle" class="small">可能</text>
<polyline data-connector="true" points="298,213 344,213" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-arrow-muted)" stroke-dasharray="6 5"/>
<text x="638" y="184" text-anchor="middle" class="small">可能</text>
<polyline data-connector="true" points="614,213 660,213" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-arrow-muted)" stroke-dasharray="6 5"/>
<text x="32" y="319" text-anchor="start" class="strong">需要共同审视的两侧</text>
<g id="ch04-product-response" data-box="32,344,430,127">
<rect x="32" y="344" width="430" height="127" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="52" y="379" text-anchor="start" class="strong">产品侧：谁参与定义需求？</text>
<text x="52" y="417" text-anchor="start" class="">与弱势用户共建，优先困难用例</text>
<text x="52" y="451" text-anchor="start" class="small">与领域专家衡量实际结果</text>
</g>
<g id="ch04-organization-response" data-box="498,344,430,127">
<rect x="498" y="344" width="430" height="127" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="518" y="379" text-anchor="start" class="strong">组织侧：谁能进入并成长？</text>
<text x="518" y="417" text-anchor="start" class="">同时审视招聘、留任与晋升</text>
<text x="518" y="451" text-anchor="start" class="small">让不同经验参与设计讨论</text>
</g>
<text x="32" y="511" text-anchor="start" class="small">人员代表性不保证数据无偏差；善意与投入也不等于公平结果。</text>
<text x="32" y="541" text-anchor="start" class="small">虚线不是量化因果关系，也不表示任何群体的必然行为。</text>
</svg>
