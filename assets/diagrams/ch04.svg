<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" class="chapter-svg cg-ch04" data-layout="desktop" role="img" aria-labelledby="ch04-title ch04-desc">
  <title id="ch04-title">软件会不会伤害它没想到的用户？</title>
  <desc id="ch04-desc">本章概览。软件会不会伤害它没想到的用户？ 本章的主要部分：承认偏见是默认：团队和数据都带着自己的经验，没有刻意纠正，产品就会自动带上盲点；建立多元团队：不同背景的人更容易预见不同用户的处境，这直接决定产品质量；挑战既定流程：拒绝单一方案；从需求、设计到测试，每一步都问：这对谁不适用？；用结果检验价值：价值观要落到结果上：宁可放慢，也别发布会伤害部分用户的产品。一句话：为所有人做工程，先承认自己有盲点，再把公平当作工程目标去验证</desc>
