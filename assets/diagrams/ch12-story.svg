<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch12-story" data-layout="desktop" role="img" aria-labelledby="ch12-story-title ch12-story-desc">
  <title id="ch12-story-title">从一改代码就大片变红的测试，到读得懂、改不坏的测试</title>
  <desc id="ch12-story-desc">本章回顾。从一改代码就大片变红的测试，到读得懂、改不坏的测试。起点：重构完，几十个测试失败，功能却没坏。测试盯着实现细节写，代码一动它就红。工程师开始把测试当噩梦，改代码前先想“会坏多少测试”。；转折：对着公开接口测行为。通过公共 API 测试，断言结果状态，少断言内部调用；这样无害的重构一个测试都不用改。；设计：让测试完整又简洁，失败时说得清。一个测试一个行为，用被测行为命名；关键输入和预期都写在眼前，无关细节收进辅助方法；失败信息直接指出差别。；取舍：测试代码：DAMP 优于 DRY。生产代码追求不重复，测试代码追求一眼看懂。宁可重复几行，也别把逻辑和条件塞进测试。。这一章最想强调的：好测试改代码时不坏、失败时能读懂；为此宁可啰嗦一点。 测行为、测状态、通过公共接口测；共享测试代码时优先 DAMP。</desc>
