  <title id="ch13m-title">测试里怎么替换掉不好用的真实依赖？</title>
  <desc id="ch13m-desc">本章概览。测试里怎么替换掉不好用的真实依赖？ 本章的主要部分：真实实现：最可信，能用就用；伪实现：轻量替代品，行为要和真的一致；打桩：直接指定返回什么，用多了测试会脆；交互验证：只查有没有调用，多用于改状态的操作。一句话：优先真实实现；用替身时首选伪实现，打桩和交互验证要克制</desc>
