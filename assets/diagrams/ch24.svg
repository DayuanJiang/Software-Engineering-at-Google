  <text x="480.0" y="210.0" class="h18" text-anchor="middle">发布列车</text>
  <text x="480.0" y="236.0" class="c14" text-anchor="middle">固定节奏发车，没上车</text>
  <text x="480.0" y="257.0" class="c14" text-anchor="middle">的功能等下一班</text>
  <path d="M563.2 150.0 L581.2 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch24-arrow)"/>
