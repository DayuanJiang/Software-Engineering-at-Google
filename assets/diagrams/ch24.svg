  <text x="664.4" y="210.0" class="h18" text-anchor="middle">分阶段发布</text>
  <text x="664.4" y="236.0" class="c14" text-anchor="middle">先给少数用户和设备，</text>
  <text x="664.4" y="257.0" class="c14" text-anchor="middle">以真实环境为基准</text>
  <path d="M747.6 150.0 L765.6 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch24-arrow)"/>
  <circle cx="848.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(833.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
  <text x="848.8" y="210.0" class="h18" text-anchor="middle">看数据取舍</text>
  <text x="848.8" y="236.0" class="c14" text-anchor="middle">只交付会被用的功能；</text>
  <text x="848.8" y="257.0" class="c14" text-anchor="middle">把数据驱动的决策往前</text>
  <text x="848.8" y="278.0" class="c14" text-anchor="middle">挪</text>
  <text x="32.0" y="313.0" class="c14" text-anchor="start">改变团队文化：把纪律写进部署流程，越快越安全</text>
