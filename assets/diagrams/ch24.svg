<svg xmlns="http://www.w3.org/2000/svg" width="960" height="441" viewBox="0 0 960 441" class="chapter-svg cg-ch24" data-layout="desktop" role="img" aria-labelledby="ch24-title ch24-desc">
  <title id="ch24-title">怎么做到又快又稳地发布？</title>
  <desc id="ch24-desc">本章概览。怎么做到又快又稳地发布？ 本章的主要部分：拆小：把大部署切成小块，每块都可管理；模块化架构让团队并行；开关保护：先部署代码，再决定对谁打开功能；问题可以单独隔离；发布列车：固定节奏发车，没上车的功能等下一班；分阶段发布：先给少数用户和设备，以真实环境为基准；看数据取舍：只交付会被用的功能；把数据驱动的决策往前挪。一句话：发布越小越频繁，风险越低；开关和数据让决策提前</desc>
