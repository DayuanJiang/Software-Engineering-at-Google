  <text x="32.0" y="52.0" class="headline" text-anchor="start">怎么做到又快又稳地发布？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">谷歌持续交付的常用做法，串起来是一条流水线</text>
  <circle cx="111.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(96.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
  <text x="111.2" y="210.0" class="h18" text-anchor="middle">拆小</text>
  <text x="111.2" y="236.0" class="c14" text-anchor="middle">把大部署切成小块，每</text>
  <text x="111.2" y="257.0" class="c14" text-anchor="middle">块都可管理；模块化架</text>
  <text x="111.2" y="278.0" class="c14" text-anchor="middle">构让团队并行</text>
