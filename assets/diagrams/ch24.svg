  <text x="295.6" y="210.0" class="h18" text-anchor="middle">开关保护</text>
  <text x="295.6" y="236.0" class="c14" text-anchor="middle">先部署代码，再决定对</text>
  <text x="295.6" y="257.0" class="c14" text-anchor="middle">谁打开功能；问题可以</text>
  <text x="295.6" y="278.0" class="c14" text-anchor="middle">单独隔离</text>
