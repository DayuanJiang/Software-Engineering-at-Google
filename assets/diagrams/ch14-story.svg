<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch14-story" data-layout="desktop" role="img" aria-labelledby="ch14-story-title ch14-story-desc">
  <title id="ch14-story-title">从全绿的单元测试和挂掉的系统，到有策略的大型测试</title>
  <desc id="ch14-story-desc">本章回顾。从全绿的单元测试和挂掉的系统，到有策略的大型测试。起点：单元测试全部通过，上线还是坏了。每个单元都对，配合起来却错：配置不一致、接口理解不同、真实数据和替身不一样。这些问题单元测试天生看不到。；发现：大型测试补的正是“配合”这一层。它跨多个单元，更慢也更真实。谷歌把它拆成四步：搭被测系统、备数据、执行操作、验证结果。；权衡：越真实越可信，也越慢、越不稳定。所以要少而精。设计阶段就写测试策略：列出风险，决定哪些风险值得一个大型测试来覆盖。；做法：让大型测试融入开发者的日常。明确谁来写、什么时候跑、失败了谁负责；把它做成工作流的一部分，别等到发布前才救火。。这一章最想强调的：大型测试覆盖单元测试看不到的地方，但要有策略、有节制。 大型测试由被测系统、数据、操作和验证组成；良好的设计从测试策略开始。</desc>
