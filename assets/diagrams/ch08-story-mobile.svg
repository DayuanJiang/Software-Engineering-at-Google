<svg xmlns="http://www.w3.org/2000/svg" width="420" height="856" viewBox="0 0 420 856" class="chapter-svg cg-ch08-story" data-layout="mobile" role="img" aria-labelledby="ch08-storym-title ch08-storym-desc">
  <title id="ch08-storym-title">从一个被禁用的 unique_ptr，到会自己更新的规则</title>
  <desc id="ch08-storym-desc">本章回顾。从一个被禁用的 unique_ptr，到会自己更新的规则。起点：谷歌曾经禁止使用 std::unique_ptr。当时它是陌生类型，移动语义也少有人懂。规则的理由很实在：读代码的人看不懂。；冲突：几万工程师、几亿行代码，靠什么保持一致？。没有规则，每个人按自己的习惯写，读别人的代码就要先猜。规则的目的是让读者少花力气。；转折：规则不追求完美，追求可持续。规则要少而精、优先照顾读者、能扛住时间和规模；能自动检查的就交给工具；不该写成规则的留作指导。；做法：规则会过时，所以要能改。后来大家适应了 unique_ptr，看到了所有权信息的长期价值，规则就改成了推荐。改规则要有明确流程，用数据说话。。这一章最想强调的：规则和指导的目的是帮组织应对时间推移和规模增长，一致性是关键。 只要可行，就用自动化执行规则；了解数据，随时调整规则。</desc>
