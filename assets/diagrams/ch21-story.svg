<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" class="chapter-svg cg-ch21-story" data-layout="desktop" role="img" aria-labelledby="ch21-story-title ch21-story-desc">
  <title id="ch21-story-title">从一个随手 import 的库，到“谁来为兼容负责”</title>
  <desc id="ch21-story-desc">本章回顾。从一个随手 import 的库，到“谁来为兼容负责”。起点：引入一个库只要一行，看起来免费。可它由别人维护，随时会变。你不控制它，却要一直跟着它。引入依赖的成本在之后的每一年。；冲突：菱形依赖：两个库要求同一个依赖的不同版本。越往下游，越难协调。版本策略只有几种：全部不动、看语义化版本、跟发行版、跟最新。每种都有代价。；转折：SemVer 只是一个人的风险估计。版本号把“这次改动多大风险”压成一个数字，包管理器却把它当事实求解，于是要么约束过度，要么约束不足。；做法：依赖是契约，兼容靠测试证明。提供方说清愿意承诺什么，使用方补上测试；资源足够时，Live at Head 用 CI 给出实际证据。能放进自己版本控制的代码，就别当外部依赖。。这一章最想强调的：依赖是一种契约，双方都有权利和责任；版本号替代不了测试。 优先把问题变成源代码版本控制问题；引入依赖前，先想清长期支持的成本。</desc>
