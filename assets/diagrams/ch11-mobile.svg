  <defs><marker id="ch11m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">为什么要写测试，写多大的测试？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">测试金字塔：底座宽、塔尖窄。规模（小中大）看占用的资源，</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">范围（窄中广）看验证多少代码</text>
  <text x="22.0" y="132.0" class="h16" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">从上到下</text>
  <rect x="22.0" y="148.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="174.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,166.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
  <text x="74.0" y="179.0" class="h18" text-anchor="start">端到端，约 5%</text>
  <text x="74.0" y="204.0" class="c15" text-anchor="start">大而广：慢且不稳，只留关键路径</text>
  <rect x="22.0" y="224.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="250.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,242.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
  <text x="74.0" y="255.0" class="h18" text-anchor="start">集成测试，约 15%</text>
  <text x="74.0" y="280.0" class="c15" text-anchor="start">中等规模：单机多进程，验证几个组件的配合</text>
  <rect x="22.0" y="300.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="326.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,318.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5c-1.4 0-2.5-1.1-2.5-2.5V2"/><path d="M8.5 2h7"/><path d="M14.5 16h-5"/></g>
  <text x="74.0" y="331.0" class="h18" text-anchor="start">单元测试，约 80%</text>
  <text x="74.0" y="356.0" class="c15" text-anchor="start">小而窄：单进程、无网络无磁盘，毫秒级，几</text>
  <text x="74.0" y="378.0" class="c15" text-anchor="start">乎不会无故失败</text>
  <text x="22.0" y="410.0" class="c13" text-anchor="start">自动化测试是让软件能持续变更的基础；碧昂斯规则：喜欢它，</text>
  <text x="22.0" y="430.0" class="c13" text-anchor="start">就为它写个测试</text>
  <rect x="22.0" y="456.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="477.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="503.0" class="answer-m" text-anchor="start">测试让代码改得放心；大部分测试应该小、</text>
  <text x="36.0" y="529.0" class="answer-m" text-anchor="start">快、确定</text>
</svg>
