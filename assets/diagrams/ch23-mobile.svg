  <text x="22.0" y="658.0" class="c13" text-anchor="start">然后回到第一步，循环往复。Takeout 团队的四个场景说明：随</text>
  <text x="22.0" y="678.0" class="c13" text-anchor="start">着规模变大，CI 越来越不可或缺；负担不起完整 CI 时也能从小</text>
  <text x="22.0" y="698.0" class="c13" text-anchor="start">做起</text>
