<svg xmlns="http://www.w3.org/2000/svg" width="420" height="836" viewBox="0 0 420 836" class="chapter-svg cg-ch23" data-layout="mobile" role="img" aria-labelledby="ch23m-title ch23m-desc">
  <title id="ch23m-title">集成问题为什么越早发现越便宜？</title>
  <desc id="ch23m-desc">本章概览。集成问题为什么越早发现越便宜？ 本章的主要部分：写代码：小步改动，随时准备集成；提交前：跑快而可靠的测试：单元测试、静态分析，几分钟出结果；提交：进入主干，TAP 全球持续构建开始跑更慢、覆盖更广的测试；提交后：慢而不太确定的测试放这里；坏了要能快速定位到某次提交；修复或回滚：反馈易得、能立刻行动；封闭测试让结果可重复。一句话：持续集成就是把发现问题的时间不断往前挪，让反馈快而可信</desc>
