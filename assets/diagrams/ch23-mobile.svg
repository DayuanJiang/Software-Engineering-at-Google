  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">集成问题为什么越早发现越便宜？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">CI 是一个反馈回路：决定运行哪些测试、什么时候运行</text>
