  <text x="74.0" y="263.0" class="h18" text-anchor="start">拆成分片</text>
  <text x="74.0" y="288.0" class="c15" text-anchor="start">工具按目录或负责人自动切成许多小改动，每</text>
  <text x="74.0" y="310.0" class="c15" text-anchor="start">片都能独立审查和提交</text>
  <path d="M210.0 322.0 L210.0 338.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch22m-arrow)"/>
  <rect x="22.0" y="346.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="372.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,364.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 22v-2"/><path d="m17 20.66-1-1.73"/><path d="M11 10.27 7 3.34"/><path d="m20.66 17-1.73-1"/><path d="m3.34 7 1.73 1"/><path d="M14 12h8"/><path d="M2 12h2"/><path d="m20.66 7-1.73 1"/><path d="m3.34 17 1.73-1"/><path d="m17 3.34-1 1.73"/><path d="m11 13.73-4 6.93"/></g>
  <text x="74.0" y="377.0" class="h18" text-anchor="start">自动审查提交</text>
  <text x="74.0" y="402.0" class="c15" text-anchor="start">全局批准人代替逐个目录负责人；测试通过就</text>
  <text x="74.0" y="424.0" class="c15" text-anchor="start">自动提交，失败自动回滚</text>
