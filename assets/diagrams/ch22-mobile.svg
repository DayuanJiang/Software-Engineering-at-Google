  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">一处改动牵动几千个文件，怎么做？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">为什么不能一次提交：冲突、审查、测试和技术限制都承受不了</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">巨型提交</text>
  <rect x="22.0" y="118.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">一个逻辑改动</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">改名、换 API、清理旧用法：逻辑上是一件</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">事，物理上散在整个代码库</text>
  <path d="M210.0 208.0 L210.0 224.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch22m-arrow)"/>
  <rect x="22.0" y="232.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
