  <text x="74.0" y="491.0" class="h18" text-anchor="start">清理收尾</text>
  <text x="74.0" y="516.0" class="c15" text-anchor="start">旧接口删掉，兼容别名撤掉，别让迁移停在一</text>
  <text x="74.0" y="538.0" class="c15" text-anchor="start">半</text>
  <text x="22.0" y="570.0" class="c13" text-anchor="start">基础设施：政策与授权、代码库洞察、变更管理工具（Rosie）、</text>
  <text x="22.0" y="590.0" class="c13" text-anchor="start">测试与回滚</text>
