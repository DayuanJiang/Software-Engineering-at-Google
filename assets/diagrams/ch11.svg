  <text x="32.0" y="52.0" class="headline" text-anchor="start">为什么要写测试，写多大的测试？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">测试金字塔：底座宽、塔尖窄。规模（小中大）看占用的资源，范围（窄中广）看验证多少代码</text>
  <rect x="280.0" y="114.0" width="400.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <g transform="translate(298.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
  <text x="340.0" y="142.0" class="h18" text-anchor="start">端到端，约 5%</text>
  <text x="340.0" y="164.0" class="c15" text-anchor="start">大而广：慢且不稳，只留关键路径</text>
  <rect x="160.0" y="186.0" width="640.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
