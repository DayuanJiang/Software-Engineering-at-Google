<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" class="chapter-svg cg-ch11" data-layout="desktop" role="img" aria-labelledby="ch11-title ch11-desc">
  <title id="ch11-title">为什么要写测试，写多大的测试？</title>
  <desc id="ch11-desc">本章概览。为什么要写测试，写多大的测试？ 本章的主要部分：单元测试，约 80%：小而窄：单进程、无网络无磁盘，毫秒级，几乎不会无故失败；集成测试，约 15%：中等规模：单机多进程，验证几个组件的配合；端到端，约 5%：大而广：慢且不稳，只留关键路径。一句话：测试让代码改得放心；大部分测试应该小、快、确定</desc>
