  <text x="220.0" y="214.0" class="h18" text-anchor="start">集成测试，约 15%</text>
  <text x="220.0" y="236.0" class="c15" text-anchor="start">中等规模：单机多进程，验证几个组件的配合</text>
  <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <g transform="translate(50.0,276.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5c-1.4 0-2.5-1.1-2.5-2.5V2"/><path d="M8.5 2h7"/><path d="M14.5 16h-5"/></g>
  <text x="92.0" y="286.0" class="h18" text-anchor="start">单元测试，约 80%</text>
  <text x="92.0" y="308.0" class="c15" text-anchor="start">小而窄：单进程、无网络无磁盘，毫秒级，几乎不会无故失败</text>
  <text x="32.0" y="348.0" class="c14" text-anchor="start">自动化测试是让软件能持续变更的基础；碧昂斯规则：喜欢它，就为它写个测试</text>
  <rect x="32.0" y="376.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="397.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="427.0" class="answer" text-anchor="start">测试让代码改得放心；大部分测试应该小、快、确定</text>
</svg>
