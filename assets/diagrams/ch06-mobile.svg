<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch06" data-layout="mobile" role="img" aria-labelledby="ch06m-title ch06m-desc">
  <title id="ch06m-title">离开一周，搜索延迟问题还会推进吗？</title>
  <desc id="ch06m-desc">将本章搜索案例与休假检验并置的依赖关系示意，不是实际组织图。左侧或上侧的子团队凡事等待领导者，领导者休假便暴露单点依赖。右侧或下侧经过培养的子团队领导者衡量质量收益与延迟代价，依数据作决定并继续迭代。组织领导者仍负责整体方向与关键调整，而不逐项代办，从而为新职责保留时间、注意力与精力。</desc>
  <style>
    .cg-ch06[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424);}
    .cg-ch06[data-layout="mobile"] .strong {font-weight:600;}
    .cg-ch06[data-layout="mobile"] .heading {font-size:22px;font-weight:600;}
    .cg-ch06[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868);}
    .cg-ch06[data-layout="mobile"] .good {fill:var(--diagram-primary,#087f6d);}
    .cg-ch06[data-layout="mobile"] .bad {fill:var(--diagram-danger,#b54750);}
    .cg-ch06[data-layout="mobile"] .cost {fill:var(--diagram-warm,#a56a1f);}
    .cg-ch06[data-layout="mobile"] .blue {fill:var(--diagram-secondary,#2f6eac);}
    .cg-ch06[data-layout="mobile"] .edge {fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="ch06m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
    <marker id="ch06m-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
    <marker id="ch06m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
    <marker id="ch06m-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
  </defs>
  <rect x="0" y="0" width="420" height="680" rx="0" fill="var(--diagram-bg,#fff)"/>
  <text x="24" y="38" text-anchor="start" class="heading">离开一周，搜索延迟问题</text>
  <text x="24" y="68" text-anchor="start" class="heading">还会推进吗？</text>
  <text x="24" y="99" text-anchor="start" class="small">搜索案例 × 休假检验</text>
  <text x="24" y="125" text-anchor="start" class="small">组织依赖示意，不是实际组织图</text>
  <rect x="24" y="146" width="372" height="58" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" id="ch06m-work"/>
  <text x="210" y="182" text-anchor="middle" class="strong" data-box="ch06m-work">搜索变更：质量、延迟、容量</text>
  <text x="24" y="239" text-anchor="start" class="strong bad">事事依赖你</text>
  <rect x="24" y="254" width="156" height="74" rx="6" fill="var(--diagram-bg,#fff)" id="ch06m-waiting" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="102" y="283" text-anchor="middle" class="strong" data-box="ch06m-waiting">子团队</text>
  <text x="102" y="313" text-anchor="middle" data-box="ch06m-waiting">等待决策</text>
  <path d="M180 291H230" class="edge" stroke="var(--diagram-danger,#b54750)" marker-end="url(#ch06m-danger)"/>
  <rect x="240" y="254" width="156" height="74" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06m-absent" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="318" y="283" text-anchor="middle" class="strong" data-box="ch06m-absent">你</text>
  <text x="318" y="313" text-anchor="middle" data-box="ch06m-absent">休假一周</text>
  <text x="24" y="362" text-anchor="start" class="bad">你不在，取舍便无人接手</text>
  <path d="M24 384H396" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="24" y="415" text-anchor="start" class="strong good">已培养独立领导者</text>
  <rect x="24" y="434" width="344" height="54" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" id="ch06m-decision" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="196" y="468" text-anchor="middle" class="strong" data-box="ch06m-decision">团队权衡收益与延迟代价</text>
  <path d="M196 488V516" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06m-primary)"/>
  <rect x="24" y="526" width="344" height="54" rx="6" fill="var(--diagram-bg,#fff)" id="ch06m-iterate" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="196" y="560" text-anchor="middle" data-box="ch06m-iterate">依数据决定，继续迭代</text>
  <path d="M368 553H392V461H378" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06m-primary)"/>
  <path d="M24 603H396" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="24" y="635" text-anchor="start" class="strong">你负责整体方向与关键调整</text>
  <text x="24" y="665" text-anchor="start" class="small">为新职责保留时间、注意力与精力</text>
</svg>
