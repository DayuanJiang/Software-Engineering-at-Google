  <rect x="0" y="0" width="960" height="444" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch09-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="32.0" y="52.0" class="headline" text-anchor="start">每次改动都要别人看过，值不值？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">谷歌每一次改动提交前都要经过审查；流程本身不复杂，价值在流程之外</text>
  <circle cx="134.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(119.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
  <text x="134.2" y="210.0" class="h18" text-anchor="middle">写好改动</text>
  <text x="134.2" y="236.0" class="c15" text-anchor="middle">改动要小，描述要清楚；提</text>
  <text x="134.2" y="258.0" class="c15" text-anchor="middle">交前先看一遍自动检查结果</text>
  <path d="M240.5 150.0 L258.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09-arrow)"/>
  <circle cx="364.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(349.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></g>
  <text x="364.8" y="210.0" class="h18" text-anchor="middle">请人审查</text>
  <text x="364.8" y="236.0" class="c15" text-anchor="middle">选尽量少的审查者；审查者</text>
  <text x="364.8" y="258.0" class="c15" text-anchor="middle">礼貌、专业、快速回复</text>
  <path d="M471.0 150.0 L489.0 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09-arrow)"/>
  <circle cx="595.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(580.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="595.2" y="210.0" class="h18" text-anchor="middle">三项批准</text>
  <text x="595.2" y="236.0" class="c15" text-anchor="middle">有人认可（LGTM）、目录负</text>
  <text x="595.2" y="258.0" class="c15" text-anchor="middle">责人同意、该语言可读性认</text>
  <text x="595.2" y="280.0" class="c15" text-anchor="middle">证；一人可以兼任多项</text>
  <path d="M701.5 150.0 L719.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09-arrow)"/>
  <circle cx="825.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(810.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="825.8" y="210.0" class="h18" text-anchor="middle">处理意见后提交</text>
  <text x="825.8" y="236.0" class="c15" text-anchor="middle">所有意见处理完才能提交；</text>
  <text x="825.8" y="258.0" class="c15" text-anchor="middle">审查记录成为代码的历史</text>
  <text x="32.0" y="316.0" class="c14" text-anchor="start">带来什么：发现错误、代码更好懂、全库一致、知识传播、心理上的共同所有权、留下记录</text>
  <rect x="32.0" y="348.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="369.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="399.0" class="answer" text-anchor="start">值：代码审查是团队共同拥有代码库的方式，收益远超找错</text>
</svg>
