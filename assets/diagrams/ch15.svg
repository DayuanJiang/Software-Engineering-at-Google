  <rect x="0" y="0" width="960" height="441" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="32.0" y="52.0" class="headline" text-anchor="start">老系统还有人用，怎么才能下线？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">为什么难：迁移的成本和收益落在不同人身上；用户的用法常常超出最初的设计</text>
  <circle cx="111.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(96.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>
  <text x="111.2" y="210.0" class="h18" text-anchor="middle">先算成本</text>
  <text x="111.2" y="236.0" class="c14" text-anchor="middle">老系统一直在耗维护精</text>
  <text x="111.2" y="257.0" class="c14" text-anchor="middle">力；留着的成本要和移</text>
  <text x="111.2" y="278.0" class="c14" text-anchor="middle">除的成本比</text>
