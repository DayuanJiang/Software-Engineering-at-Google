  <circle cx="295.6" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(280.6,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="M12 3v3"/><path d="M18 6a2 2 0 0 1 1.387.56l2.307 2.22a1 1 0 0 1 0 1.44l-2.307 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.387-.56l-2.306-2.22a1 1 0 0 1 0-1.44l2.306-2.22A2 2 0 0 1 6 6z"/></g>
  <text x="295.6" y="210.0" class="h18" text-anchor="middle">选类型</text>
  <text x="295.6" y="236.0" class="c14" text-anchor="middle">建议性：只通知，靠用</text>
  <text x="295.6" y="257.0" class="c14" text-anchor="middle">户自愿；强制性：有团</text>
  <text x="295.6" y="278.0" class="c14" text-anchor="middle">队、有期限</text>
  <path d="M378.8 150.0 L396.8 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch15-arrow)"/>
  <circle cx="480.0" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(465.0,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="15" r="3"/><circle cx="9" cy="7" r="4"/><path d="M10 15H6a4 4 0 0 0-4 4v2"/><path d="m21.7 16.4-.9-.3"/><path d="m15.2 13.9-.9-.3"/><path d="m16.6 18.7.3-.9"/><path d="m19.1 12.2.3-.9"/><path d="m19.6 18.7-.4-1"/><path d="m16.8 12.3-.4-1"/><path d="m14.3 16.6 1-.4"/><path d="m20.7 13.8 1-.4"/></g>
  <text x="480.0" y="210.0" class="h18" text-anchor="middle">定负责人</text>
  <text x="480.0" y="236.0" class="c14" text-anchor="middle">明确谁负责推进，设里</text>
  <text x="480.0" y="257.0" class="c14" text-anchor="middle">程碑，让进度可见</text>
  <path d="M563.2 150.0 L581.2 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch15-arrow)"/>
  <circle cx="664.4" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(649.4,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></g>
  <text x="664.4" y="210.0" class="h18" text-anchor="middle">找出用法</text>
  <text x="664.4" y="236.0" class="c14" text-anchor="middle">用代码搜索和静态分析</text>
  <text x="664.4" y="257.0" class="c14" text-anchor="middle">找到每一个使用点</text>
  <path d="M747.6 150.0 L765.6 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch15-arrow)"/>
  <circle cx="848.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(833.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>
  <text x="848.8" y="210.0" class="h18" text-anchor="middle">迁走再关</text>
  <text x="848.8" y="236.0" class="c14" text-anchor="middle">自动化迁移，逐步收</text>
  <text x="848.8" y="257.0" class="c14" text-anchor="middle">口；最后一个用户往往</text>
  <text x="848.8" y="278.0" class="c14" text-anchor="middle">是关键基础设施</text>
  <text x="32.0" y="313.0" class="c14" text-anchor="start">更便宜的做法：让系统原地演进；还有一种选择是从设计时就想好怎么弃用</text>
  <rect x="32.0" y="345.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="366.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="396.0" class="answer" text-anchor="start">弃用是个正式项目：有人负责、有期限、有工具，从设计时就该考虑</text>
