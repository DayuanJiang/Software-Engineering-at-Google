<svg xmlns="http://www.w3.org/2000/svg" width="420" height="592" viewBox="0 0 420 592" class="chapter-svg cg-ch20" data-layout="mobile" role="img" aria-labelledby="ch20m-title ch20m-desc">
  <title id="ch20m-title">编译能过，代码就没问题了吗？</title>
  <desc id="ch20m-desc">本章概览。编译能过，代码就没问题了吗？ 本章的主要部分：编译器：只查语法和类型；long 换成 int 之后右移成了空操作，它照样通过；静态分析（Tricorder）：跑得快、误报少、结果让工程师愿意看；在代码审查时给出意见，附带修复建议；人工审查：只处理需要判断和取舍的部分；机器能抓的问题不该耗审查者的时间。一句话：编译只查语法和类型；静态分析在审查时自动抓出更多问题</desc>
