  <defs><marker id="ch20m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">编译能过，代码就没问题了吗？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">三层把关，越往上越依赖人的判断</text>
  <text x="22.0" y="112.0" class="h16" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">从上到下</text>
  <rect x="22.0" y="128.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="154.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
  <text x="74.0" y="159.0" class="h18" text-anchor="start">人工审查</text>
  <text x="74.0" y="184.0" class="c15" text-anchor="start">只处理需要判断和取舍的部分；机器能抓的问</text>
  <text x="74.0" y="206.0" class="c15" text-anchor="start">题不该耗审查者的时间</text>
  <rect x="22.0" y="226.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="252.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,244.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></g>
  <text x="74.0" y="257.0" class="h18" text-anchor="start">静态分析（Tricorder）</text>
  <text x="74.0" y="282.0" class="c15" text-anchor="start">跑得快、误报少、结果让工程师愿意看；在代</text>
  <text x="74.0" y="304.0" class="c15" text-anchor="start">码审查时给出意见，附带修复建议</text>
  <rect x="22.0" y="324.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="350.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,342.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="4" height="6" rx="2"/><rect x="6" y="4" width="4" height="6" rx="2"/><path d="M6 20h4"/><path d="M14 10h4"/><path d="M6 14h2v6"/><path d="M14 4h2v6"/></g>
  <text x="74.0" y="355.0" class="h18" text-anchor="start">编译器</text>
  <text x="74.0" y="380.0" class="c15" text-anchor="start">只查语法和类型；long 换成 int 之后右移成</text>
  <text x="74.0" y="402.0" class="c15" text-anchor="start">了空操作，它照样通过</text>
  <text x="22.0" y="434.0" class="c13" text-anchor="start">关键经验：关注开发者的感受；把分析融入核心工作流；让领域</text>
  <text x="22.0" y="454.0" class="c13" text-anchor="start">专家贡献自己的检查</text>
  <rect x="22.0" y="480.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="501.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="527.0" class="answer-m" text-anchor="start">编译只查语法和类型；静态分析在审查时自动</text>
  <text x="36.0" y="553.0" class="answer-m" text-anchor="start">抓出更多问题</text>
</svg>
