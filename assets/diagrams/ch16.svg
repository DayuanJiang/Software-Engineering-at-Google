  <rect x="0" y="0" width="960" height="454" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="32.0" y="52.0" class="headline" text-anchor="start">为什么谷歌几乎只在主干上开发？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">版本控制记录每次改动，让多人改同一套代码；问题出在“分支怎么用”</text>
  <rect x="32.0" y="114.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <g transform="translate(52.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></g>
  <text x="88.0" y="152.0" class="h20" text-anchor="start">长期开发分支</text>
  <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="189.0" class="t15" text-anchor="start">各自埋头几周，合并时冲突成堆</text>
  <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="219.0" class="t15" text-anchor="start">同一份代码有多个版本要选</text>
  <g transform="translate(52.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="249.0" class="t15" text-anchor="start">修复要往每个分支各打一遍</text>
  <g transform="translate(52.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="279.0" class="t15" text-anchor="start">研究表明它拖累组织绩效</text>
  <rect x="510.0" y="114.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <g transform="translate(530.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="566.0" y="152.0" class="h20" text-anchor="start">主干开发</text>
  <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="189.0" class="t15" text-anchor="start">小步提交，随时集成</text>
  <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="219.0" class="t15" text-anchor="start">单版本规则：不用选“依赖哪个版本”</text>
  <g transform="translate(530.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="249.0" class="t15" text-anchor="start">发布分支只挑选修复，不带新功能</text>
  <g transform="translate(530.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="279.0" class="t15" text-anchor="start">单体仓库让全公司看同一份代码</text>
  <path d="M462.0 210.0 L498.0 210.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16-arrow)"/>
  <text x="480.0" y="196.0" class="c13" text-anchor="middle">改为</text>
  <text x="32.0" y="330.0" class="c14" text-anchor="start">版本控制的未来：越来越多工具同时支持细粒度小仓库和整个组织的单体仓库</text>
  <rect x="32.0" y="358.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="379.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="409.0" class="answer" text-anchor="start">所有人在同一个主干上工作，改动小而频繁，合并的痛苦最少</text>
</svg>
