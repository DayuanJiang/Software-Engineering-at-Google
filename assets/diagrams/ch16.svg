    .cg-ch16[data-layout="desktop"] .h22 {font-size:22px;font-weight:600}
    .cg-ch16[data-layout="desktop"] .h20 {font-size:20px;font-weight:600}
    .cg-ch16[data-layout="desktop"] .h19 {font-size:19px;font-weight:600}
    .cg-ch16[data-layout="desktop"] .h18 {font-size:18px;font-weight:600}
