<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" class="chapter-svg cg-ch01" data-layout="desktop" role="img" aria-labelledby="ch01-title ch01-desc">
  <title id="ch01-title">软件工程和编程差在哪？</title>
  <desc id="ch01-desc">本章概览。软件工程和编程差在哪？ 本章的主要部分：时间：代码要用多久？；规模：多少人一起改？；权衡：决策要算成本和收益；重审：数据变了就回头改。一句话：软件工程是把编程放进时间里：多人、多年、随时改得动</desc>
