  <text x="46.0" y="303.0" class="c14" text-anchor="start">学习的前提；嘲笑提</text>
  <text x="46.0" y="324.0" class="c14" text-anchor="start">问的人等于关掉知识</text>
  <text x="46.0" y="345.0" class="c14" text-anchor="start">的水龙头</text>
