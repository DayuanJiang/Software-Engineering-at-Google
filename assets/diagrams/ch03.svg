  <text x="777.2" y="248.0" class="h18" text-anchor="start">组织制度</text>
  <text x="777.2" y="282.0" class="c14" text-anchor="start">用培训、文档、可读</text>
  <text x="777.2" y="303.0" class="c14" text-anchor="start">性认证把经验标准化，</text>
  <text x="777.2" y="324.0" class="c14" text-anchor="start">并奖励愿意花时间教</text>
  <text x="777.2" y="345.0" class="c14" text-anchor="start">人的人</text>
