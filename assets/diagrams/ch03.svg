  <text x="228.8" y="248.0" class="h18" text-anchor="start">多提问</text>
  <text x="228.8" y="282.0" class="c14" text-anchor="start">问出来比自己猜快得</text>
  <text x="228.8" y="303.0" class="c14" text-anchor="start">多；把问到的答案记</text>
  <text x="228.8" y="324.0" class="c14" text-anchor="start">下来，下一个人就不</text>
  <text x="228.8" y="345.0" class="c14" text-anchor="start">用再问</text>
