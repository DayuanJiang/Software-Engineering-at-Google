  <text x="411.6" y="248.0" class="h18" text-anchor="start">问社区</text>
  <text x="411.6" y="282.0" class="c14" text-anchor="start">邮件组、问答频道让</text>
  <text x="411.6" y="303.0" class="c14" text-anchor="start">一个问题的答案被很</text>
  <text x="411.6" y="324.0" class="c14" text-anchor="start">多人看到</text>
