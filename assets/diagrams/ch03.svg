<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" class="chapter-svg cg-ch03" data-layout="desktop" role="img" aria-labelledby="ch03-title ch03-desc">
  <title id="ch03-title">组织里的知识，怎样才不随人走？</title>
  <desc id="ch03-desc">本章概览。组织里的知识，怎样才不随人走？ 本章的主要部分：心理安全：敢提问、敢认错，是学习的前提；嘲笑提问的人等于关掉知识的水龙头；多提问：问出来比自己猜快得多；把问到的答案记下来，下一个人就不用再问；问社区：邮件组、问答频道让一个问题的答案被很多人看到；教别人：你总有东西可以教：办公时间、技术讲座、写文档、做代码审查；组织制度：用培训、文档、可读性认证把经验标准化，并奖励愿意花时间教人的人。一句话：让人敢问、愿教，再用文档和制度把知识沉淀成组织的资产</desc>
