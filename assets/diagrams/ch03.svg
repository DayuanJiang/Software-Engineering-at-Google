  <text x="594.4" y="248.0" class="h18" text-anchor="start">教别人</text>
  <text x="594.4" y="282.0" class="c14" text-anchor="start">你总有东西可以教：</text>
  <text x="594.4" y="303.0" class="c14" text-anchor="start">办公时间、技术讲座、</text>
  <text x="594.4" y="324.0" class="c14" text-anchor="start">写文档、做代码审查</text>
