<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" class="chapter-svg cg-ch10" data-layout="desktop" role="img" aria-labelledby="ch10-title ch10-desc">
  <title id="ch10-title">工程师为什么不爱写文档，怎么改？</title>
  <desc id="ch10-desc">本章概览。工程师为什么不爱写文档，怎么改？ 本章的主要部分：常见状况：没人写、没人看、过时不删；当作代码：有负责人、有评审、想清读者、一份只做一件事。一句话：把文档当作代码来写、评审和维护，动笔前先想清读者是谁</desc>
  <style>
    .cg-ch10[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:var(--diagram-ink,#242424)}
