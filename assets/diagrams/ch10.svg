<svg xmlns="http://www.w3.org/2000/svg" id="ch10-diagram" class="chapter-svg cg-ch10" role="img" aria-labelledby="ch10-title ch10-desc" viewBox="0 0 960 560" width="960" height="560">
<title id="ch10-title">读者能做出下一步判断吗？</title>
<desc id="ch10-desc">三个据本章改绘的阅读卡点。按 StrCat 原注释推演，输入字符串 a 和 b 不插入分隔符，所以得到 ab，而不是 a 空格 b。原文的教程失败示例漏写了用户名授权前提，读者需要先确认权限。对失效教程，应标明过时，并在有替代来源时指向它。使用中的问题通过反馈接回负责人和变更评审。这些例子是不同的判断条件，不是一个必须依次完成的流程；示例代码未执行。</desc>
<style>
.cg-ch10#ch10-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch10#ch10-diagram .small{font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch10#ch10-diagram .heading{font-size:26px;font-weight:600}
.cg-ch10#ch10-diagram .strong{font-weight:600}
.cg-ch10#ch10-diagram .code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.cg-ch10#ch10-diagram .good{fill:var(--diagram-primary,#087f6d)}
.cg-ch10#ch10-diagram .bad{fill:var(--diagram-danger,#b54750)}
.cg-ch10#ch10-diagram .system{fill:var(--diagram-secondary,#2f6eac)}
</style>
<defs><marker id="ch10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.6"/></marker></defs>
<rect width="960" height="560" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="43" class="heading" text-anchor="start">读者能做出下一步判断吗？</text>
<text x="32" y="79" class="small" text-anchor="start">三个阅读卡点，据本章例子改绘；拼接输入与输出是按原注释推演的示例。</text>
<text x="32" y="123" class="small strong" text-anchor="start">读者要判断</text>
<text x="384" y="123" class="small strong" text-anchor="start">文档中补明的依据</text>
<text x="734" y="123" class="small strong" text-anchor="start">读者能作出的判断</text>
<path d="M32 142H928" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<path d="M32 259H928" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<path d="M32 379H928" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<text x="32" y="181" class="strong" text-anchor="start" data-bounds="32 150 278 90">会自动加空格吗？</text>
<text x="32" y="218" class="code small" text-anchor="start" data-bounds="32 150 278 90">StrCat(&quot;a&quot;, &quot;b&quot;)</text>
<path d="M312 196H356" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="384" y="181" class="" text-anchor="start" data-bounds="384 150 290 90">注释补明“无分隔符”</text>
<text x="384" y="218" class="code small" text-anchor="start" data-bounds="384 150 290 90">using no delimiter(s)</text>
<path d="M680 196H716" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="734" y="181" class="code strong good" text-anchor="start" data-bounds="734 150 194 90">&quot;ab&quot;</text>
<text x="734" y="218" class="small" text-anchor="start" data-bounds="734 150 194 90">不会自动加空格</text>
<text x="32" y="300" class="strong" text-anchor="start" data-bounds="32 270 278 90">为何第4步报错？</text>
<text x="32" y="337" class="small" text-anchor="start" data-bounds="32 270 278 90">示例：用户名尚未授权</text>
<path d="M312 315H356" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="384" y="300" class="" text-anchor="start" data-bounds="384 270 290 90">教程漏写了权限前提</text>
<text x="384" y="337" class="small" text-anchor="start" data-bounds="384 270 290 90">将必要权限写在开头</text>
<path d="M680 315H716" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="734" y="300" class="strong good" text-anchor="start" data-bounds="734 270 194 90">先补齐权限</text>
<text x="734" y="337" class="small" text-anchor="start" data-bounds="734 270 194 90">再继续该教程</text>
<text x="32" y="420" class="strong" text-anchor="start" data-bounds="32 390 278 90">旧教程还能照做吗？</text>
<text x="32" y="457" class="small" text-anchor="start" data-bounds="32 390 278 90">内容失效，却无标记</text>
<path d="M312 435H356" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="384" y="420" class="bad" text-anchor="start" data-bounds="384 390 290 90">标明“已过时”</text>
<text x="384" y="457" class="small" text-anchor="start" data-bounds="384 390 290 90">有新来源时给出指引</text>
<path d="M680 435H716" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch10-arrow)" data-connector="true"/>
<text x="734" y="420" class="strong good" text-anchor="start" data-bounds="734 390 194 90">不再盲从旧页</text>
<text x="734" y="457" class="small" text-anchor="start" data-bounds="734 390 194 90">按指引查找新信息</text>
<rect x="32" y="501" width="896" height="40" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="48" y="528" class="small" text-anchor="start" data-bounds="48 505 864 32">文档质量由读者使用检验；问题反馈给负责人，再进入现有变更评审。</text>
</svg>
