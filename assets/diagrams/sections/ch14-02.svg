<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch14-02" data-layout="desktop" role="img" aria-labelledby="ch14-02-title ch14-02-desc">
<title id="ch14-02-title">用数据衔接较小的集成测试</title>
<desc id="ch14-02-desc">把跨越多个组件的用户旅程拆成两两集成测试。测试 A 加 B 的输出持久化后成为测试 B 加 C 的输入。箭头只表示数据传递，不表示必须串行执行。</desc>
<style>
.cg-ch14-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch14-02[data-layout="desktop"] .strong {font-weight:600}
.cg-ch14-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch14-02[data-layout="desktop"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
.cg-ch14-02[data-layout="desktop"] .primary {fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch14-02[data-layout="desktop"] .primary-path {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch14-02-primary-arrow)}
.cg-ch14-02[data-layout="desktop"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch14-02[data-layout="desktop"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch14-02[data-layout="desktop"] .secondary-path {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;marker-end:url(#ch14-02-secondary-arrow)}
.cg-ch14-02[data-layout="desktop"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch14-02[data-layout="desktop"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch14-02[data-layout="desktop"] .warm-path {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2;marker-end:url(#ch14-02-warm-arrow)}
.cg-ch14-02[data-layout="desktop"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch14-02[data-layout="desktop"] .danger {fill:var(--diagram-danger-soft,#faecee);stroke:var(--diagram-danger,#b54750);stroke-width:1.5}
.cg-ch14-02[data-layout="desktop"] .danger-path {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2;marker-end:url(#ch14-02-danger-arrow)}
.cg-ch14-02[data-layout="desktop"] .danger-ink {fill:var(--diagram-danger,#b54750)}
</style><defs>
<marker id="ch14-02-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch14-02-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch14-02-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch14-02-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">用数据衔接较小的集成测试</text>
<text x="32" y="78" class="small" text-anchor="start">概念组件 A / B / C：把用户旅程拆成较小的两两集成测试</text>
<g data-box="32,145,270,154"><rect x="32" y="145" width="270" height="154" rx="6" class="secondary"/>
<text x="167.0" y="204.5" class="strong" text-anchor="middle">集成测试 A + B</text>
<text x="167.0" y="235.5" class="small" text-anchor="middle">只启动这一对组件</text>
<text x="167.0" y="261.5" class="small" text-anchor="middle">生成下一边界所需输出</text>
</g>
<g data-box="358,168,244,108"><rect x="358" y="168" width="244" height="108" rx="6" class="warm"/>
<text x="480.0" y="217.5" class="strong" text-anchor="middle">持久化数据</text>
<text x="480.0" y="248.5" class="small" text-anchor="middle">可复用的测试输入</text>
</g>
<g data-box="658,145,270,154"><rect x="658" y="145" width="270" height="154" rx="6" class="primary"/>
<text x="793.0" y="204.5" class="strong" text-anchor="middle">集成测试 B + C</text>
<text x="793.0" y="235.5" class="small" text-anchor="middle">只启动这一对组件</text>
<text x="793.0" y="261.5" class="small" text-anchor="middle">独立验证后半段行为</text>
</g>
<path d="M302 222H356" class="primary-path"/>
<path d="M602 222H656" class="primary-path"/>
<text x="330" y="138" class="small" text-anchor="middle">保存</text>
<text x="630" y="138" class="small" text-anchor="middle">读取</text>
<text x="32" y="359" class="strong" text-anchor="start">更小的 SUT：减少每个测试必须启动、协调和维护的组件</text>
<rect x="32" y="416" width="896" height="44" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="480.0" y="445.5" class="small" text-anchor="middle">“串联”的是输入输出契约，不是规定测试的执行顺序</text>
</svg>
