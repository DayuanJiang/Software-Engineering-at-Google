<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch05-04" data-layout="mobile" role="img" aria-labelledby="ch05-04m-title ch05-04m-desc">
  <title id="ch05-04m-title">不知怎么做，还是不知为何做？</title>
  <desc id="ch05-04m-desc">两种支持缺口需要不同信息。方向不清时，领导把工作拆成可管理任务，让下一步可执行。意义不清时，原书经理把客户描述产品帮助的邮件转发给工程团队，让团队看见谁从产品受益。成员可能同时需要两者，图不是人格分类，也不保证产出增加；内在激励的讨论以薪酬不构成压力为前提。</desc>
  <style>
.cg-ch05-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch05-04[data-layout="mobile"] .strong {font-weight:600}
.cg-ch05-04[data-layout="mobile"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
