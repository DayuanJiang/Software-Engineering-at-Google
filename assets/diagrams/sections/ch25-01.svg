<svg xmlns="http://www.w3.org/2000/svg" id="ch25-01-root" class="chapter-svg cg-ch25-01" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="ch25-01-title ch25-01-desc">
<title id="ch25-01-title">装箱解决放置，隔离约束越界</title>
<desc id="ch25-01-desc">示例：日志分析声明 CPU 和 RAM 需求，调度器排除磁盘故障的机器甲，选择健康机器乙。在同机运行时，只有需求声明不能阻止日志分析超用 CPU，使搜索服务变慢；实际执行的资源限制才约束越界使用。RAM 耗尽还可能使进程被内核终止，或因磁盘交换变慢。隔离是额外职责，不能由成功放置推导出完整隔离或零干扰。</desc>
<style>
.cg-ch25-01#ch25-01-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-01#ch25-01-root .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch25-01#ch25-01-root .strong {font-weight:600}
.cg-ch25-01#ch25-01-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch25-01-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch25-01-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch25-01-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch25-01-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch25-01-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)" stroke="none" stroke-width="1.5"/>
<text x="32" y="42" text-anchor="start" class="strong">装箱解决放置，隔离约束越界</text>
<text x="32" y="78" text-anchor="start" class="small">示例：日志分析与搜索服务共用机器；调度和隔离承担不同职责</text>
<rect x="32" y="108" width="224" height="62" rx="0" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="48" y="146" text-anchor="start" class="strong" data-box="32,108,224,62">声明 CPU、RAM</text>
<path data-connector="true" d="M256 139H302" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch25-01-secondary-arrow)"/>
<rect x="312" y="108" width="200" height="62" rx="0" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="412" y="146" text-anchor="middle" class="strong" data-box="312,108,200,62">中央调度器</text>
<path data-connector="true" d="M512 139H544V121H570" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" marker-end="url(#ch25-01-danger-arrow)"/>
<path data-connector="true" d="M544 139V163H570" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch25-01-primary-arrow)"/>
<text x="586" y="128" text-anchor="start" class="small danger">磁盘故障甲：排除</text>
<text x="586" y="170" text-anchor="start" class="small">健康机器乙：放置作业</text>
<text x="32" y="237" text-anchor="start" class="strong">只有声明</text>
<text x="32" y="272" text-anchor="start" class="small">同机争抢</text>
<rect x="190" y="211" width="176" height="76" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="278" y="257" text-anchor="middle" class="" data-box="190,211,176,76">日志分析</text>
<rect x="712" y="211" width="216" height="76" rx="0" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="820" y="257" text-anchor="middle" class="" data-box="712,211,216,76">搜索变慢</text>
<path data-connector="true" d="M366 251H702" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" marker-end="url(#ch25-01-danger-arrow)"/>
<text x="538" y="234" text-anchor="middle" class="small danger">超用 CPU，挤占邻居</text>
<text x="32" y="340" text-anchor="start" class="strong">执行限制</text>
<text x="32" y="375" text-anchor="start" class="small">约束越界</text>
<rect x="190" y="314" width="176" height="76" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="278" y="360" text-anchor="middle" class="" data-box="190,314,176,76">日志分析</text>
<rect x="712" y="314" width="216" height="76" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="820" y="360" text-anchor="middle" class="" data-box="712,314,216,76">搜索服务</text>
<path data-connector="true" d="M366 354H516" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch25-01-warm-arrow)"/>
<path data-connector="true" d="M528 318V385M536 318V385" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="3"/>
<text x="551" y="361" text-anchor="start" class="small">资源边界</text>
<text x="32" y="430" text-anchor="start" class="small">若 RAM 耗尽整机，邻居还可能被内核终止，或因磁盘交换变慢。</text>
<text x="32" y="464" text-anchor="start" class="small">成功放置不等于完整隔离；隔离边界仍需随新故障演进。</text>
</svg>
