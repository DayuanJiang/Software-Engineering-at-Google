<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="36" class="strong" text-anchor="start">common 源码变，影响到哪里？</text>
<text x="24" y="68" class="small" text-anchor="start">依赖声明：MyBinary → mylib</text>
<text x="24" y="96" class="small" text-anchor="start">mylib → common、otherlib、Guava</text>
<text x="24" y="134" class="small" text-anchor="start">下图反向画产物流／变更影响</text>
<rect id="ch18-02m-box-1" x="18" y="158" width="120" height="76" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="78.0" y="187" class="strong" text-anchor="middle" data-owner="ch18-02m-box-1">common</text>
<text x="78.0" y="215" class="small" text-anchor="middle" data-owner="ch18-02m-box-1">改变，重建</text>
<rect id="ch18-02m-box-2" x="150" y="158" width="120" height="76" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="210.0" y="187" class="strong" text-anchor="middle" data-owner="ch18-02m-box-2">otherlib</text>
<text x="210.0" y="215" class="small" text-anchor="middle" data-owner="ch18-02m-box-2">未变，复用</text>
<rect id="ch18-02m-box-3" x="282" y="158" width="120" height="76" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="342.0" y="187" class="strong" text-anchor="middle" data-owner="ch18-02m-box-3">Guava</text>
<text x="342.0" y="215" class="small" text-anchor="middle" data-owner="ch18-02m-box-3">未变，复用</text>
<path class="edge" d="M78 234V256H164V286" stroke="var(--diagram-warm,#a56a1f)" marker-end="url(#ch18-02m-warm-arrow)"/>
