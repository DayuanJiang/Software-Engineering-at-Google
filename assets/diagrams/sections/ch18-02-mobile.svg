<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch18-02" data-layout="mobile" role="img" aria-labelledby="ch18-02m-title ch18-02m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch18-02m-title">改 common，为什么不重建 otherlib？</title>
<desc id="ch18-02m-desc">保留原文增量构建图，并补上 Guava 和相反方向的依赖声明。MyBinary 依赖 mylib，mylib 依赖 common、otherlib、Guava。图中箭头是产物流和变更影响方向，从依赖流向使用方。假定其他输入不变且旧产物可用，common 源码变化后重建 common、mylib、MyBinary，复用 otherlib 与 Guava。仅改 MyBinary.java 则只重建 MyBinary。按原文目标级简化，不表示重建必定改变输出字节。</desc>
<style>
.cg-ch18-02[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch18-02[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch18-02[data-layout="mobile"] .strong{font-weight:600}
.cg-ch18-02[data-layout="mobile"] .edge{fill:none;stroke-width:2;stroke-linejoin:round}
</style><defs>
<marker id="ch18-02m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch18-02m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch18-02m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch18-02m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch18-02m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
