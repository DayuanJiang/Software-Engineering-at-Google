<text x="210.0" y="317" class="strong" text-anchor="middle" data-owner="ch18-02m-box-4">mylib</text>
<text x="210.0" y="345" class="small" text-anchor="middle" data-owner="ch18-02m-box-4">依赖受影响，重建</text>
<path class="edge" d="M210 362V388" stroke="var(--diagram-warm,#a56a1f)" marker-end="url(#ch18-02m-warm-arrow)"/>
<rect id="ch18-02m-box-5" x="100" y="390" width="220" height="74" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="210.0" y="419" class="strong" text-anchor="middle" data-owner="ch18-02m-box-5">MyBinary</text>
<text x="210.0" y="447" class="small" text-anchor="middle" data-owner="ch18-02m-box-5">依赖受影响，重建</text>
<text x="24" y="500" class="small" text-anchor="start">只改 MyBinary.java：仅它重建。</text>
<text x="24" y="528" class="small" text-anchor="start">对照条件：其他输入不变、旧产物可用。</text>
<path d="M24 548H396" fill="none" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="24" y="580" class="small" text-anchor="start">重建不等于输出字节必变。</text>
