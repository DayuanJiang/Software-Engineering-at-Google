<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch05-01" data-layout="mobile" role="img" aria-labelledby="ch05-01m-title ch05-01m-desc">
<title id="ch05-01m-title">两类职责，一个团队</title>
<desc id="ch05-01m-desc">工程经理关注人员、绩效和业务，技术负责人关注架构、技术选择与推进；双方共同安排人员与任务。小团队的 TLM 兼任两职，但需要平衡和指导。</desc>
<style>
.cg-ch05-01[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-01[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch05-01[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs><marker id="ch05-01m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker><marker id="ch05-01m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker><marker id="ch05-01m-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker><marker id="ch05-01m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" text-anchor="start" class="strong">两类职责，一个团队</text>
<g id="ch05-01m-node-1" data-box="24,95,372,100">
<rect x="24" y="95" width="372" height="100" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="210.0" y="124.0" text-anchor="middle" class="strong">工程经理：人员与业务</text>
<text x="210.0" y="153.0" text-anchor="middle" class="small">绩效、生产力与幸福感</text>
<text x="210.0" y="182.0" text-anchor="middle" class="small">同时满足业务需求</text>
</g>
<g id="ch05-01m-node-2" data-box="24,279,372,100">
<rect x="24" y="279" width="372" height="100" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="210.0" y="308.0" text-anchor="middle" class="strong">技术负责人：技术与推进</text>
<text x="210.0" y="337.0" text-anchor="middle" class="small">架构、技术选择、优先级</text>
<text x="210.0" y="366.0" text-anchor="middle" class="small">推进速度与项目管理</text>
</g>
<path d="M210 201L210 216" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
<path d="M210 258L210 273" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2"/>
<text x="210" y="245" text-anchor="middle" class="small">共同安排人员与匹配任务</text>
<g id="ch05-01m-node-3" data-box="24,435,372,77">
<rect x="24" y="435" width="372" height="77" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="210.0" y="467.0" text-anchor="middle" class="strong">TLM：一人兼任两职</text>
<text x="210.0" y="496.0" text-anchor="middle" class="small">需要平衡、委派与资深导师</text>
</g>
<text x="24" y="550" text-anchor="start" class="small">成熟大团队通常由两位领导搭档</text>
<text x="24" y="578" text-anchor="start" class="small">角色区分不等于两套互不沟通的工作</text>
</svg>
