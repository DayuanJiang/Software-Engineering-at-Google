<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch02-03" data-layout="mobile" role="img" aria-labelledby="ch02-03m-title ch02-03m-desc">
<title id="ch02-03m-title">同样建议 xyzzy，措辞改变了什么？</title>
<desc id="ch02-03m-desc">原文两段反馈完整对照。坏反馈断言控制流完全搞错，要求与大家一样。较好反馈承认自己没看懂，问会不会更清晰、更容易维护。短语对应的改变是允许解释、允许拒绝、讨论维护目标。xyzzy 是原文占位词，措辞不保证建议被接受。</desc>
<style>
.cg-ch02-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch02-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch02-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch02-03[data-layout="mobile"] .primary {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch02-03[data-layout="mobile"] .secondary {fill:var(--diagram-secondary,#2f6eac);font-weight:600}
.cg-ch02-03[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch02-03[data-layout="mobile"] .warm {fill:var(--diagram-warm,#a56a1f);font-weight:600}
</style>
<defs>
<marker id="ch02-03m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch02-03m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch02-03m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch02-03m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
<marker id="ch02-03m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="34" class="strong" text-anchor="start">同样建议 xyzzy，措辞改变了什么？</text>
<text x="24" y="68" class="danger" text-anchor="start">原文：不要这样说</text>
<g id="ch02-03m-bad-quote" data-box="24,83,372,140">
<rect x="24" y="83" width="372" height="140" rx="4" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-danger,#b54750)" stroke-width="1.5"/>
<text x="38" y="112" class="" text-anchor="start">“伙计，你把那个方法的</text>
<text x="38" y="143" class=""><tspan class="">控制流</tspan><tspan class="danger">完全搞错了</tspan><tspan class="">。</tspan><tspan class="danger">你应该</tspan></text>
<text x="38" y="174" class=""><tspan class="danger">和大家一样</tspan><tspan class="">，用标准的</tspan></text>
<text x="38" y="205" class="" text-anchor="start">xyzzy 代码模式。”</text>
</g>
<text x="24" y="252" class="small" text-anchor="start">判错、命令、从众：容易引向反击</text>
<text x="24" y="290" class="primary" text-anchor="start">原文：可以换一种说法</text>
<g id="ch02-03m-better-quote" data-box="24,305,372,140">
<rect x="24" y="305" width="372" height="140" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="38" y="334" class="" text-anchor="start">“嘿，这部分的控制流</text>
<text x="38" y="365" class=""><tspan class="primary">我有些没看懂</tspan><tspan class="">。用 xyzzy</tspan></text>
<text x="38" y="396" class=""><tspan class="">代码模式，</tspan><tspan class="secondary">会不会</tspan><tspan class="warm">更清晰，</tspan></text>
<text x="38" y="427" class=""><tspan class="warm">也更容易维护</tspan><tspan class="">？”</tspan></text>
</g>
<text x="24" y="479" class="small primary" text-anchor="start">我有些没看懂</text>
<path d="M153 473H179" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-03m-primary-arrow)"/>
<text x="193" y="479" class="small" text-anchor="start">谦逊：允许解释</text>
<text x="24" y="514" class="small secondary" text-anchor="start">会不会</text>
<path d="M153 508H179" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-03m-secondary-arrow)"/>
<text x="193" y="514" class="small" text-anchor="start">信任：允许拒绝</text>
<text x="24" y="549" class="small warm" text-anchor="start">清晰、易维护</text>
<path d="M153 543H179" class="connector" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-03m-warm-arrow)"/>
<text x="193" y="549" class="small" text-anchor="start">尊重：讨论目标</text>
<text x="24" y="585" class="small" text-anchor="start">xyzzy 为占位词；不保证建议被接受。</text>
</svg>
