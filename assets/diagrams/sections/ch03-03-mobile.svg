<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch03-03" data-layout="mobile" role="img" aria-labelledby="ch03-03m-title ch03-03m-desc">
<title id="ch03-03m-title">哪些资料需要全公司统一？</title>
<desc id="ch03-03m-desc">原文以基本开发工作流和本地 Frobber 实例作对比。多个团队查阅同一份由专家审核维护的全公司参考；Frobber 工程师查阅团队的本地运行指南。图示主要受众，而非访问权限；并非所有资料都要成为全员规范。</desc>
<style>
.cg-ch03-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch03-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch03-03[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
