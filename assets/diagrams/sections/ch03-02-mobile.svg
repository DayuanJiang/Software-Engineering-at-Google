<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch03-02" data-layout="mobile" role="img" aria-labelledby="ch03-02m-title ch03-02m-desc">
<title id="ch03-02m-title">流程变了，旧答案怎么办？</title>
<desc id="ch03-02m-desc">示意开发流程从手工配置变为自动配置。群聊里发现的新结论需写成文档或邮件；旧邮件不可改写，必须核对时效；问答中的旧答案可以由人编辑为新结论。可编辑并非自动更新。</desc>
<style>
.cg-ch03-02[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-02[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch03-02[data-layout="mobile"] .strong {font-weight:600}
.cg-ch03-02[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch03-02m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch03-02m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch03-02m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="36" text-anchor="start" class="strong">流程变了，旧答案怎么办？</text>
<text x="24" y="68" text-anchor="start" class="small">示意：开发流程原需手工配置，</text>
<text x="24" y="95" text-anchor="start" class="small">现在已自动配置。</text>
<text x="24" y="133" text-anchor="start" class="strong">群聊：发现新结论</text>
<g id="ch03-02m-node-1" data-box="24,150,164,76">
<rect x="24" y="150" width="164" height="76" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)"/>
<text x="106.0" y="182" text-anchor="middle" class="strong">群内问答</text>
<text x="106.0" y="210" text-anchor="middle" class="small">现已自动配置</text>
</g>
<path d="M194 189H234" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-02m-arrow-primary)"/>
<g id="ch03-02m-node-2" data-box="240,150,156,76">
<rect x="240" y="150" width="156" height="76" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)"/>
<text x="318.0" y="182" text-anchor="middle" class="strong">文档或邮件</text>
<text x="318.0" y="210" text-anchor="middle" class="small">整理后分享</text>
</g>
<text x="24" y="254" text-anchor="start" class="small">把结论交给群外与后来的读者</text>
<path d="M24 270H396" class="rule" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<text x="24" y="302" text-anchor="start" class="strong">邮件：后来搜到旧帖</text>
<g id="ch03-02m-node-3" data-box="24,320,164,76">
<rect x="24" y="320" width="164" height="76" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)"/>
<text x="106.0" y="352" text-anchor="middle" class="strong">旧存档</text>
<text x="106.0" y="380" text-anchor="middle" class="small">手工配置</text>
</g>
<path d="M194 358H234" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-02m-arrow-secondary)"/>
<text x="246" y="350" text-anchor="start" class="strong">存档不可改</text>
<text x="246" y="382" text-anchor="start" class="small">需核对时效</text>
<text x="24" y="424" text-anchor="start" class="small">找到旧答案，不代表仍然适用</text>
<path d="M24 440H396" class="rule" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<text x="24" y="472" text-anchor="start" class="strong">问答：主动编辑同一条答案</text>
<g id="ch03-02m-node-4" data-box="24,490,164,66">
<rect x="24" y="490" width="164" height="66" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)"/>
<text x="106.0" y="531" text-anchor="middle" class="">手工配置</text>
</g>
<path d="M194 523H234" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-02m-arrow-secondary)"/>
<g id="ch03-02m-node-5" data-box="240,490,156,66">
<rect x="240" y="490" width="156" height="66" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="318.0" y="531" text-anchor="middle" class="">自动配置</text>
</g>
<text x="24" y="588" text-anchor="start" class="small">可编辑，也需要有人实际更新</text>
</svg>
