<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch20-02" data-layout="mobile" role="img" aria-labelledby="ch20-02m-title ch20-02m-desc"><title id="ch20-02m-title">Tricorder 的请求、执行与结果</title><desc id="ch20-02m-desc">数据流展示变更元数据如何触发分析服务器读取相应版本的源文件与缓存构建产物，运行分析器并写入结果存储；Critique 展示每类最新结果和运行状态。</desc><style>.cg-ch20-02[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch20-02[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}.cg-ch20-02[data-layout="mobile"] .strong{font-weight:600}</style><defs>
<marker id="ch20-02m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
