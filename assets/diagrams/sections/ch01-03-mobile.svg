  <circle cx="348" cy="483" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
  <text x="72" y="513" text-anchor="middle">团队甲</text>
  <text x="210" y="513" text-anchor="middle">团队乙</text>
  <text x="348" y="513" text-anchor="middle">团队丙</text>
  <text x="24" y="548" class="small">共同知识与流程用于多个团队</text>
  <text x="24" y="577" class="small">工具、测试与维护仍需投入</text>
