<svg xmlns="http://www.w3.org/2000/svg" id="ch08-04m-diagram" class="chapter-svg cg-ch08-04" role="img" aria-labelledby="ch08-04m-title ch08-04m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch08-04m-title">格式化替代了哪一轮审查？</title>
<desc id="ch08-04m-desc">同一配置下，比较提交内容 S 与格式化结果 F(S)。首次 x=1 不等于 x = 1，所以拒绝并提示修正；再次提交 x = 1，结果相同，仅通过格式检查。这移除了人工发现、评论和修正格式细节的往返，没有替代复杂性审查。原文反例：数百文件重复同一行修改可能易审，20行复杂逻辑可能难审。赋值代码为示意。</desc>
<style>
.cg-ch08-04#ch08-04m-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch08-04#ch08-04m-diagram .strong{font-weight:600}
.cg-ch08-04#ch08-04m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch08-04#ch08-04m-diagram .code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.cg-ch08-04#ch08-04m-diagram .green{fill:var(--diagram-primary,#087f6d)}
.cg-ch08-04#ch08-04m-diagram .red{fill:var(--diagram-danger,#b54750)}
.cg-ch08-04#ch08-04m-diagram .blue{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch08-04#ch08-04m-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch08-04#ch08-04m-diagram .arrow{fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch08-04m-arrow)}
.cg-ch08-04#ch08-04m-diagram .uncertain{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;stroke-dasharray:5 5}
</style>
<defs><marker id="ch08-04m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="39" class="strong">格式化替代了哪一轮审查？</text>
<text x="24" y="70" class="small">同一段代码，两次提交（示意）</text>
<text x="24" y="110" class="small">首次：提交 S</text>
<text x="235" y="110" class="small">格式化 F(S)</text>
<text x="24" y="148" class="code">x=1</text>
<path class="arrow" d="M125 140H220"/>
<text x="235" y="148" class="code">x = 1</text>
<rect id="ch08-04m-box1" x="24" y="171" width="372" height="53" rx="4" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="40" y="205" class="strong" data-box="ch08-04m-box1">不相同：拒绝并提示修正</text>
<text x="24" y="264" class="small">修正后：提交 S</text>
<text x="235" y="264" class="small">格式化 F(S)</text>
<text x="24" y="303" class="code">x = 1</text>
<path class="arrow" d="M125 295H220"/>
<text x="235" y="303" class="code">x = 1</text>
<rect id="ch08-04m-box2" x="24" y="326" width="372" height="53" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="40" y="360" class="strong" data-box="ch08-04m-box2">相同：仅通过格式检查</text>
<text x="24" y="411" class="small">省去人工指出、修正格式的往返</text>
<path class="line" d="M24 428H396"/>
<text x="24" y="460" class="strong">人仍需判断：</text>
<text x="24" y="490" class="small">数百文件同一行修改 → 可能易审</text>
<text x="24" y="520" class="small">20 行复杂副作用 → 可能难审</text>
<text x="24" y="566" class="strong blue">格式通过 ≠ 审查通过</text>
</svg>
