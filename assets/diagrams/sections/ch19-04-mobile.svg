<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch19-04" data-layout="mobile" role="img" aria-labelledby="ch19-04m-title ch19-04m-desc">
<title id="ch19-04m-title">四种评分状态，下一步各找谁？</title>
<desc id="ch19-04m-desc">四个独立评分案例每次只缺一项：缺 LGTM、缺所需批准、尚有未解决意见，分别对应不同的下一步；只有三项都满足时可启动提交，提交前检查失败仍不能入库。</desc>
<style>.cg-ch19-04[data-layout=mobile] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch19-04[data-layout=mobile] .small{font-size:19px;fill:var(--diagram-muted,#686868)}.cg-ch19-04[data-layout=mobile] .strong{font-weight:600}.cg-ch19-04[data-layout=mobile] .code{font-family:Menlo,Consolas,monospace}.cg-ch19-04[data-layout=mobile] .danger{fill:var(--diagram-danger,#b54750)}.cg-ch19-04[data-layout=mobile] .positive{fill:var(--diagram-primary,#087f6d)}</style>
<defs><marker id="ch19-04m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">四种评分，下一步各找谁？</text>
<text x="24" y="74" class="small" text-anchor="start">LGTM 认可质量；批准允许提交。</text>
<rect id="ch19-04m-region-1" x="24" y="104" width="372" height="83" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="138" class="strong" text-anchor="start" data-owner="ch19-04m-region-1">A</text>
<text x="78" y="133" class="small" text-anchor="start" data-owner="ch19-04m-region-1">LGTM 0 · 批准齐全 · 未解决 0</text>
<text x="78" y="167" class="strong" text-anchor="start" data-owner="ch19-04m-region-1">等审查者给 LGTM</text>
<rect id="ch19-04m-region-2" x="24" y="200" width="372" height="83" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="234" class="strong" text-anchor="start" data-owner="ch19-04m-region-2">B</text>
<text x="78" y="229" class="small" text-anchor="start" data-owner="ch19-04m-region-2">LGTM 1 · 批准缺一项 · 未解决 0</text>
<text x="78" y="263" class="strong" text-anchor="start" data-owner="ch19-04m-region-2">等审查者补批准</text>
<rect id="ch19-04m-region-3" x="24" y="296" width="372" height="83" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="330" class="strong" text-anchor="start" data-owner="ch19-04m-region-3">C</text>
<text x="78" y="325" class="small" text-anchor="start" data-owner="ch19-04m-region-3">LGTM 1 · 批准齐全 · 未解决 1</text>
<text x="78" y="359" class="strong" text-anchor="start" data-owner="ch19-04m-region-3">作者处理并解决意见</text>
<rect id="ch19-04m-region-4" x="24" y="392" width="372" height="83" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="40" y="426" class="strong" text-anchor="start" data-owner="ch19-04m-region-4">D</text>
<text x="78" y="421" class="small" text-anchor="start" data-owner="ch19-04m-region-4">LGTM 1 · 批准齐全 · 未解决 0</text>
<text x="78" y="455" class="strong positive" text-anchor="start" data-owner="ch19-04m-region-4">可启动提交</text>
<text x="24" y="511" class="small" text-anchor="start">此处“批准”指所需批准；A-D 非步骤。</text>
<text x="24" y="540" class="small" text-anchor="start">D 仍须通过提交前检查：</text>
<text x="24" y="566" class="small" text-anchor="start">失败：不能提交；通过：入库。</text>
<text x="24" y="592" class="small" text-anchor="start">此图为基本规则；团队可追加要求。</text>
</svg>
