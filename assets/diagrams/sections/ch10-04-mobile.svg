<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch10-04" data-layout="mobile" role="img" aria-labelledby="ch10-04m-title ch10-04m-desc">
<title id="ch10-04m-title">按文档目的权衡质量</title>
<desc id="ch10-04m-desc">完整性、准确性和清晰性是需要权衡的维度，不是量化评分；概念文档省略罕见细节不等于故意写错。</desc>
<style>
.cg-ch10-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch10-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch10-04[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs><marker id="ch10-04m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" text-anchor="start" class="strong" data-font-size="22">质量取舍服从文档目的</text>
<text x="24" y="68" text-anchor="start" class="small" data-font-size="19">关系示意，不是评分或定量模型</text>
<path d="M72 147H348L210 278Z" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<circle cx="72" cy="147" r="5" fill="var(--diagram-primary,#087f6d)"/>
<text x="72" y="127" text-anchor="middle" class="" data-font-size="22">完整性</text>
<circle cx="348" cy="147" r="5" fill="var(--diagram-primary,#087f6d)"/>
<text x="348" y="127" text-anchor="middle" class="" data-font-size="22">准确性</text>
<circle cx="210" cy="278" r="5" fill="var(--diagram-primary,#087f6d)"/>
<text x="210" y="309" text-anchor="middle" class="" data-font-size="22">清晰性</text>
<text x="210" y="209" text-anchor="middle" class="strong" data-font-size="22">预定任务</text>
<text x="24" y="358" text-anchor="start" class="small" data-font-size="19">参考：覆盖契约与边界</text>
<text x="24" y="388" text-anchor="start" class="small" data-font-size="19">概念：帮助理解常见用法</text>
<text x="24" y="418" text-anchor="start" class="small" data-font-size="19">入口：组织链接，少展开</text>
<path d="M24 437H396" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
<text x="24" y="470" text-anchor="start" class="strong" data-font-size="22">技术 / 受众 / 写作评审</text>
<text x="24" y="502" text-anchor="start" class="small" data-font-size="19">分别检查准确、清楚和一致</text>
<text x="24" y="551" text-anchor="start" class="small" data-font-size="19">省略罕见细节以帮助理解，</text>
<text x="24" y="578" text-anchor="start" class="small" data-font-size="19">不等于故意写得不准确。</text>
</svg>
