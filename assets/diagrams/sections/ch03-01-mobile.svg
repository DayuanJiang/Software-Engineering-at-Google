<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch03-01" data-layout="mobile" role="img" aria-labelledby="ch03-01m-title ch03-01m-desc">
<title id="ch03-01m-title">专家与文档相互补充</title>
<desc id="ch03-01m-desc">专家帮助判断问题背景和适用资料，文档支持跨团队与跨时间共享，学习者通过提问和更新把经验回馈；心理安全感是共同基础。</desc>
<style>
.cg-ch03-01[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-01[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch03-01[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs><marker id="ch03-01m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker><marker id="ch03-01m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker><marker id="ch03-01m-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker><marker id="ch03-01m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" text-anchor="start" class="strong">专家与文档相互补充</text>
<g id="ch03-01m-node-1" data-box="24,95,372,92">
<rect x="24" y="95" width="372" height="92" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="210.0" y="134.5" text-anchor="middle" class="strong">专家：判断与定向帮助</text>
<text x="210.0" y="163.5" text-anchor="middle" class="small">了解背景，选择适用资料</text>
</g>
<g id="ch03-01m-node-2" data-box="24,246,372,92">
<rect x="24" y="246" width="372" height="92" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="210.0" y="285.5" text-anchor="middle" class="strong">文档：共享与跨时间留存</text>
<text x="210.0" y="314.5" text-anchor="middle" class="small">可查阅，但需要持续维护</text>
</g>
<text x="210" y="218" text-anchor="middle" class="small">记录经验 / 发现遗漏</text>
<path d="M210 224L210 242" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch03-01m-arrow-primary)"/>
<g id="ch03-01m-node-3" data-box="66,414,288,76">
<rect x="66" y="414" width="288" height="76" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="210.0" y="445.5" text-anchor="middle" class="strong">学习者</text>
<text x="210.0" y="474.5" text-anchor="middle" class="small">提问、实践、更新资料</text>
</g>
<path d="M210 342V410" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch03-01m-arrow-primary)"/>
<text x="230" y="382" text-anchor="start" class="small">查阅</text>
<path d="M62 452H12V141H20" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch03-01m-arrow-secondary)"/>
<text x="24" y="550" text-anchor="start" class="small">心理安全感：可以坦承不知道</text>
<text x="24" y="578" text-anchor="start" class="small">文档不替代专家，专家也不替代记录</text>
</svg>
