<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch19-01" data-layout="desktop" role="img" aria-labelledby="ch19-01-title ch19-01-desc">
<title id="ch19-01-title">新快照清除哪些已审查标记？</title>
<desc id="ch19-01-desc">示例中甲、乙都看过 v1，v2 只把 a.cc 的 n 改为 count：a.cc 对两人的已审查勾选都被清除，未变的 b.cc 保留勾选。文件已审查标记不同于 LGTM。</desc>
<style>.cg-ch19-01[data-layout=desktop] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch19-01[data-layout=desktop] .small{font-size:20px;fill:var(--diagram-muted,#686868)}.cg-ch19-01[data-layout=desktop] .strong{font-weight:600}.cg-ch19-01[data-layout=desktop] .code{font-family:Menlo,Consolas,monospace}.cg-ch19-01[data-layout=desktop] .danger{fill:var(--diagram-danger,#b54750)}.cg-ch19-01[data-layout=desktop] .positive{fill:var(--diagram-primary,#087f6d)}</style>
