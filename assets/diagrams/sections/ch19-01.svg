<text x="48" y="135" class="small" text-anchor="start" data-owner="ch19-01-region-1">v1 · a.cc</text>
<text x="48" y="178" class="code" text-anchor="start" data-owner="ch19-01-region-1">n = size()</text>
<rect id="ch19-01-region-2" x="600" y="105" width="328" height="93" rx="4" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="616" y="135" class="small" text-anchor="start" data-owner="ch19-01-region-2">v2 · a.cc</text>
<text x="616" y="178" class="code" text-anchor="start" data-owner="ch19-01-region-2">count = size()</text>
