<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch12-02" data-layout="desktop" role="img" aria-labelledby="ch12-02-title ch12-02-desc" viewBox="0 0 960 480" width="960" height="480">
<title id="ch12-02-title">同一次创建，两种断言，两类错误</title>
<desc id="ch12-02-desc">例12-4/5：调用createUser(&quot;foobar&quot;)后，交互断言仅核对database.put(&quot;foobar&quot;)，状态断言检查getUser(&quot;foobar&quot;)非空。等价写入改用另一API时，交互断言误报失败而状态通过；写入后误删记录时，交互断言漏报缺陷而状态失败。insert只是替代API的示意名称。</desc>
<style>
.cg-ch12-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0}
.cg-ch12-02[data-layout="desktop"] .small {font-size:20px}
.cg-ch12-02[data-layout="desktop"] .strong {font-weight:600}
</style>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="32 896">同一次创建，两种断言，两类错误</text>
<text x="32" y="76" class="small" text-anchor="start" fill="var(--diagram-muted,#686868)" data-font-size="20" data-lane="32 896">例12-4/5；insert 是等价写入 API 的示意名称</text>
<rect x="32" y="96" width="896" height="51" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" data-region="true"/>
<text x="48" y="130" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="48 864">每行都调用 accounts.createUser(&quot;foobar&quot;)</text>
<text x="48" y="191" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="48 396">内部步骤及最终状态</text>
<text x="571" y="183" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="453.5 235">交互：核对 put</text>
<text x="811" y="183" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="693.5 235">状态：查询用户</text>
<text x="571" y="212" class="small" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="20" data-lane="453.5 235">verify(database).put(...)</text>
<text x="811" y="212" class="small" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="20" data-lane="693.5 235">getUser(...) != null</text>
<rect x="32" y="234" width="896" height="57" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" data-region="true"/>
<text x="48" y="271" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="48 396">put → 用户存在</text>
<text x="571" y="271" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="453.5 235">通过</text>
<text x="811" y="271" class="strong" text-anchor="middle" fill="var(--diagram-primary,#087f6d)" data-font-size="24" data-lane="693.5 235">通过</text>
<rect x="32" y="301" width="896" height="57" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" data-region="true"/>
<text x="48" y="338" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="48 396">等价 insert → 用户存在</text>
<text x="571" y="338" class="strong" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="24" data-lane="453.5 235">失败：误报</text>
<text x="811" y="338" class="strong" text-anchor="middle" fill="var(--diagram-primary,#087f6d)" data-font-size="24" data-lane="693.5 235">通过</text>
<rect x="32" y="368" width="896" height="57" rx="6" fill="var(--diagram-danger-soft,#faecee)" data-region="true"/>
<text x="48" y="405" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="48 396">put → 误删 → 用户不存在</text>
<text x="571" y="405" class="strong" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="24" data-lane="453.5 235">通过：漏报</text>
<text x="811" y="405" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="24" data-lane="693.5 235">失败：检出</text>
<text x="32" y="462" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="20" data-lane="32 896">put 被调用，不等于用户仍存在；用户存在，也不要求必须调用 put。</text>
</svg>
