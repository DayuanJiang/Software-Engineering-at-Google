  <rect id="ch08-03m-box5" x="24" y="443" width="372" height="56" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="210.0" y="478.48" text-anchor="middle" class="strong" data-box="ch08-03m-box5">更新规则与相应工具</text>
  <path d="M24 530H396" class="line" />
  <text x="24" y="552" text-anchor="start" class="small">记录理由，才能识别何时需要重审</text>
  <text x="24" y="579" text-anchor="start" class="small">个别豁免不等于取消通用规则</text>
