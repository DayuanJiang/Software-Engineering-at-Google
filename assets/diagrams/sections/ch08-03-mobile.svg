<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch08-03" data-layout="mobile" role="img" aria-labelledby="ch08-03m-title ch08-03m-desc">
  <title id="ch08-03m-title">规则随证据演进</title>
  <desc id="ch08-03m-desc">现有代码中的真实问题触发规则复查，社区讨论修订，风格仲裁者按共同目标权衡并形成共识。更新规则和工具后继续观察使用模式。合理的个别豁免不必导致通用规则取消。</desc>
  <style>
.cg-ch08-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch08-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch08-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch08-03[data-layout="mobile"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch08-03m-arrow)}
.cg-ch08-03[data-layout="mobile"] .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
</style>
