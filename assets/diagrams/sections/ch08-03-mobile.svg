  <text x="24" y="39" text-anchor="start" class="strong">规则随证据演进</text>
  <text x="24" y="70" text-anchor="start" class="small">真实问题、共同目标与决策理由</text>
  <rect id="ch08-03m-box1" x="24" y="100" width="372" height="56" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="210.0" y="135.48" text-anchor="middle" class="strong" data-box="ch08-03m-box1">现有代码中的真实问题</text>
  <path d="M210 156V179" class="arrow" />
  <rect id="ch08-03m-box2" x="24" y="179" width="372" height="56" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="210.0" y="214.48" text-anchor="middle" class="strong" data-box="ch08-03m-box2">复查旧规则的理由与利弊</text>
  <path d="M210 235V258" class="arrow" />
  <rect id="ch08-03m-box3" x="24" y="258" width="372" height="56" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="210.0" y="293.48" text-anchor="middle" class="strong" data-box="ch08-03m-box3">社区讨论、提出修订</text>
  <path d="M210 314V337" class="arrow" />
  <rect id="ch08-03m-box4" x="24" y="337" width="372" height="80" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="210.0" y="368.98" text-anchor="middle" class="strong" data-box="ch08-03m-box4">仲裁者按目标权衡</text>
  <text x="210.0" y="399.98" text-anchor="middle" data-box="ch08-03m-box4">以共识作决定</text>
