<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch04-02" data-layout="mobile" role="img" aria-labelledby="ch04-02m-title ch04-02m-desc">
<title id="ch04-02m-title">同样改招聘，入职之后呢？</title>
<desc id="ch04-02m-desc">以书中希望招聘更多女性的经理为例，两条路径共用改善招聘渠道这一输入。若支持与成长机会的缺口没有改变，留任和晋升风险仍未解决。另一条路径将心理安全、支持与机会分配纳入审视，再跟踪实际留任与成长并修正做法。这是条件对照，不是实验结果，也不保证任何性别的表现、去留或晋升。</desc>
<style>
.cg-ch04-02[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04-02[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch04-02[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs>
<marker id="ch04-02m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch04-02m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch04-02m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch04-02m-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="37" text-anchor="start" class="strong">同样改招聘，入职之后呢？</text>
<text x="24" y="70" text-anchor="start" class="small">书中例子：经理希望招聘更多女性</text>
<g id="ch04-02m-shared-input" data-box="52,91,344,81">
<rect x="52" y="91" width="344" height="81" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="224" y="122" text-anchor="middle" class="strong">共同起点：改善招聘渠道</text>
<text x="224" y="155" text-anchor="middle" class="small">识别优秀女性候选人</text>
</g>
<polyline data-connector="true" points="48,131 30,131 30,282 47,282" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-02m-arrow-muted)"/>
<polyline data-connector="true" points="30,282 30,464 47,464" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-02m-arrow-muted)"/>
<g id="ch04-02m-unchanged" data-box="52,205,344,158">
<rect x="52" y="205" width="344" height="158" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="72" y="235" text-anchor="start" class="strong">若只改入口</text>
<text x="72" y="269" text-anchor="start" class="">支持与成长机会的缺口未改</text>
<polyline data-connector="true" points="224,282 224,305" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-02m-arrow-danger)"/>
<text x="224" y="338" text-anchor="middle" class="strong">留任、晋升风险仍未解决</text>
</g>
<g id="ch04-02m-expanded" data-box="52,387,344,158">
<rect x="52" y="387" width="344" height="158" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="72" y="417" text-anchor="start" class="strong">同时审视入职后</text>
<text x="72" y="451" text-anchor="start" class="">心理安全、支持与机会分配</text>
<polyline data-connector="true" points="224,464 224,487" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-02m-arrow-primary)"/>
<text x="224" y="520" text-anchor="middle" class="strong">跟踪留任与成长，再修正</text>
</g>
<text x="24" y="574" text-anchor="start" class="small">条件示意，不预测女性的表现或去留。</text>
</svg>
