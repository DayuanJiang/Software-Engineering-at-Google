<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch01-01" data-layout="desktop" role="img" aria-labelledby="ch01-01-title ch01-01-desc">
  <title id="ch01-01-title">维护生命周期：从一次运行到持续变更</title>
  <desc id="ch01-01-desc">概念示例，时间长度、事件次序与间隔不按比例。一次性脚本完成任务后结束，当次非关键升级可以不做。长期项目持续提供价值，需要应对依赖、语言、操作系统和业务需求的变化，并持续修改、验证和维护。维护生命周期不是单次执行时间；可持续性强调具备变更能力，并非每次都必须升级。</desc>
  <style>
    .cg-ch01-01[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
    .cg-ch01-01[data-layout="desktop"] .strong {font-weight:600}
    .cg-ch01-01[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
    .cg-ch01-01[data-layout="desktop"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
    .cg-ch01-01[data-layout="desktop"] .time {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch01-01-arrow)}
  </style>
  <defs>
    <marker id="ch01-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="42" class="strong">代码需要维护多久？</text>
  <text x="928" y="42" text-anchor="end" class="small">概念示例：非比例时间线</text>
  <text x="32" y="76" class="small">维护生命周期：持续构建、执行和维护的时间</text>

  <text x="32" y="144" class="strong">一次性脚本</text>
  <text x="32" y="176" class="small">短期使用</text>
  <rect x="212" y="122" width="146" height="36" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <text x="285" y="148" text-anchor="middle">开发 / 运行</text>
  <path d="M358 114V166" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2"/>
  <text x="380" y="148" class="small">任务结束</text>
  <text x="212" y="193" class="small">当次非关键升级，可以不做</text>

  <text x="32" y="277" class="strong">长期项目</text>
  <text x="32" y="309" class="small">持续提供价值</text>
  <rect x="212" y="255" width="694" height="40" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="238" y="283">开发</text>
  <path d="M308 275H928" class="time"/>
  <path d="M430 232V260M620 290V310M810 232V260" class="guide"/>
  <path d="M430 265L440 275L430 285L420 275Z" fill="var(--diagram-primary,#087f6d)"/>
  <path d="M620 265L630 275L620 285L610 275Z" fill="var(--diagram-secondary,#2f6eac)"/>
  <path d="M810 265L820 275L810 285L800 275Z" fill="var(--diagram-warm,#a56a1f)"/>
  <text x="430" y="220" text-anchor="middle" class="small">依赖 / 语言更新</text>
  <text x="620" y="338" text-anchor="middle" class="small">操作系统变化</text>
  <text x="810" y="220" text-anchor="middle" class="small">业务需求变化</text>
  <text x="212" y="376">修改、验证、维护，让代码继续有用</text>

  <rect x="32" y="405" width="896" height="51" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="480" y="438" text-anchor="middle" class="strong">可以选择不升级，但必须保留应对必要变更的能力</text>
</svg>
