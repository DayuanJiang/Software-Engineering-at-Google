<text x="521.0" y="316" class="" text-anchor="middle">按计划检查视频质量</text>
</g>
<g data-box="688,272,240,72"><rect x="688" y="272" width="240" height="72" rx="6" class="danger"/>
<text x="808.0" y="301" class="strong" text-anchor="middle">公众也能看到</text>
<text x="808.0" y="330" class="small" text-anchor="middle">媒体报道 / 调查</text>
</g>
<text x="32" y="269" class="strong" text-anchor="start">生产仿真度高</text>
<text x="32" y="304" class="small" text-anchor="start">不等于每项成本更高</text>
