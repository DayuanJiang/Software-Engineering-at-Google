</g>
<g data-box="650,132,278,82"><rect x="650" y="132" width="278" height="82" rx="6" class="warm"/>
<text x="789.0" y="164" class="strong" text-anchor="middle">公开频道与视频</text>
<text x="789.0" y="195" class="small" text-anchor="middle">Webdriver Torso</text>
</g>
