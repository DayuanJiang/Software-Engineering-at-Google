<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch14-05" data-layout="desktop" role="img" aria-labelledby="ch14-05-title ch14-05-desc" viewBox="0 0 960 480" width="960" height="480">
<title id="ch14-05-title">没显示广告：代码坏了，还是超时了？</title>
<desc id="ch14-05-desc">本章广告案例：超过服务内部期限仍未获得广告时，不展示广告而非返回500。测试只见广告缺失可能误判业务代码。另一层是测试等待：响应完成状态就立即验证，达到最大等待期限则报告超时。过载使固定等待或超时失败增多，失败测试重跑又增加负载。内部期限要可配置并明确暴露原因，不是无限等待或一味缩短；重跑指测试重新执行，不是服务 RPC 重试。</desc>
<style>
.cg-ch14-05[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch14-05[data-layout="desktop"] .strong {font-weight:600}
