<marker id="ch14-05-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch14-05-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch14-05-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">没显示广告：代码坏了，还是超时了？</text>
<text x="32" y="78" class="small" text-anchor="start">本章广告案例：服务内部超时与测试等待，是两层机制</text>
<text x="32" y="120" class="strong" text-anchor="start">服务内部</text>
<g data-box="32,142,226,80"><rect x="32" y="142" width="226" height="80" rx="6" class="danger"/>
<text x="145.0" y="174" class="strong" text-anchor="middle">超过内部期限</text>
<text x="145.0" y="205" class="small" text-anchor="middle">未及时取得广告</text>
</g>
<g data-box="340,142,248,80"><rect x="340" y="142" width="248" height="80" rx="6" class="warm"/>
<text x="464.0" y="174" class="strong" text-anchor="middle">不展示广告</text>
<text x="464.0" y="205" class="small" text-anchor="middle">不是返回 500</text>
</g>
<g data-box="680,142,248,80"><rect x="680" y="142" width="248" height="80" rx="6" class="danger"/>
<text x="804.0" y="174" class="strong" text-anchor="middle">测试看到：无广告</text>
<text x="804.0" y="205" class="small" text-anchor="middle">可能误判业务代码</text>
</g>
<path d="M258 182H338" class="danger-path" data-connector="true"/>
<path d="M588 182H678" class="danger-path" data-connector="true"/>
<text x="32" y="271" class="strong" text-anchor="start">测试层：状态等待有两个出口</text>
<g data-box="32,296,236,82"><rect x="32" y="296" width="236" height="82" rx="6" class="secondary"/>
<text x="150.0" y="329" class="strong" text-anchor="middle">等待完成状态</text>
<text x="150.0" y="361" class="small" text-anchor="middle">轮询 / 完成事件</text>
</g>
<g data-box="340,282,242,62"><rect x="340" y="282" width="242" height="62" rx="6" class="primary"/>
<text x="461.0" y="321" class="" text-anchor="middle">完成：立即验证</text>
</g>
<g data-box="340,379,242,62"><rect x="340" y="379" width="242" height="62" rx="6" class="warm"/>
<text x="461.0" y="418" class="" text-anchor="middle">最大期限到：报超时</text>
</g>
<path d="M268 321H305V313H338" class="primary-path" data-connector="true"/>
<path d="M268 351H305V410H338" class="warm-path" data-connector="true"/>
<text x="642" y="270" class="small" text-anchor="start">固定等待失败后又重跑</text>
<g data-box="642,296,116,54"><rect x="642" y="296" width="116" height="54" rx="6" class="danger"/>
<text x="700.0" y="331" class="" text-anchor="middle">过载</text>
</g>
<g data-box="812,296,116,54"><rect x="812" y="296" width="116" height="54" rx="6" class="warm"/>
<text x="870.0" y="331" class="small" text-anchor="middle">等待失败</text>
</g>
<g data-box="812,389,116,54"><rect x="812" y="389" width="116" height="54" rx="6" class="warm"/>
<text x="870.0" y="424" class="small" text-anchor="middle">重跑测试</text>
</g>
<g data-box="642,389,116,54"><rect x="642" y="389" width="116" height="54" rx="6" class="danger"/>
<text x="700.0" y="424" class="small" text-anchor="middle">负载增加</text>
</g>
<path d="M758 323H810" class="danger-path" data-connector="true"/>
<path d="M870 350V387" class="danger-path" data-connector="true"/>
<path d="M812 416H760" class="danger-path" data-connector="true"/>
<path d="M700 389V352" class="danger-path" data-connector="true"/>
<text x="32" y="473" class="small" text-anchor="start">内部期限可调、原因可见；延长或缩短都要权衡用户时限，不能只靠重跑。</text>
</svg>
