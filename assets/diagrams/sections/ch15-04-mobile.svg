<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch15-04" data-layout="mobile" role="img" aria-labelledby="ch15-04m-title ch15-04m-desc">
<title id="ch15-04m-title">迁移与收紧许可，缺一不可</title>
<desc id="ch15-04m-desc">构建依赖和可见性白名单的示意前后对照。迁移前甲乙都指向旧系统，白名单为甲乙。甲经 LSC 变更、审查和测试迁到新系统后，工具定期把甲从旧目标的可见性白名单中移除，名单只剩乙。此时甲回退或新用户丙新增旧目标依赖都被构建规则拒绝；乙仍使用旧系统，尚不能据此删除它。Tricorder 另在符号层提醒新增旧调用，提醒不等于构建目标的拒绝规则。</desc>
<style>
.cg-ch15-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch15-04[data-layout="mobile"] .strong {font-weight:600}
.cg-ch15-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch15-04[data-layout="mobile"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch15-04[data-layout="mobile"] .primary {fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch15-04[data-layout="mobile"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch15-04[data-layout="mobile"] .primary-line {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2}
.cg-ch15-04[data-layout="mobile"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch15-04[data-layout="mobile"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch15-04[data-layout="mobile"] .secondary-line {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2}
.cg-ch15-04[data-layout="mobile"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch15-04[data-layout="mobile"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch15-04[data-layout="mobile"] .warm-line {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2}
.cg-ch15-04[data-layout="mobile"] .danger {fill:var(--diagram-danger-soft,#faecee);stroke:var(--diagram-danger,#b54750);stroke-width:1.5}
.cg-ch15-04[data-layout="mobile"] .danger-ink {fill:var(--diagram-danger,#b54750)}
.cg-ch15-04[data-layout="mobile"] .danger-line {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2}
</style>
