  <rect x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)" />
  <g id="ch05-03m-heading" data-box="24,12,372,72">
    <text x="24" y="38" class="strong" text-anchor="start">经理不是 Java 专家，怎么办？</text>
    <text x="24" y="72" class="small" text-anchor="start">原书 Java 案例：改变的是求助路径</text>
  </g>
  <g id="ch05-03m-manager" data-box="74,105,272,84">
    <rect x="74" y="105" width="272" height="84" fill="var(--diagram-warm-soft,#fff3dc)" />
    <text x="210" y="137" class="strong" text-anchor="middle">经理：负责牵线</text>
    <text x="210" y="170" class="small" text-anchor="middle">并非 Java 专家</text>
  </g>
  <g id="ch05-03m-engineer" data-box="24,280,174,123">
    <rect x="24" y="280" width="174" height="123" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="111" y="311" class="strong" text-anchor="middle">受阻的工程师</text>
    <text x="111" y="350" class="small" text-anchor="middle">被一段</text>
    <text x="111" y="380" class="small" text-anchor="middle">Java 代码难住</text>
  </g>
  <g id="ch05-03m-expert" data-box="222,280,174,123">
    <rect x="222" y="280" width="174" height="123" fill="var(--diagram-secondary-soft,#eaf1fa)" />
    <text x="309" y="311" class="strong" text-anchor="middle">另一位工程师</text>
    <text x="309" y="350" class="small" text-anchor="middle">恰好了解</text>
    <text x="309" y="380" class="small" text-anchor="middle">这个问题</text>
  </g>
