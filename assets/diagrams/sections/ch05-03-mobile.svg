<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch05-03" data-layout="mobile" role="img" aria-labelledby="ch05-03m-title ch05-03m-desc">
  <title id="ch05-03m-title">经理不是 Java 专家，怎么办？</title>
  <desc id="ch05-03m-desc">原书 Java 案例：一位工程师被代码难住；经理并非 Java 专家，却将他与另一位恰好了解问题的工程师联系起来。经理改变的是两位工程师之间的联系，而不是自己的专业知识。介绍关系不是汇报线。</desc>
  <style>
.cg-ch05-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch05-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch05-03[data-layout="mobile"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
