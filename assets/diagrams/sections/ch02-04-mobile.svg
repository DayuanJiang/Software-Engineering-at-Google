<text x="318.0" y="357.0" class="" text-anchor="middle">补配置校验</text>
<text x="318.0" y="386.0" class="" text-anchor="middle">B · 预防复发</text>
</g>
<path d="M128 412V431H222V444" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-04m-primary-arrow)"/>
<path d="M318 412V431H222" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round"/>
<g id="ch02-04m-follow-through" data-box="104,450,268,48">
<rect x="104" y="450" width="268" height="48" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="238.0" y="482.0" class="" text-anchor="middle">实际落实，不止写下行动</text>
</g>
<path d="M24 197H12V539H46" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-04m-secondary-arrow)"/>
<g id="ch02-04m-share" data-box="52,515,344,48">
<rect x="52" y="515" width="344" height="48" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="1.5"/>
<text x="224.0" y="547.0" class="small" text-anchor="middle">共享事实、原因、教训，便于查阅</text>
</g>
<text x="24" y="592" class="small" text-anchor="start">无责不是无行动；道歉不能代替改进。</text>
