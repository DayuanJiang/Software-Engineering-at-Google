<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch02-04" data-layout="mobile" role="img" aria-labelledby="ch02-04m-title ch02-04m-desc">
<title id="ch02-04m-title">无责复盘：从原因到改变</title>
<desc id="ch02-04m-desc">教学示例而非书中事故：配置变更造成服务中断，调查指出缺少配置校验。原因导出修复配置与补充校验两类行动，需实际落实。记录另一路共享给后来者。箭头表示依据，不是强制处理顺序；提出行动不等于已经完成。</desc>
<style>
.cg-ch02-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch02-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch02-04[data-layout="mobile"] .strong {font-weight:600}
.cg-ch02-04[data-layout="mobile"] .primary {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch02-04[data-layout="mobile"] .secondary {fill:var(--diagram-secondary,#2f6eac);font-weight:600}
.cg-ch02-04[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch02-04[data-layout="mobile"] .warm {fill:var(--diagram-warm,#a56a1f);font-weight:600}
</style>
