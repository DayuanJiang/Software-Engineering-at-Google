<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="36" class="strong" text-anchor="start">无责复盘：从原因到改变</text>
<text x="24" y="69" class="small" text-anchor="start">教学示例，非书中事故</text>
<g id="ch02-04m-record" data-box="24,88,372,171">
<rect x="24" y="88" width="372" height="171" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="1.5"/>
<text x="40" y="119" class="strong" text-anchor="start">配置变更后，服务中断</text>
<text x="40" y="153" class="small" text-anchor="start">时间线：发现、调查、恢复</text>
<text x="40" y="182" class="small" text-anchor="start">影响：服务无法访问</text>
<text x="40" y="226" class="" text-anchor="start">原因：缺少对该配置的校验</text>
</g>
<path d="M210 265V281H128V314" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-04m-primary-arrow)"/>
