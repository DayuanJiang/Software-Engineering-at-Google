<text x="210" y="305" class="small" text-anchor="middle">据此提出行动</text>
<g id="ch02-04m-repair" data-box="52,321,152,85">
<rect x="52" y="321" width="152" height="85" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
