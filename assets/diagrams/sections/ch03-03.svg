<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch03-03" data-layout="desktop" role="img" aria-labelledby="ch03-03-title ch03-03-desc">
<title id="ch03-03-title">哪些资料需要全公司统一？</title>
<desc id="ch03-03-desc">原文以基本开发工作流和本地 Frobber 实例作对比。多个团队查阅同一份由专家审核维护的全公司参考；Frobber 工程师查阅团队的本地运行指南。图示主要受众，而非访问权限；并非所有资料都要成为全员规范。</desc>
<style>
.cg-ch03-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch03-03[data-layout="desktop"] .strong {font-weight:600}
.cg-ch03-03[data-layout="desktop"] .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch03-03-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch03-03-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch03-03-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong">哪些资料需要全公司统一？</text>
<text x="32" y="77" text-anchor="start" class="small">书中两例；团队甲乙只是不同团队的示意，不代表人数或访问权限</text>
<path d="M480 105V403" class="rule" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<text x="248" y="128" text-anchor="middle" class="strong">基本开发工作流</text>
<g id="ch03-03-node-1" data-box="118,157,260,110">
<rect x="118" y="157" width="260" height="110" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)"/>
<text x="248.0" y="193" text-anchor="middle" class="strong">全公司统一参考</text>
<text x="248.0" y="232" text-anchor="middle" class="small">专家审核与主动维护</text>
</g>
<text x="248" y="306" text-anchor="middle" class="small">不同团队查阅同一份指南</text>
<g id="ch03-03-node-2" data-box="40,335,184,64">
<rect x="40" y="335" width="184" height="64" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="132.0" y="375" text-anchor="middle" class="">团队甲</text>
</g>
<g id="ch03-03-node-3" data-box="272,335,184,64">
<rect x="272" y="335" width="184" height="64" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="364.0" y="375" text-anchor="middle" class="">团队乙</text>
</g>
<path d="M132 329V314H100V242H112" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-03-arrow-secondary)"/>
<path d="M364 329V314H396V242H384" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-03-arrow-secondary)"/>
<text x="724" y="128" text-anchor="middle" class="strong">本地 Frobber 实例</text>
<g id="ch03-03-node-4" data-box="594,157,260,110">
<rect x="594" y="157" width="260" height="110" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)"/>
<text x="724.0" y="193" text-anchor="middle" class="strong">Frobber 团队指南</text>
<text x="724.0" y="232" text-anchor="middle" class="small">记录本地运行步骤</text>
</g>
<g id="ch03-03-node-5" data-box="604,335,240,64">
<rect x="604" y="335" width="240" height="64" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="724.0" y="375" text-anchor="middle" class="">Frobber 工程师</text>
</g>
<path d="M724 329V273" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03-03-arrow-secondary)"/>
<text x="750" y="307" text-anchor="start" class="small">查阅</text>
<text x="32" y="439" text-anchor="start" class="small">统一资料：维护投入更高，覆盖更多工程师。</text>
<text x="32" y="469" text-anchor="start" class="small">团队指南：按受众维护，不必把局部内容变成全公司统一规范。</text>
</svg>
