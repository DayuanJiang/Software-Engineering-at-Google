<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch13-04" data-layout="desktop" role="img" aria-labelledby="ch13-04-title ch13-04-desc">
<title id="ch13-04-title">同一 ID 保存两次，fake 也必须报错</title>
<desc id="ch13-04-desc">将书中的重复 ID 契约变为并排执行轨迹：从空库开始，首次 save(id) 成功并改变状态，第二次必须报错；只测首次成功会漏掉允许重复保存的 fake。 重复 ID 报错是书中此数据库的示例契约，不是所有数据库 save/upsert API 的通用规则。示意未指定异常类，不证明持久化、并发或性能；真实性能应使用真实实现测试。</desc>
<style>
.cg-ch13-04[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch13-04[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch13-04[data-layout="desktop"] .strong {font-weight:600}
.cg-ch13-04[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch13-04[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch13-04[data-layout="desktop"] .rule {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch13-04[data-layout="desktop"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch13-04-arrow)}
</style>
<defs><marker id="ch13-04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect id="ch13-04-region-1" x="0" y="0" width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="40" text-anchor="start" class="strong">同一 ID 保存两次，fake 也必须报错</text>
<text x="32" y="75" text-anchor="start" class="small">书中示例契约：新 ID 成功，重复 ID 报错；不是所有数据库 save API 的规则。</text>
<rect id="ch13-04-region-2" x="32" y="106" width="896" height="43" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="48" y="136" text-anchor="start" class="strong">同一公开接口测试</text>
<text x="380" y="136" text-anchor="start" class="strong">真实实现</text>
<text x="696" y="136" text-anchor="start" class="strong">fake</text>
<text x="48" y="184" text-anchor="start" class="">初始状态</text>
<text x="380" y="184" text-anchor="start" class="">{}</text>
<text x="696" y="184" text-anchor="start" class="">{}</text>
<path class="rule" d="M32 200 L928 200"/>
<text x="48" y="237" text-anchor="start" class="">1. save(id)</text>
<text x="380" y="237" text-anchor="start" class="good">成功 → {id}</text>
<text x="696" y="237" text-anchor="start" class="good">成功 → {id}</text>
<path class="rule" d="M32 253 L928 253"/>
<text x="48" y="290" text-anchor="start" class="">2. save(id)  同一 ID</text>
<text x="380" y="290" text-anchor="start" class="strong">必须报错</text>
<text x="696" y="290" text-anchor="start" class="strong">必须报错</text>
<rect id="ch13-04-region-3" x="32" y="322" width="896" height="86" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="48" y="355" text-anchor="start" class="strong" data-fit="ch13-04-region-3">反例：fake 的第二次 save(id) 仍成功</text>
<text x="48" y="392" text-anchor="start" class="small" data-fit="ch13-04-region-3">首次保存测试会通过；补上“重复 ID 应报错”的断言后，这个 fake 才会失败。</text>
<text x="32" y="454" text-anchor="start" class="small">由维护者分别运行；这里只查保存契约，不验证持久化、真实延迟或资源消耗。</text>
</svg>
