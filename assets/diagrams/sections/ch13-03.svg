<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch13-03" data-layout="desktop" role="img" aria-labelledby="ch13-03-title ch13-03-desc">
<title id="ch13-03-title">数据库不可用于测试时，替换哪一层？</title>
<desc id="ch13-03-desc">示意保留真实的两个调用者，只在无法用于测试的数据库 API 边界提供共享 fake；写入调用改变 fake 状态，另一调用者读回该状态，而非为每个调用者分别写 fake。 A/B 是说明替换边界的示意调用者，不是书中新增的类；假定先保存再读取、同一实例、支持该契约，不暗示并发、持久性或事务保证。图不是所有依赖选择的完整决策树。</desc>
<style>
.cg-ch13-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch13-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch13-03[data-layout="desktop"] .strong {font-weight:600}
.cg-ch13-03[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch13-03[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch13-03[data-layout="desktop"] .rule {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch13-03[data-layout="desktop"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch13-03-arrow)}
</style>
<defs><marker id="ch13-03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect id="ch13-03-region-1" x="0" y="0" width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="40" text-anchor="start" class="strong">数据库不可用于测试时，替换哪一层？</text>
<text x="32" y="75" text-anchor="start" class="small">边界示意：A/B 为真实调用者；先保存，再读取，两者使用同一实例。</text>
<rect id="ch13-03-region-2" x="32" y="110" width="360" height="91" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<rect id="ch13-03-region-3" x="568" y="110" width="360" height="91" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="48" y="145" text-anchor="start" class="strong" data-fit="ch13-03-region-2">真实调用者 A</text>
<text x="48" y="180" text-anchor="start" class="small" data-fit="ch13-03-region-2">执行保存记录的业务逻辑</text>
<text x="584" y="145" text-anchor="start" class="strong" data-fit="ch13-03-region-3">真实调用者 B</text>
<text x="584" y="180" text-anchor="start" class="small" data-fit="ch13-03-region-3">执行读取记录的业务逻辑</text>
<path class="arrow" d="M212 201 L212 250"/>
<path class="arrow" d="M748 201 L748 250"/>
<text x="45" y="235" text-anchor="start" class="">1. save(item)</text>
<text x="767" y="235" text-anchor="start" class="">2. get(id)</text>
<rect id="ch13-03-region-4" x="32" y="262" width="896" height="128" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="48" y="296" text-anchor="start" class="strong" data-fit="ch13-03-region-4">只替换数据库 API：一个共享 fake</text>
<text x="60" y="349" text-anchor="start" class="">{}</text>
<path class="arrow" d="M112 341 L281 341"/>
<text x="155" y="326" text-anchor="start" class="small">保存</text>
<text x="311" y="349" text-anchor="start" class="">{id: item}</text>
<path class="arrow" d="M447 341 L575 341"/>
<text x="483" y="326" text-anchor="start" class="small">读取</text>
<text x="604" y="349" text-anchor="start" class="" data-fit="ch13-03-region-4">get(id) → item</text>
<text x="32" y="431" text-anchor="start" class="">A/B 不必各写一个 fake；两条真实调用路径仍在测试中执行。</text>
<text x="32" y="465" text-anchor="start" class="small">断言 B 读回 item；该示意不验证真实数据库的持久化、并发或性能，仍需另外测试。</text>
</svg>
