<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch04-04" data-layout="desktop" role="img" aria-labelledby="ch04-04-title ch04-04-desc">
<title id="ch04-04-title">与用户共同设计和改进</title>
<desc id="ch04-04-desc">将弱势用户参与、从困难用例开始、衡量系统公平性和持续调整组成概念回路。价值观与投入不自动等于公平结果，需要反馈和专业知识。</desc>
<style>
.cg-ch04-04[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04-04[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch04-04[data-layout="desktop"] .strong {font-weight:600}
</style>
