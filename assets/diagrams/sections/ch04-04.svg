<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong">与用户共同设计和改进</text>
<g id="ch04-04-node-1" data-box="58,106,366,94">
<rect x="58" y="106" width="366" height="94" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="241.0" y="145.0" text-anchor="middle" class="strong">让弱势用户参与</text>
<text x="241.0" y="177.0" text-anchor="middle" class="small">与用户共建，不是替用户猜</text>
</g>
<g id="ch04-04-node-2" data-box="534,106,366,94">
<rect x="534" y="106" width="366" height="94" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="717.0" y="145.0" text-anchor="middle" class="strong">从困难用例开始</text>
<text x="717.0" y="177.0" text-anchor="middle" class="small">从设计之初考虑包容性</text>
</g>
<g id="ch04-04-node-3" data-box="534,284,366,94">
<rect x="534" y="284" width="366" height="94" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="717.0" y="323.0" text-anchor="middle" class="strong">衡量系统公平性</text>
<text x="717.0" y="355.0" text-anchor="middle" class="small">借助相关领域专家的判断</text>
</g>
<g id="ch04-04-node-4" data-box="58,284,366,94">
<rect x="58" y="284" width="366" height="94" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="241.0" y="323.0" text-anchor="middle" class="strong">依据反馈持续改进</text>
<text x="241.0" y="355.0" text-anchor="middle" class="small">承担失败，修正做法</text>
</g>
