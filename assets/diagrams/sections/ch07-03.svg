<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch07-03" data-layout="desktop" role="img" aria-labelledby="ch07-03-title ch07-03-desc">
  <title id="ch07-03-title">生产力不只有速度</title>
  <desc id="ch07-03-desc">质量、注意力、认知复杂度、节奏和速度、满意度是彼此权衡的五个方面。Readability 研究设定质量、学习指导、速度和满意度目标，没有注意力目标。表格不表示评分、排名或等权重。</desc>
  <style>
.cg-ch07-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch07-03[data-layout="desktop"] .strong {font-weight:600}
.cg-ch07-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch07-03[data-layout="desktop"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch07-03-arrow)}
.cg-ch07-03[data-layout="desktop"] .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
</style>
  <defs>
    <marker id="ch07-03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
  </defs>
  <rect width="960" height="480" fill="var(--diagram-bg,#fff)" />
  <text x="32" y="40" text-anchor="start" class="strong">生产力不只有速度</text>
  <text x="32" y="70" text-anchor="start" class="small">QUANTS 与 Readability 目标</text>
  <text x="40" y="115" text-anchor="start" class="strong">生产力的方面</text>
  <text x="326" y="115" text-anchor="start" class="strong">Readability 研究中的目标</text>
  <rect x="32" y="135" width="896" height="44" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
  <text x="48" y="165" text-anchor="start">质量</text>
  <text x="326" y="165" text-anchor="start">更高质量、一致性与代码健康</text>
  <rect x="32" y="187" width="896" height="44" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" />
  <text x="48" y="217" text-anchor="start">注意力</text>
  <text x="326" y="217" text-anchor="start">此案例未设目标，不强行度量</text>
  <rect x="32" y="239" width="896" height="44" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
  <text x="48" y="269" text-anchor="start">认知复杂度</text>
  <text x="326" y="269" text-anchor="start">学习代码库与最佳实践，获得指导</text>
  <rect x="32" y="291" width="896" height="44" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
  <text x="48" y="321" text-anchor="start">节奏和速度</text>
  <text x="326" y="321" text-anchor="start">更快、更高效地完成工作</text>
  <rect x="32" y="343" width="896" height="44" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
  <text x="48" y="373" text-anchor="start">满意度</text>
  <text x="326" y="373" text-anchor="start">认可流程的收益，参与体验积极</text>
  <path d="M24 410H936" class="line" />
  <text x="32" y="432" text-anchor="start" class="small">QUANTS 是相互权衡的五个方面，不是评分表；不要只优化速度而忽略质量</text>
</svg>
