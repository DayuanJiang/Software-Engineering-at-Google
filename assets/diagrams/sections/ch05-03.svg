<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch05-03" data-layout="desktop" role="img" aria-labelledby="ch05-03-title ch05-03-desc">
  <title id="ch05-03-title">经理不是 Java 专家，怎么办？</title>
  <desc id="ch05-03-desc">原书 Java 案例：一位工程师被代码难住；经理并非 Java 专家，却将他与另一位恰好了解问题的工程师联系起来。经理改变的是两位工程师之间的联系，而不是自己的专业知识。介绍关系不是汇报线。</desc>
  <style>
.cg-ch05-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch05-03[data-layout="desktop"] .strong {font-weight:600}
.cg-ch05-03[data-layout="desktop"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
  <defs>
    <marker id="ch05-03-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch05-03-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch05-03-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch05-03-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="var(--diagram-bg,#fff)" />
  <g id="ch05-03-heading" data-box="32,12,896,72">
    <text x="32" y="42" class="strong" text-anchor="start">经理不是 Java 专家，怎么办？</text>
    <text x="32" y="77" class="small" text-anchor="start">原书 Java 案例：改变的是求助路径</text>
  </g>
  <g id="ch05-03-manager" data-box="342,102,276,84">
    <rect x="342" y="102" width="276" height="84" fill="var(--diagram-warm-soft,#fff3dc)" />
    <text x="480" y="135" class="strong" text-anchor="middle">经理：负责牵线</text>
    <text x="480" y="167" class="small" text-anchor="middle">并非 Java 专家</text>
  </g>
  <g id="ch05-03-engineer" data-box="32,263,280,98">
    <rect x="32" y="263" width="280" height="98" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="172" y="300" class="strong" text-anchor="middle">受阻的工程师</text>
    <text x="172" y="337" class="small" text-anchor="middle">被一段 Java 代码难住</text>
  </g>
  <g id="ch05-03-expert" data-box="648,263,280,98">
    <rect x="648" y="263" width="280" height="98" fill="var(--diagram-secondary-soft,#eaf1fa)" />
    <text x="788" y="300" class="strong" text-anchor="middle">另一位工程师</text>
    <text x="788" y="337" class="small" text-anchor="middle">恰好了解这个问题</text>
  </g>
  <polyline points="370,190 172,228 172,257" class="connector" stroke="var(--diagram-warm,#a56a1f)" data-connector="true" marker-end="url(#ch05-03-arrow-warm)" />
  <polyline points="590,190 788,228 788,257" class="connector" stroke="var(--diagram-warm,#a56a1f)" data-connector="true" marker-end="url(#ch05-03-arrow-warm)" />
  <g id="ch05-03-introduction-label" data-box="350,203,260,42">
    <text x="480" y="234" class="small" text-anchor="middle">把两人介绍给彼此</text>
  </g>
  <polyline points="318,312 642,312" class="connector" stroke="var(--diagram-secondary,#2f6eac)" data-connector="true" marker-end="url(#ch05-03-arrow-secondary)" />
  <g id="ch05-03-contact-label" data-box="322,273,316,32">
    <text x="480" y="296" class="small" text-anchor="middle">建立技术求助联系</text>
  </g>
  <g id="ch05-03-takeaway" data-box="32,385,896,88">
    <text x="480" y="419" class="strong" text-anchor="middle">经理提供联系，懂问题的人提供技术帮助。</text>
    <text x="480" y="459" class="small" text-anchor="middle">这个例子不要求经理先变成 Java 专家。</text>
  </g>
</svg>
