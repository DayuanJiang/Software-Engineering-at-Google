<path d="M360 284H328V360H298" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch19-02-secondary-arrow)"/>
<rect id="ch19-02-box-6" x="662" y="153" width="266" height="87" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>
<text x="678" y="183" class="strong" text-anchor="start" data-owner="ch19-02-box-6">
<tspan x="678" y="183">分析结果</tspan>
</text>
<text x="678" y="218" class="small" text-anchor="start" data-owner="ch19-02-box-6">
<tspan x="678" y="218">问题与修复建议</tspan>
</text>
<rect id="ch19-02-box-7" x="662" y="295" width="266" height="87" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>
<text x="678" y="325" class="strong" text-anchor="start" data-owner="ch19-02-box-7">
<tspan x="678" y="325">测试覆盖率</tspan>
</text>
<text x="678" y="360" class="small" text-anchor="start" data-owner="ch19-02-box-7">
<tspan x="678" y="360">显示在 diff 行号栏</tspan>
</text>
<path d="M662 196H628V248H594" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch19-02-primary-arrow)"/>
<path d="M662 337H628V286H594" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch19-02-primary-arrow)"/>
<rect id="ch19-02-box-8" x="32" y="416" width="896" height="48" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="48" y="443" class="small" text-anchor="start" data-owner="ch19-02-box-8">
<tspan x="48" y="443">跨工具导航优先使用链接；少量上下文直接呈现，不牺牲审查的简洁性。</tspan>
</text>
</svg>
