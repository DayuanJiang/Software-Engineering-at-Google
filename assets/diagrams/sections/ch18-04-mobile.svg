<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch18-04" data-layout="mobile" role="img" aria-labelledby="ch18-04m-title ch18-04m-desc"><title id="ch18-04m-title">缓存共享结果，远程执行共享算力</title><desc id="ch18-04m-desc">区分远程缓存命中、未命中的本地路径和由主控节点调度工作节点的远程执行路径；后者仍使用缓存交换中间产物，并依赖完整声明、自包含和确定性。</desc><style>.cg-ch18-04[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch18-04[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}.cg-ch18-04[data-layout="mobile"] .strong{font-weight:600}</style><defs>
<marker id="ch18-04m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch18-04m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch18-04m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch18-04m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch18-04m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect id="ch18-04m-box-1" x="0" y="0" width="420" height="600" rx="6" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">
<tspan x="24" y="38">缓存共享结果，远程执行共享算力</tspan>
</text>
<text x="24" y="76" class="small" text-anchor="start">
<tspan x="24" y="76">缓存复用已有结果；执行分担计算工作</tspan>
</text>
<text x="24" y="118" class="strong" text-anchor="start">
<tspan x="24" y="118">远程缓存</tspan>
</text>
<rect id="ch18-04m-box-2" x="24" y="140" width="372" height="52" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>
<text x="210.0" y="170" class="strong" text-anchor="middle" data-owner="ch18-04m-box-2">
<tspan x="210.0" y="170">查询共享缓存</tspan>
</text>
<path d="M126 192V227" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch18-04m-secondary-arrow)"/>
<path d="M294 192V227" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch18-04m-warm-arrow)"/>
<rect id="ch18-04m-box-3" x="24" y="229" width="176" height="77" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>
<text x="112.0" y="259" class="strong" text-anchor="middle" data-owner="ch18-04m-box-3">
<tspan x="112.0" y="259">命中</tspan>
</text>
<text x="112.0" y="291" class="small" text-anchor="middle" data-owner="ch18-04m-box-3">
<tspan x="112.0" y="291">下载产物</tspan>
</text>
<rect id="ch18-04m-box-4" x="220" y="229" width="176" height="77" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>
<text x="308.0" y="259" class="strong" text-anchor="middle" data-owner="ch18-04m-box-4">
<tspan x="308.0" y="259">未命中</tspan>
</text>
<text x="308.0" y="291" class="small" text-anchor="middle" data-owner="ch18-04m-box-4">
<tspan x="308.0" y="291">本地构建上传</tspan>
</text>
<text x="24" y="349" class="strong" text-anchor="start">
<tspan x="24" y="349">远程执行</tspan>
</text>
<path d="M34 371V477" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
<text x="54" y="385" class="small" text-anchor="start">
<tspan x="54" y="385">主控节点按依赖调度动作</tspan>
</text>
<text x="54" y="428" class="small" text-anchor="start">
<tspan x="54" y="428">工作节点池执行构建</tspan>
</text>
<text x="54" y="471" class="small" text-anchor="start">
<tspan x="54" y="471">经共享缓存交换中间产物</tspan>
</text>
<rect id="ch18-04m-box-5" x="24" y="516" width="372" height="68" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="40" y="543" class="small" text-anchor="start" data-owner="ch18-04m-box-5">
<tspan x="40" y="543">共同前提：明确输入、确定输出。</tspan>
<tspan x="40" y="569">远程执行还需自包含的构建环境。</tspan>
</text>
</svg>
