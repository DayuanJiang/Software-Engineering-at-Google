<svg xmlns="http://www.w3.org/2000/svg" id="ch24-02m-root" class="chapter-svg cg-ch24-02" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch24-02m-title ch24-02m-desc">
<title id="ch24-02m-title">关掉功能，不等于移除代码</title>
<desc id="ch24-02m-desc">对照同一 v2 的运行时关闭与开启状态，以及构建时剔除新代码的另一产物。关闭只改变所走路径；不存在的代码不能仅靠配置启用。动态配置仍需谨慎发布，已部署的关闭代码仍可能被提取。</desc>
<style>
.cg-ch24-02#ch24-02m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch24-02#ch24-02m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch24-02#ch24-02m-root .strong {font-weight:600}
.cg-ch24-02#ch24-02m-root .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
</style>
<defs>
<marker id="ch24-02m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch24-02m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch24-02m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch24-02m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start" data-box="12,8,396,584">关掉功能，不等于移除代码</text>
<text x="24" y="74" class="small" text-anchor="start" data-box="12,8,396,584">示例：请求改道，与代码消失不同。</text>
<text x="24" y="116" class="strong" text-anchor="start" data-box="12,8,396,584">v2 / 运行时关</text>
<text x="264" y="116" class="strong" text-anchor="start" data-box="12,8,396,584">走旧路径</text>
<text x="264" y="145" class="small" text-anchor="start" data-box="12,8,396,584">新代码仍在</text>
<rect x="24" y="128" width="222" height="82" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="135" y="152" class="small" text-anchor="middle" data-box="24,128,222,82">请求</text>
<rect x="34" y="171" width="90" height="32" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<rect x="146" y="171" width="90" height="32" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="79" y="195" class="" text-anchor="middle" data-box="34,171,90,32">旧</text>
<text x="191" y="195" class="" text-anchor="middle" data-box="146,171,90,32">新</text>
<path data-connector="true" d="M135 159V162H79V170" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch24-02m-secondary-arrow)"/>
<text x="24" y="248" class="strong" text-anchor="start" data-box="12,8,396,584">v2 / 运行时开</text>
<text x="264" y="248" class="strong" text-anchor="start" data-box="12,8,396,584">走新路径</text>
<text x="264" y="277" class="small" text-anchor="start" data-box="12,8,396,584">同一个 v2</text>
<rect x="24" y="260" width="222" height="82" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="135" y="284" class="small" text-anchor="middle" data-box="24,260,222,82">请求</text>
<rect x="34" y="303" width="90" height="32" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<rect x="146" y="303" width="90" height="32" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="79" y="327" class="" text-anchor="middle" data-box="34,303,90,32">旧</text>
<text x="191" y="327" class="" text-anchor="middle" data-box="146,303,90,32">新</text>
<path data-connector="true" d="M135 291V294H191V302" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch24-02m-primary-arrow)"/>
<text x="264" y="314" class="small" text-anchor="start" data-box="12,8,396,584">异常可关回</text>
<text x="264" y="338" class="small" text-anchor="start" data-box="12,8,396,584">旧路径须在</text>
<text x="24" y="380" class="strong" text-anchor="start" data-box="12,8,396,584">R / 构建时剔除</text>
<text x="264" y="380" class="strong" text-anchor="start" data-box="12,8,396,584">无法仅靠</text>
<text x="264" y="409" class="small" text-anchor="start" data-box="12,8,396,584">配置启用</text>
<rect x="24" y="392" width="222" height="82" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="135" y="416" class="small" text-anchor="middle" data-box="24,392,222,82">请求</text>
<rect x="34" y="435" width="90" height="32" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<rect x="146" y="435" width="90" height="32" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="79" y="459" class="" text-anchor="middle" data-box="34,435,90,32">旧</text>
<text x="191" y="459" class="" text-anchor="middle" data-box="146,435,90,32">缺失</text>
<path data-connector="true" d="M135 423V426H79V434" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch24-02m-warm-arrow)"/>
<path class="line" d="M24 490L396 490"/>
<text x="24" y="518" class="small" text-anchor="start" data-box="12,8,396,584">关标志仍可提取代码。</text>
<text x="24" y="546" class="small" text-anchor="start" data-box="12,8,396,584">配置须分阶段发布；不是零风险。</text>
<text x="24" y="574" class="small" text-anchor="start" data-box="12,8,396,584">构建剔除取决于语言与工具。</text>
</svg>
