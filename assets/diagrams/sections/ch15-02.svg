<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">静态清单之外，谁还在用？</text>
<text x="32" y="78" class="small" text-anchor="start">示意：服务甲从未识别到被发现；不是一次真实事故记录</text>
<text x="32" y="122" class="strong" text-anchor="start">静态视图：Code Search / Kythe</text>
<g data-box="32,149,198,58">
<rect x="32" y="149" width="198" height="58" rx="5" class="secondary"/>
<text x="131.0" y="186.0" class="strong" text-anchor="middle">库／瘦客户端</text>
</g>
<g data-box="290,149,164,58">
<rect x="290" y="149" width="164" height="58" rx="5" class="danger"/>
<text x="372.0" y="186.0" class="strong" text-anchor="middle">旧系统</text>
</g>
<path d="M230 178H288" class="primary-line" data-connector="true" marker-end="url(#ch15-02-primary-arrow)"/>
<text x="32" y="252" class="strong warm-ink" text-anchor="start">服务甲  ?</text>
<text x="32" y="287" class="small" text-anchor="start">尚未识别它的运行依赖</text>
<path d="M482 105L482 306" class="guide"/>
<text x="514" y="122" class="strong" text-anchor="start">补充运行证据</text>
<text x="514" y="158" class="small" text-anchor="start">日志／采样 + 预告的渐进停服</text>
<g data-box="514,192,158,58">
<rect x="514" y="192" width="158" height="58" rx="5" class="warm"/>
<text x="593.0" y="229.0" class="strong" text-anchor="middle">服务甲</text>
</g>
<g data-box="770,192,158,58">
<rect x="770" y="192" width="158" height="58" rx="5" class="danger"/>
<text x="849.0" y="229.0" class="strong" text-anchor="middle">旧系统</text>
</g>
<path d="M672 221H768" class="danger-line" data-connector="true" marker-end="url(#ch15-02-danger-arrow)" stroke-dasharray="6 5"/>
<text x="514" y="282" class="small danger-ink" text-anchor="start">观察到失效</text>
<text x="777" y="282" class="small danger-ink" text-anchor="start">临时停服</text>
<text x="514" y="318" class="small" text-anchor="start">虚线：新识别的运行依赖</text>
<rect x="32" y="342" width="896" height="56" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="52" y="379" class="strong" text-anchor="start">新证据改变计划：协助服务甲迁移，或与依赖方共同调整时间表。</text>
<text x="32" y="430" class="" text-anchor="start">计划停服须预告并逐步延长；测试还需使用方提供充分覆盖。</text>
<text x="32" y="458" class="" text-anchor="start">静态未找到不等于不存在运行依赖。</text>
</svg>
