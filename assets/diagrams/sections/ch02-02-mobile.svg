<marker id="ch02-02m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch02-02m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch02-02m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
<marker id="ch02-02m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="36" class="strong" text-anchor="start">主负责人离开后，谁还能接手？</text>
<text x="24" y="72" class="small" text-anchor="start">同一变化：两种情境的 A 都不可用</text>
<text x="24" y="112" class="danger" text-anchor="start">只有 A 懂原型</text>
<g id="ch02-02m-a-alone" data-box="24,131,168,76">
<rect x="24" y="131" width="168" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="108.0" y="162.5" class="" text-anchor="middle">A：主负责人</text>
<text x="108.0" y="191.5" class="" text-anchor="middle">已不可用</text>
</g>
<path d="M32 139L184 199" class="unavailable" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<g id="ch02-02m-b-unknown" data-box="228,131,168,76">
<rect x="228" y="131" width="168" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="312.0" y="162.5" class="" text-anchor="middle">B：其他成员</text>
<text x="312.0" y="191.5" class="" text-anchor="middle">不懂此原型</text>
</g>
<path d="M108 213V229M108 252V262H162" class="connector" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M98 233L118 248M118 233L98 248" class="cut" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
