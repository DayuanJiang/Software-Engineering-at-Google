<rect x="168" y="230" width="228" height="56" rx="4" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-danger,#b54750)" stroke-width="1.5"/>
<text x="282.0" y="266.0" class="" text-anchor="middle">原型：无知情者接手</text>
</g>
<path d="M24 309H396" class="connector" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<text x="24" y="348" class="primary" text-anchor="start">A、B 已共同掌握原型</text>
<g id="ch02-02m-a-shared" data-box="24,368,168,76">
<rect x="24" y="368" width="168" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="108.0" y="399.5" class="" text-anchor="middle">A：主负责人</text>
<text x="108.0" y="428.5" class="" text-anchor="middle">已不可用</text>
</g>
<path d="M32 376L184 436" class="unavailable" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<g id="ch02-02m-b-knows" data-box="228,368,168,76">
<rect x="228" y="368" width="168" height="76" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="312.0" y="399.5" class="" text-anchor="middle">B：后备负责人</text>
<text x="312.0" y="428.5" class="" text-anchor="middle">确实理解原型</text>
</g>
<path d="M108 450V464M108 488V498H162" class="connector" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M98 468L118 483M118 468L98 483" class="cut" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
<path d="M312 450V468" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-02m-primary-arrow)"/>
<g id="ch02-02m-has-path" data-box="168,474,228,56">
<rect x="168" y="474" width="228" height="56" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="282.0" y="510.0" class="" text-anchor="middle">原型：B 仍能接手</text>
</g>
<text x="24" y="563" class="small" text-anchor="start">文档辅助 B；不是第三位接手者。</text>
<text x="24" y="590" class="small" text-anchor="start">实线为可用知识路径，不计算人数。</text>
</svg>
