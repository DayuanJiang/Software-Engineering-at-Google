<svg xmlns="http://www.w3.org/2000/svg" id="ch22-04m-root" class="chapter-svg cg-ch22-04" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch22-04m-title ch22-04m-desc">
  <title id="ch22-04m-title">谁审查，取决于缺什么证据</title>
  <desc id="ch22-04m-desc">以类型改名为例：符合既定替换模式的分片可由全局审批人的工具批准；冲突后出现额外行为修改时需人工核查；依赖项目特有行为时需本地所有者提供背景。迁移授权并不等于每个分片已获批准。 reset() 与析构时机依赖是根据原文异常和行为依赖概念构造的教学案例，不是原书报告的具体缺陷。图示并非穷尽所有审查路径，也不授权跳过测试或任意项目检查；全局审批人机制依赖原文的权限与专业知识条件。</desc>
  <style>
.cg-ch22-04#ch22-04m-root text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; font-size:22px; font-weight:400; letter-spacing:0; fill:var(--diagram-ink,#242424); }
.cg-ch22-04#ch22-04m-root .small { font-size:19px; fill:var(--diagram-muted,#686868); }
.cg-ch22-04#ch22-04m-root .strong { font-weight:600; }
.cg-ch22-04#ch22-04m-root .primary-ink { fill:var(--diagram-primary,#087f6d); }
.cg-ch22-04#ch22-04m-root .danger-ink { fill:var(--diagram-danger,#b54750); }
.cg-ch22-04#ch22-04m-root .secondary-ink { fill:var(--diagram-secondary,#2f6eac); }
.cg-ch22-04#ch22-04m-root .warm-ink { fill:var(--diagram-warm,#a56a1f); }
</style>
  <defs>
    <marker id="ch22-04m-primary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch22-04m-secondary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch22-04m-warm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch22-04m-danger-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
    <marker id="ch22-04m-muted-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#686868)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)" />
  <text x="24" y="38" text-anchor="start" class="strong">谁审查，取决于缺什么证据</text>
  <text x="24" y="70" text-anchor="start" class="small">示意：别名已建立，预期仅改名</text>
  <rect x="24" y="94" width="372" height="40" fill="var(--diagram-primary-soft,#e5f4ee)" />
  <text x="36" y="122" text-anchor="start" class="strong" data-box="24,94,372,40">仅 scoped_ptr 改为新类型名</text>
  <path d="M38 140L38 166L53 166" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch22-04m-primary-arrow)" data-connector="[[38, 140], [38, 166], [53, 166]]" />
  <text x="66" y="174" text-anchor="start" class="strong">全局审批人：模式核对</text>
  <text x="24" y="207" text-anchor="start" class="small">专家定好模式，匹配才自动批准</text>
  <rect x="24" y="228" width="372" height="40" fill="var(--diagram-warm-soft,#fff3dc)" />
  <text x="36" y="256" text-anchor="start" class="strong" data-box="24,228,372,40">冲突处理后多出 reset()</text>
  <path d="M38 274L38 300L53 300" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch22-04m-warm-arrow)" data-connector="[[38, 274], [38, 300], [53, 300]]" />
  <text x="66" y="308" text-anchor="start" class="strong">全局审批人：人工核查</text>
  <text x="24" y="341" text-anchor="start" class="small">超出纯改名预期，检查异常</text>
  <rect x="24" y="362" width="372" height="40" fill="var(--diagram-secondary-soft,#eaf1fa)" />
  <text x="36" y="390" text-anchor="start" class="strong" data-box="24,362,372,40">项目依赖特定析构时机？</text>
  <path d="M38 408L38 434L53 434" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch22-04m-secondary-arrow)" data-connector="[[38, 408], [38, 434], [53, 434]]" />
  <text x="66" y="442" text-anchor="start" class="strong">本地所有者：核查行为背景</text>
  <text x="24" y="475" text-anchor="start" class="small">需要项目知识，而不只是权限</text>
  <path d="M24 496L396 496" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <text x="24" y="526" text-anchor="start" class="small">方案授权 ≠ 分片批准；仍需项目检查</text>
  <text x="24" y="554" text-anchor="start" class="small">作者回应意见；项目的既有失败</text>
  <text x="24" y="582" text-anchor="start" class="small">由本地所有者负责。</text>
</svg>
