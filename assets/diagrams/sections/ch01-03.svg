  <path d="M846 266C866 281 878 291 878 308" class="share"/>
  <circle cx="558" cy="319" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
  <circle cx="718" cy="319" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
  <circle cx="878" cy="319" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
  <text x="558" y="352" text-anchor="middle">团队甲</text>
  <text x="718" y="352" text-anchor="middle">团队乙</text>
  <text x="878" y="352" text-anchor="middle">团队丙</text>
  <text x="514" y="384" class="small">把共同知识与流程用于多个团队</text>

  <rect x="32" y="410" width="896" height="46" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <text x="480" y="440" text-anchor="middle" class="small">目标是减少重复的人力投入；共享工具、测试与维护仍需投入</text>
