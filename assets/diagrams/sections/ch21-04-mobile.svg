<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch21-04" data-layout="mobile" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch21-04m-title ch21-04m-desc">
<title id="ch21-04m-title">为什么 MVS 有时也要选 1.8？</title>
<desc id="ch21-04m-desc">本图限定同一主版本、只含最低版本要求，候选为 libbase 1.6、1.7、1.8。liba≥1.7 沿用原文，libb 是补充示意。当 libb≥1.6 时，1.7 是同时满足 liba 与 libb 的最低版本，已有 1.8 不是额外升级的理由。当 libb 抬高要求至≥1.8，1.7 不再满足全部要求，MVS 必须选择 1.8。框线标出满足全部要求的最低候选，不表示兼容性证明。完整选择还须纳入全图传递要求，随后运行组合测试。</desc>
<style>
.cg-ch21-04[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch21-04[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch21-04[data-layout="mobile"] .strong{font-weight:600}
.cg-ch21-04[data-layout="mobile"] .primary{fill:var(--diagram-primary,#087f6d)}
.cg-ch21-04[data-layout="mobile"] .secondary{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch21-04[data-layout="mobile"] .warm{fill:var(--diagram-warm,#a56a1f)}
.cg-ch21-04[data-layout="mobile"] .danger{fill:var(--diagram-danger,#b54750)}
</style><defs>
<marker id="ch21-04m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch21-04m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch21-04m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
