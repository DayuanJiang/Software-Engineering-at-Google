<svg xmlns="http://www.w3.org/2000/svg" id="ch08-02m-diagram" class="chapter-svg cg-ch08-02" role="img" aria-labelledby="ch08-02m-title ch08-02m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch08-02m-title">局部惯例：何时优先？</title>
<desc id="ch08-02m-desc">两种冲突不能用同一条无条件优先级解决。若指南允许局部选择，示意文件已有 const int，团队偏好 int const，新增声明沿用文件。反例中两个头文件把 LIMIT 分别定义为 8 和 16，宏名发生冲突。只为项目一致申请去掉项目前缀会被拒绝，A_LIMIT 和 B_LIMIT 展示前缀区分名称的作用。代码与名称均为示意。真正全局用途的宏仍可能获仲裁者批准例外。</desc>
<style>
.cg-ch08-02#ch08-02m-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch08-02#ch08-02m-diagram .strong{font-weight:600}
.cg-ch08-02#ch08-02m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch08-02#ch08-02m-diagram .code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.cg-ch08-02#ch08-02m-diagram .green{fill:var(--diagram-primary,#087f6d)}
.cg-ch08-02#ch08-02m-diagram .red{fill:var(--diagram-danger,#b54750)}
.cg-ch08-02#ch08-02m-diagram .blue{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch08-02#ch08-02m-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch08-02#ch08-02m-diagram .arrow{fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch08-02m-arrow)}
.cg-ch08-02#ch08-02m-diagram .uncertain{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;stroke-dasharray:5 5}
</style>
<defs><marker id="ch08-02m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="39" class="strong">局部惯例：何时优先？</text>
<text x="24" y="70" class="small">两种冲突对照；代码与名称为示意</text>
<text x="24" y="112" class="strong green">局部约定先形成，且允许选择</text>
<text x="24" y="151" class="small">文件已有</text>
<text x="145" y="151" class="code">const int</text>
<text x="24" y="187" class="small">团队偏好</text>
<text x="145" y="187" class="code">int const</text>
<rect id="ch08-02m-box1" x="24" y="207" width="372" height="54" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="38" y="242" class="strong" data-box="ch08-02m-box1">新增声明用 const int</text>
<path class="line" d="M24 285H396"/>
<text x="24" y="321" class="strong red">反例：宏名会跨文件冲突</text>
<text x="24" y="361" class="small">头文件 A</text>
<text x="145" y="361" class="code">#define LIMIT 8</text>
<text x="24" y="395" class="small">头文件 B</text>
<text x="145" y="395" class="code">#define LIMIT 16</text>
<path class="line" d="M142 408V430H390V408"/>
<text x="24" y="465">一起使用：同名却有不同定义。</text>
<text x="24" y="500" class="small">仅为项目一致而申请去掉前缀：</text>
<text x="24" y="534" class="strong red">拒绝；保留 A_LIMIT / B_LIMIT</text>
<path class="line" d="M24 553H396"/>
<text x="24" y="584" class="small">局部一致不能自动豁免全局约束</text>
</svg>
