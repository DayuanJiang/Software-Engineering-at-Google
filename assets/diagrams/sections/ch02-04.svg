<marker id="ch02-04-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch02-04-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
<marker id="ch02-04-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="40" class="strong" text-anchor="start">无责复盘：从原因到改变</text>
<text x="32" y="76" class="small" text-anchor="start">示意事件（非书中案例）：配置变更后服务中断</text>
<g id="ch02-04-record" data-box="32,103,290,208">
<rect x="32" y="103" width="290" height="208" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="1.5"/>
<text x="48" y="136" class="strong" text-anchor="start">记录事实与分析</text>
<text x="48" y="171" class="small" text-anchor="start">时间线：发现、调查、恢复</text>
<text x="48" y="203" class="small" text-anchor="start">影响：服务无法访问</text>
<text x="48" y="244" class="strong" text-anchor="start">查明原因</text>
<text x="48" y="282" class="" text-anchor="start">缺少对该配置的校验</text>
</g>
