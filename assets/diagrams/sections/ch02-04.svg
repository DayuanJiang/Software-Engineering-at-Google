<text x="552.0" y="280.0" class="" text-anchor="middle">补上该配置的校验</text>
<text x="552.0" y="312.0" class="" text-anchor="middle">负责人 B · 预防复发</text>
</g>
<path d="M708 159H741V221H778" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-04-primary-arrow)"/>
<path d="M708 288H741V221" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round"/>
