<rect x="784" y="172" width="144" height="98" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="856.0" y="213.0" class="" text-anchor="middle">实际落实</text>
<text x="856.0" y="245.0" class="" text-anchor="middle">两类行动</text>
</g>
<path d="M177 317V369H396" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-04-secondary-arrow)"/>
<g id="ch02-04-share" data-box="402,349,526,68">
<rect x="402" y="349" width="526" height="68" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="1.5"/>
<text x="665.0" y="391.0" class="" text-anchor="middle">共享事实、原因、教训，让后来者能查阅</text>
</g>
<text x="32" y="457" class="small" text-anchor="start">写下原因不等于改变已经发生；道歉、借口、指责不能替代落实与共享。</text>
