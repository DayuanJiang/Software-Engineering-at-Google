<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch03-01" data-layout="desktop" role="img" aria-labelledby="ch03-01-title ch03-01-desc">
<title id="ch03-01-title">专家与文档相互补充</title>
<desc id="ch03-01-desc">专家帮助判断问题背景和适用资料，文档支持跨团队与跨时间共享，学习者通过提问和更新把经验回馈；心理安全感是共同基础。</desc>
<style>
.cg-ch03-01[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-01[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch03-01[data-layout="desktop"] .strong {font-weight:600}
</style>
<defs><marker id="ch03-01-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker><marker id="ch03-01-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker><marker id="ch03-01-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker><marker id="ch03-01-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong">专家与文档相互补充</text>
<g id="ch03-01-node-1" data-box="32,104,310,112">
<rect x="32" y="104" width="310" height="112" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="187.0" y="136.0" text-anchor="middle" class="strong">专家</text>
<text x="187.0" y="168.0" text-anchor="middle" class="small">了解具体背景</text>
<text x="187.0" y="200.0" text-anchor="middle" class="small">判断资料是否适用</text>
</g>
<g id="ch03-01-node-2" data-box="618,104,310,112">
<rect x="618" y="104" width="310" height="112" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="773.0" y="136.0" text-anchor="middle" class="strong">文档</text>
<text x="773.0" y="168.0" text-anchor="middle" class="small">共享查阅、跨时间留存</text>
<text x="773.0" y="200.0" text-anchor="middle" class="small">持续维护才有用</text>
</g>
<path d="M348 158L612 158" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch03-01-arrow-primary)"/>
<text x="480" y="136" text-anchor="middle" class="small">记录并维护知识</text>
<g id="ch03-01-node-3" data-box="336,303,288,86">
<rect x="336" y="303" width="288" height="86" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="480.0" y="338.0" text-anchor="middle" class="strong">学习者</text>
<text x="480.0" y="370.0" text-anchor="middle" class="small">提问、实践、更新资料</text>
</g>
<path d="M330 346H128V222" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch03-01-arrow-secondary)"/>
<text x="234" y="279" text-anchor="middle" class="small">带着背景提问</text>
<path d="M824 222V346H630" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch03-01-arrow-primary)"/>
<text x="711" y="279" text-anchor="middle" class="small">找到并阅读资料</text>
<text x="32" y="433" text-anchor="start" class="small">共同基础是心理安全感：坦承不知道、友善答疑，让学习者也能成为新的专家。</text>
<text x="32" y="461" text-anchor="start" class="small">知识共享不是在专家与文档之间二选一；两者需要持续配合。</text>
</svg>
