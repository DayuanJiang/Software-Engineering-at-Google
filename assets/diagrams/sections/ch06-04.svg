<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch06-04" data-layout="desktop" role="img" aria-labelledby="ch06-04-title ch06-04-desc">
  <title id="ch06-04-title">再回一封急邮件，谁来做团队战略？</title>
  <desc id="ch06-04-desc">按本章任务例子排列的注意力示意，不是实际日程或工时分布。被动响应路径中，邮件、聊天、会议之后仍有下一封急邮件，等待空闲的战略工作继续被推迟。主动保护路径先留出至少两小时，处理团队战略、领导者职业路径与跨团队协作等重要但不紧急的工作。可交给他人的急事授权，非关键事项有意识地放下。图示不把所有紧急事项判为不重要，不采用原文整理比喻中的比例作统计，也不保证放下的事项必有人接手。</desc>
  <style>
    .cg-ch06-04[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424);}
    .cg-ch06-04[data-layout="desktop"] .strong {font-weight:600;}
    .cg-ch06-04[data-layout="desktop"] .heading {font-size:28px;font-weight:600;}
    .cg-ch06-04[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868);}
    .cg-ch06-04[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);}
    .cg-ch06-04[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);}
    .cg-ch06-04[data-layout="desktop"] .cost {fill:var(--diagram-warm,#a56a1f);}
    .cg-ch06-04[data-layout="desktop"] .blue {fill:var(--diagram-secondary,#2f6eac);}
    .cg-ch06-04[data-layout="desktop"] .edge {fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="ch06-04-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
    <marker id="ch06-04-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
    <marker id="ch06-04-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
    <marker id="ch06-04-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="40" text-anchor="start" class="heading">再回一封急邮件，谁来做团队战略？</text>
  <text x="32" y="74" text-anchor="start" class="small">原文任务的注意力安排示意，不是实际日程或工时分布</text>
  <rect x="32" y="96" width="896" height="56" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-04-work" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="480" y="132" text-anchor="middle" data-box="ch06-04-work">同样的待办：紧急消息、团队战略、领导者发展、跨团队协作</text>
  <text x="32" y="215" text-anchor="start" class="strong bad">被动响应</text>
  <text x="32" y="249" text-anchor="start" class="small">等空闲再规划</text>
  <rect x="240" y="188" width="154" height="66" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-04-email" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="317.0" y="229" text-anchor="middle" data-box="ch06-04-email">邮件</text>
  <rect x="398" y="188" width="154" height="66" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-04-chat" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="475.0" y="229" text-anchor="middle" data-box="ch06-04-chat">聊天</text>
  <rect x="556" y="188" width="154" height="66" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-04-meeting" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="633.0" y="229" text-anchor="middle" data-box="ch06-04-meeting">会议</text>
  <rect x="714" y="188" width="214" height="66" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-04-again" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="821.0" y="229" text-anchor="middle" data-box="ch06-04-again">又一封邮件</text>
  <text x="928" y="286" text-anchor="end" class="bad">团队战略继续等待</text>
  <text x="32" y="356" text-anchor="start" class="strong good">主动保护</text>
  <text x="32" y="389" text-anchor="start" class="small">其他事项不全接</text>
  <rect x="240" y="317" width="688" height="101" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" id="ch06-04-protected" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="260" y="354" text-anchor="start" class="strong" data-box="ch06-04-protected">预留至少 2 小时：重要但不紧急</text>
  <text x="260" y="392" text-anchor="start" class="small" data-box="ch06-04-protected">团队战略 / 领导者职业路径 / 跨团队协作</text>
  <path d="M32 438H928" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="32" y="469" text-anchor="start" class="small">不是忽略所有急事：可交他人的急事授权，非关键事项主动放下</text>
</svg>
