<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch02-02" data-layout="desktop" role="img" aria-labelledby="ch02-02-title ch02-02-desc">
<title id="ch02-02-title">主负责人离开后，谁还能接手？</title>
<desc id="ch02-02-desc">两个示意情境中的主负责人 A 都不可用。只有 A 懂原型时，旧知识路径断开。B 已共同掌握原型时，B 的实线知识路径仍在，文档辅助接手。文档不是第三个人。</desc>
<style>
.cg-ch02-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch02-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch02-02[data-layout="desktop"] .strong {font-weight:600}
.cg-ch02-02[data-layout="desktop"] .primary {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch02-02[data-layout="desktop"] .secondary {fill:var(--diagram-secondary,#2f6eac);font-weight:600}
.cg-ch02-02[data-layout="desktop"] .danger {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch02-02[data-layout="desktop"] .warm {fill:var(--diagram-warm,#a56a1f);font-weight:600}
</style>
<defs>
