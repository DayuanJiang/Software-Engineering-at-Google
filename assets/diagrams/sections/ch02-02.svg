<marker id="ch02-02-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch02-02-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch02-02-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
<marker id="ch02-02-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">主负责人离开后，谁还能接手？</text>
<text x="32" y="78" class="small" text-anchor="start">同一项变化：主负责人 A 不可用；连线表示能解释原型的知识路径。</text>
<text x="32" y="125" class="danger" text-anchor="start">只有 A 懂原型</text>
<text x="516" y="125" class="primary" text-anchor="start">A、B 已共同掌握原型</text>
<path d="M480 108V403" class="connector" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<g id="ch02-02-a-0" data-box="32,151,180,76">
<rect x="32" y="151" width="180" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="122.0" y="181.0" class="" text-anchor="middle">A：主负责人</text>
<text x="122.0" y="213.0" class="" text-anchor="middle">已不可用</text>
</g>
<path d="M40 159L204 219" class="unavailable" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<g id="ch02-02-b-0" data-box="258,151,180,76">
<rect x="258" y="151" width="180" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="348.0" y="181.0" class="" text-anchor="middle">B：其他成员</text>
<text x="348.0" y="213.0" class="" text-anchor="middle">不懂此原型</text>
</g>
