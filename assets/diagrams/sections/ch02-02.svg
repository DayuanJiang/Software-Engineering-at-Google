<path d="M112 261L132 277M132 261L112 277" class="cut" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
<text x="238" y="398" class="danger" text-anchor="middle">没有可用的知情者路径</text>
<g id="ch02-02-a-484" data-box="516,151,180,76">
<rect x="516" y="151" width="180" height="76" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="606.0" y="181.0" class="" text-anchor="middle">A：主负责人</text>
<text x="606.0" y="213.0" class="" text-anchor="middle">已不可用</text>
</g>
<path d="M524 159L688 219" class="unavailable" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<g id="ch02-02-b-484" data-box="742,151,180,76">
<rect x="742" y="151" width="180" height="76" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="832.0" y="181.0" class="" text-anchor="middle">B：后备负责人</text>
<text x="832.0" y="213.0" class="" text-anchor="middle">确实理解原型</text>
</g>
<g id="ch02-02-prototype-484" data-box="605,303,230,66">
<rect x="605" y="303" width="230" height="66" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="720.0" y="344.0" class="" text-anchor="middle">原型后续工作</text>
</g>
<path d="M606 233V257M606 281V290H720" class="connector" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M596 261L616 277M616 261L596 277" class="cut" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
<path d="M832 233V278H780V297" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch02-02-primary-arrow)"/>
<text x="738" y="398" class="small" text-anchor="middle">文档可查，辅助 B 接手</text>
<text x="32" y="446" class="small" text-anchor="start">仅任命后备不够：右侧的前提是 B 已经掌握了知识。</text>
</svg>
