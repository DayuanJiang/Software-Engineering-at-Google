<title id="ch02-01m-title">同一个设计缺陷，何时才能被看见？</title>
<desc id="ch02-01m-desc">原文变速器故事中，原型一直保密，数月后邻居才有机会指出简单缺陷。书中反事实是早些展示，也许第一周就能解决。两条路径比较检查入口，不表示实测工期。</desc>
