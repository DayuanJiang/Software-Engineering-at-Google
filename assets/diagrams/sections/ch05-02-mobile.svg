<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch05-02" data-layout="mobile" role="img" aria-labelledby="ch05-02m-title ch05-02m-desc">
  <title id="ch05-02m-title">用限期指导，让差距可见</title>
  <desc id="ch05-02m-desc">发现表现未达预期后，若只等待且问题未改善，同伴仍需补位。另一条路径是约定期限及小、递进、可衡量目标，每周比较实际进展与预定目标；达标后明确下一里程碑，未达标时双方尽早看见差距。两个月只是原书示例，不是自动离职规则。</desc>
  <style>
.cg-ch05-02[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-02[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch05-02[data-layout="mobile"] .strong {font-weight:600}
.cg-ch05-02[data-layout="mobile"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
  <defs>
    <marker id="ch05-02m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch05-02m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch05-02m-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch05-02m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)" />
  <g id="ch05-02m-heading" data-box="24,12,372,72">
    <text x="24" y="38" class="strong" text-anchor="start">用限期指导，让差距可见</text>
    <text x="24" y="72" class="small" text-anchor="start">起点：已经发现表现未达预期</text>
  </g>
  <g id="ch05-02m-waiting" data-box="24,94,372,92">
    <rect x="24" y="94" width="372" height="92" fill="var(--diagram-danger-soft,#faecee)" />
    <text x="40" y="124" class="strong" text-anchor="start">等待自行改善</text>
    <text x="40" y="163" class="small" text-anchor="start">若未改善，其他成员仍须补位</text>
  </g>
  <g id="ch05-02m-goals" data-box="24,213,372,82">
    <rect x="24" y="213" width="372" height="82" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="40" y="244" class="strong" text-anchor="start">约定期限（如两个月）</text>
    <text x="40" y="279" class="small" text-anchor="start">目标要小、递进、可衡量</text>
  </g>
  <polyline points="210,300 210,331" class="connector" stroke="var(--diagram-primary,#087f6d)" data-connector="true" marker-end="url(#ch05-02m-arrow-primary)" />
  <g id="ch05-02m-check" data-box="24,337,372,80">
    <rect x="24" y="337" width="372" height="80" fill="var(--diagram-secondary-soft,#eaf1fa)" />
    <text x="210" y="368" class="strong" text-anchor="middle">每周：实际进展 vs 预定目标</text>
    <text x="210" y="401" class="small" text-anchor="middle">双方对照同一里程碑</text>
  </g>
  <polyline points="210,422 210,442 110,442 110,460" class="connector" stroke="var(--diagram-primary,#087f6d)" data-connector="true" marker-end="url(#ch05-02m-arrow-primary)" />
  <polyline points="210,442 310,442 310,460" class="connector" stroke="var(--diagram-warm,#a56a1f)" data-connector="true" marker-end="url(#ch05-02m-arrow-warm)" />
  <g id="ch05-02m-met" data-box="24,466,172,64">
    <rect x="24" y="466" width="172" height="64" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="110" y="491" class="strong" text-anchor="middle">达标</text>
    <text x="110" y="518" class="small" text-anchor="middle">明确下个里程碑</text>
  </g>
  <g id="ch05-02m-unmet" data-box="224,466,172,64">
    <rect x="224" y="466" width="172" height="64" fill="var(--diagram-warm-soft,#fff3dc)" />
    <text x="310" y="491" class="strong" text-anchor="middle">未达标</text>
    <text x="310" y="518" class="small" text-anchor="middle">尽早看清差距</text>
  </g>
  <polyline points="24,498 12,498 12,377 20,377" class="connector" stroke="var(--diagram-secondary,#2f6eac)" data-connector="true" marker-end="url(#ch05-02m-arrow-secondary)" />
  <g id="ch05-02m-limits" data-box="24,543,372,54">
    <text x="24" y="565" class="small" text-anchor="start">指导须限期且尊重对方。</text>
    <text x="24" y="591" class="small" text-anchor="start">未达标不等于自动离职。</text>
  </g>
</svg>
