<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch04-03" data-layout="desktop" role="img" aria-labelledby="ch04-03-title ch04-03-desc">
<title id="ch04-03-title">旧岗位低评分，能否决定新岗位资格？</title>
<desc id="ch04-03-desc">本章内部流动案例：招聘方提议，员工表达转组意向时就突出显示历史低评级。工程师质疑旧岗位评价是否能预测新岗位表现。调查发现，转组后曾获低评级和从无低评级的候选人，获得满意或卓越评级的可能性相当，原文未给数值。因此不应据此判断新团队资格，但可审视当前岗位匹配与支持需求。同时仍须审视个人偏见与跨组织标准；这些问题不是公平保证。</desc>
<style>
.cg-ch04-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch04-03[data-layout="desktop"] .strong {font-weight:600}
</style>
<defs>
<marker id="ch04-03-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch04-03-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch04-03-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch04-03-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong">旧岗位低评分，能否决定新岗位资格？</text>
<text x="32" y="79" text-anchor="start" class="small">招聘方的提效请求：转组意向一提交，就突出显示历史低评级。</text>
<g id="ch04-03-old-role" data-box="32,111,288,91">
<rect x="32" y="111" width="288" height="91" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="176" y="145" text-anchor="middle" class="">旧岗位、受评期间</text>
<text x="176" y="181" text-anchor="middle" class="strong">低绩效评级</text>
</g>
<text x="480" y="139" text-anchor="middle" class="strong">不能据此外推</text>
<polyline data-connector="true" points="327,173 463,173" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
<polyline data-connector="true" points="496,173 633,173" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04-03-arrow-danger)"/>
<polyline data-connector="true" points="471,165 486,181" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<polyline data-connector="true" points="486,165 471,181" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="3" stroke-linejoin="round"/>
<g id="ch04-03-new-role" data-box="640,111,288,91">
<rect x="640" y="111" width="288" height="91" rx="6" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="784" y="145" text-anchor="middle" class="">新团队、未来岗位</text>
<text x="784" y="181" text-anchor="middle" class="strong">不应据此判断资格</text>
</g>
<text x="32" y="246" text-anchor="start" class="strong">书中调查：转组之后，两组候选人的结果如何？</text>
<g id="ch04-03-prior-low" data-box="32,267,239,38">
<text x="50" y="294" text-anchor="start" class="">曾获低评级</text>
</g>
<g id="ch04-03-no-prior-low" data-box="32,309,239,38">
<text x="50" y="336" text-anchor="start" class="">从无低评级</text>
</g>
<polyline data-connector="true" points="208,286 290,286 290,328 208,328" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round"/>
<polyline data-connector="true" points="290,307 330,307" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round"/>
<g id="ch04-03-comparison" data-box="342,266,586,83">
<rect x="342" y="266" width="586" height="83" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="635" y="299" text-anchor="middle" class="strong">获满意或卓越评级的可能性相当</text>
<text x="635" y="331" text-anchor="middle" class="small">原文未给数值；不保证某个人的表现</text>
</g>
<g id="ch04-03-valid-use" data-box="32,365,896,52">
<rect x="32" y="365" width="896" height="52" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="480" y="399" text-anchor="middle" class="">仍可用：审视当前岗位匹配与支持需求</text>
</g>
<text x="32" y="444" text-anchor="start" class="small">这是本章内部流动案例，不是关于所有绩效指标的普遍定律。</text>
<text x="32" y="471" text-anchor="start" class="small">预测效力、个人偏见、跨组织标准均须审视；全答“是”也不证明公平。</text>
</svg>
