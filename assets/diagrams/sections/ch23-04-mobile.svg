<svg xmlns="http://www.w3.org/2000/svg" id="ch23-04m-root" class="chapter-svg cg-ch23-04" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch23-04m-title ch23-04m-desc">
  <title id="ch23-04m-title">Takeout：用成对结果缩小排查范围</title>
  <desc id="ch23-04m-desc">书中 Takeout 在提交后 CI 的新二进制与生产二进制上持续运行同一套测试，两边连接相同真实后端。图中四条归档测试的红绿组合都是解释用假设结果，不是历史测量。仅 CI 失败可优先检查新构建及环境差异；两边失败表明生产中也可观察到问题；仅生产失败可调查生产侧差异；两边通过只说明本项本次通过。这些对照不能自动证明上游或某次提交是根因。录制／重放在此案例中仍是未来改进。</desc>
  <style>
  .cg-ch23-04#ch23-04m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
  .cg-ch23-04#ch23-04m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
  .cg-ch23-04#ch23-04m-root .strong {font-weight:600}
  .cg-ch23-04#ch23-04m-root .good {fill:var(--diagram-primary,#087f6d)}
  .cg-ch23-04#ch23-04m-root .bad {fill:var(--diagram-danger,#b54750)}
  .cg-ch23-04#ch23-04m-root .pending {fill:var(--diagram-warm,#a56a1f)}
  </style>
  <defs><marker id="ch23-04m-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#686868)"/></marker></defs>
  <rect x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)"/>
  <text x="24" y="36" class="strong" data-box="16,8,388,584">Takeout：用成对结果缩小范围</text>
  <text x="24" y="70" class="small" data-box="16,8,388,584">同一套测试；下方结果均为示意</text>
  <rect x="24" y="88" width="176" height="70" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <rect x="220" y="88" width="176" height="70" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="38" y="116" class="strong" data-box="24,88,176,70">提交后 CI</text>
  <text x="38" y="145" class="small" data-box="24,88,176,70">新二进制</text>
  <text x="234" y="116" class="strong" data-box="220,88,176,70">生产</text>
  <text x="234" y="145" class="small" data-box="220,88,176,70">生产二进制</text>
  <path d="M112 160L112 181" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" data-connector="true" marker-end="url(#ch23-04m-arrow)"/>
  <path d="M308 160L308 181" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" data-connector="true" marker-end="url(#ch23-04m-arrow)"/>
  <rect x="24" y="186" width="372" height="39" fill="var(--diagram-warm-soft,#fff3dc)"/>
  <text x="210" y="213" class="strong" data-box="24,186,372,39" text-anchor="middle">两边连接相同真实后端</text>
  <text x="38" y="256" class="small strong" data-box="16,8,388,584">测试项</text>
  <text x="246" y="256" class="small strong" data-box="16,8,388,584">CI</text>
  <text x="322" y="256" class="small strong" data-box="16,8,388,584">生产</text>
  <rect x="24" y="269" width="372" height="61" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <text x="38" y="294" class="" data-box="24,269,192,31">照片归档</text>
  <text x="246" y="294" class="bad" data-box="235,269,65,31">失败</text>
  <text x="322" y="294" class="good" data-box="311,269,76,31">通过</text>
  <text x="38" y="323" class="small" data-box="24,299,372,31">查新构建及环境差异</text>
  <text x="38" y="355" class="" data-box="24,330,192,31">邮件归档</text>
  <text x="246" y="355" class="bad" data-box="235,330,65,31">失败</text>
  <text x="322" y="355" class="bad" data-box="311,330,76,31">失败</text>
  <text x="38" y="384" class="small" data-box="24,360,372,31">生产也有此问题，查共享因素</text>
  <rect x="24" y="391" width="372" height="61" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <text x="38" y="416" class="" data-box="24,391,192,31">文件夹归档</text>
  <text x="246" y="416" class="good" data-box="235,391,65,31">通过</text>
  <text x="322" y="416" class="bad" data-box="311,391,76,31">失败</text>
  <text x="38" y="445" class="small" data-box="24,421,372,31">查生产侧差异</text>
  <text x="38" y="477" class="" data-box="24,452,192,31">联系人归档</text>
  <text x="246" y="477" class="good" data-box="235,452,65,31">通过</text>
  <text x="322" y="477" class="good" data-box="311,452,76,31">通过</text>
  <text x="38" y="506" class="small" data-box="24,482,372,31">只说明此项本次通过</text>
  <text x="24" y="549" class="small" data-box="16,8,388,584">对照不是根因证明，不能直接归责上游</text>
  <text x="24" y="580" class="small" data-box="16,8,388,584">本案例：录制／重放仍是未来改进</text>
</svg>
