<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch13-01" data-layout="mobile" role="img" aria-labelledby="ch13-01m-title ch13-01m-desc">
<title id="ch13-01m-title">替身返回 true，过期卡为什么仍返回 false？</title>
<desc id="ch13-01m-desc">由构造函数传入同一 CreditCardService 接口的替身，再跟踪 makePayment 的过期判断：过期卡直接返回 false，未调用扣款；有效卡才调用始终返回 true 的替身。 0次和1次由例13-1的单次调用路径推导，不是书中另加的 verify 断言。有效卡 true 是该替身的响应，不是真实扣款证据；图不推荐把此替身用于所有支付测试。</desc>
<style>
.cg-ch13-01[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch13-01[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch13-01[data-layout="mobile"] .strong {font-weight:600}
.cg-ch13-01[data-layout="mobile"] .good {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch13-01[data-layout="mobile"] .bad {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch13-01[data-layout="mobile"] .rule {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch13-01[data-layout="mobile"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch13-01m-arrow)}
</style>
<defs><marker id="ch13-01m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect id="ch13-01m-region-1" x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="36" text-anchor="start" class="strong">替身返回 true，</text>
<text x="24" y="66" text-anchor="start" class="strong">过期卡为什么仍返回 false？</text>
<rect id="ch13-01m-region-2" x="24" y="92" width="372" height="102" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="40" y="122" text-anchor="start" class="small" data-fit="ch13-01m-region-2">new PaymentProcessor(service)</text>
<text x="40" y="155" text-anchor="start" class="small" data-fit="ch13-01m-region-2">service：扣款始终返回 true</text>
<text x="40" y="182" text-anchor="start" class="small" data-fit="ch13-01m-region-2">由 CreditCardService 接口传入</text>
<text x="24" y="229" text-anchor="start" class="strong">makePayment(card, amount)</text>
<rect id="ch13-01m-region-3" x="24" y="250" width="372" height="117" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="40" y="280" text-anchor="start" class="strong" data-fit="ch13-01m-region-3">过期卡：isExpired() = true</text>
<text x="40" y="314" text-anchor="start" class="good" data-fit="ch13-01m-region-3">return false</text>
<text x="249" y="314" text-anchor="start" class="" data-fit="ch13-01m-region-3">0 次扣款</text>
<text x="40" y="349" text-anchor="start" class="small" data-fit="ch13-01m-region-3">提前返回；断言 success 为 false</text>
<rect id="ch13-01m-region-4" x="24" y="387" width="372" height="128" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="40" y="419" text-anchor="start" class="strong" data-fit="ch13-01m-region-4">有效卡：isExpired() = false</text>
<text x="40" y="453" text-anchor="start" class="" data-fit="ch13-01m-region-4">chargeCreditCard(...) → true</text>
<text x="40" y="490" text-anchor="start" class="" data-fit="ch13-01m-region-4">return true；1 次扣款</text>
<text x="24" y="550" text-anchor="start" class="small">以上路径不能证明真实扣款成功。</text>
</svg>
