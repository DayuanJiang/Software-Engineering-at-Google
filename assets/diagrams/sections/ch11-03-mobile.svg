<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch11-03" data-layout="mobile" role="img" aria-labelledby="ch11-03m-title ch11-03m-desc">
<title id="ch11-03m-title">规模与范围：相关但不等同</title>
<desc id="ch11-03m-desc">用源文中的服务器端点和日期选择器两个反例，分别定位小型但广范围、中型但窄范围的测试；范围指验证目标，不是执行过的代码。</desc>
<style>
.cg-ch11-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch11-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch11-03[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs><marker id="ch11-03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" text-anchor="start" class="strong" data-font-size="22">规模与范围是两个维度</text>
<text x="24" y="68" text-anchor="start" class="small" data-font-size="19">范围看验证目标，不看执行了多少代码</text>
<text x="24" y="110" text-anchor="start" class="strong" data-font-size="22">规模：运行资源与限制</text>
<text x="24" y="144" text-anchor="start" class="strong" data-font-size="22">范围：被验证的行为与代码</text>
<rect x="24" y="189" width="372" height="153" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
<text x="40" y="221" text-anchor="start" class="strong" data-font-size="22">小型 + 广范围：服务器端点</text>
<text x="40" y="254" text-anchor="start" class="small" data-font-size="19">验证解析、请求校验、业务逻辑</text>
<text x="40" y="281" text-anchor="start" class="small" data-font-size="19">用替身替换全部进程外依赖</text>
<text x="40" y="308" text-anchor="start" class="small" data-font-size="19">仍在单个进程内运行</text>
<rect x="24" y="366" width="372" height="153" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
<text x="40" y="398" text-anchor="start" class="strong" data-font-size="22">中型 + 窄范围：日期选择器</text>
<text x="40" y="431" text-anchor="start" class="small" data-font-size="19">只验证组件的一条代码路径</text>
<text x="40" y="458" text-anchor="start" class="small" data-font-size="19">却需要运行整个浏览器</text>
<text x="40" y="485" text-anchor="start" class="small" data-font-size="19">因此可能需要多个进程</text>
<text x="24" y="561" text-anchor="start" class="small" data-font-size="19">小型不等于单元；中型不等于集成。</text>
</svg>
