<svg xmlns="http://www.w3.org/2000/svg" id="ch25-01m-root" class="chapter-svg cg-ch25-01" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch25-01m-title ch25-01m-desc">
<title id="ch25-01m-title">装箱解决放置，隔离约束越界</title>
<desc id="ch25-01m-desc">示例：日志分析声明 CPU 和 RAM 需求，调度器排除磁盘故障的机器甲，选择健康机器乙。在同机运行时，只有需求声明不能阻止日志分析超用 CPU，使搜索服务变慢；实际执行的资源限制才约束越界使用。RAM 耗尽还可能使进程被内核终止，或因磁盘交换变慢。隔离是额外职责，不能由成功放置推导出完整隔离或零干扰。</desc>
<style>
.cg-ch25-01#ch25-01m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-01#ch25-01m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch25-01#ch25-01m-root .strong {font-weight:600}
.cg-ch25-01#ch25-01m-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch25-01m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch25-01m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch25-01m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch25-01m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch25-01m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)" stroke="none" stroke-width="1.5"/>
<text x="20" y="38" text-anchor="start" class="strong">装箱解决放置，隔离约束越界</text>
<text x="20" y="74" text-anchor="start" class="small">日志分析与搜索服务共用机器（示例）</text>
<rect x="20" y="98" width="380" height="86" rx="0" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="none" stroke-width="1.5"/>
<text x="36" y="129" text-anchor="start" class="strong" data-box="20,98,380,86">日志分析声明 CPU、RAM</text>
<text x="36" y="162" text-anchor="start" class="small" data-box="20,98,380,86">放到健康乙；磁盘故障甲不接新作业</text>
<text x="20" y="220" text-anchor="start" class="strong">只有声明：仍会争抢</text>
<rect x="20" y="244" width="136" height="64" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="88" y="284" text-anchor="middle" class="" data-box="20,244,136,64">日志分析</text>
<rect x="252" y="244" width="148" height="64" rx="0" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="326" y="284" text-anchor="middle" class="" data-box="252,244,148,64">搜索变慢</text>
<path data-connector="true" d="M156 276H242" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" marker-end="url(#ch25-01m-danger-arrow)"/>
<text x="204" y="256" text-anchor="middle" class="small danger">CPU 超用</text>
<text x="20" y="354" text-anchor="start" class="strong">执行限制：约束越界使用</text>
<rect x="20" y="378" width="136" height="64" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="88" y="418" text-anchor="middle" class="" data-box="20,378,136,64">日志分析</text>
<rect x="252" y="378" width="148" height="64" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="326" y="418" text-anchor="middle" class="" data-box="252,378,148,64">搜索服务</text>
<path data-connector="true" d="M156 410H202" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch25-01m-warm-arrow)"/>
<path data-connector="true" d="M214 379V443M222 379V443" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="3"/>
<text x="218" y="475" text-anchor="middle" class="small">实际资源边界</text>
<text x="20" y="518" text-anchor="start" class="small">RAM 耗尽还可能导致进程被终止，</text>
<text x="20" y="548" text-anchor="start" class="small">或因磁盘交换变慢。</text>
<text x="20" y="581" text-anchor="start" class="strong">声明资源不等于已经隔离。</text>
</svg>
