<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch12-03" data-layout="mobile" role="img" aria-labelledby="ch12-03m-title ch12-03m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch12-03m-title">一个方法，拆出两项行为测试</title>
<desc id="ch12-03m-desc">按例12-8的代码条件分别测试商品消息和低余额警告。两测试各自调用displayTransactionResults。示意删除警告时，商品名测试仍通过，低余额警告测试失败；方法名本身不能区分这两项行为。低余额直接设为小于阈值，不沿用例12-9/10与方法片段不一致的加2再花3设置。例12-11的转账需要同时断言两个账户余额，说明单一行为不等于单一断言。</desc>
<style>
.cg-ch12-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0}
.cg-ch12-03[data-layout="mobile"] .small {font-size:19px}
.cg-ch12-03[data-layout="mobile"] .strong {font-weight:600}
</style>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="24 372">一个方法，拆出两项行为测试</text>
<text x="24" y="68" class="small" text-anchor="start" fill="var(--diagram-muted,#686868)" data-font-size="19" data-lane="24 372">例12-8/10；低余额直接设为小于阈值</text>
<text x="24" y="103" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">两项测试各自调用：</text>
<text x="24" y="130" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">displayTransactionResults(...)</text>
<rect x="24" y="149" width="372" height="61" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" data-region="true"/>
<text x="40" y="174" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 340">示意变更：删去低余额警告，</text>
<text x="40" y="200" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 340">但保留商品消息</text>
<rect x="24" y="227" width="372" height="133" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" data-region="true"/>
<text x="40" y="255" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 340">行为 A：显示商品名</text>
<text x="40" y="287" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 340">给定：商品 Some Item</text>
<text x="40" y="318" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 340">则：消息包含 Some Item</text>
<text x="40" y="347" class="strong" text-anchor="start" fill="var(--diagram-primary,#087f6d)" data-font-size="22" data-lane="40 340">变更后：通过</text>
<rect x="24" y="376" width="372" height="133" rx="6" fill="var(--diagram-danger-soft,#faecee)" data-region="true"/>
<text x="40" y="404" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 340">行为 B：低余额警告</text>
<text x="40" y="436" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 340">给定：余额 &lt; 阈值</text>
<text x="40" y="467" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 340">则：消息包含余额不足警告</text>
<text x="40" y="496" class="strong" text-anchor="start" fill="var(--diagram-danger,#b54750)" data-font-size="22" data-lane="40 340">变更后：失败</text>
<text x="24" y="540" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">例12-11：转账 100，</text>
<text x="24" y="566" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">余额 150 / 20 变为 50 / 120。</text>
<text x="24" y="592" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">两条余额断言仍验证同一个行为。</text>
</svg>
