<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch12-02" data-layout="mobile" role="img" aria-labelledby="ch12-02m-title ch12-02m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch12-02m-title">同一次创建，两种断言，两类错误</title>
<desc id="ch12-02m-desc">例12-4/5：调用createUser(&quot;foobar&quot;)后，交互断言仅核对database.put(&quot;foobar&quot;)，状态断言检查getUser(&quot;foobar&quot;)非空。等价写入改用另一API时，交互断言误报失败而状态通过；写入后误删记录时，交互断言漏报缺陷而状态失败。insert只是替代API的示意名称。</desc>
<style>
.cg-ch12-02[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0}
.cg-ch12-02[data-layout="mobile"] .small {font-size:19px}
.cg-ch12-02[data-layout="mobile"] .strong {font-weight:600}
</style>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="24 372">同一次创建，两种断言</text>
<text x="24" y="68" class="small" text-anchor="start" fill="var(--diagram-muted,#686868)" data-font-size="19" data-lane="24 372">例12-4/5；insert 为等价 API 示意</text>
<text x="24" y="108" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="24 372">createUser(&quot;foobar&quot;)</text>
<text x="24" y="148" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">交互：核对 put 调用</text>
<text x="24" y="180" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">状态：getUser(&quot;foobar&quot;) 非空</text>
<text x="40" y="225" class="strong" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 168">步骤与结果</text>
<text x="255" y="225" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="218.0 74">交互</text>
<text x="348" y="225" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="311.0 74">状态</text>
<rect x="24" y="243" width="372" height="81" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" data-region="true"/>
<text x="40" y="275" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 170">put</text>
<text x="40" y="307" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 170">用户存在</text>
<text x="255" y="275" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="218.0 74">通过</text>
<text x="348" y="275" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="311.0 74">通过</text>
<rect x="24" y="333" width="372" height="94" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" data-region="true"/>
<text x="40" y="365" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 170">改用等价 insert</text>
<text x="40" y="397" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 170">用户存在</text>
<text x="255" y="365" class="strong" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="22" data-lane="218.0 74">失败</text>
<text x="348" y="365" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="311.0 74">通过</text>
<text x="255" y="397" class="small" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="19" data-lane="218.0 74">误报</text>
<rect x="24" y="437" width="372" height="94" rx="6" fill="var(--diagram-danger-soft,#faecee)" data-region="true"/>
<text x="40" y="469" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="40 170">put 后误删</text>
<text x="40" y="501" class="" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="40 170">用户不存在</text>
<text x="255" y="469" class="strong" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="22" data-lane="218.0 74">通过</text>
<text x="348" y="469" class="strong" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="22" data-lane="311.0 74">失败</text>
<text x="255" y="501" class="small" text-anchor="middle" fill="var(--diagram-danger,#b54750)" data-font-size="19" data-lane="218.0 74">漏报</text>
<text x="348" y="501" class="small" text-anchor="middle" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="311.0 74">检出</text>
<text x="24" y="566" class="small" text-anchor="start" fill="var(--diagram-ink,#242424)" data-font-size="19" data-lane="24 372">调用记录与最终状态不是同一事实。</text>
</svg>
