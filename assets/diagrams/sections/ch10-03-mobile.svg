<svg xmlns="http://www.w3.org/2000/svg" id="ch10-03m-diagram" class="chapter-svg cg-ch10-03" role="img" aria-labelledby="ch10-03m-title ch10-03m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch10-03m-title">下一步，究竟轮到谁操作？</title>
<desc id="ch10-03m-desc">对照原书教程第3至7步，省略下载与复制两步。原第3步执行脚本；第4、5步认证和建 baz 是系统响应，并入改后第3步的从属说明，不再编号。原第6步测试 baz 和第7步输入 SQL 是一次用户操作，合并为改后第4步。只给用户动作编号，命令单独列行。显示的 cd ~; foobar.sh 和 CREATE DATABASE my_foobar_db; 是原书片段，仅作为文字展示，未执行。图不是完整可执行指南；如果描述服务器生命周期，编号视角可以不同。</desc>
<style>
.cg-ch10-03#ch10-03m-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch10-03#ch10-03m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch10-03#ch10-03m-diagram .heading{font-size:24px;font-weight:600}
.cg-ch10-03#ch10-03m-diagram .strong{font-weight:600}
.cg-ch10-03#ch10-03m-diagram .code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.cg-ch10-03#ch10-03m-diagram .good{fill:var(--diagram-primary,#087f6d)}
.cg-ch10-03#ch10-03m-diagram .bad{fill:var(--diagram-danger,#b54750)}
.cg-ch10-03#ch10-03m-diagram .system{fill:var(--diagram-secondary,#2f6eac)}
</style>
<defs><marker id="ch10-03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.6"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="heading" text-anchor="start">下一步，究竟轮到谁操作？</text>
<text x="24" y="69" class="small" text-anchor="start">原例第3至7步：只编号用户操作</text>
<rect x="24" y="91" width="372" height="177" rx="6" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="36" y="119" class="small strong bad" text-anchor="start" data-bounds="36 99 348 161">原例：编号混进系统响应</text>
<text x="36" y="150" class="small" text-anchor="start" data-bounds="36 99 348 161">3. 执行脚本</text>
<text x="36" y="181" class="small system" text-anchor="start" data-bounds="36 99 348 161">4. 系统认证；5. 系统建 baz</text>
<text x="36" y="212" class="small" text-anchor="start" data-bounds="36 99 348 161">6. 测试 baz；7. 输入 SQL</text>
<text x="36" y="246" class="small bad" text-anchor="start" data-bounds="36 99 348 161">响应被当作操作，同一操作被拆开。</text>
<text x="24" y="308" class="strong" text-anchor="start">改后：动作与响应分开</text>
<circle cx="42" cy="348" r="16" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="42" y="355" class="strong good" text-anchor="middle" data-bounds="26 332 32 32">3</text>
<text x="66" y="355" class="strong" text-anchor="start">执行脚本</text>
<text x="66" y="386" class="code small" text-anchor="start">cd ~; foobar.sh</text>
<path d="M42 373V435H56" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" data-connector="true"/>
<rect x="64" y="403" width="332" height="66" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="78" y="430" class="small system" text-anchor="start" data-bounds="78 409 304 54">认证通过后建 baz、打开 shell</text>
<text x="78" y="457" class="small" text-anchor="start" data-bounds="78 409 304 54">系统响应，无须另一步操作</text>
<circle cx="42" cy="500" r="16" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="42" y="507" class="strong good" text-anchor="middle" data-bounds="26 484 32 32">4</text>
<text x="66" y="507" class="strong" text-anchor="start">输入 SQL（一个操作）</text>
<text x="66" y="536" class="code small" text-anchor="start">baz:$</text>
<text x="66" y="563" class="code small" text-anchor="start">CREATE DATABASE my_foobar_db;</text>
<text x="24" y="592" class="small" text-anchor="start">命令为原书展示片段，未执行。</text>
</svg>
