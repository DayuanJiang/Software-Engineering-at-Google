<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch06-03" data-layout="desktop" role="img" aria-labelledby="ch06-03-title ch06-03-desc">
  <title id="ch06-03-title">20 分钟能修好，为什么还要交给别人？</title>
  <desc id="ch06-03-desc">本章假设你可以用二十分钟解决一个长期困扰的问题，另一个领导者也能做，但可能更慢。在并非只有你能做、也并非真正刻不容缓的前提下，对比两条路径：自己做很快，却没有给别人练习，下一次类似任务仍可能依赖你；授权并按需辅导，允许失败和重试，本次可能较慢，却让其他领导者练习独立承担同类工作。若前提改变，就不能机械套用这条授权路径；没有给出别人耗时或成功率。</desc>
  <style>
    .cg-ch06-03[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424);}
    .cg-ch06-03[data-layout="desktop"] .strong {font-weight:600;}
    .cg-ch06-03[data-layout="desktop"] .heading {font-size:28px;font-weight:600;}
    .cg-ch06-03[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868);}
    .cg-ch06-03[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);}
    .cg-ch06-03[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);}
    .cg-ch06-03[data-layout="desktop"] .cost {fill:var(--diagram-warm,#a56a1f);}
    .cg-ch06-03[data-layout="desktop"] .blue {fill:var(--diagram-secondary,#2f6eac);}
    .cg-ch06-03[data-layout="desktop"] .edge {fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="ch06-03-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
    <marker id="ch06-03-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
    <marker id="ch06-03-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
    <marker id="ch06-03-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="40" text-anchor="start" class="heading">20 分钟能修好，为什么还要交给别人？</text>
  <text x="32" y="74" text-anchor="start" class="small">书中设问：一个长期困扰的问题，你做很快，别人能做但会更慢</text>
  <rect x="32" y="96" width="896" height="54" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" id="ch06-03-condition"/>
  <text x="480" y="131" text-anchor="middle" class="strong" data-box="ch06-03-condition">前提：不是只有你能做，而且并非刻不容缓</text>
  <path d="M480 175V414" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="48" y="195" text-anchor="start" class="strong bad">只看这次速度</text>
  <text x="520" y="195" text-anchor="start" class="strong good">把这次当作培养机会</text>
  <rect x="48" y="217" width="392" height="70" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-03-self" stroke="var(--diagram-danger,#b54750)" stroke-width="2"/>
  <text x="244" y="260" text-anchor="middle" class="strong" data-box="ch06-03-self">你亲手修好：约 20 分钟</text>
  <text x="48" y="324" text-anchor="start" class="small">没有给他人这次练习机会</text>
  <path d="M428 287V340" class="edge" stroke="var(--diagram-danger,#b54750)" marker-end="url(#ch06-03-danger)" stroke-dasharray="6 5"/>
  <rect x="48" y="350" width="392" height="62" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-03-dependency" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="244" y="389" text-anchor="middle" data-box="ch06-03-dependency">下次类似任务仍可能找你</text>
  <path d="M48 381H24V252H40" class="edge" stroke="var(--diagram-danger,#b54750)" marker-end="url(#ch06-03-danger)" stroke-dasharray="6 5"/>
  <rect x="520" y="217" width="384" height="70" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" id="ch06-03-delegate" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="712" y="248" text-anchor="middle" class="strong" data-box="ch06-03-delegate">他来做，你按需辅导</text>
  <text x="712" y="274" text-anchor="middle" class="small" data-box="ch06-03-delegate">允许失败，再尝试</text>
  <text x="520" y="324" text-anchor="start" class="small">本次可能更慢</text>
  <path d="M892 287V340" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06-03-primary)"/>
  <rect x="520" y="350" width="384" height="62" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-03-practice" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="712" y="389" text-anchor="middle" data-box="ch06-03-practice">练习独立承担同类工作</text>
  <path d="M32 434H928" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="32" y="466" text-anchor="start" class="small">只有你能做，或确实刻不容缓时，就不能机械套用这条授权路径</text>
</svg>
