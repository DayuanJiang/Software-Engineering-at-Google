<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch06-02" data-layout="desktop" role="img" aria-labelledby="ch06-02-title ch06-02-desc">
  <title id="ch06-02-title">为什么只优化代码，延迟还会回来？</title>
  <desc id="ch06-02-desc">搜索的质量改动持续增加代码和页面复杂度，从而累积延迟，抵消已有代码的提速收益。因此，症状侧团队优化已有代码，成因侧团队同时补足指标、延迟分析工具、开发者培训与文档。两条回指箭头表示两组工作针对不同作用点，不表示先后执行或确保完全消除延迟。分配的是问题域，不是固定解决方案，也不表示恰好有两个实际团队。</desc>
  <style>
    .cg-ch06-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424);}
    .cg-ch06-02[data-layout="desktop"] .strong {font-weight:600;}
    .cg-ch06-02[data-layout="desktop"] .heading {font-size:28px;font-weight:600;}
    .cg-ch06-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868);}
    .cg-ch06-02[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);}
    .cg-ch06-02[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);}
    .cg-ch06-02[data-layout="desktop"] .cost {fill:var(--diagram-warm,#a56a1f);}
    .cg-ch06-02[data-layout="desktop"] .blue {fill:var(--diagram-secondary,#2f6eac);}
    .cg-ch06-02[data-layout="desktop"] .edge {fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="ch06-02-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
    <marker id="ch06-02-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
    <marker id="ch06-02-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
    <marker id="ch06-02-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="40" text-anchor="start" class="heading">为什么只优化代码，延迟还会回来？</text>
  <text x="32" y="74" text-anchor="start" class="small">搜索案例：降低已有延迟，还要预防新增延迟</text>
  <rect x="32" y="116" width="232" height="96" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-02-quality" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="148" y="152" text-anchor="middle" class="strong" data-box="ch06-02-quality">质量改动持续上线</text>
  <text x="148" y="188" text-anchor="middle" class="small" data-box="ch06-02-quality">图片、视频等</text>
  <path d="M264 164H328" class="edge" stroke="var(--diagram-warm,#a56a1f)" marker-end="url(#ch06-02-warm)"/>
  <rect x="338" y="116" width="258" height="96" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" id="ch06-02-complexity" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2"/>
  <text x="467" y="152" text-anchor="middle" data-box="ch06-02-complexity">代码与页面</text>
  <text x="467" y="188" text-anchor="middle" class="strong" data-box="ch06-02-complexity">越来越复杂</text>
  <path d="M596 164H680" class="edge" stroke="var(--diagram-danger,#b54750)" marker-end="url(#ch06-02-danger)"/>
  <rect x="690" y="116" width="238" height="96" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-02-latency" stroke="var(--diagram-danger,#b54750)" stroke-width="2"/>
  <text x="809" y="174" text-anchor="middle" class="strong" data-box="ch06-02-latency">延迟逐渐累积</text>
  <text x="32" y="252" text-anchor="start" class="small">新增复杂度持续出现，可抵消提速收益</text>
  <rect x="32" y="306" width="408" height="108" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" id="ch06-02-prevention" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="236" y="344" text-anchor="middle" class="strong" data-box="ch06-02-prevention">成因侧团队：预防新增</text>
  <text x="236" y="386" text-anchor="middle" data-box="ch06-02-prevention">指标、工具、培训与文档</text>
  <rect x="520" y="306" width="408" height="108" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" id="ch06-02-optimization" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2"/>
  <text x="724" y="344" text-anchor="middle" class="strong" data-box="ch06-02-optimization">症状侧团队：降低已有</text>
  <text x="724" y="386" text-anchor="middle" data-box="ch06-02-optimization">优化代码库，提速</text>
  <path d="M236 306V278H467V220" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06-02-primary)"/>
  <path d="M724 306V270H809V220" class="edge" stroke="var(--diagram-secondary,#2f6eac)" marker-end="url(#ch06-02-secondary)"/>
  <path d="M236 424V438H724V424" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="480" y="467" text-anchor="middle" class="small">两侧并行负责问题，不是先优化完，再做预防</text>
</svg>
