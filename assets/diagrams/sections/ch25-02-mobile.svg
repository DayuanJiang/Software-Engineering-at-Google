<svg xmlns="http://www.w3.org/2000/svg" id="ch25-02m-root" class="chapter-svg cg-ch25-02" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch25-02m-title ch25-02m-desc">
<title id="ch25-02m-title">实例重建之后，还要补哪一步？</title>
<desc id="ch25-02m-desc">示例中甲在数据块 K2 尚未上报时终止。K1 已上报，K3 尚待领取；动态分块让替代 worker 乙重做 K2，而不用重做 K1。另一个独立示例是计划维护：通知甲停止接收新请求，甲完成在途 Q1 后退出，负载均衡识别拒接状态并把新请求 Q2 发往乙。突然故障未必有排空机会；图不保证无中断，也不保证重复执行没有额外效果。</desc>
<style>
.cg-ch25-02#ch25-02m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-02#ch25-02m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch25-02#ch25-02m-root .strong {font-weight:600}
.cg-ch25-02#ch25-02m-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
