<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">静态清单之外，谁还在用？</text>
<text x="24" y="71" class="small" text-anchor="start">服务甲为示意；问号表示尚未识别</text>
<text x="24" y="106" class="small strong" text-anchor="start">静态视图：Code Search / Kythe</text>
