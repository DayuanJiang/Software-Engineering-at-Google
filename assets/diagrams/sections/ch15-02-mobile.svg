<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch15-02" data-layout="mobile" role="img" aria-labelledby="ch15-02m-title ch15-02m-desc">
<title id="ch15-02m-title">静态清单之外，谁还在用？</title>
<desc id="ch15-02m-desc">示意服务甲的依赖由尚未识别到被发现。代码搜索和 Kythe 查库或瘦客户端的静态引用；问号不代表不存在依赖。生产日志与运行采样补动态线索；预告、逐步延长的临时停服发现服务失效，从而揭示运行依赖。发现新用法后协助迁移或调整时间表。测试还需使用方提供充分覆盖，不能把未见失效当作无依赖的证明。</desc>
<style>
