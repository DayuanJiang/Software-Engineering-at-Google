<text x="24" y="265" class="strong" text-anchor="start">补充运行证据</text>
<text x="24" y="294" class="small" text-anchor="start">日志／采样 + 预告的渐进停服</text>
<g data-box="24,319,152,52">
<rect x="24" y="319" width="152" height="52" rx="5" class="warm"/>
<text x="100.0" y="352.0" class="strong" text-anchor="middle">服务甲</text>
</g>
<g data-box="256,319,140,52">
<rect x="256" y="319" width="140" height="52" rx="5" class="danger"/>
<text x="326.0" y="352.0" class="strong" text-anchor="middle">旧系统</text>
</g>
<path d="M176 345H254" class="danger-line" data-connector="true" marker-end="url(#ch15-02m-danger-arrow)" stroke-dasharray="6 5"/>
<text x="24" y="402" class="small danger-ink" text-anchor="start">观察到失效</text>
<text x="257" y="402" class="small danger-ink" text-anchor="start">临时停服</text>
<text x="24" y="434" class="small" text-anchor="start">虚线：新识别的运行依赖</text>
<rect x="24" y="456" width="372" height="72" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="40" y="486" class="" text-anchor="start">发现服务甲后：协助迁移</text>
<text x="40" y="512" class="" text-anchor="start">或调整时间表，不是立即删除。</text>
<text x="24" y="553" class="" text-anchor="start">停服须预告并逐步延长；仍需充分测试</text>
<text x="24" y="579" class="" text-anchor="start">静态未找到 ≠ 不存在运行依赖</text>
