<svg xmlns="http://www.w3.org/2000/svg" id="ch07-02m-diagram" class="chapter-svg cg-ch07-02" role="img" aria-labelledby="ch07-02m-title ch07-02m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch07-02m-title">指标缺位，不等于目标消失</title><desc id="ch07-02m-desc">研究设计中，更快完成工作的目标对应已取得 Readability 资格者的 CL 比未取得资格者审查更快这一信号；日志代理是按资格分组的 CL 审查耗时中位数。质量目标保留，但研究不采用不理想的客观定量代理，仍收集代码质量自评。自评比例反映看法，不等于客观代码质量。</desc>
<style>.cg-ch07-02#ch07-02m-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch07-02#ch07-02m-diagram .strong{font-weight:600}
.cg-ch07-02#ch07-02m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch07-02#ch07-02m-diagram .danger-text{fill:var(--diagram-danger,#b54750)}
.cg-ch07-02#ch07-02m-diagram .primary{fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch07-02#ch07-02m-diagram .secondary{fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch07-02#ch07-02m-diagram .warm{fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch07-02#ch07-02m-diagram .empty{fill:var(--diagram-bg,#fff);stroke:var(--diagram-danger,#b54750);stroke-width:1.5;stroke-dasharray:6 5}
.cg-ch07-02#ch07-02m-diagram .band{fill:var(--diagram-primary-soft,#e5f4ee)}
.cg-ch07-02#ch07-02m-diagram .blue-band{fill:var(--diagram-secondary-soft,#eaf1fa)}
.cg-ch07-02#ch07-02m-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch07-02#ch07-02m-diagram .arrow{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;marker-end:url(#ch07-02m-arrow)}</style>
<defs><marker id="ch07-02m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.5"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">指标缺位，不等于目标消失</text>
<text x="24" y="69" class="small" text-anchor="start">Readability：研究设计，非研究结果</text>
<rect id="ch07-02m-speed-goal" x="24" y="89" width="372" height="43" rx="4" class="band"/>
<text x="38" y="118" class="strong" text-anchor="start" data-box="ch07-02m-speed-goal">目标：更快、更高效地完成工作</text>
<text x="38" y="168" class="" text-anchor="start">信号：已取得资格者的 CL</text>
<text x="38" y="198" class="" text-anchor="start">比未取得资格者审查更快</text>
<path d="M210 133V143" class="arrow"/>
<path d="M210 205V216" class="arrow"/>
<rect id="ch07-02m-speed-metric" x="24" y="219" width="372" height="71" rx="4" class="secondary"/>
<text x="38" y="248" class="" text-anchor="start" data-box="ch07-02m-speed-metric">代理：按资格分组比较</text>
<text x="38" y="278" class="" text-anchor="start" data-box="ch07-02m-speed-metric">CL 审查耗时中位数</text>
<path d="M24 305H396" class="line"/>
<rect id="ch07-02m-quality-goal" x="24" y="319" width="372" height="43" rx="4" class="band"/>
<text x="38" y="348" class="strong" text-anchor="start" data-box="ch07-02m-quality-goal">目标：写出更高质量的代码</text>
<text x="38" y="393" class="small" text-anchor="start">信号：自评较高、流程有正面影响</text>
<path d="M210 363V371" class="arrow"/>
<path d="M210 401V411" class="arrow"/>
<rect id="ch07-02m-quality-gap" x="24" y="414" width="372" height="46" rx="4" class="empty"/>
<text x="38" y="444" class="" text-anchor="start" data-box="ch07-02m-quality-gap">客观定量代理：空缺</text>
<text x="38" y="499" class="" text-anchor="start">仍收集工程师对代码质量的自评</text>
<text x="24" y="548" class="small" text-anchor="start">保留质量目标，不拿差代理填空。</text>
<text x="24" y="578" class="small" text-anchor="start">自评比例测的是看法，不是客观质量。</text>
</svg>
