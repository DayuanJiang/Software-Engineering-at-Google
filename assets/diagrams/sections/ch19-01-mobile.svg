<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch19-01" data-layout="mobile" role="img" aria-labelledby="ch19-01m-title ch19-01m-desc">
<title id="ch19-01m-title">新快照清除哪些已审查标记？</title>
<desc id="ch19-01m-desc">示例中甲、乙都看过 v1，v2 只把 a.cc 的 n 改为 count：a.cc 对两人的已审查勾选都被清除，未变的 b.cc 保留勾选。文件已审查标记不同于 LGTM。</desc>
