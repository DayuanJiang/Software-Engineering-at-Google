<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch16-02" data-layout="desktop" role="img" aria-labelledby="ch16-02-title ch16-02-desc">
<title id="ch16-02-title">两类分支的终点不同</title>
<desc id="ch16-02-desc">非比例概念时间线：开发分支最终会合回主干，发布分支只从主干按需选取少量修复，最终停止维护，不计划再合回。区别在使用策略而非分支技术。</desc>
<style>
.cg-ch16-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch16-02[data-layout="desktop"] .strong {font-weight:600}
.cg-ch16-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch16-02[data-layout="desktop"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
.cg-ch16-02[data-layout="desktop"] .primary {fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch16-02[data-layout="desktop"] .primary-path {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch16-02-primary-arrow)}
.cg-ch16-02[data-layout="desktop"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch16-02[data-layout="desktop"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch16-02[data-layout="desktop"] .secondary-path {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;marker-end:url(#ch16-02-secondary-arrow)}
.cg-ch16-02[data-layout="desktop"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch16-02[data-layout="desktop"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch16-02[data-layout="desktop"] .warm-path {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2;marker-end:url(#ch16-02-warm-arrow)}
.cg-ch16-02[data-layout="desktop"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch16-02[data-layout="desktop"] .danger {fill:var(--diagram-danger-soft,#faecee);stroke:var(--diagram-danger,#b54750);stroke-width:1.5}
.cg-ch16-02[data-layout="desktop"] .danger-path {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2;marker-end:url(#ch16-02-danger-arrow)}
.cg-ch16-02[data-layout="desktop"] .danger-ink {fill:var(--diagram-danger,#b54750)}
</style><defs>
<marker id="ch16-02-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch16-02-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch16-02-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch16-02-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">两类分支的终点不同</text>
<text x="32" y="78" class="small" text-anchor="start">概念时间线：开发分支要合回；发布分支只接受少量修复并最终弃用</text>
<text x="32" y="145" class="strong" text-anchor="start">开发分支</text>
<path d="M220 133H925" class="secondary-path"/>
<circle cx="277" cy="133" r="6" class="secondary-ink"/>
<path d="M277 133L345 215H689L785 133" class="primary-path"/>
<circle cx="785" cy="133" r="6" class="secondary-ink"/>
<text x="451" y="197" class="" text-anchor="start">开发累积，最终合入</text>
<text x="803" y="171" class="small" text-anchor="start">主干</text>
<path d="M32 250H928" class="guide"/>
<text x="32" y="307" class="strong" text-anchor="start">发布分支</text>
<path d="M220 291H925" class="secondary-path"/>
<circle cx="277" cy="291" r="6" class="secondary-ink"/>
<path d="M277 291L345 367H841" class="warm-path"/>
<circle cx="582" cy="291" r="6" class="secondary-ink"/>
<path d="M582 291V365" class="warm-path" stroke-dasharray="6 5"/>
<path d="M845 352V382" class="guide"/>
<text x="607" y="330" class="small" text-anchor="start">按需选取修复</text>
<text x="864" y="374" class="small" text-anchor="start">弃用</text>
<rect x="32" y="416" width="896" height="44" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="480.0" y="445.5" class="small" text-anchor="middle">发布分支不计划合回主干；长期开发分支增加协调、合并和重新测试的负担</text>
</svg>
