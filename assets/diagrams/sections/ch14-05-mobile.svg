.cg-ch14-05[data-layout="mobile"] .danger-ink {fill:var(--diagram-danger,#b54750)}
.cg-ch14-05[data-layout="mobile"] .danger-path {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2;marker-end:url(#ch14-05m-danger-arrow)}
</style><defs>
