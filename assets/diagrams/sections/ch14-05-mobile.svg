</g>
<g data-box="226,96,172,76"><rect x="226" y="96" width="172" height="76" rx="6" class="warm"/>
<text x="312.0" y="127" class="strong" text-anchor="middle">不展示广告</text>
<text x="312.0" y="158" class="small" text-anchor="middle">不是 500</text>
</g>
<path d="M192 134H224" class="danger-path" data-connector="true"/>
<text x="22" y="205" class="strong" text-anchor="start">测试只见缺广告，可能误判</text>
<g data-box="22,232,164,46"><rect x="22" y="232" width="164" height="46" rx="6" class="danger"/>
<text x="104.0" y="263" class="" text-anchor="middle">过载</text>
</g>
<g data-box="234,232,164,46"><rect x="234" y="232" width="164" height="46" rx="6" class="warm"/>
<text x="316.0" y="263" class="" text-anchor="middle">等待失败</text>
</g>
<g data-box="234,318,164,46"><rect x="234" y="318" width="164" height="46" rx="6" class="warm"/>
<text x="316.0" y="349" class="" text-anchor="middle">重跑测试</text>
</g>
<g data-box="22,318,164,46"><rect x="22" y="318" width="164" height="46" rx="6" class="danger"/>
<text x="104.0" y="349" class="" text-anchor="middle">负载增加</text>
</g>
<path d="M186 255H232" class="danger-path" data-connector="true"/>
<path d="M316 278V316" class="danger-path" data-connector="true"/>
<path d="M234 341H188" class="danger-path" data-connector="true"/>
<path d="M104 318V280" class="danger-path" data-connector="true"/>
<text x="22" y="403" class="strong" text-anchor="start">测试等待：完成即验证</text>
<g data-box="22,422,156,84"><rect x="22" y="422" width="156" height="84" rx="6" class="secondary"/>
<text x="100.0" y="454" class="strong" text-anchor="middle">等待状态</text>
<text x="100.0" y="487" class="small" text-anchor="middle">轮询 / 通知</text>
</g>
<g data-box="226,416,172,48"><rect x="226" y="416" width="172" height="48" rx="6" class="primary"/>
<text x="312.0" y="448" class="" text-anchor="middle">完成：验证</text>
</g>
<g data-box="226,484,172,48"><rect x="226" y="484" width="172" height="48" rx="6" class="warm"/>
<text x="312.0" y="516" class="" text-anchor="middle">到上限：报超时</text>
</g>
<path d="M178 446H200V440H224" class="primary-path" data-connector="true"/>
<path d="M178 482H200V508H224" class="warm-path" data-connector="true"/>
<text x="22" y="563" class="small" text-anchor="start">内部期限另调，并暴露超时原因</text>
<text x="22" y="589" class="small" text-anchor="start">延长或缩短都要权衡用户时限</text>
</svg>
