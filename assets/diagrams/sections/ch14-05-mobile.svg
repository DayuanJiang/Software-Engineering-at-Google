<marker id="ch14-05m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch14-05m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch14-05m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="22" y="34" class="strong" text-anchor="start">没显示广告：代码坏了？</text>
<text x="22" y="68" class="small" text-anchor="start">本章广告案例：也可能是内部超时</text>
<g data-box="22,96,170,76"><rect x="22" y="96" width="170" height="76" rx="6" class="danger"/>
<text x="107.0" y="127" class="strong" text-anchor="middle">内部期限到</text>
