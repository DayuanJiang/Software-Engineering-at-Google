.cg-ch14-05[data-layout="mobile"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch14-05[data-layout="mobile"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch14-05[data-layout="mobile"] .secondary-path {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;marker-end:url(#ch14-05m-secondary-arrow)}
.cg-ch14-05[data-layout="mobile"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch14-05[data-layout="mobile"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch14-05[data-layout="mobile"] .warm-path {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2;marker-end:url(#ch14-05m-warm-arrow)}
