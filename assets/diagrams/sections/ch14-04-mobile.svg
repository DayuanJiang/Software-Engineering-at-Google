<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch14-04" data-layout="mobile" role="img" aria-labelledby="ch14-04m-title ch14-04m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch14-04m-title">响应不同，何时才能说 B 错了？</title>
<desc id="ch14-04m-desc">用本章 xyzzy 搜索断言构造示意对照，不是实测结果。同一查询发送给两套真实程序，A 的响应含 Colossal Cave，B 不含。A/B 比较只揭示变化，需人核对预期，基准不是正确答案。若明确采用结果必须包含 Colossal Cave 的断言，则 B 不满足该断言。A-A 示例中同版本两次也出现有和无，是调查非确定性和噪声的线索。无差异也可能两个版本都错。</desc>
