<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="22" y="34" class="strong" text-anchor="start">响应不同，何时才能说 B 错了？</text>
<text x="22" y="69" class="small" text-anchor="start">用本章 xyzzy 查询构造对照</text>
<text x="22" y="96" class="small" text-anchor="start">以下响应为示意，非实测</text>
<g data-box="82,113,256,48"><rect x="82" y="113" width="256" height="48" rx="6" class="warm"/>
<text x="210.0" y="145" class="" text-anchor="middle">同一查询：xyzzy</text>
</g>
<g data-box="22,195,178,88"><rect x="22" y="195" width="178" height="88" rx="6" class="secondary"/>
<text x="111.0" y="224" class="strong" text-anchor="middle">A 基准</text>
<text x="111.0" y="249" class="small" text-anchor="middle">含</text>
<text x="111.0" y="273" class="small" text-anchor="middle">Colossal Cave</text>
</g>
<g data-box="220,195,178,88"><rect x="220" y="195" width="178" height="88" rx="6" class="primary"/>
<text x="309.0" y="224" class="strong" text-anchor="middle">B 候选</text>
<text x="309.0" y="249" class="small" text-anchor="middle">不含</text>
<text x="309.0" y="273" class="small" text-anchor="middle">Colossal Cave</text>
</g>
<path d="M210 161V178H111V193" class="primary-path" data-connector="true"/>
<path d="M210 178H309V193" class="primary-path" data-connector="true"/>
<g data-box="22,327,376,66"><rect x="22" y="327" width="376" height="66" rx="6" class="warm"/>
<text x="210.0" y="355" class="strong" text-anchor="middle">比较只知有变化</text>
<text x="210.0" y="382" class="small" text-anchor="middle">仍需人核对预期</text>
</g>
<path d="M111 283V306H172V325" class="primary-path" data-connector="true"/>
<path d="M309 283V306H248V325" class="primary-path" data-connector="true"/>
<text x="22" y="428" class="strong" text-anchor="start">若要求：含 Colossal Cave</text>
<text x="22" y="460" class="strong danger-ink" text-anchor="start">B 才是不满足该断言</text>
<path d="M22 480H398" class="guide"/>
<text x="22" y="513" class="small" text-anchor="start">A-A 也出现「有 / 无」？</text>
<text x="22" y="541" class="small" text-anchor="start">同版也会变，先查噪声</text>
<text x="22" y="583" class="small" text-anchor="start">A/B 无差异也不证明二者正确</text>
