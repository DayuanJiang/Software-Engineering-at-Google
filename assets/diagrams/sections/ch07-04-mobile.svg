<svg xmlns="http://www.w3.org/2000/svg" id="ch07-04m-diagram" class="chapter-svg cg-ch07-04" role="img" aria-labelledby="ch07-04m-title ch07-04m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch07-04m-title">同算中位数，哪些构建不再算？</title><desc id="ch07-04m-desc">目标是工程师的典型构建等待体验。校正前后对照中，工程师等待结果的构建仍纳入；自动工具发起且工程师不等待结果的构建由纳入改为排除。体验抽样发现有人根本没有启动构建。指标仍是每位工程师的构建延迟中位数，原文没有报告数值变化。</desc>
<style>.cg-ch07-04#ch07-04m-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch07-04#ch07-04m-diagram .strong{font-weight:600}
.cg-ch07-04#ch07-04m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch07-04#ch07-04m-diagram .danger-text{fill:var(--diagram-danger,#b54750)}
.cg-ch07-04#ch07-04m-diagram .primary{fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch07-04#ch07-04m-diagram .secondary{fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch07-04#ch07-04m-diagram .warm{fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch07-04#ch07-04m-diagram .empty{fill:var(--diagram-bg,#fff);stroke:var(--diagram-danger,#b54750);stroke-width:1.5;stroke-dasharray:6 5}
.cg-ch07-04#ch07-04m-diagram .band{fill:var(--diagram-primary-soft,#e5f4ee)}
.cg-ch07-04#ch07-04m-diagram .blue-band{fill:var(--diagram-secondary-soft,#eaf1fa)}
.cg-ch07-04#ch07-04m-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch07-04#ch07-04m-diagram .arrow{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;marker-end:url(#ch07-04m-arrow)}</style>
<defs><marker id="ch07-04m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.5"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">同算中位数，哪些构建不再算？</text>
<text x="24" y="69" class="small" text-anchor="start">目标不变：工程师的</text>
<text x="24" y="96" class="small" text-anchor="start">典型构建等待体验</text>
<text x="24" y="139" class="strong" text-anchor="start">构建类型</text>
<text x="259" y="139" class="small" text-anchor="middle">校正前</text>
<text x="355" y="139" class="small" text-anchor="middle">校正后</text>
<rect id="ch07-04m-waiting" x="24" y="160" width="372" height="95" rx="4" class="blue-band"/>
<text x="38" y="193" class="" text-anchor="start" data-box="ch07-04m-waiting">工程师等待</text>
<text x="38" y="224" class="" text-anchor="start" data-box="ch07-04m-waiting">构建结果</text>
<text x="259" y="215" class="strong" text-anchor="middle" data-box="ch07-04m-waiting">纳入</text>
<text x="355" y="215" class="strong" text-anchor="middle" data-box="ch07-04m-waiting">纳入</text>
<rect id="ch07-04m-unwaited" x="24" y="275" width="372" height="105" rx="4" class="band"/>
<text x="38" y="306" class="" text-anchor="start" data-box="ch07-04m-unwaited">自动工具发起</text>
<text x="38" y="336" class="" text-anchor="start" data-box="ch07-04m-unwaited">且工程师</text>
<text x="38" y="366" class="" text-anchor="start" data-box="ch07-04m-unwaited">不等待结果</text>
<text x="259" y="337" class="strong" text-anchor="middle" data-box="ch07-04m-unwaited">纳入</text>
<rect id="ch07-04m-excluded" x="319" y="304" width="72" height="49" rx="4" class="empty"/>
<text x="355" y="337" class="strong danger-text" text-anchor="middle" data-box="ch07-04m-excluded">排除</text>
<text x="24" y="427" class="" text-anchor="start">体验抽样：有人表示自己并未</text>
<text x="24" y="458" class="" text-anchor="start">启动构建，才发现范围不符。</text>
<text x="24" y="505" class="small" text-anchor="start">指标仍是每位工程师的</text>
<text x="24" y="533" class="small" text-anchor="start">构建延迟中位数。</text>
<text x="24" y="577" class="small" text-anchor="start">只改纳入范围。</text>
</svg>
