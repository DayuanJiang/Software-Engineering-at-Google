<text x="489.0" y="265" class="strong" text-anchor="middle" data-owner="ch18-02-box-4">mylib</text>
<text x="489.0" y="293" class="small" text-anchor="middle" data-owner="ch18-02-box-4">依赖受影响，重建</text>
<path class="edge" d="M602 275H700" stroke="var(--diagram-warm,#a56a1f)" marker-end="url(#ch18-02-warm-arrow)"/>
<rect id="ch18-02-box-5" x="702" y="236" width="226" height="78" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="815.0" y="265" class="strong" text-anchor="middle" data-owner="ch18-02-box-5">MyBinary</text>
<text x="815.0" y="293" class="small" text-anchor="middle" data-owner="ch18-02-box-5">依赖受影响，重建</text>
<text x="376" y="364" class="strong" text-anchor="start">对照：只改 MyBinary.java</text>
<text x="376" y="395" class="small" text-anchor="start">只重建 MyBinary，其他产物复用。</text>
<path d="M24 428H936" fill="none" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="32" y="458" class="small" text-anchor="start">其他输入不变时旧产物可用；重建不等于输出字节必变。</text>
