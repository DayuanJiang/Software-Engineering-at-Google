<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch18-02" data-layout="desktop" role="img" aria-labelledby="ch18-02-title ch18-02-desc" viewBox="0 0 960 480" width="960" height="480">
<title id="ch18-02-title">改 common，为什么不重建 otherlib？</title>
<desc id="ch18-02-desc">保留原文增量构建图，并补上 Guava 和相反方向的依赖声明。MyBinary 依赖 mylib，mylib 依赖 common、otherlib、Guava。图中箭头是产物流和变更影响方向，从依赖流向使用方。假定其他输入不变且旧产物可用，common 源码变化后重建 common、mylib、MyBinary，复用 otherlib 与 Guava。仅改 MyBinary.java 则只重建 MyBinary。按原文目标级简化，不表示重建必定改变输出字节。</desc>
