.cg-ch18-02[data-layout="desktop"] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch18-02[data-layout="desktop"] .small{font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch18-02[data-layout="desktop"] .strong{font-weight:600}
.cg-ch18-02[data-layout="desktop"] .edge{fill:none;stroke-width:2;stroke-linejoin:round}
</style><defs>
