<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">改 common，为什么不重建 otherlib？</text>
<text x="32" y="76" class="small" text-anchor="start">依赖声明：MyBinary → mylib；mylib → common、otherlib、Guava</text>
<text x="32" y="110" class="small" text-anchor="start">下面的箭头方向相反：依赖产物 → 使用方；暖色路径传播本次影响</text>
<rect id="ch18-02-box-1" x="32" y="136" width="218" height="74" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="141.0" y="165" class="strong" text-anchor="middle" data-owner="ch18-02-box-1">common</text>
<text x="141.0" y="193" class="small" text-anchor="middle" data-owner="ch18-02-box-1">源码变，重建</text>
<rect id="ch18-02-box-2" x="32" y="238" width="218" height="74" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)" stroke-width="1.5"/>
<text x="141.0" y="267" class="strong" text-anchor="middle" data-owner="ch18-02-box-2">otherlib</text>
<text x="141.0" y="295" class="small" text-anchor="middle" data-owner="ch18-02-box-2">输入未变，复用</text>
