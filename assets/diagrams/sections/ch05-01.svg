<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch05-01" data-layout="desktop" role="img" aria-labelledby="ch05-01-title ch05-01-desc">
<title id="ch05-01-title">两类职责，一个团队</title>
<desc id="ch05-01-desc">工程经理关注人员、绩效和业务，技术负责人关注架构、技术选择与推进；双方共同安排人员与任务。小团队的 TLM 兼任两职，但需要平衡和指导。</desc>
<style>
.cg-ch05-01[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05-01[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch05-01[data-layout="desktop"] .strong {font-weight:600}
</style>
<defs><marker id="ch05-01-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker><marker id="ch05-01-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker><marker id="ch05-01-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker><marker id="ch05-01-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong">两类职责，一个团队</text>
<g id="ch05-01-node-1" data-box="32,113,360,138">
<rect x="32" y="113" width="360" height="138" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="212.0" y="158.0" text-anchor="middle" class="strong">工程经理</text>
<text x="212.0" y="190.0" text-anchor="middle" class="small">人员绩效、生产力与幸福感</text>
<text x="212.0" y="222.0" text-anchor="middle" class="small">确保产品满足业务需求</text>
</g>
<g id="ch05-01-node-2" data-box="568,113,360,138">
<rect x="568" y="113" width="360" height="138" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="748.0" y="158.0" text-anchor="middle" class="strong">技术负责人</text>
<text x="748.0" y="190.0" text-anchor="middle" class="small">架构、技术选择、优先级</text>
<text x="748.0" y="222.0" text-anchor="middle" class="small">推进速度与项目管理</text>
</g>
<path d="M398 181L562 181" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
<text x="480" y="145" text-anchor="middle" class="small">搭档协作</text>
<text x="480" y="294" text-anchor="middle" class="">共同安排人员，并把任务交给技能与水平匹配的成员</text>
<g id="ch05-01-node-3" data-box="176,328,608,65">
<rect x="176" y="328" width="608" height="65" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="480.0" y="368.5" text-anchor="middle" class="strong">小团队 TLM：兼任两职，需要平衡与指导</text>
</g>
<text x="32" y="433" text-anchor="start" class="small">经理与技术负责人都要帮助团队成长，但人员管理和技术领导的职责不同。</text>
<text x="32" y="461" text-anchor="start" class="small">兼任不等于减少职责；成熟的大团队通常由两位领导分别专注。</text>
</svg>
