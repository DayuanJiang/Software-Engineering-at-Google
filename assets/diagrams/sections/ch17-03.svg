<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch17-03" data-layout="desktop" role="img" aria-labelledby="ch17-03-title ch17-03-desc">
<title id="ch17-03-title">首屏没显示，就不用改吗？</title>
<desc id="ch17-03-desc">查询 OldApi 的教学示例：分片 A 中 a.cc 优先级较高，z.cc 较低；分片 B 中 b.cc 较高，y.cc 较低，四个文件都匹配 OldApi。示例首屏只显示 a.cc、b.cc，全部模式返回四个文件，所以只按首屏重构会漏掉 y.cc、z.cc。首屏条目数不是固定配额；全部仍限于所选版本已索引范围，大响应需要资源保护。</desc>
<style>
.cg-ch17-03[data-layout="desktop"] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch17-03[data-layout="desktop"] .small{font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch17-03[data-layout="desktop"] .strong{font-weight:600}
.cg-ch17-03[data-layout="desktop"] .code{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
.cg-ch17-03[data-layout="desktop"] .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch17-03[data-layout="desktop"] .primary{fill:var(--diagram-primary-soft,#e5f4ee)}
.cg-ch17-03[data-layout="desktop"] .primary-ink{fill:var(--diagram-primary,#087f6d)}
.cg-ch17-03[data-layout="desktop"] .secondary{fill:var(--diagram-secondary-soft,#eaf1fa)}
.cg-ch17-03[data-layout="desktop"] .secondary-ink{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch17-03[data-layout="desktop"] .warm{fill:var(--diagram-warm-soft,#fff3dc)}
.cg-ch17-03[data-layout="desktop"] .warm-ink{fill:var(--diagram-warm,#a56a1f)}
.cg-ch17-03[data-layout="desktop"] .danger{fill:var(--diagram-danger-soft,#faecee)}
.cg-ch17-03[data-layout="desktop"] .danger-ink{fill:var(--diagram-danger,#b54750)}
</style>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">首屏没显示，就不用改吗？</text>
<text x="32" y="78" class="small" text-anchor="start">查询 OldApi；两分片内各按优先级排列。文件与首屏条目数仅为示例。</text>
<text x="48" y="123" class="small" text-anchor="start">片内优先级</text>
<text x="246" y="123" class="small" text-anchor="start">文件</text>
<text x="438" y="123" class="small" text-anchor="start">源码匹配</text>
<text x="711" y="123" class="small" text-anchor="middle">示例首屏</text>
<text x="860" y="123" class="small" text-anchor="middle">请求全部</text>
<g data-box="32,145,896,47">
<rect x="32" y="145" width="896" height="47" class="secondary"/>
<text x="48" y="177" class="" text-anchor="start">A 高</text>
<text x="246" y="177" class="code" text-anchor="start">a.cc</text>
<text x="438" y="177" class="code" text-anchor="start">OldApi()</text>
<text x="711" y="177" class="" text-anchor="middle">显示</text>
<text x="860" y="177" class="primary-ink" text-anchor="middle">返回</text>
</g>
<g data-box="32,199,896,47">
<rect x="32" y="199" width="896" height="47" class="warm"/>
<text x="48" y="231" class="" text-anchor="start">A 低</text>
<text x="246" y="231" class="code" text-anchor="start">z.cc</text>
<text x="438" y="231" class="code" text-anchor="start">OldApi()</text>
<text x="711" y="231" class="" text-anchor="middle">未显示</text>
<text x="860" y="231" class="primary-ink" text-anchor="middle">返回</text>
</g>
<g data-box="32,253,896,47">
<rect x="32" y="253" width="896" height="47" class="secondary"/>
<text x="48" y="285" class="" text-anchor="start">B 高</text>
<text x="246" y="285" class="code" text-anchor="start">b.cc</text>
<text x="438" y="285" class="code" text-anchor="start">OldApi()</text>
<text x="711" y="285" class="" text-anchor="middle">显示</text>
<text x="860" y="285" class="primary-ink" text-anchor="middle">返回</text>
</g>
<g data-box="32,307,896,47">
<rect x="32" y="307" width="896" height="47" class="warm"/>
<text x="48" y="339" class="" text-anchor="start">B 低</text>
<text x="246" y="339" class="code" text-anchor="start">y.cc</text>
<text x="438" y="339" class="code" text-anchor="start">OldApi()</text>
<text x="711" y="339" class="" text-anchor="middle">未显示</text>
<text x="860" y="339" class="primary-ink" text-anchor="middle">返回</text>
</g>
<text x="32" y="397" class="strong" text-anchor="start">只按首屏改 a.cc、b.cc，会漏掉仍匹配的 y.cc、z.cc。</text>
<text x="32" y="433" class="small" text-anchor="start">请求各片全部匹配，可按字母顺序输出：a.cc、b.cc、y.cc、z.cc。</text>
<text x="32" y="465" class="small" text-anchor="start">“全部”限于所选版本的已索引范围；大响应仍受资源保护。</text>
</svg>
