<svg xmlns="http://www.w3.org/2000/svg" id="ch22-02m-root" class="chapter-svg cg-ch22-02" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch22-02m-title ch22-02m-desc">
  <title id="ch22-02m-title">合测的失败，如何归到分片？</title>
  <desc id="ch22-02m-desc">以三个分片和四个测试为示例，先跑受影响测试的并集；若 b 失败，甲、乙分别重跑 b，丙与失败集的交集为空。甲通过、乙失败的示例说明合测失败不能直接归罪于整批分片。 集合和结果为教学示例，不是性能测量；没有给出提速或总耗时。使用后文的分片交集规则，不将其冒充为前文 TAP 列车的完整五步流程；后者先随机抽样1000个测试，再对每个非 flaky 失败测试逐项复跑。图中假设分片独立、测试均非 flaky；不把忽略 flaky 的经验推广为通用规则。</desc>
  <style>
.cg-ch22-02#ch22-02m-root text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; font-size:22px; font-weight:400; letter-spacing:0; fill:var(--diagram-ink,#242424); }
.cg-ch22-02#ch22-02m-root .small { font-size:19px; fill:var(--diagram-muted,#686868); }
.cg-ch22-02#ch22-02m-root .strong { font-weight:600; }
.cg-ch22-02#ch22-02m-root .primary-ink { fill:var(--diagram-primary,#087f6d); }
.cg-ch22-02#ch22-02m-root .danger-ink { fill:var(--diagram-danger,#b54750); }
.cg-ch22-02#ch22-02m-root .secondary-ink { fill:var(--diagram-secondary,#2f6eac); }
.cg-ch22-02#ch22-02m-root .warm-ink { fill:var(--diagram-warm,#a56a1f); }
</style>
  <defs>
    <marker id="ch22-02m-primary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch22-02m-secondary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch22-02m-warm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch22-02m-danger-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
    <marker id="ch22-02m-muted-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#686868)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="600" fill="var(--diagram-bg,#fff)" />
  <text x="24" y="38" text-anchor="start" class="strong">合测的失败，如何归到分片？</text>
  <text x="24" y="72" text-anchor="start" class="small">示意：实心圆为该片受影响测试</text>
  <text x="24" y="100" text-anchor="start" class="small">采用后文分片交集规则；均非 flaky</text>
  <text x="153" y="139" text-anchor="middle" class="strong">a</text>
  <text x="225" y="139" text-anchor="middle" class="strong">b</text>
  <text x="297" y="139" text-anchor="middle" class="strong">c</text>
  <text x="369" y="139" text-anchor="middle" class="strong">d</text>
  <text x="40" y="177" text-anchor="start">甲</text>
  <circle cx="153" cy="169" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <circle cx="225" cy="169" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <path d="M291 169L303 169" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <path d="M363 169L375 169" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <text x="40" y="217" text-anchor="start">乙</text>
  <path d="M147 209L159 209" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <circle cx="225" cy="209" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <circle cx="297" cy="209" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <path d="M363 209L375 209" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <text x="40" y="257" text-anchor="start">丙</text>
  <path d="M147 249L159 249" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <path d="M219 249L231 249" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <circle cx="297" cy="249" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <circle cx="369" cy="249" r="8" fill="var(--diagram-secondary,#2f6eac)" />
  <rect x="197" y="117" width="56" height="153" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-dasharray="7 5" />
  <path d="M24 277L396 277" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <text x="24" y="310" text-anchor="start" class="strong">合测</text>
  <text x="153" y="310" text-anchor="middle" class="primary-ink">过</text>
  <text x="225" y="310" text-anchor="middle" class="danger-ink">败</text>
  <text x="297" y="310" text-anchor="middle" class="primary-ink">过</text>
  <text x="369" y="310" text-anchor="middle" class="primary-ink">过</text>
  <text x="24" y="350" text-anchor="start" class="strong danger-ink">失败集 F = {b}</text>
  <text x="24" y="384" text-anchor="start" class="small">各片受影响集 ∩ F → 单片复跑</text>
  <text x="24" y="425" text-anchor="start">甲的集合 ∩ F = {b}</text>
  <text x="273" y="425" text-anchor="start" class="primary-ink">b 通过</text>
  <text x="24" y="466" text-anchor="start">乙的集合 ∩ F = {b}</text>
  <text x="273" y="466" text-anchor="start" class="danger-ink">b 失败</text>
  <text x="24" y="507" text-anchor="start">丙的集合 ∩ F = ∅</text>
  <text x="273" y="507" text-anchor="start" class="small">不复跑</text>
  <path d="M24 527L396 527" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" />
  <text x="24" y="556" text-anchor="start" class="small">合测不等于合交；证据仍逐片保留。</text>
  <text x="24" y="584" text-anchor="start" class="small">集合与结果是示例，不是提速测量。</text>
</svg>
