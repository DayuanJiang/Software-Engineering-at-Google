<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch24-01" data-layout="mobile" role="img" aria-labelledby="ch24-01m-title ch24-01m-desc">
  <title id="ch24-01m-title">持续交付不等于持续部署</title>
  <desc id="ch24-01m-desc">持续交付让团队维持随时可部署的状态；持续部署进一步让符合条件的变更自动进入生产。创建可发布版本的频率、实际部署频率和用户收到更新的频率可以分别选择。</desc>
  <style>.cg-ch24-01[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch24-01[data-layout="mobile"] .strong {font-weight:600}
.cg-ch24-01[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}</style>
  <defs>
    <marker id="ch24-01m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch24-01m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch24-01m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch24-01m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)" stroke="none" />
  <text x="24" y="38" text-anchor="start" class="strong">持续交付不等于持续部署</text>
  <text x="24" y="76" text-anchor="start" class="small">把部署能力与实际推送决策分开</text>
  <rect x="24" y="108" width="372" height="90" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" />
  <text x="38" y="139" text-anchor="start" class="strong" data-box="24,108,372,90">构建、测试、组装候选版本</text>
  <text x="38" y="174" text-anchor="start" class="small" data-box="24,108,372,90">先建立稳定的可发布状态</text>
  <path d="M210 198V226" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch24-01m-primary-arrow)" />
  <rect x="24" y="226" width="372" height="90" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" />
  <text x="38" y="257" text-anchor="start" class="strong" data-box="24,226,372,90">持续交付</text>
  <text x="38" y="292" text-anchor="start" class="small" data-box="24,226,372,90">随时能够部署；是否部署另作选择</text>
  <path d="M210 316V350" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch24-01m-secondary-arrow)" stroke-dasharray="6 5" />
  <rect x="24" y="350" width="372" height="114" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" />
  <text x="38" y="381" text-anchor="start" class="strong" data-box="24,350,372,114">持续部署</text>
  <text x="38" y="416" text-anchor="start" class="small" data-box="24,350,372,114">更进一步：符合条件的变更</text>
  <text x="38" y="442" text-anchor="start" class="small" data-box="24,350,372,114">自动推进到生产环境</text>
  <rect x="24" y="530" width="372" height="52" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="none" />
  <text x="210.0" y="553" text-anchor="middle" class="small" data-box="24,530,372,52">版本生成频率与用户接收频率可分离</text>
</svg>
