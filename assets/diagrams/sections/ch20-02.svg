<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch20-02" data-layout="desktop" role="img" aria-labelledby="ch20-02-title ch20-02-desc"><title id="ch20-02-title">Tricorder 的请求、执行与结果</title><desc id="ch20-02-desc">数据流展示变更元数据如何触发分析服务器读取相应版本的源文件与缓存构建产物，运行分析器并写入结果存储；Critique 展示每类最新结果和运行状态。</desc><style>.cg-ch20-02[data-layout="desktop"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch20-02[data-layout="desktop"] .small{font-size:20px;fill:var(--diagram-muted,#686868)}.cg-ch20-02[data-layout="desktop"] .strong{font-weight:600}</style><defs>
