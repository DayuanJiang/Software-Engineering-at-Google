<svg xmlns="http://www.w3.org/2000/svg" id="ch25-05m-root" class="chapter-svg cg-ch25-05" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch25-05m-title ch25-05m-desc">
<title id="ch25-05m-title">Bash 换成 ash，为何反而告警？</title>
<desc id="ch25-05m-desc">本章计算服务选择中的真实历史案例：团队已经在自己的文件系统覆盖层里，把 /usr/bin/bash 换成只执行参数的极简程序，避开 Bash 包装开销。Borg 把统一启动路径改成 /usr/bin/ash，本想降低 shell 开销，但对这些团队却绕过了原有定制，真正启动 ash，内存使用反而增加，触发告警并回滚。这是隐式依赖导致迁移失败的反例，不是 Bash 与 ash 的性能比较，也不是当前云产品行为；图不提供任何内存测量或资源比例。</desc>
<style>
.cg-ch25-05#ch25-05m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-05#ch25-05m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch25-05#ch25-05m-root .strong {font-weight:600}
.cg-ch25-05#ch25-05m-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch25-05m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch25-05m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch25-05m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch25-05m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch25-05m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)" stroke="none" stroke-width="1.5"/>
<text x="20" y="38" text-anchor="start" class="strong">Bash 换成 ash，为何反而告警？</text>
<text x="20" y="74" text-anchor="start" class="small">书中定制覆盖层案例（非资源测量）</text>
<text x="20" y="116" text-anchor="start" class="strong">原来调用 /usr/bin/bash</text>
<rect x="20" y="138" width="380" height="88" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="36" y="169" text-anchor="start" class="strong" data-box="20,138,380,88">命中团队的覆盖层</text>
<text x="36" y="203" text-anchor="start" class="small" data-box="20,138,380,88">实际执行极简程序，不启动 Bash</text>
<path data-connector="true" d="M210 226V268" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch25-05m-warm-arrow)"/>
<text x="234" y="254" text-anchor="start" class="small">平台切换</text>
<text x="20" y="302" text-anchor="start" class="strong">改为调用 /usr/bin/ash</text>
<rect x="20" y="321" width="380" height="88" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="36" y="352" text-anchor="start" class="strong" data-box="20,321,380,88">绕过了团队的覆盖层</text>
<text x="36" y="386" text-anchor="start" class="small" data-box="20,321,380,88">这次启动了真正的 ash</text>
<path data-connector="true" d="M210 409V443" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" marker-end="url(#ch25-05m-danger-arrow)"/>
<rect x="20" y="453" width="380" height="58" rx="0" fill="var(--diagram-danger-soft,#faecee)" stroke="none" stroke-width="1.5"/>
<text x="210" y="491" text-anchor="middle" class="strong" data-box="20,453,380,58">内存增加 → 告警 → 回滚</text>
<text x="20" y="549" text-anchor="start" class="small">已有隐式依赖，让统一优化变成退步。</text>
<text x="20" y="582" text-anchor="start" class="small">迁移清单还要覆盖脚本与外围工具。</text>
</svg>
