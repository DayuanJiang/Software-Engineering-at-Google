<svg xmlns="http://www.w3.org/2000/svg" id="ch25-04m-root" class="chapter-svg cg-ch25-04" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch25-04m-title ch25-04m-desc">
<title id="ch25-04m-title">服务要收回资源，批处理会怎样？</title>
<desc id="ch25-04m-desc">示例沿用书中的 Borg 策略：搜索服务平时未使用的预留资源可由日志分析批处理借用，但借用可被抢占。搜索请求增加、需要 CPU 时暂停批处理，计算不再推进但内存仍占用；需要 RAM 时终止批处理，释放内存而失去进程状态，重启后重做未上报的数据块。暂停并不释放内存；同一份服务预留余量不能再作为另一份不可抢占服务承诺。所有位置和形状只编码条件与状态，不代表容量、资源比例、费用或性能数据。</desc>
<style>
.cg-ch25-04#ch25-04m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-04#ch25-04m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch25-04#ch25-04m-root .strong {font-weight:600}
.cg-ch25-04#ch25-04m-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
