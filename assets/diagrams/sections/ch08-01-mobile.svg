<svg xmlns="http://www.w3.org/2000/svg" id="ch08-01m-diagram" class="chapter-svg cg-ch08-01" role="img" aria-labelledby="ch08-01m-title ch08-01m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch08-01m-title">读完这一行，谁拥有 Foo？</title>
<desc id="ch08-01m-desc">左侧或上侧是原文 Foo* 参数及调用，无法单凭它确定所有权。右侧或下侧是原文按值 std::unique_ptr&lt;Foo&gt; 参数及 std::move(my_foo) 调用：独占所有权由 my_foo 交给 arg。my_foo 不再拥有原对象，但这不说明原对象何时销毁或函数全部行为。std::move 单独出现不是转移保证。</desc>
<style>
.cg-ch08-01#ch08-01m-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch08-01#ch08-01m-diagram .strong{font-weight:600}
.cg-ch08-01#ch08-01m-diagram .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch08-01#ch08-01m-diagram .code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.cg-ch08-01#ch08-01m-diagram .green{fill:var(--diagram-primary,#087f6d)}
.cg-ch08-01#ch08-01m-diagram .red{fill:var(--diagram-danger,#b54750)}
.cg-ch08-01#ch08-01m-diagram .blue{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch08-01#ch08-01m-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch08-01#ch08-01m-diagram .arrow{fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch08-01m-arrow)}
.cg-ch08-01#ch08-01m-diagram .uncertain{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;stroke-dasharray:5 5}
</style>
<defs><marker id="ch08-01m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="39" class="strong">读完这一行，谁拥有 Foo？</text>
<text x="24" y="70" class="small">原文代码摘录；结合声明，判断调用</text>
<text x="24" y="109" class="strong">A  普通指针：答案不确定</text>
<rect id="ch08-01m-box1" x="24" y="127" width="372" height="83" rx="4" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="38" y="157" class="code" data-box="ch08-01m-box1">void TakeFoo(Foo* arg);</text>
<text x="38" y="193" class="code" data-box="ch08-01m-box1">TakeFoo(my_foo);</text>
<path class="uncertain" d="M115 212V226H66V239"/>
<path class="uncertain" d="M115 226H263V239"/>
<text x="24" y="264" class="small">调用方保留？</text>
<text x="218" y="264" class="small">被调用方接管？</text>
<path class="line" d="M24 283H396"/>
<text x="24" y="318" class="strong">B  按值接收独占所有权</text>
<rect id="ch08-01m-box2" x="24" y="336" width="372" height="148" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)"/>
<text x="38" y="365" class="code" data-box="ch08-01m-box2">void TakeFoo(</text>
<text x="38" y="393" class="code" data-box="ch08-01m-box2"> std::unique_ptr&lt;Foo&gt; arg);</text>
<text x="38" y="439" class="code" data-box="ch08-01m-box2">TakeFoo(</text>
<text x="38" y="469" class="code" data-box="ch08-01m-box2"> std::move(my_foo));</text>
<text x="26" y="522" class="code">my_foo</text>
<path class="arrow" d="M127 514H282"/>
<text x="173" y="508" class="small" text-anchor="middle">所有权</text>
<text x="298" y="522" class="code">arg</text>
<text x="24" y="552" class="small">my_foo 不再拥有原对象</text>
<text x="24" y="582" class="small">std::move 单独出现不保证转移</text>
</svg>
