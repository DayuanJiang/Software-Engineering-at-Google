.cg-ch14-03[data-layout="mobile"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch14-03[data-layout="mobile"] .primary-path {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch14-03m-primary-arrow)}
.cg-ch14-03[data-layout="mobile"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
