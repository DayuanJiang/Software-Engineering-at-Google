<text x="42" y="270" class="small" text-anchor="start">重放 · 开发 / 提交前</text>
<g data-box="42,281,344,70"><rect x="42" y="281" width="344" height="70" rx="6" class="warm"/>
<text x="214.0" y="310" class="strong" text-anchor="middle">读取日志，按请求匹配</text>
<text x="214.0" y="338" class="small" text-anchor="middle">不实时调用真实依赖</text>
</g>
<g data-box="50,390,142,82"><rect x="50" y="390" width="142" height="82" rx="6" class="primary"/>
<text x="121.0" y="421" class="strong" text-anchor="middle">东京</text>
<text x="121.0" y="453" class="small" text-anchor="middle">返回响应 T</text>
</g>
<g data-box="226,390,160,82"><rect x="226" y="390" width="160" height="82" rx="6" class="danger"/>
<text x="306.0" y="421" class="strong" text-anchor="middle">大阪</text>
<text x="306.0" y="453" class="small" text-anchor="middle">无匹配，失败</text>
</g>
<path d="M121 351V388" class="primary-path" data-connector="true"/>
<path d="M306 351V388" class="danger-path" data-connector="true"/>
<path d="M306 472V493H22V190H40" class="danger-path" data-connector="true" stroke-dasharray="6 5"/>
<text x="42" y="524" class="strong" text-anchor="start">新请求需工程师重新录制</text>
