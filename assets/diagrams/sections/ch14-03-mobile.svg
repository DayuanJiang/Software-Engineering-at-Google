</defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="22" y="34" class="strong" text-anchor="start">日志没有这个请求，</text>
<text x="22" y="63" class="strong" text-anchor="start">重放怎么办？</text>
<text x="22" y="95" class="small" text-anchor="start">地图请求为示意，非真实 API 格式</text>
