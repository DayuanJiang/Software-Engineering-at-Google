<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch14-03" data-layout="mobile" role="img" aria-labelledby="ch14-03m-title ch14-03m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch14-03m-title">日志没有这个请求，重放怎么办？</title>
<desc id="ch14-03m-desc">地图请求为教学示意，不是 Google Maps 真实 API 格式。录制模式在提交后调用真实依赖，只有测试通过才保存东京请求和响应 T。开发或提交前重放时，东京请求匹配后返回 T；大阪新请求没有匹配项，重放不能通过，需要工程师运行录制模式。重放不实时调用依赖，日志匹配不证明依赖当前契约正确。</desc>
<style>
.cg-ch14-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch14-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch14-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch14-03[data-layout="mobile"] .guide {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch14-03[data-layout="mobile"] .boundary {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2;stroke-dasharray:7 5}
