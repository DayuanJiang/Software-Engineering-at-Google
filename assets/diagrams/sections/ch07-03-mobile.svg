<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch07-03" data-layout="mobile" role="img" aria-labelledby="ch07-03m-title ch07-03m-desc">
  <title id="ch07-03m-title">生产力不只有速度</title>
  <desc id="ch07-03m-desc">质量、注意力、认知复杂度、节奏和速度、满意度是彼此权衡的五个方面。Readability 研究设定质量、学习指导、速度和满意度目标，没有注意力目标。表格不表示评分、排名或等权重。</desc>
  <style>
.cg-ch07-03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch07-03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch07-03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch07-03[data-layout="mobile"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch07-03m-arrow)}
.cg-ch07-03[data-layout="mobile"] .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
</style>
  <defs>
    <marker id="ch07-03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
  </defs>
  <rect width="420" height="600" fill="var(--diagram-bg,#fff)" />
  <text x="24" y="39" text-anchor="start" class="strong">生产力不只有速度</text>
  <text x="24" y="70" text-anchor="start" class="small">QUANTS 与 Readability 目标</text>
  <rect x="24" y="96" width="372" height="72" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
  <text x="40" y="123" text-anchor="start" class="strong">质量</text>
  <text x="40" y="152" text-anchor="start" class="small">更高质量、一致性与代码健康</text>
  <rect x="24" y="179" width="372" height="72" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" />
  <text x="40" y="206" text-anchor="start" class="strong">注意力</text>
  <text x="40" y="235" text-anchor="start" class="small">此案例未设目标，不强行度量</text>
  <rect x="24" y="262" width="372" height="72" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
  <text x="40" y="289" text-anchor="start" class="strong">认知复杂度</text>
  <text x="40" y="318" text-anchor="start" class="small">学习代码库与实践，获得指导</text>
  <rect x="24" y="345" width="372" height="72" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
  <text x="40" y="372" text-anchor="start" class="strong">节奏和速度</text>
  <text x="40" y="401" text-anchor="start" class="small">更快、更高效地完成工作</text>
  <rect x="24" y="428" width="372" height="72" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
  <text x="40" y="455" text-anchor="start" class="strong">满意度</text>
  <text x="40" y="484" text-anchor="start" class="small">认可收益，参与体验积极</text>
  <path d="M24 530H396" class="line" />
  <text x="24" y="552" text-anchor="start" class="small">五个方面彼此权衡，不是单一总分</text>
  <text x="24" y="579" text-anchor="start" class="small">避免只优化速度，却损害其他目标</text>
</svg>
