<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch20-03" data-layout="mobile" role="img" aria-labelledby="ch20-03m-title ch20-03m-desc">
<title id="ch20-03m-title">诊断正确，为什么仍被认为无用？</title>
<desc id="ch20-03m-desc">用 Guava 只支持 %s 的原文案例，对照用户和分析器对占位符的不同计数，再展示无用反馈如何促成诊断改写，并与请修复的处理对象区分。 格式串、参数和简短提示均为按原文构造或意译，不是精确 API 调用或诊断原文；不推广到所有 Guava 函数。点击无用本身既不证明技术误报，也不表示必然禁用分析器。</desc>
<style>
.cg-ch20-03[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch20-03[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch20-03[data-layout="mobile"] .strong{font-weight:600}
.cg-ch20-03[data-layout="mobile"] .code{font-family:Menlo,Consolas,monospace}
.cg-ch20-03[data-layout="mobile"] .connector{fill:none;stroke-width:2;stroke-linejoin:round}
.cg-ch20-03[data-layout="mobile"] .rule{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch20-03[data-layout="mobile"] .primary-edge{stroke:var(--diagram-primary,#087f6d)}
.cg-ch20-03[data-layout="mobile"] .secondary-edge{stroke:var(--diagram-secondary,#2f6eac)}
.cg-ch20-03[data-layout="mobile"] .danger-edge{stroke:var(--diagram-danger,#b54750)}
</style>
<defs><marker id="ch20-03m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch20-03m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch20-03m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start">诊断正确，为什么仍被认为无用？</text>
<text x="24" y="69" class="small" text-anchor="start">Guava 案例；输入示意、提示意译</text>
<rect id="ch20-03m-shape-1" x="24" y="88" width="372" height="54" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="122" class="" text-anchor="start" data-owner="ch20-03m-shape-1">格式串 &quot;n=%d&quot;，参数 7</text>
<text x="24" y="177" class="strong" text-anchor="start">用户：1 个占位符，1 个参数</text>
<text x="24" y="210" class="strong" text-anchor="start">实际：0 个 %s，1 个参数</text>
<text x="24" y="240" class="small" text-anchor="start">该函数不识别 %d，只识别 %s</text>
<rect id="ch20-03m-shape-2" x="24" y="262" width="372" height="77" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="293" class="strong" text-anchor="start" data-owner="ch20-03m-shape-2">旧提示：“参数过多”</text>
<text x="40" y="323" class="small" text-anchor="start" data-owner="ch20-03m-shape-2">用户：“数量相等，分析错了？”</text>
<text x="24" y="368" class="small" text-anchor="start">“无用”反馈给分析器作者</text>
<path class="connector primary-edge" d="M374 339V382" marker-end="url(#ch20-03m-primary-arrow)"/>
<rect id="ch20-03m-shape-3" x="24" y="388" width="372" height="78" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="40" y="419" class="strong" text-anchor="start" data-owner="ch20-03m-shape-3">改后：“仅接受 %s 占位符”</text>
<text x="40" y="450" class="small" text-anchor="start" data-owner="ch20-03m-shape-3">本例可把 n=%d 改成 n=%s</text>
<text x="24" y="497" class="small" text-anchor="start">原文：这类“无用”报告不再涌入。</text>
<text x="24" y="532" class="small" text-anchor="start">“请修复”要求变更作者改代码。</text>
<text x="24" y="560" class="small" text-anchor="start">高“无用”率且不着手改进：</text>
<text x="24" y="586" class="small" text-anchor="start">团队可禁用分析器。</text>
</svg>
