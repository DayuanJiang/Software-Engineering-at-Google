<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch01-01" data-layout="mobile" role="img" aria-labelledby="ch01-01m-title ch01-01m-desc">
  <title id="ch01-01m-title">维护生命周期：从一次运行到持续变更</title>
  <desc id="ch01-01m-desc">概念示例，时间长度、事件次序与间隔不按比例。短期脚本完成任务后结束，可以不做当次非关键升级。长期项目在持续提供价值的过程中，需要应对依赖、语言、操作系统和业务需求的变化。修改、验证和维护持续进行，可以选择不升级，但要保留改变的能力。</desc>
  <style>
    .cg-ch01-01[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
    .cg-ch01-01[data-layout="mobile"] .strong {font-weight:600}
    .cg-ch01-01[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
    .cg-ch01-01[data-layout="mobile"] .time {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch01-01m-arrow)}
  </style>
  <defs>
    <marker id="ch01-01m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/>
    </marker>
  </defs>
  <rect width="420" height="600" fill="var(--diagram-bg,#fff)"/>
  <text x="24" y="38" class="strong">代码需要维护多久？</text>
  <text x="24" y="70" class="small">维护生命周期，不是单次运行时间</text>

  <text x="24" y="109" class="strong">一次性脚本</text>
  <rect x="24" y="124" width="176" height="36" rx="4" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
  <text x="112" y="149" text-anchor="middle">开发 / 运行</text>
  <path d="M200 142H254M254 126V158" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2"/>
  <text x="272" y="149">结束</text>
  <text x="24" y="189" class="small">当次非关键升级，可以不做</text>
  <path d="M24 212H396" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1"/>

  <text x="24" y="244" class="strong">长期项目：持续提供价值</text>
  <rect x="52" y="269" width="32" height="182" rx="4" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <path d="M68 280V462" class="time"/>
  <circle cx="68" cy="286" r="7" fill="var(--diagram-primary,#087f6d)"/>
  <path d="M68 329L77 338L68 347L59 338Z" fill="var(--diagram-primary,#087f6d)"/>
  <path d="M68 381L77 390L68 399L59 390Z" fill="var(--diagram-secondary,#2f6eac)"/>
  <path d="M68 433L77 442L68 451L59 442Z" fill="var(--diagram-warm,#a56a1f)"/>
  <text x="98" y="294">开发</text>
  <text x="98" y="346">依赖 / 语言更新</text>
  <text x="98" y="398">操作系统变化</text>
  <text x="98" y="450">业务需求变化</text>
  <text x="24" y="484">修改、验证、维护持续进行</text>

  <rect x="24" y="502" width="372" height="64" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="40" y="528" class="strong"><tspan x="40">可以选择不升级</tspan><tspan x="40" dy="27">但要保留改变的能力</tspan></text>
  <text x="24" y="588" class="small">概念示例；事件次序与间隔非实测</text>
</svg>
