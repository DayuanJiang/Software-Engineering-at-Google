<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch09-02" data-layout="desktop" role="img" aria-labelledby="ch09-02-title ch09-02-desc">
  <title id="ch09-02-title">三项批准，不是三个人</title>
  <desc id="ch09-02-desc">同行 LGTM 检查正确性与可理解性，代码所有者批准目录适用性与维护责任，Readability 批准语言规范与最佳实践。三项均需满足，但可以由一个合格审查者兼任；作者可满足后两项，同行 LGTM 必须来自别人。</desc>
  <style>
.cg-ch09-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch09-02[data-layout="desktop"] .strong {font-weight:600}
.cg-ch09-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch09-02[data-layout="desktop"] .arrow {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2;marker-end:url(#ch09-02-arrow)}
.cg-ch09-02[data-layout="desktop"] .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:2}
</style>
  <defs>
    <marker id="ch09-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
  </defs>
  <rect width="960" height="480" fill="var(--diagram-bg,#fff)" />
  <text x="32" y="40" text-anchor="start" class="strong">三项批准，不是三个人</text>
  <text x="32" y="70" text-anchor="start" class="small">分开要求，允许角色兼任</text>
  <rect id="ch09-02-box1" x="32" y="117" width="258" height="141" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="161.0" y="161.66" text-anchor="middle" class="strong" data-box="ch09-02-box1">同行 LGTM</text>
  <text x="161.0" y="195.66" text-anchor="middle" data-box="ch09-02-box1">正确性</text>
  <text x="161.0" y="229.66" text-anchor="middle" data-box="ch09-02-box1">可理解性</text>
  <rect id="ch09-02-box2" x="352" y="117" width="258" height="141" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="481.0" y="161.66" text-anchor="middle" class="strong" data-box="ch09-02-box2">代码所有者批准</text>
  <text x="481.0" y="195.66" text-anchor="middle" data-box="ch09-02-box2">目录适用性</text>
  <text x="481.0" y="229.66" text-anchor="middle" data-box="ch09-02-box2">长期维护责任</text>
  <rect id="ch09-02-box3" x="672" y="117" width="256" height="141" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="800.0" y="161.66" text-anchor="middle" class="strong" data-box="ch09-02-box3">Readability 批准</text>
  <text x="800.0" y="195.66" text-anchor="middle" data-box="ch09-02-box3">语言规范</text>
  <text x="800.0" y="229.66" text-anchor="middle" data-box="ch09-02-box3">最佳实践</text>
  <path d="M161 258V299H800V258M481 258V299" class="line" />
  <path d="M481 299V334" class="arrow" />
  <rect id="ch09-02-box4" x="232" y="334" width="496" height="59" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" />
  <text x="480.0" y="371.66" text-anchor="middle" class="strong" data-box="ch09-02-box4">三项要求同时满足，可由同一人兼任</text>
  <path d="M24 410H936" class="line" />
  <text x="32" y="432" text-anchor="start" class="small">作者可自行满足所有者与 Readability 要求，但 LGTM 必须来自另一位工程师</text>
</svg>
