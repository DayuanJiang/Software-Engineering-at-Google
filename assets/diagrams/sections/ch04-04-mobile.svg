<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch04-04" data-layout="mobile" role="img" aria-labelledby="ch04-04m-title ch04-04m-desc">
<title id="ch04-04m-title">与用户共同设计和改进</title>
<desc id="ch04-04m-desc">将弱势用户参与、从困难用例开始、衡量系统公平性和持续调整组成概念回路。价值观与投入不自动等于公平结果，需要反馈和专业知识。</desc>
<style>
.cg-ch04-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch04-04[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs><marker id="ch04-04m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker><marker id="ch04-04m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker><marker id="ch04-04m-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker><marker id="ch04-04m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker></defs>
<rect x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" text-anchor="start" class="strong">与用户共同设计和改进</text>
<g id="ch04-04m-node-1" data-box="52,96,338,80">
<rect x="52" y="96" width="338" height="80" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="221.0" y="129.5" text-anchor="middle" class="strong">让弱势用户参与</text>
<text x="221.0" y="158.5" text-anchor="middle" class="small">与用户共建，不是替用户猜</text>
</g>
<path d="M221 178L221 199" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch04-04m-arrow-primary)"/>
<g id="ch04-04m-node-2" data-box="52,204,338,80">
<rect x="52" y="204" width="338" height="80" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="221.0" y="237.5" text-anchor="middle" class="strong">从困难用例开始</text>
<text x="221.0" y="266.5" text-anchor="middle" class="small">从设计之初考虑包容性</text>
</g>
<path d="M221 286L221 307" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch04-04m-arrow-primary)"/>
<g id="ch04-04m-node-3" data-box="52,312,338,80">
<rect x="52" y="312" width="338" height="80" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="221.0" y="345.5" text-anchor="middle" class="strong">衡量系统公平性</text>
<text x="221.0" y="374.5" text-anchor="middle" class="small">借助相关领域专家的判断</text>
</g>
<path d="M221 394L221 415" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" marker-end="url(#ch04-04m-arrow-primary)"/>
<g id="ch04-04m-node-4" data-box="52,420,338,80">
<rect x="52" y="420" width="338" height="80" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="221.0" y="453.5" text-anchor="middle" class="strong">依据反馈持续改进</text>
<text x="221.0" y="482.5" text-anchor="middle" class="small">承担失败，修正做法</text>
</g>
<path d="M52 460H28V136H48" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" marker-end="url(#ch04-04m-arrow-secondary)"/>
<text x="24" y="550" text-anchor="start" class="small">价值观与投入不自动等于公平结果</text>
<text x="24" y="578" text-anchor="start" class="small">不要用公平换取短期开发速度</text>
</svg>
