<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" class="chapter-svg cg-ch03-04" data-layout="mobile" role="img" aria-labelledby="ch03-04m-title ch03-04m-desc">
<title id="ch03-04m-title">有资格后，还需代码审查吗？</title>
<desc id="ch03-04m-desc">仍然需要。对于同一种语言，未取得 Readability 资格的作者需由具资格审查者明确批准本项；具资格作者的 CL 隐含满足本项。两种情况都仍需代码审查，本项满足不代表全部批准齐备。教学反馈引用准则并解释理由。范围为本书的单体仓库制度，明确短期代码可有豁免。</desc>
<style>
.cg-ch03-04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03-04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch03-04[data-layout="mobile"] .strong {font-weight:600}
.cg-ch03-04[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750)}
</style>
