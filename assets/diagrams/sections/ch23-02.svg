<svg xmlns="http://www.w3.org/2000/svg" id="ch23-02-root" class="chapter-svg cg-ch23-02" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="ch23-02-title ch23-02-desc">
  <title id="ch23-02-title">两个提交前通过，为什么组合后失败？</title>
  <desc id="ch23-02-desc">用于解释空中碰撞的假设例子，不是书中的具体故障。原配置使用 v1，原客户端支持 v1 与 v2。变更 A 修改配置文件，改用 v2；变更 B 修改客户端文件，只保留 v1。测试要求客户端能处理配置指定的协议。同一旧基线上，A 和 B 各自通过该测试；并发提交后 A+B 的配置使用 v2，客户端却只支持 v1，测试失败。提交前结果不保证未经测试的组合安全；提交后补测和处置仍然必要。</desc>
  <style>
  .cg-ch23-02#ch23-02-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
  .cg-ch23-02#ch23-02-root .small {font-size:20px;fill:var(--diagram-muted,#686868)}
  .cg-ch23-02#ch23-02-root .strong {font-weight:600}
  .cg-ch23-02#ch23-02-root .good {fill:var(--diagram-primary,#087f6d)}
  .cg-ch23-02#ch23-02-root .bad {fill:var(--diagram-danger,#b54750)}
  .cg-ch23-02#ch23-02-root .pending {fill:var(--diagram-warm,#a56a1f)}
  </style>
  <defs><marker id="ch23-02-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#686868)"/></marker></defs>
  <rect x="0" y="0" width="960" height="480" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="42" class="strong" data-box="16,8,928,464">两个提交前通过，为什么组合后失败？</text>
  <text x="32" y="78" class="small" data-box="16,8,928,464">假设例子：A 改配置文件；B 改客户端文件。测试要求：客户端能处理配置指定的协议。</text>
  <text x="424" y="126" class="strong" data-box="272,100,304,42" text-anchor="middle">原客户端：支持 v1、v2</text>
  <text x="754" y="126" class="strong" data-box="602,100,326,42" text-anchor="middle">B 客户端：只支持 v1</text>
  <text x="48" y="211" class="strong" data-box="32,151,238,102">原配置：使用 v1</text>
  <text x="48" y="321" class="strong" data-box="32,261,238,102">A 配置：使用 v2</text>
  <rect x="278" y="151" width="318" height="98" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="294" y="185" class="strong" data-box="278,151,318,98">旧基线</text>
  <text x="294" y="226" class="good" data-box="278,151,318,98">v1 可处理：通过</text>
  <rect x="610" y="151" width="318" height="98" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="626" y="185" class="strong" data-box="610,151,318,98">仅 B</text>
  <text x="626" y="226" class="good" data-box="610,151,318,98">v1 可处理：通过</text>
  <rect x="278" y="261" width="318" height="98" fill="var(--diagram-primary-soft,#e5f4ee)"/>
  <text x="294" y="295" class="strong" data-box="278,261,318,98">仅 A</text>
  <text x="294" y="336" class="good" data-box="278,261,318,98">v2 可处理：通过</text>
  <rect x="610" y="261" width="318" height="98" fill="var(--diagram-danger-soft,#faecee)"/>
  <text x="626" y="295" class="strong" data-box="610,261,318,98">A + B</text>
  <text x="626" y="336" class="bad" data-box="610,261,318,98">v2 不支持：失败</text>
  <text x="32" y="402" class="strong" data-box="16,8,928,464">提交前分别测了「旧基线 + A」和「旧基线 + B」，没有测 A + B。</text>
  <text x="32" y="444" class="small" data-box="16,8,928,464">提交后检查实际组合并定位、修复或回滚；较小项目也可串行提交，避开这类竞态。</text>
</svg>
