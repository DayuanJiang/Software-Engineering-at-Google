<path d="M136 265H201V217" class="primary-line" data-connector="true"/>
<text x="32" y="332" class="strong" text-anchor="start">旧目标白名单：{甲, 乙}</text>
<path d="M447 103L447 350" class="guide"/>
<text x="484" y="118" class="strong" text-anchor="start">甲迁出后，定期删去甲的许可</text>
<g data-box="484,143,104,52">
<rect x="484" y="143" width="104" height="52" rx="5" class="secondary"/>
<text x="536.0" y="177.0" class="strong" text-anchor="middle">甲</text>
</g>
<g data-box="772,142,156,54">
<rect x="772" y="142" width="156" height="54" rx="5" class="primary"/>
<text x="850.0" y="177.0" class="strong" text-anchor="middle">新系统</text>
</g>
<path d="M588 169H770" class="primary-line" data-connector="true" marker-end="url(#ch15-04-primary-arrow)"/>
<g data-box="484,239,104,52">
<rect x="484" y="239" width="104" height="52" rx="5" class="secondary"/>
<text x="536.0" y="273.0" class="strong" text-anchor="middle">乙</text>
</g>
<g data-box="772,238,156,54">
<rect x="772" y="238" width="156" height="54" rx="5" class="danger"/>
<text x="850.0" y="273.0" class="strong" text-anchor="middle">旧系统</text>
</g>
<path d="M588 265H770" class="primary-line" data-connector="true" marker-end="url(#ch15-04-primary-arrow)"/>
<text x="484" y="332" class="strong" text-anchor="start">旧目标白名单：{乙}</text>
<rect x="32" y="355" width="896" height="46" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="52" y="386" class="small" text-anchor="start">甲回退或新增丙再依赖旧目标：构建规则拒绝；乙仍在使用，不能据此删旧系统。</text>
<text x="32" y="433" class="" text-anchor="start">甲的引用由 LSC 等工具更新，经审查与测试核对行为；乙的迁移仍是剩余工作。</text>
<text x="32" y="461" class="" text-anchor="start">Tricorder 另在符号级提醒新增旧调用；迁移与防倒退同时推进。</text>
</svg>
