<svg xmlns="http://www.w3.org/2000/svg" id="ch25-04-root" class="chapter-svg cg-ch25-04" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="ch25-04-title ch25-04-desc">
<title id="ch25-04-title">服务要收回资源，批处理会怎样？</title>
<desc id="ch25-04-desc">示例沿用书中的 Borg 策略：搜索服务平时未使用的预留资源可由日志分析批处理借用，但借用可被抢占。搜索请求增加、需要 CPU 时暂停批处理，计算不再推进但内存仍占用；需要 RAM 时终止批处理，释放内存而失去进程状态，重启后重做未上报的数据块。暂停并不释放内存；同一份服务预留余量不能再作为另一份不可抢占服务承诺。所有位置和形状只编码条件与状态，不代表容量、资源比例、费用或性能数据。</desc>
<style>
.cg-ch25-04#ch25-04-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch25-04#ch25-04-root .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch25-04#ch25-04-root .strong {font-weight:600}
.cg-ch25-04#ch25-04-root .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch25-04-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch25-04-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch25-04-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch25-04-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch25-04-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="480" rx="0" fill="var(--diagram-bg,#fff)" stroke="none" stroke-width="1.5"/>
<text x="32" y="42" text-anchor="start" class="strong">服务要收回资源，批处理会怎样？</text>
<text x="32" y="78" text-anchor="start" class="small">Borg 策略示例：借用服务余量的日志分析必须允许被抢占</text>
<rect x="32" y="108" width="896" height="64" rx="0" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="none" stroke-width="1.5"/>
<text x="48" y="148" text-anchor="start" class="strong" data-box="32,108,896,64">平时：搜索未用的预留资源 → 日志分析借用（可抢占）</text>
<path data-connector="true" d="M480 172V205" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch25-04-warm-arrow)"/>
<text x="480" y="240" text-anchor="middle" class="strong">搜索请求增加：需要收回哪种资源？</text>
<path data-connector="true" d="M480 255V269H240V284" fill="none" stroke="var(--diagram-warm,#a56a1f)" stroke-width="2" marker-end="url(#ch25-04-warm-arrow)"/>
<path data-connector="true" d="M480 269H720V284" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" marker-end="url(#ch25-04-danger-arrow)"/>
<rect x="32" y="294" width="416" height="114" rx="0" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="50" y="327" text-anchor="start" class="strong" data-box="32,294,416,114">要 CPU：暂停日志分析</text>
<text x="50" y="360" text-anchor="start" class="small" data-box="32,294,416,114">CPU 让给服务；内存仍占用</text>
<text x="50" y="393" text-anchor="start" class="small" data-box="32,294,416,114">暂停期间不再推进计算</text>
<rect x="512" y="294" width="416" height="114" rx="0" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="530" y="327" text-anchor="start" class="strong" data-box="512,294,416,114">要 RAM：终止日志分析</text>
<text x="530" y="360" text-anchor="start" class="small" data-box="512,294,416,114">释放内存；进程状态丢失</text>
<text x="530" y="393" text-anchor="start" class="small" data-box="512,294,416,114">重启后重做尚未上报的数据块</text>
<text x="32" y="454" text-anchor="start" class="small">暂停不等于释放内存；这份余量不能再许诺给不可抢占的服务。</text>
</svg>
