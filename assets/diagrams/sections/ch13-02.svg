<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" class="chapter-svg cg-ch13-02" data-layout="desktop" role="img" aria-labelledby="ch13-02-title ch13-02-desc">
<title id="ch13-02-title">fake、stub 与交互验证不是一回事</title>
<desc id="ch13-02-desc">区分伪实现的轻量行为、打桩的预设响应和交互测试的调用验证；mock 是框架创建的对象，框架既能打桩也能验证交互。</desc>
<style>
.cg-ch13-02[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch13-02[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch13-02[data-layout="desktop"] .strong {font-weight:600}
</style>
<defs><marker id="ch13-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker></defs>
<rect width="960" height="480" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" text-anchor="start" class="strong" data-font-size="24">三种技术，各自验证什么</text>
<text x="32" y="76" text-anchor="start" class="small" data-font-size="20">mock 对象与使用技术不能混称</text>
<rect x="32" y="126" width="280" height="219" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" />
<text x="48" y="158" text-anchor="start" class="strong" data-font-size="24">fake：伪实现</text>
<text x="48" y="191" text-anchor="start" class="small" data-font-size="20">轻量级实现</text>
<text x="48" y="220" text-anchor="start" class="small" data-font-size="20">行为与真实实现相似</text>
<text x="48" y="249" text-anchor="start" class="small" data-font-size="20">可以保留内部状态</text>
<text x="48" y="278" text-anchor="start" class="small" data-font-size="20">例：保存后再读取</text>
<rect x="340" y="126" width="280" height="219" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" />
<text x="356" y="158" text-anchor="start" class="strong" data-font-size="24">stub：预设响应</text>
<text x="356" y="191" text-anchor="start" class="small" data-font-size="20">在测试中指定行为</text>
<text x="356" y="220" text-anchor="start" class="small" data-font-size="20">返回特定值或错误</text>
<text x="356" y="249" text-anchor="start" class="small" data-font-size="20">不自动验证真实契约</text>
<text x="356" y="278" text-anchor="start" class="small" data-font-size="20">例：返回指定用户</text>
<rect x="648" y="126" width="280" height="219" rx="6" fill="var(--diagram-warm-soft,#fff3dc)" />
<text x="664" y="158" text-anchor="start" class="strong" data-font-size="24">交互测试</text>
<text x="664" y="191" text-anchor="start" class="small" data-font-size="20">检查函数调用方式</text>
<text x="664" y="220" text-anchor="start" class="small" data-font-size="20">参数、次数或顺序</text>
<text x="664" y="249" text-anchor="start" class="small" data-font-size="20">不证明结果正确</text>
<text x="664" y="278" text-anchor="start" class="small" data-font-size="20">例：验证 lookup 调用</text>
<text x="32" y="398" text-anchor="start" class="small" data-font-size="20">模拟框架创建 mock 对象：同一个对象既能被打桩，也能用于验证交互。</text>
<text x="32" y="440" text-anchor="start" class="small" data-font-size="20">因此，本章不把 mocking 当作所有测试替身的统称，也不把框架等同于交互测试。</text>
</svg>
