<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch14-01" data-layout="mobile" role="img" aria-labelledby="ch14-01m-title ch14-01m-desc" viewBox="0 0 420 600" width="420" height="600">
<title id="ch14-01m-title">复用生产环境，省了什么又暴露了什么？</title>
<desc id="ch14-01m-desc">Webdriver Torso 案例：自动化脚本把生成的测试视频上传到 YouTube 生产环境来检查视频质量。频道和多数视频公开，公众与媒体发现这些测试内容。复用已有生产 SUT 可省去另建环境的维护，但还需保障测试安全；并非所有成本随仿真度单调增加，也不能由环境维护节省推出总成本更低。</desc>
