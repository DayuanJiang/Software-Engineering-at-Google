<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch21-03" data-layout="mobile" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="ch21-03m-title ch21-03m-desc">
<title id="ch21-03m-title">版本允许，不等于用法兼容</title>
<desc id="ch21-03m-desc">两个源于原文的反例，函数签名、数组与补丁编号为示意。第一例只有未使用的 Bar 从 Bar() 改为 Bar(mode)，liba 与 libb 调用的 Foo(x) 不变；1.x 约束拒绝 2.x，却未反映本例的真实使用范围。第二例契约不承诺顺序，版本 1.1.14 输出 A、B，1.1.15 输出 B、A；调用方断言首项是 A，旧版通过新版失败，尽管 1.1.14≤v&lt;2 允许新补丁。判断兼容必须结合具体用法，不能把 SemVer 或解算器结果当作行为证明。</desc>
<style>
.cg-ch21-03[data-layout="mobile"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch21-03[data-layout="mobile"] .small{font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch21-03[data-layout="mobile"] .strong{font-weight:600}
.cg-ch21-03[data-layout="mobile"] .primary{fill:var(--diagram-primary,#087f6d)}
.cg-ch21-03[data-layout="mobile"] .secondary{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch21-03[data-layout="mobile"] .warm{fill:var(--diagram-warm,#a56a1f)}
.cg-ch21-03[data-layout="mobile"] .danger{fill:var(--diagram-danger,#b54750)}
</style><defs>
<marker id="ch21-03m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch21-03m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch21-03m-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect id="ch21-03m-shape-1" x="0" y="0" width="420" height="600" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="20" y="36" class="strong" text-anchor="start">版本允许，不等于用法兼容</text>
<text x="20" y="67" class="small" text-anchor="start">原文反例；签名 / 输出 / 编号示意</text>
<text x="20" y="106" class="strong warm" text-anchor="start">只改未使用的 Bar</text>
<text x="186" y="143" class="strong" text-anchor="middle">1.x</text>
<text x="332" y="143" class="strong" text-anchor="middle">2.x</text>
<rect id="ch21-03m-shape-2" x="20" y="159" width="380" height="40" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="30" y="186" class="small" text-anchor="start" data-owner="ch21-03m-shape-2">使用</text>
<text x="186" y="186" class="" text-anchor="middle" data-owner="ch21-03m-shape-2">Foo(x)</text>
<text x="332" y="186" class="" text-anchor="middle" data-owner="ch21-03m-shape-2">Foo(x)</text>
<rect id="ch21-03m-shape-3" x="20" y="201" width="380" height="40" rx="0" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="30" y="228" class="small" text-anchor="start" data-owner="ch21-03m-shape-3">未用</text>
<text x="186" y="228" class="" text-anchor="middle" data-owner="ch21-03m-shape-3">Bar()</text>
<text x="332" y="228" class="" text-anchor="middle" data-owner="ch21-03m-shape-3">Bar(mode)</text>
<text x="20" y="265" class="small" text-anchor="start">1.x 排除 2.x；只用 Foo 的代码却可用。</text>
<path d="M20 285h380" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" fill="none"/>
<text x="20" y="320" class="strong danger" text-anchor="start">无序流换了顺序</text>
<text x="158" y="353" class="strong" text-anchor="middle">1.1.14</text>
<text x="330" y="353" class="strong" text-anchor="middle">1.1.15</text>
<text x="20" y="400" class="small" text-anchor="start">out</text>
<rect id="ch21-03m-shape-4" x="115" y="369" width="40" height="40" rx="3" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="135" y="397" class="strong" text-anchor="middle" data-owner="ch21-03m-shape-4">A</text>
<rect id="ch21-03m-shape-5" x="161" y="369" width="40" height="40" rx="3" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="181" y="397" class="strong" text-anchor="middle" data-owner="ch21-03m-shape-5">B</text>
<rect id="ch21-03m-shape-6" x="287" y="369" width="40" height="40" rx="3" fill="var(--diagram-warm-soft,#fff3dc)" stroke="var(--diagram-warm,#a56a1f)" stroke-width="1.5"/>
<text x="307" y="397" class="strong" text-anchor="middle" data-owner="ch21-03m-shape-6">B</text>
<rect id="ch21-03m-shape-7" x="333" y="369" width="40" height="40" rx="3" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="353" y="397" class="strong" text-anchor="middle" data-owner="ch21-03m-shape-7">A</text>
<text x="20" y="446" class="" text-anchor="start">assert(out[0] == &#x27;A&#x27;)</text>
<text x="20" y="479" class="strong danger" text-anchor="start">旧：通过；新：失败</text>
<text x="20" y="511" class="small" text-anchor="start">1.1.14 ≤ v &lt; 2 仍允许新补丁</text>
<text x="20" y="551" class="small" text-anchor="start">具体用法才决定影响；</text>
<text x="20" y="579" class="small" text-anchor="start">SemVer 不是行为兼容的证明。</text>
</svg>
