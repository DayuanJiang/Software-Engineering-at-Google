  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">代码规范为什么要定，怎么定？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">谷歌的风格指南是给读者写的，目标是让代码库在时间和规模上</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">都撑得住</text>
