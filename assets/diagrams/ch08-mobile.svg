  <text x="74.0" y="263.0" class="h18" text-anchor="start">自动执行</text>
  <text x="74.0" y="288.0" class="c15" text-anchor="start">格式化器和检查工具替人执行规则，人只处理</text>
  <text x="74.0" y="310.0" class="c15" text-anchor="start">需要判断的部分</text>
