  <text x="22.0" y="586.0" class="c13" text-anchor="start">然后回到第一步，循环往复。并非所有做法都该写成规则：指导</text>
  <text x="22.0" y="606.0" class="c13" text-anchor="start">是建议，规则是必须；一致性本身就是价值</text>
