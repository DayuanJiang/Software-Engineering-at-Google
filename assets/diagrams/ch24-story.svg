<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch24-story" data-layout="desktop" role="img" aria-labelledby="ch24-story-title ch24-story-desc">
  <title id="ch24-story-title">从一年几次的大发布，到每一次都小到不可怕</title>
  <desc id="ch24-story-desc">本章回顾。从一年几次的大发布，到每一次都小到不可怕。起点：发布很大、很少、很吓人。几个月的改动一起上线，出了问题不知道是哪一处。于是发布前反复检查，越检查越慢，越慢越大。；转折：越快越安全：小批量、频繁发布。每次改动小，风险就小，出问题也容易定位。这需要模块化架构和近乎持续的集成，是团队协作的事。；做法：开关、发布列车、分阶段发布。部署代码和启用功能分开；固定节奏发车，没上车的等下一班；先给少数用户和设备，以真实环境为基准。；取舍：只交付会被用的功能，用数据尽早决策。监控每项功能的成本和价值，没人用的就撤；把数据驱动的判断往前挪；把纪律写进部署流程。。这一章最想强调的：越快越安全：尽早、小批量、频繁地发布，每次的风险都更低。 用开关单独评估变更，以真实情况为基准，只交付会被使用的功能。</desc>
