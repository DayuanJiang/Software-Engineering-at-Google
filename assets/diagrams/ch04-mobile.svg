  <text x="74.0" y="149.0" class="h18" text-anchor="start">承认偏见是默认</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">团队和数据都带着自己的经验，没有刻意纠</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">正，产品就会自动带上盲点</text>
  <path d="M210.0 208.0 L210.0 224.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04m-arrow)"/>
