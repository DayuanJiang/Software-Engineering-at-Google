  <text x="74.0" y="263.0" class="h18" text-anchor="start">建立多元团队</text>
  <text x="74.0" y="288.0" class="c15" text-anchor="start">不同背景的人更容易预见不同用户的处境，这</text>
  <text x="74.0" y="310.0" class="c15" text-anchor="start">直接决定产品质量</text>
  <path d="M210.0 322.0 L210.0 338.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04m-arrow)"/>
  <rect x="22.0" y="346.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="372.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,364.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
  <text x="74.0" y="377.0" class="h18" text-anchor="start">挑战既定流程</text>
  <text x="74.0" y="402.0" class="c15" text-anchor="start">拒绝单一方案；从需求、设计到测试，每一步</text>
  <text x="74.0" y="424.0" class="c15" text-anchor="start">都问：这对谁不适用？</text>
  <path d="M210.0 436.0 L210.0 452.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04m-arrow)"/>
  <rect x="22.0" y="460.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="486.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,478.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
  <text x="74.0" y="491.0" class="h18" text-anchor="start">用结果检验价值</text>
  <text x="74.0" y="516.0" class="c15" text-anchor="start">价值观要落到结果上：宁可放慢，也别发布会</text>
  <text x="74.0" y="538.0" class="c15" text-anchor="start">伤害部分用户的产品</text>
  <text x="22.0" y="570.0" class="c13" text-anchor="start">保持好奇，继续前行：公平是一直要做的工程工作，没有一次做</text>
  <text x="22.0" y="590.0" class="c13" text-anchor="start">完的时候</text>
  <rect x="22.0" y="616.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="637.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="663.0" class="answer-m" text-anchor="start">为所有人做工程，先承认自己有盲点，再把公</text>
  <text x="36.0" y="689.0" class="answer-m" text-anchor="start">平当作工程目标去验证</text>
