<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch04" data-layout="mobile" role="img" aria-labelledby="ch04m-title ch04m-desc">
<title id="ch04m-title">产品伤害为何也会影响团队建设？</title>
<desc id="ch04m-desc">本章的风险联系：Google Photos 的误分类伤害黑人用户；求职者也可能失去对组织包容性的信任，从而妨碍代表性招聘目标。虚线表示可能影响，不是测量出的效应。产品侧需与用户共建并衡量结果，组织侧需同时审视招聘、留任与成长；人员代表性不保证公平。</desc>
<style>
.cg-ch04[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch04[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch04[data-layout="mobile"] .strong {font-weight:600}
</style>
<defs>
<marker id="ch04m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch04m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch04m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
<marker id="ch04m-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker>
</defs>
<rect x="0" y="0" width="420" height="680" rx="0" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="35" text-anchor="start" class="strong">产品伤害为何也会</text>
<text x="24" y="65" text-anchor="start" class="strong">影响团队建设？</text>
<text x="24" y="96" text-anchor="start" class="small">书中风险联系；虚线表示可能影响</text>
<g id="ch04m-product" data-box="24,116,372,89">
<rect x="24" y="116" width="372" height="89" rx="6" fill="var(--diagram-danger-soft,#faecee)"/>
<text x="210" y="150" text-anchor="middle" class="strong">产品失误：照片识别误分类</text>
<text x="210" y="183" text-anchor="middle" class="">伤害黑人用户</text>
</g>
<g id="ch04m-trust" data-box="24,243,372,89">
<rect x="24" y="243" width="372" height="89" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="210" y="277" text-anchor="middle" class="strong">求职者也可能失去信任</text>
<text x="210" y="310" text-anchor="middle" class="">怀疑组织是否包容</text>
</g>
<g id="ch04m-hiring" data-box="24,370,372,89">
<rect x="24" y="370" width="372" height="89" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)"/>
<text x="210" y="404" text-anchor="middle" class="strong">组织后果</text>
<text x="210" y="437" text-anchor="middle" class="">代表性招聘目标可能更难实现</text>
</g>
<polyline data-connector="true" points="210,210 210,238" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04m-arrow-muted)" stroke-dasharray="6 5"/>
<text x="230" y="231" text-anchor="start" class="small">可能</text>
<polyline data-connector="true" points="210,337 210,365" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch04m-arrow-muted)" stroke-dasharray="6 5"/>
<text x="230" y="358" text-anchor="start" class="small">可能</text>
<g id="ch04m-product-response" data-box="24,480,372,75">
<rect x="24" y="480" width="4" height="75" rx="0" fill="var(--diagram-primary,#087f6d)"/>
<text x="40" y="504" text-anchor="start" class="strong">产品侧：与弱势用户共建</text>
<text x="40" y="537" text-anchor="start" class="small">与专家衡量结果，修正设计</text>
</g>
<g id="ch04m-organization-response" data-box="24,566,372,75">
<rect x="24" y="566" width="4" height="75" rx="0" fill="var(--diagram-secondary,#2f6eac)"/>
<text x="40" y="590" text-anchor="start" class="strong">组织侧：招聘、留任与成长</text>
<text x="40" y="623" text-anchor="start" class="small">支持不同经验参与设计讨论</text>
</g>
<text x="24" y="664" text-anchor="start" class="small">人员代表性不保证数据或结果公平。</text>
</svg>
