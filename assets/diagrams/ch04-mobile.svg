  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">软件会不会伤害它没想到的用户？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">从照片被错误分类的伤害出发，这一章讲工程团队为什么会有盲</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">点，以及怎么补</text>
  <rect x="22.0" y="118.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
