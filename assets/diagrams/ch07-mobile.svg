  <circle cx="50.0" cy="558.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,550.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></g>
  <text x="74.0" y="563.0" class="h18" text-anchor="start">行动</text>
  <text x="74.0" y="588.0" class="c15" text-anchor="start">把改进融入日常工作流和激励，再跟踪结果</text>
  <path d="M210.0 600.0 L210.0 616.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch07m-arrow)"/>
  <text x="22.0" y="636.0" class="c13" text-anchor="start">然后回到第一步，循环往复。度量前先筛选：结果不会改变任何</text>
  <text x="22.0" y="656.0" class="c13" text-anchor="start">决策的项目，本身就不值得度量</text>
  <rect x="22.0" y="682.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="703.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="729.0" class="answer-m" text-anchor="start">可以度量：从目标出发选指标，用访谈等定性</text>
  <text x="36.0" y="755.0" class="answer-m" text-anchor="start">数据校验，再据此行动</text>
