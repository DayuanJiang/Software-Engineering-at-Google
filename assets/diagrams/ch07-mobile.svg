  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">工程效率能度量吗？该怎么度量？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">先问一句：无论结果好坏，能不能据此采取行动？不能就别度量</text>
