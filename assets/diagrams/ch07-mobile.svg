  <text x="74.0" y="449.0" class="h18" text-anchor="start">验证</text>
  <text x="74.0" y="474.0" class="c15" text-anchor="start">用访谈、调查等定性数据校验指标；对不上，</text>
  <text x="74.0" y="496.0" class="c15" text-anchor="start">多半是指标错了</text>
  <path d="M210.0 508.0 L210.0 524.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch07m-arrow)"/>
