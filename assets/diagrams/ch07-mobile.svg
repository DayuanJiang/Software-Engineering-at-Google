  <text x="74.0" y="129.0" class="h18" text-anchor="start">目标</text>
  <text x="74.0" y="154.0" class="c15" text-anchor="start">想改善什么？用 QUANTS 五个方面拆开：质</text>
  <text x="74.0" y="176.0" class="c15" text-anchor="start">量、注意力、脑力负担、速度、满意度</text>
