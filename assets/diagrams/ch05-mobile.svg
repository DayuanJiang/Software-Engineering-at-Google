<svg xmlns="http://www.w3.org/2000/svg" width="420" height="486" viewBox="0 0 420 486" class="chapter-svg cg-ch05" data-layout="mobile" role="img" aria-labelledby="ch05m-title ch05m-desc">
  <title id="ch05m-title">从写代码到带团队，要换什么脑子？</title>
  <desc id="ch05m-desc">本章概览。从写代码到带团队，要换什么脑子？ 本章的主要部分：反模式：招庸才、放任低绩效、当老好人、事事插手；积极模式：放下自我、做催化剂、当导师、设目标、护住团队。一句话：领导者的产出是团队的产出：少插手，多清障，让人成长</desc>
