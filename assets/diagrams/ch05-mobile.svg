  <rect x="0" y="0" width="420" height="486" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch05m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">从写代码到带团队，要换什么脑子？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">两种角色：经理管人和方向，技术负责人管技术决策；小团队常</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">由一人兼任</text>
  <rect x="22.0" y="118.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">反模式：新领导常踩的坑</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">招好说话的庸才；忽视低绩效者；忽视人的问</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">题；当所有人的朋友；事事插手当保姆</text>
  <rect x="22.0" y="216.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="242.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,234.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="74.0" y="247.0" class="h18" text-anchor="start">积极模式：让团队变强</text>
  <text x="74.0" y="272.0" class="c15" text-anchor="start">放下自我，信任团队；做催化剂，帮人清障；</text>
  <text x="74.0" y="294.0" class="c15" text-anchor="start">当导师，多问少答；设清晰目标，保持诚实；</text>
  <text x="74.0" y="316.0" class="c15" text-anchor="start">护住团队，把人当植物养</text>
  <text x="22.0" y="348.0" class="c13" text-anchor="start">委派：成员有时做得慢一些，也是培养团队能力的机会</text>
  <rect x="22.0" y="374.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="395.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="421.0" class="answer-m" text-anchor="start">领导者的产出是团队的产出：少插手，多清</text>
  <text x="36.0" y="447.0" class="answer-m" text-anchor="start">障，让人成长</text>
</svg>
