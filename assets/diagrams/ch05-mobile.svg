<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch05" data-layout="mobile" role="img" aria-labelledby="ch05m-title ch05m-desc">
  <title id="ch05m-title">先分清职责，再决定谁来做</title>
  <desc id="ch05m-desc">问题与负责角色逐行对应：经理兼顾每个人（包括 TL）的绩效、生产力、幸福感与业务需求；TL 负责技术选择、架构和推进；双方共同配齐人员、匹配任务。TLM 兼任两职，但 TL 仍需委派而非包办实现。</desc>
  <style>
.cg-ch05[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch05[data-layout="mobile"] .strong {font-weight:600}
.cg-ch05[data-layout="mobile"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
  <defs>
    <marker id="ch05m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch05m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch05m-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch05m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="680" fill="var(--diagram-bg,#fff)" />
  <g id="ch05m-heading" data-box="24,12,372,72">
    <text x="24" y="38" class="strong" text-anchor="start">先分清职责，再决定谁来做</text>
    <text x="24" y="72" class="small" text-anchor="start">本章的角色分工：负责不等于包办实现</text>
  </g>
  <g id="ch05m-row-0" data-box="24,98,372,156">
    <rect x="24" y="98" width="372" height="156" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="38" y="127" class="small" text-anchor="start">成员与业务需求不一致？</text>
    <text x="38" y="163" class="strong" text-anchor="start">工程经理</text>
    <text x="38" y="197" class="small" text-anchor="start">关注成员（含 TL）的绩效与幸福感</text>
    <text x="38" y="227" class="small" text-anchor="start">兼顾生产力与产品的业务需求</text>
  </g>
  <g id="ch05m-row-1" data-box="24,272,372,128">
    <rect x="24" y="272" width="372" height="128" fill="var(--diagram-secondary-soft,#eaf1fa)" />
    <text x="38" y="301" class="small" text-anchor="start">技术选型、架构、优先级由谁负责？</text>
    <text x="38" y="337" class="strong" text-anchor="start">技术负责人（TL）</text>
    <text x="38" y="371" class="small" text-anchor="start">负责技术决策与项目推进</text>
  </g>
  <g id="ch05m-row-2" data-box="24,418,372,128">
    <rect x="24" y="418" width="372" height="128" fill="var(--diagram-warm-soft,#fff3dc)" />
    <text x="38" y="447" class="small" text-anchor="start">人手够不够？任务交给谁？</text>
    <text x="38" y="483" class="strong" text-anchor="start">工程经理 + TL 共同安排</text>
    <text x="38" y="517" class="small" text-anchor="start">配齐人员，按技能与水平匹配任务</text>
  </g>
  <g id="ch05m-limits" data-box="24,562,372,112">
    <text x="24" y="586" class="small" text-anchor="start">小或新团队：TLM 可一人兼任两职</text>
    <text x="24" y="613" class="small" text-anchor="start">成熟大团队通常由两位领导搭档</text>
    <text x="24" y="640" class="small" text-anchor="start">TL 委派任务，给成员学习机会</text>
    <text x="24" y="667" class="small" text-anchor="start">即使对方有时做得慢一些</text>
  </g>
</svg>
