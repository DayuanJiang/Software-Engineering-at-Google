  <text x="74.0" y="263.0" class="h18" text-anchor="start">选类型</text>
  <text x="74.0" y="288.0" class="c15" text-anchor="start">建议性：只通知，靠用户自愿；强制性：有团</text>
  <text x="74.0" y="310.0" class="c15" text-anchor="start">队、有期限</text>
  <path d="M210.0 322.0 L210.0 338.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch15m-arrow)"/>
