.cg-ch15[data-layout="mobile"] .primary-ink {fill:var(--diagram-primary,#087f6d)}
.cg-ch15[data-layout="mobile"] .primary-line {fill:none;stroke:var(--diagram-primary,#087f6d);stroke-width:2}
.cg-ch15[data-layout="mobile"] .secondary {fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch15[data-layout="mobile"] .secondary-ink {fill:var(--diagram-secondary,#2f6eac)}
.cg-ch15[data-layout="mobile"] .secondary-line {fill:none;stroke:var(--diagram-secondary,#2f6eac);stroke-width:2}
.cg-ch15[data-layout="mobile"] .warm {fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch15[data-layout="mobile"] .warm-ink {fill:var(--diagram-warm,#a56a1f)}
.cg-ch15[data-layout="mobile"] .warm-line {fill:none;stroke:var(--diagram-warm,#a56a1f);stroke-width:2}
.cg-ch15[data-layout="mobile"] .danger {fill:var(--diagram-danger-soft,#faecee);stroke:var(--diagram-danger,#b54750);stroke-width:1.5}
.cg-ch15[data-layout="mobile"] .danger-ink {fill:var(--diagram-danger,#b54750)}
.cg-ch15[data-layout="mobile"] .danger-line {fill:none;stroke:var(--diagram-danger,#b54750);stroke-width:2}
</style>
