<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch15" data-layout="mobile" role="img" aria-labelledby="ch15m-title ch15m-desc">
<title id="ch15m-title">只剩一个用户，为什么还不能关？</title>
<desc id="ch15m-desc">书中反例的示意：应用甲和乙依赖关键基础设施，关键基础设施是旧系统的最后一个直接用户。箭头指向被依赖方；关闭旧系统可能经关键基础设施连带影响应用。建议性弃用没有期限和专门迁移投入，不能指望用户自行全部迁出。强制性弃用通常有期限，需要专门团队、迁移帮助、充分告知和执行权限；关键依赖仍可能促使调整时间表。</desc>
<style>
.cg-ch15[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch15[data-layout="mobile"] .strong {font-weight:600}
.cg-ch15[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
