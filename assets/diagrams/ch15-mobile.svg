  <text x="74.0" y="561.0" class="h18" text-anchor="start">迁走再关</text>
  <text x="74.0" y="586.0" class="c15" text-anchor="start">自动化迁移，逐步收口；最后一个用户往往是</text>
  <text x="74.0" y="608.0" class="c15" text-anchor="start">关键基础设施</text>
  <text x="22.0" y="640.0" class="c13" text-anchor="start">更便宜的做法：让系统原地演进；还有一种选择是从设计时就想</text>
  <text x="22.0" y="660.0" class="c13" text-anchor="start">好怎么弃用</text>
  <rect x="22.0" y="686.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="707.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="733.0" class="answer-m" text-anchor="start">弃用是个正式项目：有人负责、有期限、有工</text>
  <text x="36.0" y="759.0" class="answer-m" text-anchor="start">具，从设计时就该考虑</text>
