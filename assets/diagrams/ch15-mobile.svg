<svg xmlns="http://www.w3.org/2000/svg" width="420" height="798" viewBox="0 0 420 798" class="chapter-svg cg-ch15" data-layout="mobile" role="img" aria-labelledby="ch15m-title ch15m-desc">
  <title id="ch15m-title">老系统还有人用，怎么才能下线？</title>
  <desc id="ch15m-desc">本章概览。老系统还有人用，怎么才能下线？ 本章的主要部分：先算成本：老系统一直在耗维护精力；留着的成本要和移除的成本比；选类型：建议性：只通知，靠用户自愿；强制性：有团队、有期限；定负责人：明确谁负责推进，设里程碑，让进度可见；找出用法：用代码搜索和静态分析找到每一个使用点；迁走再关：自动化迁移，逐步收口；最后一个用户往往是关键基础设施。一句话：弃用是个正式项目：有人负责、有期限、有工具，从设计时就该考虑</desc>
