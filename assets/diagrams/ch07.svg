<svg xmlns="http://www.w3.org/2000/svg" id="ch07-diagram" class="chapter-svg cg-ch07" role="img" aria-labelledby="ch07-title ch07-desc" viewBox="0 0 960 560" width="960" height="560">
<title id="ch07-title">审查更快，等于生产力更高？</title><desc id="ch07-desc">书中假设取消代码审查可以让审查更快，但速度不能代表代码质量。实际 Readability 研究结合日志中的审查和提交速度与取得资格者的满意、学习自述，判断流程总体值得，继而改进工具和透明度。质量仍只自评；图不提供数值或因果证明。</desc>
<style>.cg-ch07#ch07-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch07#ch07-diagram .strong{font-weight:600}
.cg-ch07#ch07-diagram .small{font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch07#ch07-diagram .danger-text{fill:var(--diagram-danger,#b54750)}
.cg-ch07#ch07-diagram .primary{fill:var(--diagram-primary-soft,#e5f4ee);stroke:var(--diagram-primary,#087f6d);stroke-width:1.5}
.cg-ch07#ch07-diagram .secondary{fill:var(--diagram-secondary-soft,#eaf1fa);stroke:var(--diagram-secondary,#2f6eac);stroke-width:1.5}
.cg-ch07#ch07-diagram .warm{fill:var(--diagram-warm-soft,#fff3dc);stroke:var(--diagram-warm,#a56a1f);stroke-width:1.5}
.cg-ch07#ch07-diagram .empty{fill:var(--diagram-bg,#fff);stroke:var(--diagram-danger,#b54750);stroke-width:1.5;stroke-dasharray:6 5}
.cg-ch07#ch07-diagram .band{fill:var(--diagram-primary-soft,#e5f4ee)}
.cg-ch07#ch07-diagram .blue-band{fill:var(--diagram-secondary-soft,#eaf1fa)}
.cg-ch07#ch07-diagram .line{fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
.cg-ch07#ch07-diagram .arrow{fill:none;stroke:var(--diagram-muted,#686868);stroke-width:2;marker-end:url(#ch07-arrow)}</style>
<defs><marker id="ch07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="1.5"/></marker></defs>
<rect width="960" height="560" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">审查更快，等于生产力更高？</text>
<text x="32" y="74" class="small" text-anchor="start">Readability：先检验指标代表什么，再判断流程是否值得。</text>
<text x="32" y="118" class="strong" text-anchor="start">反例（书中假设）</text>
<text x="504" y="118" class="strong" text-anchor="start">实际研究（书中报告）</text>
<path d="M476 104V405" class="line"/>
<rect id="ch07-remove" x="32" y="146" width="182" height="64" rx="4" class="warm"/>
<text x="123" y="186" class="" text-anchor="middle" data-box="ch07-remove">取消代码审查</text>
<path d="M218 178H260" class="arrow"/>
<rect id="ch07-faster" x="268" y="146" width="178" height="64" rx="4" class="warm"/>
<text x="357" y="186" class="" text-anchor="middle" data-box="ch07-faster">审查更快</text>
<text x="32" y="266" class="strong danger-text" text-anchor="start">耗时更短 ≠ 代码质量更好</text>
<text x="32" y="310" class="small" text-anchor="start">只跟踪速度和满意度，</text>
<text x="32" y="340" class="small" text-anchor="start">会漏掉质量这一目标。</text>
<text x="32" y="387" class="small" text-anchor="start">一个代理变好，不等于整体目标达成。</text>
<rect id="ch07-logs" x="504" y="146" width="424" height="70" rx="4" class="secondary"/>
<text x="522" y="176" class="strong" text-anchor="start" data-box="ch07-logs">日志：审查和提交更快</text>
<text x="522" y="204" class="small" text-anchor="start" data-box="ch07-logs">已考虑所需审查者减少这一因素</text>
<rect id="ch07-survey" x="504" y="236" width="424" height="70" rx="4" class="secondary"/>
<text x="522" y="266" class="strong" text-anchor="start" data-box="ch07-survey">取得资格者：满意、有收获</text>
<text x="522" y="294" class="small" text-anchor="start" data-box="ch07-survey">这是工程师自述的体验</text>
<path d="M930 182H946V326H716V339" class="arrow"/>
<path d="M930 270H946" class="line"/>
<text x="504" y="366" class="strong" text-anchor="start">综合判断：流程总体值得投入</text>
<text x="504" y="394" class="small" text-anchor="start">不是仅凭一项速度指标作决定</text>
<path d="M716 402V422" class="arrow"/>
<rect id="ch07-action" x="32" y="430" width="896" height="68" rx="4" class="band"/>
<text x="52" y="471" class="strong" text-anchor="start" data-box="ch07-action">行动：保留流程，改进工具与透明度</text>
<text x="32" y="532" class="small" text-anchor="start">质量仅自评；未设客观定量代理。速度代理不等于总体收益或因果证明。</text>
</svg>
