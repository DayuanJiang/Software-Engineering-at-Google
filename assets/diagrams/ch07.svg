  <text x="480.0" y="186.0" class="c14" text-anchor="middle">想改善什么？用 QUANTS 五个方面拆开：质量、注</text>
  <text x="480.0" y="206.0" class="c14" text-anchor="middle">意力、脑力负担、速度、满意度</text>
  <circle cx="774.8" cy="315.1" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(760.8,301.1) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></g>
  <text x="774.8" y="233.1" class="h18" text-anchor="middle">信号</text>
  <text x="774.8" y="255.1" class="c14" text-anchor="middle">什么现象能说明目标达成？信号不一</text>
  <text x="774.8" y="275.1" class="c14" text-anchor="middle">定可测</text>
  <circle cx="662.2" cy="426.9" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(648.2,412.9) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
  <text x="662.2" y="480.9" class="h18" text-anchor="middle">指标</text>
  <text x="662.2" y="502.9" class="c14" text-anchor="middle">为每个信号找可测量的代理，说明它</text>
  <text x="662.2" y="522.9" class="c14" text-anchor="middle">能追溯到哪个目标</text>
  <circle cx="297.8" cy="426.9" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(283.8,412.9) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></g>
  <text x="297.8" y="480.9" class="h18" text-anchor="middle">验证</text>
  <text x="297.8" y="502.9" class="c14" text-anchor="middle">用访谈、调查等定性数据校验指标；</text>
  <text x="297.8" y="522.9" class="c14" text-anchor="middle">对不上，多半是指标错了</text>
  <circle cx="185.2" cy="315.1" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(171.2,301.1) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></g>
  <text x="185.2" y="233.1" class="h18" text-anchor="middle">行动</text>
  <text x="185.2" y="255.1" class="c14" text-anchor="middle">把改进融入日常工作流和激励，再跟</text>
