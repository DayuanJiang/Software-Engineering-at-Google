<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" class="chapter-svg cg-ch07" data-layout="desktop" role="img" aria-labelledby="ch07-title ch07-desc">
  <title id="ch07-title">工程效率能度量吗？该怎么度量？</title>
  <desc id="ch07-desc">本章概览。工程效率能度量吗？该怎么度量？ 本章的主要部分：目标：想改善什么？用 QUANTS 五个方面拆开：质量、注意力、脑力负担、速度、满意度；信号：什么现象能说明目标达成？信号不一定可测；指标：为每个信号找可测量的代理，说明它能追溯到哪个目标；验证：用访谈、调查等定性数据校验指标；对不上，多半是指标错了；行动：把改进融入日常工作流和激励，再跟踪结果。一句话：可以度量：从目标出发选指标，用访谈等定性数据校验，再据此行动</desc>
