<svg xmlns="http://www.w3.org/2000/svg" width="420" height="879" viewBox="0 0 420 879" class="chapter-svg cg-ch23-story" data-layout="mobile" role="img" aria-labelledby="ch23-storym-title ch23-storym-desc">
  <title id="ch23-storym-title">从每两小时才知道坏没坏，到提交前几分钟就有答案</title>
  <desc id="ch23-storym-desc">本章回顾。从每两小时才知道坏没坏，到提交前几分钟就有答案。起点：Takeout 团队的发布总在最后一刻发现问题。测试在部署后才跑，坏了要回溯几十个提交找原因。越晚发现，修起来越贵，这就是反馈回路的成本。；发现：反馈越快越便宜，所以要把测试往前挪。提交前跑快而可靠的测试，提交后跑慢而不太确定的；CI 系统的工作就是决定哪些测试在什么时候跑。；做法：TAP：全球持续构建，加上封闭测试。每次提交都触发受影响的测试；封闭环境让结果可重复；坏了能定位到某一次提交，并自动回滚。；演进：Takeout 的四步：把检查一步步提前。启动检查搬到提交前的沙盒，完整归档测试提前到每两小时的提交后环境。负担不起完整 CI，也能从小处开始。。这一章最想强调的：CI 决定运行哪些测试、何时运行；反馈易得且能立刻行动，它才有效。 代码库用得越久、越大，CI 越不可或缺；提交前要快而可靠，提交后可以慢而广。</desc>
