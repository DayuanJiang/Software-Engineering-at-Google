<svg xmlns="http://www.w3.org/2000/svg" width="420" height="833" viewBox="0 0 420 833" class="chapter-svg cg-ch22-story" data-layout="mobile" role="img" aria-labelledby="ch22-storym-title ch22-storym-desc">
  <title id="ch22-storym-title">从“这个 API 永远改不了”，到每天都在发生的大规模变更</title>
  <desc id="ch22-storym-desc">本章回顾。从“这个 API 永远改不了”，到每天都在发生的大规模变更。起点：一个被几万处调用的旧 API，大家默认它永远改不了。改一处很容易，改几万处却被认为不可能：一次提交要么冲突，要么审不完，要么跑不完测试。；冲突：原子提交在这个规模上行不通。技术上仓库承受不了，合并冲突随时间增加，没有一个人能审完，测试和验证也不可能一次完成。；转折：拆成很多小改动，用工具批量推进。按目录或负责人自动分片，每片独立审查提交；全局批准人代替逐个目录负责人；测试通过就自动提交，失败自动回滚。；做法：把大规模变更变成习惯。有了基础设施和流程，重构就能突破人力上限。谷歌的经验：要做好它，就要经常做它。。这一章最想强调的：大规模变更让组织重新思考：哪些技术决策真的不可更改？ 传统重构到了大规模就失效；分片、自动化、经常做，是可行的路。</desc>
