  <text x="32.0" y="52.0" class="headline" text-anchor="start">从写代码到带团队，要换什么脑子？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">两种角色：经理管人和方向，技术负责人管技术决策；小团队常由一人兼任</text>
  <rect x="32.0" y="114.0" width="418.0" height="222.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <g transform="translate(52.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="88.0" y="152.0" class="h20" text-anchor="start">反模式：新领导常踩的坑</text>
  <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="189.0" class="t15" text-anchor="start">招好说话的庸才</text>
  <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="219.0" class="t15" text-anchor="start">忽视低绩效者</text>
  <g transform="translate(52.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="249.0" class="t15" text-anchor="start">忽视人的问题</text>
  <g transform="translate(52.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="279.0" class="t15" text-anchor="start">当所有人的朋友</text>
  <g transform="translate(52.0,296.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="76.0" y="309.0" class="t15" text-anchor="start">事事插手当保姆</text>
  <rect x="510.0" y="114.0" width="418.0" height="222.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <g transform="translate(530.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="566.0" y="152.0" class="h20" text-anchor="start">积极模式：让团队变强</text>
  <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="189.0" class="t15" text-anchor="start">放下自我，信任团队</text>
  <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="219.0" class="t15" text-anchor="start">做催化剂，帮人清障</text>
  <g transform="translate(530.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="249.0" class="t15" text-anchor="start">当导师，多问少答</text>
  <g transform="translate(530.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="279.0" class="t15" text-anchor="start">设清晰目标，保持诚实</text>
  <g transform="translate(530.0,296.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="554.0" y="309.0" class="t15" text-anchor="start">护住团队，把人当植物养</text>
  <path d="M462.0 225.0 L498.0 225.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch05-arrow)"/>
  <text x="480.0" y="211.0" class="c13" text-anchor="middle">改为</text>
  <text x="32.0" y="360.0" class="c14" text-anchor="start">委派：成员有时做得慢一些，也是培养团队能力的机会</text>
  <rect x="32.0" y="388.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="50.0" y="409.0" class="tag" text-anchor="start">一句话</text>
  <text x="50.0" y="439.0" class="answer" text-anchor="start">领导者的产出是团队的产出：少插手，多清障，让人成长</text>
