<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" class="chapter-svg cg-ch05" data-layout="desktop" role="img" aria-labelledby="ch05-title ch05-desc">
  <title id="ch05-title">先分清职责，再决定谁来做</title>
  <desc id="ch05-desc">问题与负责角色逐行对应：经理兼顾每个人（包括 TL）的绩效、生产力、幸福感与业务需求；TL 负责技术选择、架构和推进；双方共同配齐人员、匹配任务。TLM 兼任两职，但 TL 仍需委派而非包办实现。</desc>
  <style>
.cg-ch05[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch05[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch05[data-layout="desktop"] .strong {font-weight:600}
.cg-ch05[data-layout="desktop"] .connector {fill:none;stroke-width:2;stroke-linejoin:round}
</style>
  <defs>
    <marker id="ch05-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)" />
    </marker>
    <marker id="ch05-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)" />
    </marker>
    <marker id="ch05-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)" />
    </marker>
    <marker id="ch05-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="var(--diagram-bg,#fff)" />
  <g id="ch05-heading" data-box="32,12,896,72">
    <text x="32" y="42" class="strong" text-anchor="start">先分清职责，再决定谁来做</text>
    <text x="32" y="77" class="small" text-anchor="start">本章的角色分工：负责不等于包办实现</text>
  </g>
  <g id="ch05-columns" data-box="32,92,896,40">
    <text x="48" y="122" class="small" text-anchor="start">面对的问题</text>
    <text x="482" y="122" class="small" text-anchor="start">负责角色与行动</text>
  </g>
  <g id="ch05-row-0" data-box="32,140,896,110">
    <rect x="32" y="140" width="896" height="110" fill="var(--diagram-primary-soft,#e5f4ee)" />
    <text x="48" y="177" class="" text-anchor="start">成员与业务的需求</text>
    <text x="48" y="207" class="" text-anchor="start">不一致，谁来兼顾？</text>
    <text x="482" y="172" class="strong" text-anchor="start">工程经理</text>
    <text x="482" y="204" class="small" text-anchor="start">关注成员（含 TL）的绩效与幸福感</text>
    <text x="482" y="232" class="small" text-anchor="start">兼顾生产力与产品的业务需求</text>
  </g>
  <g id="ch05-row-1" data-box="32,268,896,88">
    <rect x="32" y="268" width="896" height="88" fill="var(--diagram-secondary-soft,#eaf1fa)" />
    <text x="48" y="305" class="" text-anchor="start">技术选型、架构、优先级</text>
    <text x="48" y="335" class="" text-anchor="start">由谁负责？</text>
    <text x="482" y="300" class="strong" text-anchor="start">技术负责人（TL）</text>
    <text x="482" y="332" class="small" text-anchor="start">负责技术决策与项目推进</text>
  </g>
  <g id="ch05-row-2" data-box="32,374,896,88">
    <rect x="32" y="374" width="896" height="88" fill="var(--diagram-warm-soft,#fff3dc)" />
    <text x="48" y="411" class="" text-anchor="start">人手够不够？</text>
    <text x="48" y="441" class="" text-anchor="start">任务交给谁？</text>
    <text x="482" y="406" class="strong" text-anchor="start">工程经理 + TL</text>
    <text x="482" y="438" class="small" text-anchor="start">共同配齐人员，按技能与水平匹配任务</text>
  </g>
  <g id="ch05-limits" data-box="32,482,896,70">
    <text x="32" y="509" class="small" text-anchor="start">小或新团队：TLM 一人兼任两职；成熟大团队通常由两位领导搭档。</text>
    <text x="32" y="542" class="small" text-anchor="start">TL 仍需委派：成员有时做得慢一些，也是培养团队能力的机会。</text>
  </g>
</svg>
