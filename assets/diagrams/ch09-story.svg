<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch09-story" data-layout="desktop" role="img" aria-labelledby="ch09-story-title ch09-story-desc">
  <title id="ch09-story-title">从“这只是找 bug”的误解，到审查成为代码库的共同所有权</title>
  <desc id="ch09-story-desc">本章回顾。从“这只是找 bug”的误解，到审查成为代码库的共同所有权。起点：大多数人以为代码审查是为了抓错误。抓错确实是收益之一，但如果只为这个，审查的成本看起来太高了：每次改动都要等人。；发现：审查更大的作用是让代码可读、一致、被人理解。审查者是代码的第一位读者。看不懂就改到看得懂；风格不一致就统一；顺带把知识传给了另一个人。；规则：三项批准，不等于三位审查者。他人认可、目录负责人批准、该语言的可读性认证；一个合格的审查者可以同时给出三项。自审不能替代他人认可。；做法：小改动、快回复、保持专业。把改动切小，审查才快；审查者及时回应，作者虚心接受批评；能自动化的检查交给工具，人只看需要判断的部分。。这一章最想强调的：代码审查让代码库成为团队共同的财产，每个人都为它负责。 始终请他人检验你的假设，优先考虑读者；自动化是审查跟上规模的关键。</desc>
