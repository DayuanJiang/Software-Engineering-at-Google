<svg xmlns="http://www.w3.org/2000/svg" width="420" height="898" viewBox="0 0 420 898" class="chapter-svg cg-ch11-story" data-layout="mobile" role="img" aria-labelledby="ch11-storym-title ch11-storym-desc">
  <title id="ch11-storym-title">从 GWS 的救火，到测试成为谷歌的文化</title>
  <desc id="ch11-storym-desc">本章回顾。从 GWS 的救火，到测试成为谷歌的文化。起点：2005 年的谷歌 Web 服务器：改一行就出事。代码越来越复杂，发布常带着 bug，工程师害怕改动。新来的负责人决定：把自动化测试变成硬性要求。；转折：测试是改代码的底气。人工验证跟不上改动速度；有了测试，重构和加功能都敢下手。GWS 一年后成了公司里最健康的项目之一。；设计：按规模和范围设计测试套件。规模看资源：小型单进程、中型单机、大型跨机；范围看验证多少代码。多数测试应小而窄，少量端到端兜底。；文化：改变文化需要时间：培训、认证、厕所里的测试。入职课程、测试认证、贴在厕所的小贴士，十几年下来测试才成为默认。自动化也有做不到的事，人工探索仍有价值。。这一章最想强调的：测试的目的是让代码能被放心地改；测试要能随规模扩展，就必须自动化。 测试套件的配比要平衡：多数小而快，少量大而慢；喜欢它，就为它写个测试。</desc>
