  <text x="790.0" y="400.0" class="h18" text-anchor="middle">自动执行</text>
  <text x="790.0" y="422.0" class="c14" text-anchor="middle">格式化器和检查工具替人执行规则，</text>
  <text x="790.0" y="442.0" class="c14" text-anchor="middle">人只处理需要判断的部分</text>
  <circle cx="480.0" cy="446.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(466.0,432.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
  <text x="480.0" y="500.0" class="h18" text-anchor="middle">看数据</text>
  <text x="480.0" y="522.0" class="c14" text-anchor="middle">规则影响了什么？用代码库和工程师的反馈判断规</text>
  <text x="480.0" y="542.0" class="c14" text-anchor="middle">则是否还合适</text>
  <circle cx="170.0" cy="346.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(156.0,332.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
  <text x="170.0" y="400.0" class="h18" text-anchor="middle">修改规则</text>
  <text x="170.0" y="422.0" class="c14" text-anchor="middle">规则会过时。unique_ptr 从禁用到</text>
  <text x="170.0" y="442.0" class="c14" text-anchor="middle">推荐，靠的是明确的修改流程</text>
  <text x="32.0" y="590.0" class="c14" text-anchor="start">并非所有做法都该写成规则：指导是建议，规则是必须；一致性本身就是价值</text>
