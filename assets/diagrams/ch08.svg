<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" class="chapter-svg cg-ch08" data-layout="desktop" role="img" aria-labelledby="ch08-title ch08-desc">
  <title id="ch08-title">代码规范为什么要定，怎么定？</title>
  <desc id="ch08-desc">本章概览。代码规范为什么要定，怎么定？ 本章的主要部分：制定规则：少而精：规则要能扛住时间和规模，优先照顾读代码的人，不为炫技留空间；自动执行：格式化器和检查工具替人执行规则，人只处理需要判断的部分；看数据：规则影响了什么？用代码库和工程师的反馈判断规则是否还合适；修改规则：规则会过时。unique_ptr 从禁用到推荐，靠的是明确的修改流程。一句话：规则服务于长期协作：少而精，能自动执行，随时代更新</desc>
