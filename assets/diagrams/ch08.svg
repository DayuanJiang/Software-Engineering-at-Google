  <text x="32.0" y="52.0" class="headline" text-anchor="start">代码规范为什么要定，怎么定？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">谷歌的风格指南是给读者写的，目标是让代码库在时间和规模上都撑得住</text>
