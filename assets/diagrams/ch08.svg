  <text x="480.0" y="164.0" class="h18" text-anchor="middle">制定规则</text>
  <text x="480.0" y="186.0" class="c14" text-anchor="middle">少而精：规则要能扛住时间和规模，优先照顾读代</text>
  <text x="480.0" y="206.0" class="c14" text-anchor="middle">码的人，不为炫技留空间</text>
