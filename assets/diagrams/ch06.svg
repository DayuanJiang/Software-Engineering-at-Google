<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" class="chapter-svg cg-ch06" data-layout="desktop" role="img" aria-labelledby="ch06-title ch06-desc">
  <title id="ch06-title">管的团队大了，还能事事亲力亲为吗？</title>
  <desc id="ch06-desc">本章概览。管的团队大了，还能事事亲力亲为吗？ 本章的主要部分：持续作出决策：模糊难题没有唾手可得的答案。认清盲点，找出关键权衡，做出当前最好的决定，然后不断迭代；随时准备离开：打造自主运转的组织：定清晰的目标和方向，把决策权交下去，你不在时它也能自己判断；不断适应规模增长：成功会带来更多责任。保护有限的时间、注意力和精力，学会放手，只留下最重要的问题。一句话：规模一大，领导要从做事转向决策、放权和守住自己的注意力</desc>
