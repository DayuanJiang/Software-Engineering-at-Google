  <text x="655.3" y="248.0" class="h18" text-anchor="start">不断适应规模增长</text>
  <text x="655.3" y="282.0" class="c15" text-anchor="start">成功会带来更多责任。保护有限的时</text>
  <text x="655.3" y="304.0" class="c15" text-anchor="start">间、注意力和精力，学会放手，只留下</text>
  <text x="655.3" y="326.0" class="c15" text-anchor="start">最重要的问题</text>
