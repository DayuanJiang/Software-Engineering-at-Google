<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" class="chapter-svg cg-ch06" data-layout="desktop" role="img" aria-labelledby="ch06-title ch06-desc">
  <title id="ch06-title">离开一周，搜索延迟问题还会推进吗？</title>
  <desc id="ch06-desc">将本章搜索案例与休假检验并置的依赖关系示意，不是实际组织图。左侧或上侧的子团队凡事等待领导者，领导者休假便暴露单点依赖。右侧或下侧经过培养的子团队领导者衡量质量收益与延迟代价，依数据作决定并继续迭代。组织领导者仍负责整体方向与关键调整，而不逐项代办，从而为新职责保留时间、注意力与精力。</desc>
  <style>
    .cg-ch06[data-layout="desktop"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424);}
    .cg-ch06[data-layout="desktop"] .strong {font-weight:600;}
    .cg-ch06[data-layout="desktop"] .heading {font-size:28px;font-weight:600;}
    .cg-ch06[data-layout="desktop"] .small {font-size:20px;fill:var(--diagram-muted,#686868);}
    .cg-ch06[data-layout="desktop"] .good {fill:var(--diagram-primary,#087f6d);}
    .cg-ch06[data-layout="desktop"] .bad {fill:var(--diagram-danger,#b54750);}
    .cg-ch06[data-layout="desktop"] .cost {fill:var(--diagram-warm,#a56a1f);}
    .cg-ch06[data-layout="desktop"] .blue {fill:var(--diagram-secondary,#2f6eac);}
    .cg-ch06[data-layout="desktop"] .edge {fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="ch06-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
    <marker id="ch06-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
    <marker id="ch06-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
    <marker id="ch06-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="0" fill="var(--diagram-bg,#fff)"/>
  <text x="32" y="40" text-anchor="start" class="heading">离开一周，搜索延迟问题还会推进吗？</text>
  <text x="32" y="74" text-anchor="start" class="small">搜索案例 × 休假检验：组织依赖示意，不是实际组织图</text>
  <rect x="32" y="98" width="896" height="60" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" id="ch06-work"/>
  <text x="480" y="136" text-anchor="middle" class="strong" data-box="ch06-work">同一工作：搜索变更，需要持续权衡质量、延迟与容量</text>
  <path d="M480 184V436" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="48" y="200" text-anchor="start" class="strong bad">事事依赖你</text>
  <text x="520" y="200" text-anchor="start" class="strong good">已培养独立领导者</text>
  <rect x="48" y="224" width="176" height="90" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-waiting" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2"/>
  <text x="136" y="259" text-anchor="middle" class="strong" data-box="ch06-waiting">子团队</text>
  <text x="136" y="294" text-anchor="middle" data-box="ch06-waiting">等待决策</text>
  <path d="M224 269H286" class="edge" stroke="var(--diagram-danger,#b54750)" marker-end="url(#ch06-danger)"/>
  <rect x="296" y="224" width="144" height="90" rx="6" fill="var(--diagram-danger-soft,#faecee)" id="ch06-absent" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="368" y="259" text-anchor="middle" class="strong" data-box="ch06-absent">你</text>
  <text x="368" y="294" text-anchor="middle" data-box="ch06-absent">休假一周</text>
  <text x="48" y="365" text-anchor="start" class="bad">你不在，取舍便无人接手</text>
  <text x="48" y="405" text-anchor="start" class="small">旧问题仍占住你的时间</text>
  <rect x="520" y="224" width="384" height="70" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" id="ch06-decision" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="712" y="266" text-anchor="middle" class="strong" data-box="ch06-decision">团队权衡收益与延迟代价</text>
  <path d="M712 294V334" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06-primary)"/>
  <rect x="520" y="344" width="384" height="70" rx="6" fill="var(--diagram-bg,#fff)" id="ch06-iterate" stroke="var(--diagram-primary,#087f6d)" stroke-width="2"/>
  <text x="712" y="386" text-anchor="middle" data-box="ch06-iterate">依数据决定，继续迭代</text>
  <path d="M904 379H938V259H914" class="edge" stroke="var(--diagram-primary,#087f6d)" marker-end="url(#ch06-primary)"/>
  <path d="M32 458H928" class="edge" stroke="var(--diagram-line,#b9c9c0)"/>
  <text x="32" y="498" text-anchor="start" class="strong">你仍负责整体方向与关键调整，不再逐项代办</text>
  <text x="32" y="536" text-anchor="start" class="small">团队持续决策，才容许你离场，为新职责保留时间、注意力与精力</text>
</svg>
