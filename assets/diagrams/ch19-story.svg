<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch19-story" data-layout="desktop" role="img" aria-labelledby="ch19-story-title ch19-story-desc">
  <title id="ch19-story-title">从一封邮件里的 diff，到一条改动在 Critique 里走完全程</title>
  <desc id="ch19-story-desc">本章回顾。从一封邮件里的 diff，到一条改动在 Critique 里走完全程。起点：审查曾经就是把 diff 发给同事。看不到上下文，不知道谁在等谁，意见散在邮件里。流程不变，体验却决定了大家愿不愿意认真审。；原则：简单、信任、通用、集成。Critique 不替人做判断，它信任工程师；界面简单，通用到各种语言和团队都能用，并且和构建、分析、搜索打通。；流程：六个阶段：创建、请求、理解、评论、批准、提交。作者先看自动分析结果再请人审；审查者看差异留意见；LGTM 和所需批准齐了、意见处理完，才能提交。；细节：小优化，大不同：关注集。谁现在该行动，一眼可见，来回等待的摩擦少了很多。工具的价值往往藏在这种小地方。。这一章最想强调的：信任和沟通是代码审查的核心，工具能改善体验，但取代不了它们。 与其他工具紧密集成，以及像“关注集”这样的小优化，决定了审查体验的好坏。</desc>
