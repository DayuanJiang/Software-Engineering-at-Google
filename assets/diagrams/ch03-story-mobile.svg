<svg xmlns="http://www.w3.org/2000/svg" width="420" height="786" viewBox="0 0 420 786" class="chapter-svg cg-ch03-story" data-layout="mobile" role="img" aria-labelledby="ch03-storym-title ch03-storym-desc">
  <title id="ch03-storym-title">从只有一个人会修的故障，到人人都能查的文档</title>
  <desc id="ch03-storym-desc">本章回顾。从只有一个人会修的故障，到人人都能查的文档。起点：生产出故障，只有一位专家知道怎么排查。专家一休假，同类故障就没人会处理。知识只在一个人脑子里，组织就有了单点故障。；阻碍：为什么大家不问、不写、不教？。怕问显得笨，专家不愿被打扰，照抄旧做法却不懂为什么。没有心理安全，学习就停在表面。；转折：先造安全感，再谈分享。允许不知道，允许犯错，把提问当作正常工作。谷歌用导师制、新人组、无责复盘让人敢开口。；做法：从个人到组织，一层层放大。个人多问多记；社区用邮件组和问答让答案传开；组织用培训、文档和可读性认证把经验变成制度。。这一章最想强调的：知识共享的起点是心理安全，终点是制度化。 没有万能办法：多种策略配合，并且要奖励那些愿意花时间教人的人。</desc>
