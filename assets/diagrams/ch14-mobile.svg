  <text x="74.0" y="160.0" class="h18" text-anchor="start">搭起被测系统</text>
  <text x="74.0" y="185.0" class="c15" text-anchor="start">决定 SUT 的范围：封闭的单机环境、多机部</text>
  <text x="74.0" y="207.0" class="c15" text-anchor="start">署，还是接近生产的环境</text>
