<svg xmlns="http://www.w3.org/2000/svg" width="420" height="739" viewBox="0 0 420 739" class="chapter-svg cg-ch14" data-layout="mobile" role="img" aria-labelledby="ch14m-title ch14m-desc">
  <title id="ch14m-title">单元测试都过了，系统为什么还会坏？</title>
  <desc id="ch14m-desc">本章概览。单元测试都过了，系统为什么还会坏？ 本章的主要部分：搭起被测系统：决定 SUT 的范围：封闭的单机环境、多机部署，还是接近生产的环境；准备测试数据：种子数据、录制的真实流量或人工构造；数据越真实越可信，也越难维护；执行操作：用公开 API 驱动，别贴着界面写：界面一改样式，测试就断；验证结果：人工检查、断言、A/B 差异比较；明确这轮测试要回答什么风险。一句话：单元测试看不到组件之间的配合，需要少量有目标的大型测试补上</desc>
