  <text x="74.0" y="274.0" class="h18" text-anchor="start">准备测试数据</text>
  <text x="74.0" y="299.0" class="c15" text-anchor="start">种子数据、录制的真实流量或人工构造；数据</text>
  <text x="74.0" y="321.0" class="c15" text-anchor="start">越真实越可信，也越难维护</text>
  <path d="M210.0 333.0 L210.0 349.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch14m-arrow)"/>
  <rect x="22.0" y="357.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="383.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,375.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></g>
  <text x="74.0" y="388.0" class="h18" text-anchor="start">执行操作</text>
  <text x="74.0" y="413.0" class="c15" text-anchor="start">用公开 API 驱动，别贴着界面写：界面一改</text>
  <text x="74.0" y="435.0" class="c15" text-anchor="start">样式，测试就断</text>
  <path d="M210.0 447.0 L210.0 463.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch14m-arrow)"/>
  <rect x="22.0" y="471.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="497.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,489.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
  <text x="74.0" y="502.0" class="h18" text-anchor="start">验证结果</text>
  <text x="74.0" y="527.0" class="c15" text-anchor="start">人工检查、断言、A/B 差异比较；明确这轮测</text>
  <text x="74.0" y="549.0" class="c15" text-anchor="start">试要回答什么风险</text>
  <text x="22.0" y="581.0" class="c13" text-anchor="start">类型：功能、浏览器与设备、性能与负载、部署配置、探索性、</text>
  <text x="22.0" y="601.0" class="c13" text-anchor="start">A/B 差异、用户验收、探针与金丝雀、灾难恢复</text>
  <rect x="22.0" y="627.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="648.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="674.0" class="answer-m" text-anchor="start">单元测试看不到组件之间的配合，需要少量有</text>
  <text x="36.0" y="700.0" class="answer-m" text-anchor="start">目标的大型测试补上</text>
