<svg xmlns="http://www.w3.org/2000/svg" width="420" height="809" viewBox="0 0 420 809" class="chapter-svg cg-ch06-story" data-layout="mobile" role="img" aria-labelledby="ch06-storym-title ch06-storym-desc">
  <title id="ch06-storym-title">从每个问题都等你拍板，到你休假一周团队照常推进</title>
  <desc id="ch06-storym-desc">本章回顾。从每个问题都等你拍板，到你休假一周团队照常推进。起点：你现在带的是好几个团队。问题变了：从“这个 bug 怎么修”变成“搜索延迟该不该降”这样没有标准答案的模糊难题。；冲突：所有决定都等你，你成了瓶颈。每件事都要你拍板，日程被填满，真正重要的问题反而没时间想。团队也学不会自己判断。；转折：三个“始终”：决策、离开、扩展。认清盲点、找出关键权衡、做决定再迭代；建立一个你不在也能运转的组织；随着责任增长，主动保护时间和精力。；做法：用“休假一周”检验团队是否自主。你不在时，子团队的领导者能否自己权衡取舍？如果不能，就还没把决策权真正交下去。。这一章最想强调的：领导者的职责是建立一个不需要自己在场也能解决模糊难题的组织。 成功会不断带来新责任，你必须主动管理这些扩张，守住有限的注意力。</desc>
