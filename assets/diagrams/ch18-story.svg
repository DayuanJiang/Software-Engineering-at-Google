<svg xmlns="http://www.w3.org/2000/svg" width="960" height="673" viewBox="0 0 960 673" class="chapter-svg cg-ch18-story" data-layout="desktop" role="img" aria-labelledby="ch18-story-title ch18-story-desc">
  <title id="ch18-story-title">从“我只需要一个编译器”，到把构建交给工具推理</title>
  <desc id="ch18-story-desc">本章回顾。从“我只需要一个编译器”，到把构建交给工具推理。起点：“我只需要一个编译器！”。一个人、几个文件，一条命令就够。文件多了写个 shell 脚本，依赖多了再加几行。直到有人在别的机器上构建失败。；冲突：基于任务的构建：步骤越写越多，工具越来越盲。Ant、Maven、Gradle 让你描述做什么；但工具不知道步骤之间真正依赖什么，于是不敢并行、不敢缓存，脚本自身也成了维护负担。；转折：基于产物的构建：声明目标，让工具算依赖。Bazel 只让你说“这个目标依赖那些目标”。工具知道全部依赖图，就能判断什么该重建、什么能并行、什么能从远程缓存拿。；做法：细粒度模块、最小可见性、锁定外部依赖。1:1:1 规则让模块小而清晰；限制谁能依赖谁；外部依赖锁定版本并校验哈希。约束多了，工程师反而轻松。。这一章最想强调的：构建系统的价值在于对依赖的理解；给它适当的约束，它就能替你推理。 组织越大，越需要功能完备的构建系统；控制权和灵活性都有代价。</desc>
