  <rect x="0" y="0" width="420" height="830" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch12m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">什么样的单元测试值得长期维护？</text>
  <rect x="22.0" y="68.0" width="376.0" height="112.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
  <text x="74.0" y="99.0" class="h18" text-anchor="start">目标：测试陪代码很多年，不拖慢任</text>
  <text x="74.0" y="123.0" class="h18" text-anchor="start">何人</text>
  <text x="74.0" y="148.0" class="c15" text-anchor="start">脆弱的测试一改就坏，不清晰的测试失败了没</text>
  <text x="74.0" y="170.0" class="c15" text-anchor="start">人看得懂；两者都在偷走工程师的时间</text>
  <text x="22.0" y="204.0" class="h16" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">靠什么支撑</text>
  <rect x="22.0" y="220.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="246.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,238.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g>
  <text x="74.0" y="251.0" class="h18" text-anchor="start">不轻易坏</text>
  <text x="74.0" y="276.0" class="c15" text-anchor="start">对着公开接口测行为；重构、加功能、修 bug</text>
  <text x="74.0" y="298.0" class="c15" text-anchor="start">都不该逼你改测试</text>
  <rect x="22.0" y="318.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="344.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,336.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></g>
  <text x="74.0" y="349.0" class="h18" text-anchor="start">一个行为</text>
  <text x="74.0" y="374.0" class="c15" text-anchor="start">一个测试只验证一个行为，按 given、when、</text>
  <text x="74.0" y="396.0" class="c15" text-anchor="start">then 组织，用被测行为命名</text>
  <rect x="22.0" y="416.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="442.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,434.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g>
  <text x="74.0" y="447.0" class="h18" text-anchor="start">完整简洁</text>
  <text x="74.0" y="472.0" class="c15" text-anchor="start">读者在测试里就能看到全部关键输入和预期，</text>
  <text x="74.0" y="494.0" class="c15" text-anchor="start">无关细节用辅助方法藏起来</text>
  <rect x="22.0" y="514.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="540.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,532.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></g>
  <text x="74.0" y="545.0" class="h18" text-anchor="start">失败可读</text>
  <text x="74.0" y="570.0" class="c15" text-anchor="start">失败信息要说清预期、实际和差别，让人不用</text>
  <text x="74.0" y="592.0" class="c15" text-anchor="start">调试就知道错在哪</text>
  <rect x="22.0" y="612.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="638.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,630.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
  <text x="74.0" y="643.0" class="h18" text-anchor="start">DAMP 优于 DRY</text>
  <text x="74.0" y="668.0" class="c15" text-anchor="start">测试代码宁可重复也要直白；别把逻辑和条件</text>
  <text x="74.0" y="690.0" class="c15" text-anchor="start">放进测试里</text>
  <rect x="22.0" y="718.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="739.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="765.0" class="answer-m" text-anchor="start">好的单元测试：重构不坏、读起来完整、失败</text>
  <text x="36.0" y="791.0" class="answer-m" text-anchor="start">时说得清原因</text>
