<svg xmlns="http://www.w3.org/2000/svg" width="420" height="830" viewBox="0 0 420 830" class="chapter-svg cg-ch12" data-layout="mobile" role="img" aria-labelledby="ch12m-title ch12m-desc">
  <title id="ch12m-title">什么样的单元测试值得长期维护？</title>
  <desc id="ch12m-desc">本章概览。什么样的单元测试值得长期维护？ 本章的主要部分：不轻易坏：对着公开接口测行为；重构、加功能、修 bug 都不该逼你改测试；一个行为：一个测试只验证一个行为，按 given、when、then 组织，用被测行为命名；完整简洁：读者在测试里就能看到全部关键输入和预期，无关细节用辅助方法藏起来；失败可读：失败信息要说清预期、实际和差别，让人不用调试就知道错在哪；DAMP 优于 DRY：测试代码宁可重复也要直白；别把逻辑和条件放进测试里。一句话：好的单元测试：重构不坏、读起来完整、失败时说得清原因</desc>
