<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch02-story" data-layout="desktop" role="img" aria-labelledby="ch02-story-title ch02-story-desc">
  <title id="ch02-story-title">从想藏起代码的请求，到没人能独自完成软件</title>
  <desc id="ch02-story-desc">本章回顾。从想藏起代码的请求，到没人能独自完成软件。起点：“能不能让我把代码藏起来，等写完再给人看？”。这是作者收到最多的请求之一。背后是天才神话：我们记住的是 Linus、Guido，忘了他们身后成千的贡献者。；代价：躲起来的三个代价。巴士因子为 1，你一离开项目就停；方向错了没人早提醒，几个月后才发现；进展慢，因为一切都得自己来。；转折：协作靠三根柱子：谦逊、尊重、信任。承认自己会错，把同事当值得尊重的人，相信他们会做对。这三样有了，批评就成了帮忙。；做法：早分享、多沟通、快速失败。小步提交让人看到，出问题就做无责复盘，把注意力放在事情上。团队的成果远大于个人英雄。。这一章最想强调的：软件工程是团队运动，藏起来的代码得不到任何帮助。 谦逊、尊重、信任，缺一样，团队就会把精力耗在人际摩擦上。</desc>
