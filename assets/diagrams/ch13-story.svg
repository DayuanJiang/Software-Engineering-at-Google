<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" class="chapter-svg cg-ch13-story" data-layout="desktop" role="img" aria-labelledby="ch13-story-title ch13-story-desc">
  <title id="ch13-story-title">从不能真扣钱的测试，到对替身的克制</title>
  <desc id="ch13-story-desc">本章回顾。从不能真扣钱的测试，到对替身的克制。起点：支付代码调用真实的信用卡服务，怎么测？。总不能每跑一次测试就扣一次钱。测试需要一个能替换真实依赖的办法。；发现：接缝：让依赖从外面传进来。构造函数接收依赖，测试就能塞进一个替身。模拟框架让替身几秒钟就能生成，再也不用手写。；诱惑：太方便了，于是到处打桩、到处验证调用。测试开始复述实现细节：改一行代码，一堆测试就坏；测试通过了，也说不清到底证明了什么。；转向：谷歌的选择：能用真的就用真的。真实实现最可信；用不了时，用依赖方维护并测试过的伪实现；打桩只用来制造状态；交互验证只留给没法验证状态的改动。。这一章最想强调的：替身是一种权衡，从来不是默认。测试要断言结果，不要断言过程。 每多一个替身，测试离真实系统就远一步；用之前先问一句：真的不能用真的吗？</desc>
