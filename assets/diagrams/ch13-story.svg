  <text x="32.0" y="62.0" class="story-headline" text-anchor="start">从不能真扣钱的测试，到对替身的克制</text>
  <circle cx="74.0" cy="122.0" r="22" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(63.0,111.0) scale(0.917)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></g>
  <text x="118.0" y="110.0" class="act" fill="var(--diagram-secondary,#2c6096)" text-anchor="start">起点</text>
  <text x="118.0" y="134.0" class="h19" text-anchor="start">支付代码调用真实的信用卡服务，怎么测？</text>
  <text x="118.0" y="160.0" class="t15" text-anchor="start">总不能每跑一次测试就扣一次钱。测试需要一个能替换真实依赖的办法。</text>
  <circle cx="74.0" cy="222.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(63.0,211.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></g>
  <text x="118.0" y="210.0" class="act" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">发现</text>
  <text x="118.0" y="234.0" class="h19" text-anchor="start">接缝：让依赖从外面传进来</text>
  <text x="118.0" y="260.0" class="t15" text-anchor="start">构造函数接收依赖，测试就能塞进一个替身。模拟框架让替身几秒钟就能生成，再也不用手写。</text>
  <circle cx="74.0" cy="322.0" r="22" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(63.0,311.0) scale(0.917)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
  <text x="118.0" y="310.0" class="act" fill="var(--diagram-danger,#a03946)" text-anchor="start">诱惑</text>
  <text x="118.0" y="334.0" class="h19" text-anchor="start">太方便了，于是到处打桩、到处验证调用</text>
  <text x="118.0" y="360.0" class="t15" text-anchor="start">测试开始复述实现细节：改一行代码，一堆测试就坏；测试通过了，也说不清到底证明了什么。</text>
  <circle cx="74.0" cy="422.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(63.0,411.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="118.0" y="410.0" class="act" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">转向</text>
  <text x="118.0" y="434.0" class="h19" text-anchor="start">谷歌的选择：能用真的就用真的</text>
  <text x="118.0" y="460.0" class="t15" text-anchor="start">真实实现最可信；用不了时，用依赖方维护并测试过的伪实现；打桩只用来制造状态；交互验证只留给没法验证状态的改</text>
  <text x="118.0" y="483.0" class="t15" text-anchor="start">动。</text>
