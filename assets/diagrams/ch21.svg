<svg xmlns="http://www.w3.org/2000/svg" class="chapter-svg cg-ch21" data-layout="desktop" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="ch21-title ch21-desc">
<title id="ch21-title">依赖更新：谁能验证受影响的用法？</title>
<desc id="ch21-desc">示意网络中，私有 libuser 经 liba 使用结果，liba 调用 libbase 的 Foo。实线从使用方指向依赖方；libbase 的候选改动需要沿虚线反向查找 liba 和 libuser 的受影响测试。上游能运行可见使用方的测试，但不能据本地测试通过推断私有用法可用。私有使用方要补充验证，必要变更还需迁移协调或工具。Live at Head 依赖测试、可见性和责任安排，不是普适的无条件选最新版策略。</desc>
<style>
.cg-ch21[data-layout="desktop"] text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch21[data-layout="desktop"] .small{font-size:20px;fill:var(--diagram-muted,#686868)}
.cg-ch21[data-layout="desktop"] .strong{font-weight:600}
.cg-ch21[data-layout="desktop"] .primary{fill:var(--diagram-primary,#087f6d)}
.cg-ch21[data-layout="desktop"] .secondary{fill:var(--diagram-secondary,#2f6eac)}
.cg-ch21[data-layout="desktop"] .warm{fill:var(--diagram-warm,#a56a1f)}
.cg-ch21[data-layout="desktop"] .danger{fill:var(--diagram-danger,#b54750)}
</style><defs>
