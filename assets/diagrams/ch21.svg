<text x="48" y="379" class="strong" text-anchor="start">libbase 本地测试通过</text>
<text x="400" y="379" class="" text-anchor="start">只验证了测试覆盖到的本地用法</text>
<path d="M32 400h896" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1" fill="none"/>
<text x="48" y="437" class="strong" text-anchor="start">再测 liba / libuser</text>
<text x="400" y="437" class="" text-anchor="start">调用方式与结果假设才进入验证</text>
<text x="32" y="492" class="small" text-anchor="start">看不到私有用法？使用方补测试；必要变更还需迁移协调或工具。</text>
<text x="32" y="530" class="small" text-anchor="start">Live at Head 依赖这些责任与条件，不是无条件选最新版本。</text>
