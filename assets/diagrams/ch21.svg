  <text x="528.0" y="264.0" class="h18" text-anchor="start">打包发行版</text>
  <text x="636.0" y="264.0" class="c15" text-anchor="start">跟着一个经过整体测试的集合走</text>
  <g transform="translate(486.0,291.0) scale(1.167)" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
  <text x="528.0" y="312.0" class="h18" text-anchor="start">跟随最新</text>
  <text x="636.0" y="312.0" class="c15" text-anchor="start">Live at Head：一起改、一起测</text>
  <text x="484.0" y="346.0" class="c13" text-anchor="start">SemVer 把“这次改动多大风险”压成一个数字，包管理器却把它当成事实</text>
