  <text x="74.0" y="401.0" class="h18" text-anchor="start">问社区</text>
  <text x="74.0" y="426.0" class="c15" text-anchor="start">邮件组、问答频道让一个问题的答案被很多人</text>
  <text x="74.0" y="448.0" class="c15" text-anchor="start">看到</text>
