  <text x="74.0" y="303.0" class="h18" text-anchor="start">多提问</text>
  <text x="74.0" y="328.0" class="c15" text-anchor="start">问出来比自己猜快得多；把问到的答案记下</text>
  <text x="74.0" y="350.0" class="c15" text-anchor="start">来，下一个人就不用再问</text>
