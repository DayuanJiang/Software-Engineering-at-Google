<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch03" data-layout="mobile" role="img" aria-labelledby="ch03m-title ch03m-desc">
<title id="ch03m-title">专家休假后，同类故障还能排查吗？</title>
<desc id="ch03m-desc">对比反复向唯一专家求助，与记录排查步骤后的路径。没有记录时，专家休假会使求助受阻。记录并维护知识后，同事能先查资料，不适用或仍有疑问时再向有经验的同事求助。仍须培养专家并允许坦诚提问。</desc>
<style>
.cg-ch03[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch03[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch03[data-layout="mobile"] .strong {font-weight:600}
.cg-ch03[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750)}
</style>
<defs>
<marker id="ch03m-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch03m-arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch03m-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="420" height="680" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="37" text-anchor="start" class="strong">专家不在，故障还能排查吗？</text>
<text x="24" y="70" text-anchor="start" class="small">书中场景：反复求助同一位排障专家</text>
<text x="24" y="111" text-anchor="start" class="strong danger">只靠口头经验</text>
<g id="ch03m-node-1" data-box="24,133,152,94">
<rect x="24" y="133" width="152" height="94" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="100.0" y="170" text-anchor="middle" class="strong">同事再求助</text>
<text x="100.0" y="204" text-anchor="middle" class="small">同类故障</text>
</g>
<path d="M182 180H228" class="rule" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5"/>
<path d="M201 170L221 190M221 170L201 190" class="rule" fill="none" stroke="var(--diagram-danger,#b54750)" stroke-width="2" stroke-linejoin="round"/>
<g id="ch03m-node-2" data-box="236,133,160,94">
<rect x="236" y="133" width="160" height="94" rx="6" fill="var(--diagram-danger-soft,#faecee)" stroke="var(--diagram-danger,#b54750)"/>
<text x="316.0" y="170" text-anchor="middle" class="strong">唯一专家</text>
<text x="316.0" y="204" text-anchor="middle" class="small">正在休假</text>
</g>
<text x="24" y="264" text-anchor="start" class="small">没有记录可查，同类问题也会受阻</text>
<path d="M24 287H396" class="rule" fill="none" stroke="var(--diagram-line,#b9c9c0)" stroke-width="2" stroke-linejoin="round"/>
<text x="24" y="323" text-anchor="start" class="strong">记录步骤，也培养其他专家</text>
<g id="ch03m-node-3" data-box="24,357,128,80">
<rect x="24" y="357" width="128" height="80" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="88.0" y="391" text-anchor="middle" class="strong">后来同事</text>
<text x="88.0" y="421" text-anchor="middle" class="small">同类故障</text>
</g>
<path d="M158 397H210" class="connector" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03m-arrow-primary)"/>
<text x="184" y="376" text-anchor="middle" class="small">先查</text>
<g id="ch03m-node-4" data-box="216,345,180,108">
<rect x="216" y="345" width="180" height="108" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="var(--diagram-primary,#087f6d)"/>
<text x="306.0" y="381" text-anchor="middle" class="strong">共享排查步骤</text>
<text x="306.0" y="417" text-anchor="middle" class="small">可找到的记录</text>
</g>
<path d="M306 459V498" class="connector" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="2" stroke-linejoin="round" marker-end="url(#ch03m-arrow-secondary)"/>
<text x="24" y="483" text-anchor="start" class="small">不适用或仍有疑问</text>
<g id="ch03m-node-5" data-box="114,504,282,88">
<rect x="114" y="504" width="282" height="88" rx="6" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="var(--diagram-secondary,#2f6eac)"/>
<text x="255.0" y="539" text-anchor="middle" class="strong">有经验的同事</text>
<text x="255.0" y="572" text-anchor="middle" class="small">判断背景，解释例外</text>
</g>
<text x="24" y="627" text-anchor="start" class="small">文档须持续维护；仍需人工帮助</text>
<text x="24" y="659" text-anchor="start" class="small">前提：让人敢于提问、培养更多专家</text>
</svg>
