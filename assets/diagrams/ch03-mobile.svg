  <text x="74.0" y="252.0" class="c15" text-anchor="start">人等于关掉知识的水龙头</text>
  <rect x="22.0" y="272.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
