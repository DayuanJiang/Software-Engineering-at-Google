<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch25-story" data-layout="desktop" role="img" aria-labelledby="ch25-story-title ch25-story-desc">
  <title id="ch25-story-title">从半夜起来重启机器，到不知道程序跑在哪台机器上</title>
  <desc id="ch25-story-desc">本章回顾。从半夜起来重启机器，到不知道程序跑在哪台机器上。起点：早年的谷歌：每台机器都要人管。装软件、盯故障、机器坏了半夜起来处理。机器越多，人越不够用。；转折：驯服计算环境：容器加调度器。把程序打包成容器，由调度器决定放哪台机器，坏了自动换一台。工程师只声明需要多少资源。；代价：程序必须学会被随时搬走。机器随时会换，本地状态说没就没。持久数据放在机器之外；用稳定的服务名找服务，别记地址；接受重启和重复请求。；选择：选一个抽象层次恰当的计算方案。集中托管还是自建，无服务器还是容器，各有取舍。抽象太低，人还是在管机器；太高，程序就被平台绑死。。这一章最想强调的：要扩大规模，就需要共用的基础设施来运行生产负载，软件必须为此调整。 审慎选择组织的计算方案，让它提供恰当的抽象层次。</desc>
