  <text x="74.0" y="517.0" class="h18" text-anchor="start">提交</text>
  <text x="74.0" y="542.0" class="c15" text-anchor="start">意见都处理完，才能提交</text>
  <text x="22.0" y="574.0" class="c13" text-anchor="start">信任与沟通是核心，工具只是让它们更顺；和其他工具紧密集成</text>
  <text x="22.0" y="594.0" class="c13" text-anchor="start">是好体验的关键</text>
