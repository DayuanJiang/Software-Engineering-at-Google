  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">一个代码审查工具要做好哪些事？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">设计原则：简单、信任工程师、通用、和其他工具打通；下面是</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">一次审查在 Critique 里走过的路</text>
