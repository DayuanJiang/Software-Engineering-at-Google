<svg xmlns="http://www.w3.org/2000/svg" width="420" height="732" viewBox="0 0 420 732" class="chapter-svg cg-ch19" data-layout="mobile" role="img" aria-labelledby="ch19m-title ch19m-desc">
  <title id="ch19m-title">一个代码审查工具要做好哪些事？</title>
  <desc id="ch19m-desc">本章概览。一个代码审查工具要做好哪些事？ 本章的主要部分：创建变更：写改动，先看静态分析的自动意见；请求审查：选审查者，工具建议合适的人；理解评论：看差异、留意见，作者回复并修改；批准评分：LGTM 和所需批准；关注集让人知道轮到谁；提交：意见都处理完，才能提交。一句话：把审查的每一步放在一个界面里，让审查快、透明、有记录</desc>
