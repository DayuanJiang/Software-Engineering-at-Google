  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">怎么做到又快又稳地发布？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">谷歌持续交付的常用做法，串起来是一条流水线</text>
