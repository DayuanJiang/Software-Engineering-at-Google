<svg xmlns="http://www.w3.org/2000/svg" id="ch24m-root" class="chapter-svg cg-ch24" width="420" height="680" viewBox="0 0 420 680" role="img" aria-labelledby="ch24m-title ch24m-desc">
<title id="ch24m-title">版本已就绪，用户就能用新功能吗？</title>
<desc id="ch24m-desc">以候选版本 v2 和新功能 F 为示例，对照暂不部署、部署但关闭功能、只为部分用户启用三种状态。可交付能力不要求立即部署；部署代码与启用功能分别改变产物位置和用户行为。</desc>
<style>
.cg-ch24#ch24m-root text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch24#ch24m-root .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch24#ch24m-root .strong {font-weight:600}
.cg-ch24#ch24m-root .line {fill:none;stroke:var(--diagram-line,#b9c9c0);stroke-width:1.5}
</style>
<defs>
<marker id="ch24m-primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-primary,#087f6d)"/></marker>
<marker id="ch24m-secondary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-secondary,#2f6eac)"/></marker>
<marker id="ch24m-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-warm,#a56a1f)"/></marker>
<marker id="ch24m-danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-danger,#b54750)"/></marker>
</defs>
<rect width="420" height="680" fill="var(--diagram-bg,#fff)"/>
<text x="24" y="38" class="strong" text-anchor="start" data-box="12,8,396,664">版本已就绪，用户就能用</text>
<text x="24" y="67" class="strong" text-anchor="start" data-box="12,8,396,664">新功能吗？</text>
<text x="24" y="100" class="small" text-anchor="start" data-box="12,8,396,664">示例：v2 可交付，内含旧路径与 F。</text>
<rect x="20" y="122" width="380" height="118" rx="0" fill="var(--diagram-bg,#fff)" stroke="none"/>
<text x="28" y="150" class="strong" text-anchor="start" data-box="20,122,380,118">暂不部署</text>
<rect x="28" y="164" width="64" height="38" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="60" y="190" class="strong" text-anchor="middle" data-box="28,164,64,38">v1</text>
<text x="106" y="190" class="small" text-anchor="start" data-box="20,122,380,118">F 未上线</text>
<circle cx="231" cy="168" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
<path d="M222 190V183Q231 173 240 183V190" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="3"/>
<text x="250" y="190" class="small" text-anchor="start" data-box="20,122,380,118">全部：旧路径</text>
<text x="28" y="223" class="small" text-anchor="start" data-box="20,122,380,118">仍然具备交付能力</text>
<rect x="20" y="254" width="380" height="118" rx="0" fill="var(--diagram-secondary-soft,#eaf1fa)" stroke="none"/>
<text x="28" y="282" class="strong" text-anchor="start" data-box="20,254,380,118">部署 v2，不启用 F</text>
<rect x="28" y="296" width="64" height="38" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="60" y="322" class="strong" text-anchor="middle" data-box="28,296,64,38">v2</text>
<text x="106" y="322" class="small" text-anchor="start" data-box="20,254,380,118">F 关闭</text>
<circle cx="231" cy="300" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
<path d="M222 322V315Q231 305 240 315V322" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="3"/>
<text x="250" y="322" class="small" text-anchor="start" data-box="20,254,380,118">全部：旧路径</text>
<text x="28" y="355" class="small" text-anchor="start" data-box="20,254,380,118">新代码到位，旧行为继续</text>
<rect x="20" y="386" width="380" height="118" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)" stroke="none"/>
<text x="28" y="414" class="strong" text-anchor="start" data-box="20,386,380,118">只更新启用配置</text>
<rect x="28" y="428" width="64" height="38" rx="4" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<text x="60" y="454" class="strong" text-anchor="middle" data-box="28,428,64,38">v2</text>
<text x="106" y="454" class="small" text-anchor="start" data-box="20,386,380,118">F 部分开</text>
<circle cx="231" cy="432" r="5" fill="var(--diagram-primary,#087f6d)"/>
<path d="M222 454V447Q231 437 240 447V454" fill="none" stroke="var(--diagram-primary,#087f6d)" stroke-width="3"/>
<text x="250" y="454" class="small" text-anchor="start" data-box="20,386,380,118">选中用户：新</text>
<text x="250" y="487" class="small" text-anchor="start" data-box="20,386,380,118">其余用户：旧</text>
<text x="28" y="487" class="small" text-anchor="start" data-box="20,386,380,118">同一个二进制 v2</text>
<circle cx="231" cy="465" r="5" fill="var(--diagram-secondary,#2f6eac)"/>
<path d="M222 487V480Q231 470 240 480V487" fill="none" stroke="var(--diagram-secondary,#2f6eac)" stroke-width="3"/>
<path class="line" d="M24 524L396 524"/>
<text x="24" y="559" class="" text-anchor="start" data-box="12,8,396,664">可部署，不等于必须部署。</text>
<text x="24" y="590" class="small" text-anchor="start" data-box="12,8,396,664">实际推送频率按用户需求选择。</text>
<text x="24" y="627" class="small" text-anchor="start" data-box="12,8,396,664">配置须分阶段验证；关闭标志</text>
<text x="24" y="654" class="small" text-anchor="start" data-box="12,8,396,664">不代表代码保密或风险消失。</text>
</svg>
