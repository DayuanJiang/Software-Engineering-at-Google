  <text x="480.0" y="210.0" class="h18" text-anchor="middle">理解评论</text>
  <text x="480.0" y="236.0" class="c14" text-anchor="middle">看差异、留意见，作者</text>
  <text x="480.0" y="257.0" class="c14" text-anchor="middle">回复并修改</text>
  <path d="M563.2 150.0 L581.2 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch19-arrow)"/>
  <circle cx="664.4" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(649.4,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="664.4" y="210.0" class="h18" text-anchor="middle">批准评分</text>
  <text x="664.4" y="236.0" class="c14" text-anchor="middle">LGTM 和所需批准；关</text>
  <text x="664.4" y="257.0" class="c14" text-anchor="middle">注集让人知道轮到谁</text>
  <path d="M747.6 150.0 L765.6 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch19-arrow)"/>
  <circle cx="848.8" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(833.8,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="848.8" y="210.0" class="h18" text-anchor="middle">提交</text>
  <text x="848.8" y="236.0" class="c14" text-anchor="middle">意见都处理完，才能提</text>
  <text x="848.8" y="257.0" class="c14" text-anchor="middle">交</text>
  <text x="32.0" y="292.0" class="c14" text-anchor="start">信任与沟通是核心，工具只是让它们更顺；和其他工具紧密集成是好体验的关键</text>
