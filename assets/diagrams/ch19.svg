  <text x="32.0" y="52.0" class="headline" text-anchor="start">一个代码审查工具要做好哪些事？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">设计原则：简单、信任工程师、通用、和其他工具打通；下面是一次审查在 Critique 里走过的路</text>
  <circle cx="111.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(96.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
