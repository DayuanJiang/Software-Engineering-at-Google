<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" class="chapter-svg cg-ch19" data-layout="desktop" role="img" aria-labelledby="ch19-title ch19-desc">
<title id="ch19-title">获批后，为什么还不能提交？</title>
<desc id="ch19-desc">同一条命名意见的前后对照：LGTM 和所需批准不变，作者修改代码并回复 Done 后，未解决意见从 1 变为 0，才满足基本审查条件；提交前检查仍须通过。</desc>
<style>.cg-ch19[data-layout=desktop] text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}.cg-ch19[data-layout=desktop] .small{font-size:20px;fill:var(--diagram-muted,#686868)}.cg-ch19[data-layout=desktop] .strong{font-weight:600}.cg-ch19[data-layout=desktop] .code{font-family:Menlo,Consolas,monospace}.cg-ch19[data-layout=desktop] .danger{fill:var(--diagram-danger,#b54750)}.cg-ch19[data-layout=desktop] .positive{fill:var(--diagram-primary,#087f6d)}</style>
<defs><marker id="ch19-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-muted,#686868)"/></marker></defs>
<rect width="960" height="560" fill="var(--diagram-bg,#fff)"/>
<text x="32" y="42" class="strong" text-anchor="start">获批后，为什么还不能提交？</text>
<text x="32" y="76" class="small" text-anchor="start">Critique · 同一条命名意见的前后对照（示例）</text>
<rect id="ch19-region-1" x="32" y="112" width="384" height="282" rx="6" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<rect id="ch19-region-2" x="32" y="112" width="384" height="44" rx="6" fill="var(--diagram-warm-soft,#fff3dc)"/>
<text x="48" y="142" class="strong" text-anchor="start" data-owner="ch19-region-2">v1 · 意见已发布</text>
<text x="48" y="203" class="code" text-anchor="start" data-owner="ch19-region-1">n = size()</text>
<text x="48" y="247" class="" text-anchor="start" data-owner="ch19-region-1">“请把 n 改成 count”</text>
<text x="48" y="296" class="small" text-anchor="start" data-owner="ch19-region-1">LGTM 1 · 所需批准齐全</text>
<text x="48" y="335" class="strong danger" text-anchor="start" data-owner="ch19-region-1">未解决意见：1</text>
<text x="48" y="371" class="small" text-anchor="start" data-owner="ch19-region-1">还不能提交：作者需处理</text>
<rect id="ch19-region-3" x="544" y="112" width="384" height="282" rx="6" fill="var(--diagram-bg,#fff)" stroke="var(--diagram-line,#b9c9c0)" stroke-width="1.5"/>
<rect id="ch19-region-4" x="544" y="112" width="384" height="44" rx="6" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="560" y="142" class="strong" text-anchor="start" data-owner="ch19-region-4">v2 · 作者处理意见后</text>
<text x="560" y="203" class="code" text-anchor="start" data-owner="ch19-region-3">count = size()</text>
<text x="560" y="247" class="" text-anchor="start" data-owner="ch19-region-3">Done：已改名</text>
<text x="560" y="296" class="small" text-anchor="start" data-owner="ch19-region-3">LGTM 1 · 所需批准齐全</text>
<text x="560" y="335" class="strong positive" text-anchor="start" data-owner="ch19-region-3">未解决意见：0</text>
<text x="560" y="371" class="small" text-anchor="start" data-owner="ch19-region-3">可启动提交</text>
<text x="488" y="205" class="small" text-anchor="middle">作者修改</text>
<text x="488" y="232" class="small" text-anchor="middle">并回复</text>
<path class="connector" d="M424 257H536" fill="none" stroke="var(--diagram-muted,#686868)" stroke-width="2" marker-end="url(#ch19-arrow)"/>
<text x="32" y="443" class="" text-anchor="start">作者解决意见，不等于作者授予 LGTM 或批准。</text>
<text x="32" y="481" class="small" text-anchor="start">本例 LGTM 和批准未被撤销；工具不要求再获一次 LGTM。</text>
<rect id="ch19-region-5" x="32" y="502" width="896" height="40" rx="0" fill="var(--diagram-primary-soft,#e5f4ee)"/>
<text x="48" y="530" class="small" text-anchor="start" data-owner="ch19-region-5">可启动提交 ≠ 已提交：提交前检查通过后才入库。</text>
</svg>
