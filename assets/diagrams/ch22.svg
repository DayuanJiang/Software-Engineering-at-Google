  <text x="364.8" y="210.0" class="h18" text-anchor="middle">拆成分片</text>
  <text x="364.8" y="236.0" class="c15" text-anchor="middle">工具按目录或负责人自动切</text>
  <text x="364.8" y="258.0" class="c15" text-anchor="middle">成许多小改动，每片都能独</text>
  <text x="364.8" y="280.0" class="c15" text-anchor="middle">立审查和提交</text>
  <path d="M471.0 150.0 L489.0 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch22-arrow)"/>
  <circle cx="595.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(580.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 22v-2"/><path d="m17 20.66-1-1.73"/><path d="M11 10.27 7 3.34"/><path d="m20.66 17-1.73-1"/><path d="m3.34 7 1.73 1"/><path d="M14 12h8"/><path d="M2 12h2"/><path d="m20.66 7-1.73 1"/><path d="m3.34 17 1.73-1"/><path d="m17 3.34-1 1.73"/><path d="m11 13.73-4 6.93"/></g>
  <text x="595.2" y="210.0" class="h18" text-anchor="middle">自动审查提交</text>
  <text x="595.2" y="236.0" class="c15" text-anchor="middle">全局批准人代替逐个目录负</text>
  <text x="595.2" y="258.0" class="c15" text-anchor="middle">责人；测试通过就自动提交，</text>
  <text x="595.2" y="280.0" class="c15" text-anchor="middle">失败自动回滚</text>
  <path d="M701.5 150.0 L719.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch22-arrow)"/>
