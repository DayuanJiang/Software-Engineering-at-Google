  <text x="825.8" y="210.0" class="h18" text-anchor="middle">清理收尾</text>
  <text x="825.8" y="236.0" class="c15" text-anchor="middle">旧接口删掉，兼容别名撤掉，</text>
  <text x="825.8" y="258.0" class="c15" text-anchor="middle">别让迁移停在一半</text>
