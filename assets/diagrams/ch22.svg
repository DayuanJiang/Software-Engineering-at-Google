<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" class="chapter-svg cg-ch22" data-layout="desktop" role="img" aria-labelledby="ch22-title ch22-desc">
  <title id="ch22-title">一处改动牵动几千个文件，怎么做？</title>
  <desc id="ch22-desc">本章概览。一处改动牵动几千个文件，怎么做？ 本章的主要部分：一个逻辑改动：改名、换 API、清理旧用法：逻辑上是一件事，物理上散在整个代码库；拆成分片：工具按目录或负责人自动切成许多小改动，每片都能独立审查和提交；自动审查提交：全局批准人代替逐个目录负责人；测试通过就自动提交，失败自动回滚；清理收尾：旧接口删掉，兼容别名撤掉，别让迁移停在一半。一句话：把一个大改动拆成很多小提交，靠工具和流程批量推进</desc>
