  <text x="32.0" y="52.0" class="headline" text-anchor="start">一处改动牵动几千个文件，怎么做？</text>
  <text x="32.0" y="94.0" class="c15" text-anchor="start">为什么不能一次提交：冲突、审查、测试和技术限制都承受不了巨型提交</text>
  <circle cx="134.2" cy="150.0" r="30" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(119.2,135.0) scale(1.250)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
  <text x="134.2" y="210.0" class="h18" text-anchor="middle">一个逻辑改动</text>
  <text x="134.2" y="236.0" class="c15" text-anchor="middle">改名、换 API、清理旧用</text>
  <text x="134.2" y="258.0" class="c15" text-anchor="middle">法：逻辑上是一件事，物理</text>
  <text x="134.2" y="280.0" class="c15" text-anchor="middle">上散在整个代码库</text>
  <path d="M240.5 150.0 L258.5 150.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch22-arrow)"/>
