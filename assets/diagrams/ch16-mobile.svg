<svg xmlns="http://www.w3.org/2000/svg" width="420" height="528" viewBox="0 0 420 528" class="chapter-svg cg-ch16" data-layout="mobile" role="img" aria-labelledby="ch16m-title ch16m-desc">
  <title id="ch16m-title">为什么谷歌几乎只在主干上开发？</title>
  <desc id="ch16m-desc">本章概览。为什么谷歌几乎只在主干上开发？ 本章的主要部分：长期分支：合并痛苦、多版本、修复重复打；主干开发：小步提交、单版本规则、发布分支只挑修复。一句话：所有人在同一个主干上工作，改动小而频繁，合并的痛苦最少</desc>
  <style>
    .cg-ch16[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:var(--diagram-ink,#242424)}
