  <rect x="0" y="0" width="420" height="528" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch16m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">为什么谷歌几乎只在主干上开发？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">版本控制记录每次改动，让多人改同一套代码；问题出在“分支</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">怎么用”</text>
  <rect x="22.0" y="118.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">长期开发分支</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">各自埋头几周，合并时冲突成堆；同一份代码</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">有多个版本要选；修复要往每个分支各打一</text>
  <text x="74.0" y="218.0" class="c15" text-anchor="start">遍；研究表明它拖累组织绩效</text>
  <rect x="22.0" y="238.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="264.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,256.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="74.0" y="269.0" class="h18" text-anchor="start">主干开发</text>
  <text x="74.0" y="294.0" class="c15" text-anchor="start">小步提交，随时集成；单版本规则：不用选“</text>
  <text x="74.0" y="316.0" class="c15" text-anchor="start">依赖哪个版本”；发布分支只挑选修复，不带</text>
  <text x="74.0" y="338.0" class="c15" text-anchor="start">新功能；单体仓库让全公司看同一份代码</text>
  <text x="22.0" y="370.0" class="c13" text-anchor="start">版本控制的未来：越来越多工具同时支持细粒度小仓库和整个组</text>
  <text x="22.0" y="390.0" class="c13" text-anchor="start">织的单体仓库</text>
  <rect x="22.0" y="416.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="437.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="463.0" class="answer-m" text-anchor="start">所有人在同一个主干上工作，改动小而频繁，</text>
  <text x="36.0" y="489.0" class="answer-m" text-anchor="start">合并的痛苦最少</text>
</svg>
