<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch01-story" data-layout="desktop" role="img" aria-labelledby="ch01-story-title ch01-story-desc">
  <title id="ch01-story-title">从一个脚本到十年的服务：编程怎样变成软件工程</title>
  <desc id="ch01-story-desc">本章回顾。从一个脚本到十年的服务：编程怎样变成软件工程。起点：你写了一个脚本，跑完就扔。这是编程：一个人，一次性，只要现在能跑就行。没有人会在明年回来改它。；变化：代码活了十年，几百人在改。依赖会升级，需求会变，编译器会变。海勒姆定律：用户够多，你的一切可见行为都会被人依赖，想改就有人痛。；转折：问题从“怎么写对”变成“怎么一直改得动”。这就是软件工程：编程加上时间、规模和权衡。可以选择不改，但绝不能失去改的能力。；做法：让做法跟得上规模，让决策拿得出依据。反复执行的任务，人力不能随规模暴涨；决策以数据为主，加上假设和先例；数据变了就调整，犯错和修订都正常。。这一章最想强调的：软件工程是随时间推移的编程。一次性脚本和十年服务需要完全不同的做法。 判断标准只有一个：在代码预期的寿命里，你是否还有能力应对变化。</desc>
