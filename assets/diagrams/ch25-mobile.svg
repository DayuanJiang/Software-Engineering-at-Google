  <defs><marker id="ch25m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">程序跑在哪台机器上，还需要关心</text>
  <text x="22.0" y="75.0" class="headline-m" text-anchor="start">吗？</text>
  <text x="22.0" y="111.0" class="c13" text-anchor="start">计算即服务：一层层把“哪台机器”这个问题抽象掉</text>
  <text x="22.0" y="143.0" class="h16" fill="var(--diagram-primary,#0b6f5d)" text-anchor="start">从上到下</text>
  <rect x="22.0" y="159.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="185.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,177.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
  <text x="74.0" y="190.0" class="h18" text-anchor="start">服务</text>
  <text x="74.0" y="215.0" class="c15" text-anchor="start">稳定的服务名，状态放在机器之外；程序要接</text>
  <text x="74.0" y="237.0" class="c15" text-anchor="start">受随时被迁移和重启</text>
  <rect x="22.0" y="257.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="283.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,275.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"/><path d="M10 21.9V14L2.1 9.1"/><path d="m10 14 11.9-6.9"/><path d="M14 19.8v-8.1"/><path d="M18 17.5V9.4"/></g>
  <text x="74.0" y="288.0" class="h18" text-anchor="start">容器与调度</text>
  <text x="74.0" y="313.0" class="c15" text-anchor="start">打包成容器，调度器决定放哪台机器，坏了自</text>
  <text x="74.0" y="335.0" class="c15" text-anchor="start">动换一台</text>
  <rect x="22.0" y="355.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
  <circle cx="50.0" cy="381.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,373.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
  <text x="74.0" y="386.0" class="h18" text-anchor="start">物理机器</text>
  <text x="74.0" y="411.0" class="c15" text-anchor="start">曾经要人手管每一台：装软件、盯故障、半夜</text>
  <text x="74.0" y="433.0" class="c15" text-anchor="start">重启</text>
  <text x="22.0" y="465.0" class="c13" text-anchor="start">怎么选：集中托管还是自建，无服务器还是容器；抽象层次要恰</text>
  <text x="22.0" y="485.0" class="c13" text-anchor="start">当，太低太高都有代价</text>
  <rect x="22.0" y="511.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="532.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="558.0" class="answer-m" text-anchor="start">把机器交给平台管理，代价是程序必须随时能</text>
  <text x="36.0" y="584.0" class="answer-m" text-anchor="start">被搬走和重启</text>
</svg>
