<svg xmlns="http://www.w3.org/2000/svg" width="420" height="623" viewBox="0 0 420 623" class="chapter-svg cg-ch25" data-layout="mobile" role="img" aria-labelledby="ch25m-title ch25m-desc">
  <title id="ch25m-title">程序跑在哪台机器上，还需要关心吗？</title>
  <desc id="ch25m-desc">本章概览。程序跑在哪台机器上，还需要关心吗？ 本章的主要部分：物理机器：曾经要人手管每一台：装软件、盯故障、半夜重启；容器与调度：打包成容器，调度器决定放哪台机器，坏了自动换一台；服务：稳定的服务名，状态放在机器之外；程序要接受随时被迁移和重启。一句话：把机器交给平台管理，代价是程序必须随时能被搬走和重启</desc>
