<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch15-story" data-layout="desktop" role="img" aria-labelledby="ch15-story-title ch15-story-desc">
  <title id="ch15-story-title">从“只剩一个用户了”的旧系统，到有人负责的弃用项目</title>
  <desc id="ch15-story-desc">本章回顾。从“只剩一个用户了”的旧系统，到有人负责的弃用项目。起点：一个旧系统，只剩最后一个直接用户。看起来随手就能关掉。可那个用户可能是关键基础设施，关了它，半个公司跟着停。；冲突：弃用比建造更难。用户的用法早就超出最初的设计；迁移的成本落在用户身上，收益却在维护者身上，谁都不急。；转折：留着旧系统也有成本，只是分散得看不见。维护精力、用户在几个相似系统之间纠结、新系统被拖慢。把这些成本算进来，才能如实比较。；做法：把弃用当项目做：类型、负责人、里程碑、工具。建议性弃用只靠通知，往往不了了之；强制性弃用有团队、有期限，用代码搜索和自动迁移逐个收口。。这一章最想强调的：系统会持续产生维护成本，留着与移除都要算账。 最省钱的办法常是让系统原地演进；能在设计时就想好如何弃用更好。</desc>
