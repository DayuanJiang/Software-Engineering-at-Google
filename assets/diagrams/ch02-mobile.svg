<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" class="chapter-svg cg-ch02" data-layout="mobile" role="img" aria-labelledby="ch02m-title ch02m-desc">
<title id="ch02m-title">团队协作，不必采用同一种工作方式</title>
<desc id="ch02m-desc">原文作者喜欢自下而上快速试验，Karl 喜欢自上而下先理解全貌。强行同步结对引起冲突；改为共同确认缺陷、分头分析、汇合发现，保留了不同方式和团队协作。</desc>
<style>
.cg-ch02[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;font-weight:400;letter-spacing:0;fill:var(--diagram-ink,#242424)}
.cg-ch02[data-layout="mobile"] .small {font-size:19px;fill:var(--diagram-muted,#686868)}
.cg-ch02[data-layout="mobile"] .strong {font-weight:600}
.cg-ch02[data-layout="mobile"] .primary {fill:var(--diagram-primary,#087f6d);font-weight:600}
.cg-ch02[data-layout="mobile"] .secondary {fill:var(--diagram-secondary,#2f6eac);font-weight:600}
.cg-ch02[data-layout="mobile"] .danger {fill:var(--diagram-danger,#b54750);font-weight:600}
.cg-ch02[data-layout="mobile"] .warm {fill:var(--diagram-warm,#a56a1f);font-weight:600}
</style>
