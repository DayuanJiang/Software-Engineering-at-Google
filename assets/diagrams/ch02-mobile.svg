  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">为什么独自闷头干，反而更慢？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">天才神话让人想躲起来独自做出完美的东西；这一章说，躲起来</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">的代价比你想的大</text>
  <rect x="22.0" y="118.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">一个人躲起来写</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">怕别人看到不成熟的代码；巴士因子是 1，你</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">一走项目就停；方向错了，没人早点提醒；重</text>
  <text x="74.0" y="218.0" class="c15" text-anchor="start">复造别人已有的轮子</text>
  <rect x="22.0" y="238.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="264.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,256.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
  <text x="74.0" y="269.0" class="h18" text-anchor="start">早点亮出来，一起做</text>
  <text x="74.0" y="294.0" class="c15" text-anchor="start">小步提交，问题早发现；谦逊、尊重、信任是</text>
  <text x="74.0" y="316.0" class="c15" text-anchor="start">协作的底；接受批评，无责复盘；快速失败，</text>
  <text x="74.0" y="338.0" class="c15" text-anchor="start">快速学习</text>
  <text x="22.0" y="370.0" class="c13" text-anchor="start">了解自己和同事偏好的工作方式，团队才转得顺</text>
  <rect x="22.0" y="396.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="417.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="443.0" class="answer-m" text-anchor="start">软件是团队做出来的：早点把工作亮出来，靠</text>
  <text x="36.0" y="469.0" class="answer-m" text-anchor="start">谦逊、尊重、信任协作</text>
