<text x="24" y="36" class="strong" text-anchor="start">团队协作，不必采用</text>
<text x="24" y="66" class="strong" text-anchor="start">同一种工作方式</text>
<text x="24" y="99" class="small" text-anchor="start">原文：作者与 Karl 调试转换工具</text>
<text x="24" y="138" class="danger" text-anchor="start">强行同步：下一步做什么？</text>
<g id="ch02m-before-author" data-box="24,155,176,72">
