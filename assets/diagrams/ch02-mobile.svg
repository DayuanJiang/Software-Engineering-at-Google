<svg xmlns="http://www.w3.org/2000/svg" width="420" height="508" viewBox="0 0 420 508" class="chapter-svg cg-ch02" data-layout="mobile" role="img" aria-labelledby="ch02m-title ch02m-desc">
  <title id="ch02m-title">为什么独自闷头干，反而更慢？</title>
  <desc id="ch02m-desc">本章概览。为什么独自闷头干，反而更慢？ 本章的主要部分：躲起来写：怕被看到、巴士因子为 1、走错方向没人提醒；一起做：小步提交、谦逊尊重信任、无责复盘、快速学习。一句话：软件是团队做出来的：早点把工作亮出来，靠谦逊、尊重、信任协作</desc>
