<svg xmlns="http://www.w3.org/2000/svg" width="420" height="728" viewBox="0 0 420 728" class="chapter-svg cg-ch09" data-layout="mobile" role="img" aria-labelledby="ch09m-title ch09m-desc">
  <title id="ch09m-title">每次改动都要别人看过，值不值？</title>
  <desc id="ch09m-desc">本章概览。每次改动都要别人看过，值不值？ 本章的主要部分：写好改动：改动要小，描述要清楚；提交前先看一遍自动检查结果；请人审查：选尽量少的审查者；审查者礼貌、专业、快速回复；三项批准：有人认可（LGTM）、目录负责人同意、该语言可读性认证；一人可以兼任多项；处理意见后提交：所有意见处理完才能提交；审查记录成为代码的历史。一句话：值：代码审查是团队共同拥有代码库的方式，收益远超找错</desc>
  <style>
    .cg-ch09[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:var(--diagram-ink,#242424)}
