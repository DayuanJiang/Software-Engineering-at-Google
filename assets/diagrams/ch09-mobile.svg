  <rect x="0" y="0" width="420" height="728" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch09m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">每次改动都要别人看过，值不值？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">谷歌每一次改动提交前都要经过审查；流程本身不复杂，价值在</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">流程之外</text>
  <rect x="22.0" y="118.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">写好改动</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">改动要小，描述要清楚；提交前先看一遍自动</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">检查结果</text>
  <path d="M210.0 208.0 L210.0 224.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09m-arrow)"/>
  <rect x="22.0" y="232.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="258.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,250.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></g>
  <text x="74.0" y="263.0" class="h18" text-anchor="start">请人审查</text>
  <text x="74.0" y="288.0" class="c15" text-anchor="start">选尽量少的审查者；审查者礼貌、专业、快速</text>
  <text x="74.0" y="310.0" class="c15" text-anchor="start">回复</text>
  <path d="M210.0 322.0 L210.0 338.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09m-arrow)"/>
  <rect x="22.0" y="346.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="372.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,364.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="74.0" y="377.0" class="h18" text-anchor="start">三项批准</text>
  <text x="74.0" y="402.0" class="c15" text-anchor="start">有人认可（LGTM）、目录负责人同意、该语</text>
  <text x="74.0" y="424.0" class="c15" text-anchor="start">言可读性认证；一人可以兼任多项</text>
  <path d="M210.0 436.0 L210.0 452.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch09m-arrow)"/>
  <rect x="22.0" y="460.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="486.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,478.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></g>
  <text x="74.0" y="491.0" class="h18" text-anchor="start">处理意见后提交</text>
  <text x="74.0" y="516.0" class="c15" text-anchor="start">所有意见处理完才能提交；审查记录成为代码</text>
  <text x="74.0" y="538.0" class="c15" text-anchor="start">的历史</text>
  <text x="22.0" y="570.0" class="c13" text-anchor="start">带来什么：发现错误、代码更好懂、全库一致、知识传播、心理</text>
  <text x="22.0" y="590.0" class="c13" text-anchor="start">上的共同所有权、留下记录</text>
  <rect x="22.0" y="616.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="637.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="663.0" class="answer-m" text-anchor="start">值：代码审查是团队共同拥有代码库的方式，</text>
  <text x="36.0" y="689.0" class="answer-m" text-anchor="start">收益远超找错</text>
</svg>
