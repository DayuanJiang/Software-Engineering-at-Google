<svg xmlns="http://www.w3.org/2000/svg" width="420" height="833" viewBox="0 0 420 833" class="chapter-svg cg-ch07-story" data-layout="mobile" role="img" aria-labelledby="ch07-storym-title ch07-storym-desc">
  <title id="ch07-storym-title">从“审查更快就是更好”的假设，到追溯到目标的指标</title>
  <desc id="ch07-storym-desc">本章回顾。从“审查更快就是更好”的假设，到追溯到目标的指标。起点：有人提出：取消可读性流程，审查能更快。速度确实是个可以度量的数字。但更快的审查等于更高的生产力吗？这是这一章要回答的问题。；冲突：只盯一个数字，会把目标换掉。只跟踪速度和满意度，就漏掉了质量。一个代理指标变好，并不等于整体目标达成。；转折：目标、信号、指标：从想要什么倒推该量什么。先写清目标，用 QUANTS 五个方面把它拆全；再找能反映目标的信号；最后才选可测量的指标。；做法：定性数据校验定量指标，再融入工作流。谷歌用日志加访谈证明可读性流程总体值得投入；改进建议要嵌进开发者的日常习惯和激励里，才会真的发生。。这一章最想强调的：度量之前先问：无论结果好坏，能不能据此采取行动？ 好指标能追溯到目标，并且有定性数据相互印证；对不上时，多半是指标错了。</desc>
