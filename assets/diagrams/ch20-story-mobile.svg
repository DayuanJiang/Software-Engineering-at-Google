<svg xmlns="http://www.w3.org/2000/svg" width="420" height="857" viewBox="0 0 420 857" class="chapter-svg cg-ch20-story" data-layout="mobile" role="img" aria-labelledby="ch20-storym-title ch20-storym-desc">
  <title id="ch20-storym-title">从一个编译通过却算错哈希的改动，到审查时自动出现的修复建议</title>
  <desc id="ch20-storym-desc">本章回顾。从一个编译通过却算错哈希的改动，到审查时自动出现的修复建议。起点：把 long 改成 int，编译通过，哈希算错了。右移 32 位对 int 是空操作，字段不再参与哈希。编译器不管这个，测试也可能漏过。；冲突：静态分析工具很多，工程师却不看。误报太多、结果藏在别处、修起来麻烦。分析器再聪明，没人看就等于没有。；转折：把分析结果放进代码审查，并且让它值得信任。Tricorder 在审查时给出意见，附带一键修复；每条结果都能点“没用”，误报率高的分析器会被下线。；做法：让写分析的人和用分析的人形成回路。关注开发者的感受；分析融入编译、提交前检查、IDE 和代码浏览；领域专家可以贡献自己的检查。。这一章最想强调的：静态分析要发挥作用，关键是开发者体验和融入工作流，技术反倒是次要的。 让用户能贡献分析：领域专家的知识会让代码库持续变好。</desc>
