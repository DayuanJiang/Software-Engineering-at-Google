<svg xmlns="http://www.w3.org/2000/svg" width="960" height="627" viewBox="0 0 960 627" class="chapter-svg cg-ch16-story" data-layout="desktop" role="img" aria-labelledby="ch16-story-title ch16-story-desc">
  <title id="ch16-story-title">从合并周的噩梦，到“选哪个版本”这个问题消失</title>
  <desc id="ch16-story-desc">本章回顾。从合并周的噩梦，到“选哪个版本”这个问题消失。起点：每个功能一条分支，几周后再合回来。听起来自由。可合并那周成了噩梦：冲突成堆，谁也说不清哪个版本才是对的。；冲突：一旦要选“依赖它的哪个版本”，麻烦就开始了。同一份代码有多个版本，修复要往每条分支各打一遍，有人只好用 shading 和分别编译绕开冲突。；转折：单版本规则：一个提交位置，一个可依赖的版本。消除这两个选择，工作简化得超乎想象。谷歌几乎只在主干上开发，发布分支只挑选修复，不带新功能。；做法：单体仓库把全公司放在同一份代码上。研究表明主干开发是高绩效组织的预测因素之一。仓库怎么分可以按组织选，关键是依赖别停留在旧版本上。。这一章最想强调的：只要项目超出一个人的玩具，就该用版本控制；能在主干上开发，就别留长期分支。 单版本规则消除了提交位置和依赖版本的选择，这对组织效率的意义超乎想象。</desc>
