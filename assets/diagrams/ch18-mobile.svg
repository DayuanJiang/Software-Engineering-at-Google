  <rect x="0" y="0" width="420" height="528" fill="var(--diagram-bg,#fff)"/>
  <defs><marker id="ch18m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
  <text x="22.0" y="44.0" class="headline-m" text-anchor="start">构建系统到底在解决什么问题？</text>
  <text x="22.0" y="80.0" class="c13" text-anchor="start">构建系统的目的：把源码可靠、可重复地变成产物；核心难点在</text>
  <text x="22.0" y="100.0" class="c13" text-anchor="start">依赖</text>
  <rect x="22.0" y="118.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-warm-soft,#eae2cf)"/>
  <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
  <text x="74.0" y="149.0" class="h18" text-anchor="start">基于任务：Ant、Maven、Gradle</text>
  <text x="74.0" y="174.0" class="c15" text-anchor="start">你写步骤，工具照做；工具看不懂步骤之间的</text>
  <text x="74.0" y="196.0" class="c15" text-anchor="start">依赖；难以并行，难以缓存；构建脚本本身越</text>
  <text x="74.0" y="218.0" class="c15" text-anchor="start">来越难维护</text>
  <rect x="22.0" y="238.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <circle cx="50.0" cy="264.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,256.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
  <text x="74.0" y="269.0" class="h18" text-anchor="start">基于产物：Bazel、Buck</text>
  <text x="74.0" y="294.0" class="c15" text-anchor="start">你声明目标和依赖，工具决定怎么做；工具能</text>
  <text x="74.0" y="316.0" class="c15" text-anchor="start">算出什么该重建；可并行、可缓存、可远程执</text>
  <text x="74.0" y="338.0" class="c15" text-anchor="start">行；构建可重复，结果可信</text>
  <text x="22.0" y="370.0" class="c13" text-anchor="start">模块要细：1:1:1 规则；最小化可见性；外部依赖锁定版本并校</text>
  <text x="22.0" y="390.0" class="c13" text-anchor="start">验哈希</text>
  <rect x="22.0" y="416.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
  <text x="36.0" y="437.0" class="tag" text-anchor="start">一句话</text>
  <text x="36.0" y="463.0" class="answer-m" text-anchor="start">只声明要什么，让工具决定怎么做，构建才可</text>
  <text x="36.0" y="489.0" class="answer-m" text-anchor="start">靠、可缓存、可并行</text>
</svg>
