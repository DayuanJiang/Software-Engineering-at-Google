<svg xmlns="http://www.w3.org/2000/svg" width="420" height="528" viewBox="0 0 420 528" class="chapter-svg cg-ch18" data-layout="mobile" role="img" aria-labelledby="ch18m-title ch18m-desc">
  <title id="ch18m-title">构建系统到底在解决什么问题？</title>
  <desc id="ch18m-desc">本章概览。构建系统到底在解决什么问题？ 本章的主要部分：基于任务：你写步骤，工具照做，难并行难缓存；基于产物：你声明目标和依赖，工具决定怎么做。一句话：只声明要什么，让工具决定怎么做，构建才可靠、可缓存、可并行</desc>
  <style>
    .cg-ch18[data-layout="mobile"] text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:var(--diagram-ink,#242424)}
