<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" class="chapter-svg cg-ch17" data-layout="desktop" role="img" aria-labelledby="ch17-title ch17-desc">
  <title id="ch17-title">为什么要专门做一个代码搜索工具？</title>
  <desc id="ch17-desc">本章概览。为什么要专门做一个代码搜索工具？ 本章的主要部分：找到定义：输入一个名字或限定名，秒级跳到定义处，哪怕它没在源码里连续出现；看用法示例：看别人怎么调用它，比读文档更快理解一个 API；查影响范围：谁在用这个函数？改它会波及哪些地方？交叉引用给出答案；读历史：看这段代码是谁改的、为什么改，把问题追到源头。一句话：读代码比写代码花的时间多，让全公司代码可秒查值得专门投入</desc>
